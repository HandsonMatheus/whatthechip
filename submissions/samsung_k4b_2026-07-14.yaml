    source_url: "https://www.jotrin.com/product/parts/K4B2G0846C_HYH9.html"
    notes: >
      Bônus — par DDR3L 1.35V do K4B2G0846C (Jotrin). Mesmo padrão de par de
      tensão já visto na família local (K4B2G1646F tem BC/BY, K4B1G0846I tem
      BC/BY). HY = DDR3L 1.35V.
