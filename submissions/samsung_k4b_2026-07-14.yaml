    notes: >
      Achado bônus (varredura da família K4B, cross-reference DigiPart "See
      Also" do alvo) — mesma densidade 2Gb/C-die do alvo, largura x8 em vez
      de x16. NÃO estava local (seed só tinha K4B2G0846F). Base deriva de
      K4B2G0846C-HCH9 (DDR3 1.5V) + K4B2G0846C-HYH9 (DDR3L 1.35V), par de
      tensão completo confirmado. Octopart/Datasheets.com/Jotrin/veswin/avaq
      convergentes: "2G-Bit 256Mx8 1.5V", 78-ball FBGA. 2Gbit÷8=256MB/die.

  - part_number: "K4B2G0846CHCH9"
    chip_type: "DDR3"
    subtype: "DDR3"
    interface: "x8"
    capacity: "256MB"
    confidence: confirmed
    source_url: "https://octopart.com/k4b2g0846c-hch9-samsung-27952999"
    notes: >
      Bônus — par DDR3 1.5V do K4B2G0846C. Octopart/Datasheets.com/Jotrin/
      veswin/avaq convergentes: "DRAM Chip DDR3 SDRAM 2G-Bit 256Mx8 1.5V",
      78-ball FBGA.

  - part_number: "K4B2G0846CHYH9"
    chip_type: "DDR3L"
    subtype: "DDR3L"
    interface: "x8"
    capacity: "256MB"
