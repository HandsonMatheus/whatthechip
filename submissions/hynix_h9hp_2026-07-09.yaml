# Submissão de known_parts — SK Hynix, família H9HP (eMCP LPDDR4X, JÁ EXISTENTE)
# Gerado a partir da investigação do PN H9HP16ACPMMD (busca na bancada, 2026-07-09).
# Família H9HP e mapas HYX_H9HP_NAND_CAP/HYX_LPDDR4X_RAM_CAP JÁ EXISTIAM e já
# decodificavam o PN buscado certo (known=true, grammar_complete=true, RENTÁVEL).
#
# ACHADO / FIX DE GRAMÁTICA: H9HP27ABUMMDAR-KEM tem pn[6:8]='AB', que NÃO estava no
# mapa HYX_LPDDR4X_RAM_CAP (só tinha AC/AD/AE/AF). Preduo E Puris concordam, de forma
# independente: "32+16" (32GB eMMC + 16Gb÷8=2GB LPDDR4X). 'AB'→2GB foi ADICIONADO ao
# mapa (compartilhado com H9HQ) em chips/knowledge/hynix.yaml. Golden novo em
# chips/tests.py prova o fix. Mesmo padrão dos fixes '22' (H9HQ) e '18' (H9TQ) de
# hoje mais cedo — chave nova só depois de 2 fontes estruturadas concordando.
#
# Todos os 4 PNs abaixo vêm de Preduo (tier-1 neste projeto) e/ou Puris — catálogos
# de broker estruturados, fetchados direto (não snippet de busca). Aritmética Gb→GB
# confirmada em cada um: NAND já em GB, RAM em Gb bruto (÷8 = GB).
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h9hp_2026-07-09.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h9hp_2026-07-09.yaml --commit --user <seu_usuario>
#
brand: "SK Hynix"
