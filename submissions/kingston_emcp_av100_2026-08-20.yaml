# Submissão known_parts — Kingston, família eMCP "08EMCP" (8GB eMMC 5.0), geração de sufixo "AV100"
# Chat de marca Kingston, 2026-08-20. Disparado pelo PN físico do debug de estoque `08EMCP04NL2AV1`
# (known:false, classification_source:"gramática", subtype retornado errado como LPDDR3).
#
# DIAGNÓSTICO: família `08EMCP` já tem gramática completa (grammar_complete:true) — decodifica
# pn[0:2]="08"→8GB NAND e pn[6:8]="04"→512MB RAM certo. O problema é só o sufixo: o token "NL2"
# (posições 8-10 do PN físico) diz LPDDR2 pela convenção JÁ DOCUMENTADA da própria família
# (KINGSTON.md §0.2 regra 5 e §2: "NL2"=LPDDR2/162-ball × "NL3"/"EL3"=LPDDR3/221-ball) — mas a
# gramática (decode map) SEMPRE devolve LPDDR3 por default, e só um known_part explícito corrige
# pra LPDDR2. Isso NÃO é bug novo que eu descobri — já está escrito como regra permanente antes
# desta entrega ("Um PN com sufixo NL2 que não vira known_part confirmado... aparece errado pro
# operador"). O mecanismo de correção é exatamente known_parts (Trilha B) — não precisa (nem dá,
# é fora de escopo) mexer no .py do engine nem na gramática/yaml.
#
# ⚠ PN do debug ("08EMCP04NL2AV1") é quase certamente uma leitura TRUNCADA — não achei essa string
# exata em nenhum distribuidor, mas achei a família completa "08EMCP04-NL2AV100-C06/-C30/-C50"
# (Octopart, cross-referenciado). "AV1" bate com os 3 primeiros chars de "AV100" — a leitura da
# bancada/scanner provavelmente cortou os 2 dígitos finais + todo o sufixo de revisão "-C##". Isso
# NÃO muda a classificação: NAND/RAM/geração são decididos pelo prefixo "08EMCP04" + token "NL2",
# que são idênticos nas 3 variantes C06/C30/C50 — só o código de revisão (não decodificado por
# design, vira `tip`/`notes`, nunca campo próprio) diverge entre elas. Registrei a string truncada
# como known_part própria (resolve a fila de revisão direto) MAIS as 3 formas completas encontradas
# (mais a família irmã EL3/LPDDR3 e o RAM=1GB de 08EMCP08) — não assumi qual dos 3 C-códigos é o
# físico real, registrei os 3 (mesmo padrão do caso FH32B08UCT1-0C: registrar em vez de supor).
#
# CLUSTER encontrado (busca Octopart + Worldway Electronics, cross-referenciados, 2026-08-20):
#   NL2 (LPDDR2), 08EMCP04 (8GB NAND + 512MB RAM): AV100-C06, AV100-C30, AV100-C50
#   EL3 (LPDDR3), 08EMCP04 (8GB NAND + 512MB RAM): AV100-C06, AV100-C30U, AV100-C50
#   EL3 (LPDDR3), 08EMCP08 (8GB NAND + 1GB RAM):   AV100-C50 (Octopart + Worldway, 2 fontes)
# Tentei "08EMCP08-NL2AV100" (par LPDDR2 do RAM=1GB, completaria a matriz 2x2) — NÃO achei em
# nenhuma fonte. Não incluí — excluir, não adivinhar.
#
# NÃO PERSEGUIDO (fora do escopo desta rodada, achado incidentalmente enquanto buscava "AV100"):
# a família 08EMCP tem MUITAS outras gerações de sufixo além de DT227/DM327/AS100/DM627 (já na
# gramática) e AV100 (esta entrega) — vi também CV100, BT227, DT527, EL2BV100 aparecerem em
# resultados de busca, sem perseguir. Sinaliza um padrão parecido com o eMMC standalone
# (TB28/TB29/TA29/TX29) — múltiplas gerações paralelas de sufixo pra mesma família — mas catalogar
# TODAS as gerações do eMCP é rodada própria, não cabe numa correção pontual de fila de revisão.
# Gap sinalizado no KINGSTON.md §5 pra próxima rodada dedicada, não urgente.
#
# Convenção de campos (KINGSTON.md §1, já estabelecida — não inventei nada aqui): chip_type="eMCP",
# subtype=geração da RAM ("LPDDR2"/"LPDDR3", nunca as duas), interface=versão eMMC ("eMMC 5.0" pra
# toda a família 08EMCP), emcp_nand=GB direto, emcp_ram="LPDDR{n} {cap}" com cap=Gbit÷8 (abaixo de
# 1GB em MB) — 04(RAM)÷8=0.5GB=512MB; 08(RAM)÷8=1GB. device vazio (eMCP não usa esse campo, só
# NAND cru usa pra pacote — ver submissão kingston_nand_raw).
#
# validar: python manage.py submit_known_parts submissions/kingston_emcp_av100_2026-08-20.yaml

