# Submissão de known_parts — SK Hynix, família H5AN (DDR4 standalone, JÁ MAPEADA, GRANDFATHERED).
# Gerado a partir da investigação do PN H5AN8G6NCJ (busca na bancada, 2026-08-20).
#
# ⚠ CORRIGIDO 2026-08-20 (foto do chip físico enviada pelo dono): a 1ª versão desta submissão
# tinha "corrigido" o PN da bancada de "H5AN8G6NCJ" (10 chars) pra "H5AN8G6NCJR" (11 chars,
# forma de catálogo/distribuidor), assumindo que faltava o "R" final por erro de leitura —
# decisão unilateral errada, deveria ter perguntado (regra de ouro: nunca decidir PN
# ambíguo sozinho). O dono enviou FOTO do chip físico e confirmou: "existe sem o R no final
# sim, vide foto do chip" — a marcação FÍSICA gravada no encapsulamento é mesmo "H5AN8G6NCJ"
# (10 chars), sem o R. Isso é NORMAL em semicondutores: o "top mark" (o que vem gravado a
# laser no pacote) frequentemente é abreviado em relação ao PN "de pedido" que aparece no
# datasheet/distribuidor (aqui, "H5AN8G6NCJR-VKC") — espaço físico limitado no encapsulamento.
# O known_part abaixo foi corrigido pra bater com a marcação REAL ("H5AN8G6NCJ", sem R), que é
# o que o operador de bancada vai digitar — é o único jeito do known_exact bater na prática.
# As specs (x16, 8Gb=1GB, DDR4) continuam corretas e vêm do mesmo datasheet oficial (a
# identidade do chip — família+densidade+organização+revisão — não muda, só a forma exata do
# PN de 11 chars pra 10 chars no campo part_number).
#
# ⚠ RESOLVIDO 2026-08-20 (2ª mensagem do dono): "brother os dois existem! com e sem a letra!" —
# NÃO é "a marcação física é sempre curta, a de catálogo é sempre longa" (o que eu tinha
# assumido implicitamente ao levantar a pergunta acima). As DUAS formas são PNs reais e
# distintos que aparecem em chips físicos diferentes — a Hynix aparentemente imprime o top
# mark completo (11 chars, com a letra de revisão) em alguns lotes/pacotes e o abreviado (10
# chars, sem a letra) em outros, da MESMA combinação densidade+organização+revisão. Por isso
# esta submissão agora tem os DOIS PNs pra cada uma das 9 combinações já pesquisadas: a forma
# de 11 chars (já vinha das 9 originais, com fonte Tier-1 direta no datasheet — Ordering
# Information) e a forma de 10 chars (irmã, mesma identidade de chip, sem letra final — só a
# H5AN8G6NCJ tem confirmação fotográfica direta; as outras 8 formas curtas seguem o mesmo
# padrão que o dono confirmou existir na família, mas sem foto individual de cada uma).
# Resultado: 18 known_parts nesta submissão (9 pares longa+curta).
#
# ⚠ RESOLVE A DÚVIDA DEIXADA PELA INVESTIGAÇÃO ANTERIOR DESTA SESSÃO (2026-08-20, mesmo dia
# — "bug GB/Gb" em H5AN8G8NCJR/-VKC, ver memória wtc-h5an-gb-gbit-nao-e-bug.md): aquela
# investigação já tinha concluído que não havia bug, mas não tinha explicado o que o dígito
# em pn[6] (a posição logo após o código de densidade "8G") realmente significa. Agora, com
# datasheet oficial completo lido para TRÊS revisões independentes (A/C/D), está confirmado:
#   pn[4:6] = "8G" → densidade TOTAL do chip (8Gb = 1GB) — SEMPRE a mesma nas 9 entradas
#   abaixo, não muda com organização.
#   pn[6] (о dígito seguinte, reaproveitando "4"/"6"/"8" mas em OUTRO campo) = ORGANIZAÇÃO:
#     '4' → x4 (2G x 4)      '8' → x8 (1G x 8)      '6' → x16 (512M x 16)
#   Ou seja, H5AN8G8NCJR (o PN da investigação anterior) e H5AN8G6NCJR (o PN desta rodada,
#   forma completa do alvo da bancada) são o MESMO die/densidade (8Gb=1GB), só organizados
#   diferente (x8 vs x16) — dois PNs REAIS e DISTINTOS, não confusão de leitura entre si.
#   Confirma de vez que não há e nunca houve bug de conversão nesta família.
#
# COBERTURA DE CLUSTER (pedido permanente do dono — nunca 1 só PN): a busca achou TRÊS
# datasheets oficiais completos, cada um cobrindo as MESMAS 3 organizações (x4/x8/x16) da
# MESMA densidade (8Gb), cada um uma revisão de die diferente (mesmo padrão "die-revision-
# letter" já visto em H5TC/H5TQ nesta sessão): revisão A (Rev.1.2/Jul.2017), revisão C
# (Rev.1.5/Mar.2019 — inclui o PN da investigação anterior E o alvo desta rodada) e revisão D
# (Rev.1.4/Apr.2020). Entreguei as 9 combinações (3 revisões × 3 organizações) na mesma
# submissão — todas com o MESMO nível de evidência (datasheet oficial lido na íntegra) — e,
# após o dono confirmar que a forma curta (sem letra final) também é real, dobrei pra 18
# (cada combinação com sua forma longa E curta).
#
# FONTES (Tier-1, datasheet oficial SK Hynix, lido NA ÍNTEGRA via fetch direto do PDF em
# cada caso — Ordering Information com a tabela Part No./Configuration/Package explícita):
#   Revisão A: https://datasheet.lcsc.com/datasheet/pdf/6c53e5aaaf7112b7986374307a80ae1f.pdf?productCode=C499916
#     "8Gb DDR4 SDRAM" Rev.1.2/Jul.2017. H5AN8G4NAFR-*xxC=2Gx4/78ball; H5AN8G8NAFR-*xxC=1Gx8/
#     78ball; H5AN8G6NAFR-*xxC=512Mx16/96ball.
#   Revisão C: https://datasheet.lcsc.com/datasheet/pdf/c27d011a76fb9fb935e03923df73d324.pdf?productCode=C2803261
#     "8Gb DDR4 SDRAM" Rev.1.5/Mar.2019. Mesma tabela: H5AN8G4NCJR-*xxC=2Gx4;
#     H5AN8G8NCJR-*xxC=1Gx8; H5AN8G6NCJR-*xxC=512Mx16/96ball.
#   Revisão D: https://datasheet.lcsc.com/datasheet/pdf/200bb31c5ebbfb4e0d85dea907c5133c.pdf?productCode=C2961593
#     "8Gb DDR4 SDRAM" Rev.1.4/Apr.2020. Mesma tabela: H5AN8G4NDJR-*xxC=2Gx4;
#     H5AN8G8NDJR-*xxC=1Gx8; H5AN8G6NDJR-*xxC=512Mx16/96ball.
# Todas as 9 corroboradas por distribuidores independentes (LCSC estoque+preço direto,
# JLCPCB, AB Sunshine, Fusion Worldwide, Sourcengine, xonelec, ElectronicsDataSheets) —
# manufacturer HYNIX/SK Hynix consistente em todas. confidence=confirmed em TODAS (li o
# corpo técnico completo do datasheet + tabela Ordering Information direta em cada uma).
#
# GAP CONHECIDO (não incluído, não inventado): podem existir outras letras de revisão além
# de A/C/D nesta mesma densidade/organizações (padrão já visto no resto da família) — não
# persegui além destas 3 por já ser uma entrega robusta (9 PNs, 3 fontes independentes).
#
# ⚠ BUG PRÉ-EXISTENTE DO ENGINE (mesmo já documentado em hynix_h5tc_2026-07-13.yaml e nas
# submissões H5TC/H5TQ desta sessão): `_result_from_known` (chips/engine.py, branch família
# casada) não propaga `known.interface` pro classify() — campo fica salvo corretamente no
# banco, só não aparece na saída hoje. Mantive `interface` preenchido nas 9 entradas porque
# o dado está correto (extraído direto da tabela Configuration do datasheet). Fora do escopo
# do chat de marca (não modificar código sem perguntar).
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h5an8g_organizacoes_2026-08-20.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h5an8g_organizacoes_2026-08-20.yaml --commit
#
