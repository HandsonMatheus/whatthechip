      dono confirmou em sites de venda "8GB + 1GB" (2026-08-20). Aritmética: NAND=8(GB,
      1º número, sem ambiguidade Gb/GB)=8GB eMMC; RAM=8(Gb, 2º número bruto "+8")÷8=1GB
      LPDDR3 — mesma conta da âncora da família. Bate exatamente com TYD0GH221651RA (mesmo
