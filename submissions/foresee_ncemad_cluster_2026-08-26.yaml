#   especificamente pra este PN (mesmo padrão de cautela já aplicado a resumos de busca nesta marca
#   — não copiei pro campo `interface`, deixei em branco). confidence=manual (existência + capacidade
#   fortíssimas, versão/processo não confirmados).
#
# ⭐ BÔNUS ENCONTRADOS NO MESMO DOCUMENTO (histórico de revisão, NÃO na tabela atual — vendor-codes
