#     NCEMAD9D-08G → [Gb do die não veio limpo na extração do PDF, célula truncada] → 8GB → 3D →
#       eMMC 5.1 → 11.5x13mm (capacidade 8GB inequívoca — bate Byte Size da tabela + literal do PN;
#       só o número de Gb/die específico não veio limpo, não afeta capacity/chip_type/interface)
