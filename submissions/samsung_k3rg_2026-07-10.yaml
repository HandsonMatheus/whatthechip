#
# Dados locais (seed_known_parts.json) já cobriam bem a família: base K3RG2G20BM
# (bare) + sufixos 0G0J/CGCJ já confirmados a 4GB (iFixit Pixel XL + LG G5 +
# Octopart); dies CA/CM também 4GB (PSG 1H 2017); K3RG3G3/K3RG4G4/K3RG6G6
# (3GB/3GB/6GB, PSG + iFixit Galaxy S6). O mapa K3RG_CAP (2G/3G/4G/6G) está
# bem fundamentado — não precisei mexer nele pro alvo.
#
# NOVO SUFIXO do alvo: "DGCH" não estava nos known_parts locais (só 0G0J/CGCJ).
# Confirmado como PN real via Octopart/Worldway/Sierra IC/DigiPart — mesma base
# BM já confirmada a 4GB. Varrendo "todos os similares" da família encontrei
# MAIS 2 sufixos novos da mesma base BM (AGCH, MGCH) e — achado maior — TRÊS
# cap_keys que NÃO EXISTEM no mapa K3RG_CAP (só tem 2G/3G/4G/6G):
#   - "1G" → 16Gb = 2GB  (K3RG1G10BM-MGCH — Preduo Density + 3 distribuidores)
#   - "8G" → 64Gb = 8GB  (K3RG8G80MM-MGCJ — Preduo Density + catálogo OFICIAL
#     Samsung no DirectIndustry, que lista K3RG2G20BM/K3RG5G50MM/K3RG8G80MM
#     como os 3 representantes LPDDR4 da linha K3RG)
#   - "5G" → 32Gb = 4GB  (K3RG5G50MM-FGCJ — confirmado como PN genuíno no
#     catálogo oficial Samsung/DirectIndustry, mas a DENSIDADE numérica só
#     achei em título de listagem Alibaba — fonte única e mais fraca que as
#     outras duas, por isso confidence=distributor aqui, não confirmed)
# NÃO toquei no mapa K3RG_CAP (gramática) — mantive a prática desta sessão de
# só registrar known_parts; sinalizando pro dono que 1G/5G/8G são candidatos a
# entrar no mapa como correção de gramática futura, se quiser.
