      Corroborado por Datasheets360, AB Sunshine. Reforço de confiança: o par x8 da
      MESMA revisão (H5TC4G83DFR) está listado na página OFICIAL skhynix.com/
      products.view.do — confirma revisão D como produto SK Hynix vigente. NÃO
      consegui abrir o corpo do PDF do H5TC4G43DFR em si — confidence=manual.
