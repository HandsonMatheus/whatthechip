      consegui abrir o corpo do PDF — confidence=manual.

  - part_number: "H5TC4G43DFR"
    chip_type: "DDR3L"
    subtype: "DDR3L"
    density_gbit: "4Gb"
    density_gb: "512MB"
    interface: "x4"
    confidence: manual
    source_url: "https://www.datasheets.com/part-details/h5tc4g43dfr-rda-sk-hynix-inc-63813526"
    notes: >
      Achado na varredura de cluster — revisão D, organização x4, mesma densidade
