# contra os 488 known_parts já submetidos (grep em submissions/*.yaml) — sobraram 20 PNs
# genuinamente novos. Dois achados TIER-1 (fabricante) fecharam a maior parte de uma vez:
#
# FONTE TIER-1 #1 — tabela oficial Toshiba/TAEC via DigiKey (media.digikey.com, PDF "Card
# Interface e-MMC", datado 16/ago/2012, Copyright TOSHIBA CORPORATION) — tabela COMPLETA
# 2GB-128GB com Capacidade/PN/Classificação/Versão/Velocidade/Pacote. 7 PNs novos aqui.
#
# FONTE TIER-1 #2 — press release OFICIAL da KIOXIA (kioxia.com/en-jp/business/news/2014/
# 20141002-1.html, "Toshiba Launches World's Smallest-class Embedded NAND Flash Memory
# Products", 2/out/2014, lido diretamente na página oficial) — tabela "New Product Line-up"
# completa: 12 PNs com Capacidade/Categoria/Pacote/Data de produção. 8 PNs novos aqui (os outros
# 4 já eram known_part de rodadas anteriores — THGBMFG7C1LBAIL/8C2LBAIL/9C4LBAIR já existiam).
#
# FONTE TIER-3 (distribuidor) — página dedicada da Puris (puris.net/archives/NNNN, formato
# "品牌/型号/规格/封装" já usado e aceito antes neste projeto) pra 1 PN com chave nova, e
# existência na lista master Puris (cruzada com chave JÁ multiplamente confirmada Tier-1/2 em
# outros PNs da mesma chave) pra mais 4 PNs.
#
# Chaves NOVAS adicionadas ao THGBM_CAP nesta rodada: 0DB=128GB, 6D2=8GB, 9T4=64GB (todas com
# fonte — 0DB e 6D2 são Tier-1 DigiKey, 9T4 é Tier-3 Puris direto).
#
# 2 PNs ficaram DE FORA (sem fonte confiável, ver rodapé): THGBH5G7A2JBAIH, THGBM1G5D2EBAI7.
#
# Uso:
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgbm_varredura2_2026-07-10.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgbm_varredura2_2026-07-10.yaml --commit --user <seu_usuario>
