# Submissão known_parts — Kingston, linha "Embedded Discrete DRAM" (DDR3L/DDR4/LPDDR4/LPDDR4x)
# Chat de marca Kingston, 2026-08-17. Pesquisa disparada pelo PN físico D1216MCABXGGBS (dono leu
# no chip: "N11044-01 / 1648 S2C 6 / D1216MCABXGGBS / 54MJE222000J").
#
# ACHADO: a Kingston TEM linha própria de DRAM discreta embarcada (contradiz a regra 9 que eu
# tinha escrito no KINGSTON.md — "não fabrica die avulsa" — corrigido em paralelo).
# Fonte primária: kingston.com/us/embedded/dram + os 3 flyers oficiais em media.kingston.com
# (ver source_url por item). Cross-checado contra DigiKey/Mouser/Octopart/Future Electronics.
#
# NÃO usei sufixo de empacotamento (-U tray / -R reel / -TU) no part_number — não é o que vem
# gravado a laser no chip, é só código de logística de embalagem do distribuidor.
#
# Todos chip_type/subtype já existem no vocabulário (DDR3L/DDR4/LPDDR4/LPDDR4X) — sem tipo novo,
# sem handshake de rentabilidade pendente. Nenhuma família nova no yaml (Trilha A não tocada) —
# são PNs exatos e enumerados pela própria Kingston, não uma regra posicional inferida por mim.
#
# validar: python manage.py submit_known_parts submissions/kingston_dram_embarcada_2026-08-17.yaml
# ⚠ SCHEMA DA SUBMISSÃO ≠ BrandFile do load_brands: aqui `brand:` é uma STRING ("brand: Kingston"),
# não o bloco name/code/notes da gramática — corrigido pela infra 2026-08-17 (o bloco antigo fazia o
# lookup falhar com "marca '{dict}' não existe").

