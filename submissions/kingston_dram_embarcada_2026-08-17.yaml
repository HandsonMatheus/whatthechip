  # ── O PN que disparou a pesquisa — legado, fora dos flyers atuais ──────────────
  - part_number: D1216MCABXGGBS
    chip_type: DDR3L
    subtype: DDR3L
    interface: x16
    density_gbit: 2Gb
    confidence: manual
    notes: >
      ⚠ CADEIA DE EVIDÊNCIA MISTA — ler com atenção antes de aprovar. IDENTIDADE confirmada por
      leitura física do chip pelo dono (eMiner, 2026-08-17), PN correto reconfirmado pelo dono:
      4 linhas gravadas no encapsulamento — "N11044-01" / "1648 S2C 6" (provável date code YYWW =
      semana 48 de 2016) / "D1216MCABXGGBS" / "54MJE222000J". Organização/densidade CORROBORADAS
      (2026-08-17, tier inferior) por 2 fontes de distribuidor independentes concordando em
      "128M x 16" + pacote "BGA96"/"96 ball": everychina/cpuprocessorchip ("Dram Memory Chip 128M *
      16... BGA96") e netCOMPONENTS (agrega 16 fornecedores, 208.723 unidades em estoque global —
      volume real, não listagem fantasma). 128M×16 = 2.147.483.648 bit = 2Gbit, bate exatamente com
      "1216" = 2Gb já confirmado em Tier-1 pela família "...ECMD..." (ver PNs acima). alldatasheet.com
      cataloga o fabricante como "Kingston Technology Far East Co. Ltd." (nome corporativo real da
      Kingston), reforçando a identidade. ⚠ Um distribuidor cita "PC1600" como velocidade — isso é
      JEDEC de DDR1 (incompatível com DDR3), quase certamente ruído: a MESMA página cita "tray
      package, 1600/box" — hipótese provável é confusão automática entre a quantidade por bandeja
      (1600 un.) e uma "velocidade PC1600"; NÃO usei esse dado. Velocidade real (1866 vs 2133 Mbps,
      os dois bins que a família "1216" tem) e voltagem exata seguem SEM fonte própria pra este PN —
      seguem inferidos por analogia à família confirmada, não seguem numa nota estruturada. Decisão da revisão
      (infra, 2026-08-17): `confidence=manual` — identidade é física (dono leu o chip) e densidade é
      corroborada, mas velocidade/voltagem seguem por ANALOGIA; sobe a confirmed quando aparecer
      datasheet dedicado do código "MCAB". (manual continua elegível ao estoque, como confirmed.)
    source_url: ""

