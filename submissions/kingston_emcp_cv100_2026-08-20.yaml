# Submissão known_parts — Kingston, família eMCP "08EMCP" (8GB eMMC 5.0), geração de sufixo "CV100"
# Chat de marca Kingston, 2026-08-20. Disparado pelo PN físico do debug de estoque `08EMCP08EL3CV100`
# (known_exact:false, classification_source:"gramática", confidence:"estimated").
#
# DIAGNÓSTICO: diferente do caso 08EMCP04NL2AV1 (rodada anterior, mesmo dia) — aqui o token do PN
# físico é "EL3" (LPDDR3/221-ball pela convenção já documentada da família), e o default da gramática
# TAMBÉM é sempre LPDDR3 — então pra ESTE PN específico o subtype que a gramática mostra (LPDDR3) já
# está CORRETO por coincidência (não é o mesmo bug de mis-classificação do caso NL2/AV1). O gap aqui
# é só known_exact:false / confidence:"estimated" — falta known_part confirmado, e o campo "interface"
# vem vazio no JSON cru da gramática (ela empacota "eMMC 5.0" dentro de emcp_nand como string solta,
# não no campo interface — o schema do known_part usa os campos corretos e separados, ver convenção
# abaixo).
#
# CONTEXTO: sufixo "CV100" já era gap sinalizado (KINGSTON.md §5 / notas da submissão AV100, achado
# incidental buscando "AV100", nunca pesquisado a fundo: "vi também CV100, BT227, DT527, EL2BV100...
# sem perseguir"). Esta rodada pesquisou CV100 a fundo (mesmo padrão AV100: prefixo 08EMCP + token
# NL2/EL3 decodificam certo por gramática, só o sufixo de geração muda).
#
# CLUSTER encontrado (Jotrin + Octopart + ERSA Electronics + bax.com.ua, cross-referenciados,
# 2026-08-20):
#   EL3 (LPDDR3), 08EMCP08 (8GB NAND + 1GB RAM): CV100 (sem revisão) e CV100-C50
#   NL2 (LPDDR2), 08EMCP08 (8GB NAND + 1GB RAM): CV100 (sem revisão)
# Confirmação forte pro EL3CV100 base: bax.com.ua vende a peça já USADA com leitura real do chip via
# ferramenta de programador (Z3X Easy Jtag + E-Mate Pro eMMC Tool) — não é só texto de catálogo de
# distribuidor, é dump do CSD register do silício: "1GB ОЗП + 8 GB Флеш пам'яті", "Extended CSD rev
# 1.7 (MMC 5.0)" — bate exatamente com NAND=8GB/RAM=1GB/eMMC 5.0 esperados pelo prefixo 08EMCP08.
#
# Tentei e NÃO achei (excluído, não adivinhado):
#   - "08EMCP04" (RAM=512MB) em nenhuma variante CV100 (nem NL2 nem EL3) — só existe a capacidade de
#     RAM "08" (1GB) pra essa geração, em todas as fontes consultadas.
#   - Outros códigos de revisão além de "-C50" (tentei C06/C30 por analogia à família AV100) — não
#     achei nenhuma fonte citando essas variantes pra CV100 especificamente.
#
# NÃO PERSEGUIDO nesta rodada (achado incidentalmente buscando CV100, mesmo padrão de escopo já usado
# na entrega AV100): a família 08EMCP tem AINDA MAIS gerações de sufixo — BT227 (existe em 04 e 08),
# BS100, CU100 — apareceram juntas numa mesma listagem Alibaba (mesmo pacote BGA221). BS100 e CU100
# são achados NOVOS desta rodada (não estavam nem na lista "não perseguido" da entrega AV100). Seguem
# sinalizadas no KINGSTON.md §5 pra rodada futura dedicada — não é o gatilho desta vez.
#
# Convenção de campos: idêntica à entrega AV100 (KINGSTON.md §1) — chip_type="eMCP", subtype=geração
# da RAM (LPDDR2/LPDDR3), interface="eMMC 5.0" (toda a família 08EMCP), emcp_nand=GB direto,
# emcp_ram="LPDDR{n} {cap}" (cap=Gbit÷8: código RAM "08"→8Gbit÷8=1GB). device vazio (eMCP não usa
# esse campo, só NAND cru usa pra pacote).
#
# validar: python manage.py submit_known_parts submissions/kingston_emcp_cv100_2026-08-20.yaml

