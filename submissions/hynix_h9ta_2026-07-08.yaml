  #    (findcomponents.net), o VALOR vem de bater exatamente com o mapa H9DA
  #    (já tier-1/Preduo) + a gramática expandida decodificar de forma consistente.
  #    Não é fonte Tier-1 por-PN individual — revisor pode rebaixar ou pedir mais
  #    verificação se achar necessário. ──
