# Submissão de known_parts — SK Hynix, família H9TA (eMCP LPDDR1, família NOVA)
# Gerado pelo chat de marca SK Hynix a partir da investigação do PN H9TA4GH2GDAC
# (busca na bancada, 2026-07-08) — prefixo H9TA não constava na gramática (hynix.yaml
# tinha 35 prefixos, nenhum H9TA). Família adicionada em chips/knowledge/hynix.yaml
# (Trilha A) espelhando o esquema posicional do irmão H9DA. Depois de confirmar o
# primeiro PN, fui atrás de TODOS os irmãos H9TA achados no catálogo do
# findcomponents.net (mesma família, prefixo real e consistente) em vez de coletar
# um PN por vez — a gramática expandida (NAND 1/2/4, RAM 1G/2G/51, todas batendo
# exatamente com o mapa já tier-1 do H9DA) já decodifica 6 dos 8 PNs irmãos achados.
# Os outros 2 (RAM '4G') ficam DE FORA desta submissão — '4G' não existe no mapa
# H9DA e não achei corroboração cruzada, então fica pendente (ver notas no final
# do arquivo e o tip da família em hynix.yaml). Ver diff em chips/knowledge/hynix.yaml
# e chips/tests.py (_HYX_GOLDEN, 5 âncoras H9TA agora, incluindo o caso não-mapeado).
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h9ta_2026-07-08.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h9ta_2026-07-08.yaml --commit --user <seu_usuario>
#
brand: "SK Hynix"
known_parts:
  # ── PN original da bancada — motivou a família nova, confirmação INDIVIDUAL (WinSource) ──
  - part_number: "H9TA4GH2GDACPR-4GM"
    chip_type: "eMCP"
    subtype: "LPDDR1"
    interface: ""
    emcp_nand: "4GB"
    emcp_ram: "LPDDR1 256MB"
    confidence: manual
    source_url: "https://www.win-source.net/products/detail/hynix-semiconductor/h9ta4gh2gdacpr-4gm.html"
    notes: >
      PN base buscado na bancada foi "H9TA4GH2GDAC" (sem sufixo) — este é o order
      code completo confirmado via WinSource (dono verificou o conteúdo renderizado
      via JS em 2026-07-08; meu fetch não executa JS, mesma limitação já documentada
      no caso H9TQ AA/AB de 2026-07-06 — usada aqui como exceção equivalente,
      aprovada pelo dono). WinSource confirma: eMCP eMMC4.x + LPDDR1, mesma leitura
      do irmão já confirmado H9DA4GH2GJAM (posições pn[4:8]="4GH2G" idênticas —
      pn[4]='4'→4GB NAND, pn[7:9]='2G'→LPDDR1 256MB). Único PN desta família com
      confirmação INDIVIDUAL — daí confidence=manual (os demais abaixo são
      confidence=distributor, ver nota geral).

  # ── Irmãos achados no catálogo findcomponents.net — corroboração ESTRUTURAL,
  #    NÃO confirmação individual por-PN. confidence=distributor (mais baixo que
