brand: "Micron"
known_parts:
  # ── D9TXS — o alvo, FAMÍLIA NOVA (GDDR5X, MT58K) ──────────────────────────
  - part_number: "MT58K256M32JA-100:A"
    chip_type: "GDDR5X"
    subtype: "GDDR5X"
    interface: "x32"
    density_gbit: "8Gb"
    fbga_code: "D9TXS"
    confidence: confirmed
    source_url: "https://www.techinsights.com/products/0716-43012-o-5dm-100"
    notes: >
      Identidade via API oficial FBGA Decoder da Micron (fetch direto,
      2026-07-10): D9TXS → MT58K256M32JA-100:A. TIPO: TechInsights (empresa
      de reverse-engineering de semicondutores — fonte técnica confiável,
      não é revendedor) tem entrada estruturada de catálogo pro PN EXATO:
      "Device Type: DDR SGRAM" + título "Micron MT58K256M32JA-100:A 1 GB
      GDDR5X SDRAM". Octopart confirma independentemente: "Synchronous
      Graphics RAM, 256MX32, CMOS, PBGA190" + campo técnico "Number of
      Terminals: 190" (TFBGA-190) + resumo de busca cita densidade
      "8589934592 bits" = 2^33 = 8Gb exato (contagem bruta, sem
      ambiguidade de unidade). CAPACIDADE: conta pelo PN — 256M
      (profundidade) × 32bit (largura) = 8192Mb = 8Gb — bate exato com o
      "8 Gb" do Octopart e com "1GB" do TechInsights (8Gb÷8=1GB). 3 fontes
      independentes batendo. ⚠ Campo é density_gbit (Gb), não capacity —
      GDDR usa density_gbit por convenção (CLAUDE.md §6), igual DDR3/DDR4/
      SDRAM/RDRAM. Obsoleto desde ~2016 (Introduction Date 2016-04-13 no
      Octopart), ainda assim comum na bancada de reciclagem (GPU antiga).
      ⚠⚠ FAMÍLIA NOVA — chips/knowledge/micron.yaml não tem prefixo MT58K
      nem chip_type=GDDR5X pra Micron (é a SEGUNDA família GDDR nova em uma
      semana — a primeira foi MT51J/GDDR5 no lote D9SXC 2026-07-09, ainda
      não aplicada). Ver proposta de gramática comentada no fim deste
      arquivo antes de aprovar — forward-lookup no prefixo "MT58K" (não só
      "MT58K256M32") devolveu SÓ os 11 PNs já listados na proposta (mesma
      organização 256M32/256M321, variando só grau de velocidade -100/-110/
      -120 e ES/MS) — família pequena e já totalmente varrida, sem outro
      tier de densidade encontrado. Nenhum desses 11 aparece no
      fuzzy_sugest. da bancada (o alvo é família nova — não há nada
      aprovado ainda pra sugerir), o que é consistente com serem, de fato,
      todos ausentes do sistema.

