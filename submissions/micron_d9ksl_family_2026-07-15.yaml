# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9KSL
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (D9XSL, D9KJL, D9KSF, D9KSG, D9KSJ) IGNORADO
# por construção — já são KnownPart aprovado.
#
# ACHADO: D9KSL → MT47H128M8HV-3 IT:G. Prefixo MT47H = DDR2, mesma
# família base de D9RZH/D9MTG/D9KJP — aqui organização "128M8" (1Gb,
# x8). Sem part-name direto da Micron para o próprio alvo, mas Octopart
# lista o MESMO part-number com a MESMA revisão ":G" diretamente:
# "MT47H128M8HV-3 IT:G — DRAM Chip DDR2 SDRAM 1G-Bit 128Mx8 1.8V 60-Pin
# FBGA Tray". Capacidade: 128M × 8bit = 1024Mb = 1Gb — bate exato.
#
# Coleta máxima da família (conforme padrão desta sessão): forward-
# lookup no prefixo "MT47H128M8" (2026-07-15) achou 136 PNs: 100 de
# produção ("D9*") + 36 Engineering Sample ("Z9*", EXCLUÍDOS). Dos 100
# D9, 2 têm "ES" no próprio texto do PN apesar do prefixo D9 "de
# produção" (checado programaticamente, regex `(?:^| )ES(?:$|[ :])`) —
# EXCLUÍDOS: D9FVM ("...5E L ES:A"), D9FVN ("...37E L ES:A"). Restam 98
# D9 de produção limpos. 12 têm part-name direto da Micron confirmando
# tipo+capacidade ("DDR2 1G X8 FBGA"/"TFBGA": D9LHN, D9LHP, D9LHQ, D9LNN,
# D9LVF, D9LVM, D9LXP, D9LXQ, D9LXZ, D9MCG, D9RZK, D9RZW); os outros 86
# (alvo + 85 irmãos) herdam a mesma organização por construção do
# próprio prefixo buscado (verificado programaticamente: todos os 98
# part-numbers começam literalmente por "MT47H128M8", mesma lógica já
# usada em D9RZH/D9MTG/D9KJP/D9MNT/D9NMW).
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente).
# Sem sobreposição com nenhuma submissão anterior (grep em
# submissions/*.yaml, zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9ksl_family_2026-07-15.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9ksl_family_2026-07-15.yaml --commit
#
