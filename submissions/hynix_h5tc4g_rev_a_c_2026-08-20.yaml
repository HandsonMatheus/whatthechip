# Submissão de known_parts — SK Hynix, família H5TC (DDR3L standalone, JÁ MAPEADA).
# Gerado a partir da investigação do PN H5TC4G63AFR (busca na bancada, 2026-08-20) — MESMO
# padrão "die-revision-letter" já visto váras vezes nesta família/H5TQ (H5TC2G63FFR/-GFR,
# H5TQ1G63DFR/-EFR, H5TQ4G63CFR/-EFR): dentro da MESMA densidade+interface, uma letra final
# diferente é uma REVISÃO/DOCUMENTO de datasheet distinto, não muda capacidade. A gramática
# já decodifica certo (pn[4:6]="4G"→dram_density="4Gb = 512MB por die [✓]", grammar_complete=
# true no debug) — é known_parts-only (Trilha B), sem fix de gramática.
#
# COBERTURA DE CLUSTER (pedido permanente do dono — nunca 1 só PN): a chave 4G/x16 já tinha
# a revisão E confirmada (hynix_h5tc_2026-07-13.yaml). Busca ampliada nesta rodada achou DUAS
# revisões novas na MESMA densidade: a revisão A (alvo da bancada) E a revisão C (achada de
# bônus — datasheet oficial com fetch DIRETO e completo, melhor evidência que o próprio alvo).
# As 4 entradas abaixo = par x16/x8 de cada revisão nova.
#
# FONTES:
#   Revisão A (H5TC4G63AFR / H5TC4G83AFR) — AllDataSheet: entrada PRÓPRIA (Part#=H5TC4G63AFR,
#   id 533422, 497KB/35 páginas; H5TC4G83AFR-PBA, id 533416, mesma contagem de páginas/tamanho
#   de arquivo — consistente com par x16/x8 do mesmo documento), Manufacturer=HYNIX, Direct
#   Link=skhynix.com oficial. NÃO consegui abrir o corpo do PDF em si (host com viewer JS não
#   retorna texto no fetch, mesma limitação já documentada nesta família p/ H5TC1G83EFR e
#   H5TC8G63AMR). Corroborado por: Datasheets360, ElectronicsDataSheets, Kynix (descrição
#   estruturada própria: "DDR DRAM, 512MX8, 0.225ns, CMOS, PBGA78" pro H5TC4G83AFR-PBA — bate
#   exato com 4Gb÷8=512MB e x8/78ball), Tech-Electr, AB Sunshine — todos convergindo em "4Gb
#   DDR3L SDRAM" / config 256Mx16 (63) e 512Mx8 (83). Metadado do PDF em datasheet.iiic.cc (não
#   abriu corpo, só título via busca) cita "Rev. 1.0 / Apr. 2013" — documento real, revisão mais
#   antiga que a E (confirmada Rev.1.4/1.5). confidence=manual (mesmo rigor das outras entregas
#   manual desta família — metadado estruturado multi-fonte, não li o corpo do PDF).
#
#   Revisão C (H5TC4G63CFR / H5TC4G83CFR) — achada na varredura de cluster, NÃO era o alvo da
#   bancada. Datasheet oficial SK Hynix "4Gb DDR3 SDRAM / 4Gb DDR3L SDRAM" Rev.0.2/Jul.2014,
#   lido NA ÍNTEGRA via fetch direto do PDF (hospedado community.nxp.com, anexo de fórum oficial
#   da NXP/imx-processors — documento técnico completo, não metadado de agregador). Ordering
#   Information confirma EXPLICITAMENTE as duas variantes no mesmo doc.: H5TC4G83CFR-*xxA/I/L/J
#   = "512M x 8" (x8), 78ball FBGA; H5TC4G63CFR-*xxA/I/L/J = "256M x 16" (x16), 96ball FBGA.
#   4Gb÷8=512MB — bate exato com a gramática. Corroborado por AllDataSheet listando 5 variantes
#   de sufixo (-H9A/-H9I/-H9J/-H9L/-PBA, Rev.1.4/Oct.2015 — revisão mais nova do mesmo produto,
#   472KB/33P). confidence=confirmed (li o corpo técnico completo do datasheet, tabela Ordering
#   Information direta).
#
# GAP CONHECIDO (não incluído, não inventado): busca também retornou sinais de uma possível
# revisão B (H5TC4G83BFR-PBA/-RDA, vários distribuidores: AB Sunshine, Express Technology,
# DigiPart, Avaq, Kynix) — mas o único PDF direto encontrado (datasheet.iiic.cc) teve o mesmo
# problema de viewer JS que a revisão A, sem body de texto extraível, e não achei mirror
# alternativo nesta rodada. Não incluída por rigor (nem confirmed nem manual com convergência
# suficiente checada) — sinalizando pro dono como possível 5ª revisão a fechar depois.
#
# ⚠ BUG PRÉ-EXISTENTE DO ENGINE (já documentado em hynix_h5tc_2026-07-13.yaml e
# hynix_h5tc_h5tq_2026-07-15.yaml, reaplica aqui): `_result_from_known` (chips/engine.py,
# branch família casada) não propaga `known.interface` pro classify() quando há família
# casada — campo fica salvo corretamente no banco, só não aparece na saída hoje. Fora do
# escopo do chat de marca (não modificar código sem perguntar).
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h5tc4g_rev_a_c_2026-08-20.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h5tc4g_rev_a_c_2026-08-20.yaml --commit
#
brand: "SK Hynix"
known_parts:
  - part_number: "H5TC4G63AFR"
    chip_type: "DDR3L"
    subtype: "DDR3L"
    density_gbit: "4Gb"
    density_gb: "512MB"
    interface: "x16"
    confidence: manual
    source_url: "https://www.alldatasheet.com/datasheet-pdf/pdf/533422/HYNIX/H5TC4G63AFR.html"
    notes: >
