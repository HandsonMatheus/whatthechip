      pra esta forma exata (id 533422, 497KB/35 páginas, Manufacturer=HYNIX, Direct
      Link=skhynix.com oficial). NÃO consegui abrir o corpo do PDF (host com viewer JS não
      retorna texto no fetch) — confidence=manual, mesmo padrão de rigor já usado em
      H5TC1G83EFR/H5TC8G63AMR nesta família. Corroborado por Datasheets360,
      ElectronicsDataSheets, Tech-Electr, AB Sunshine — todos "4Gb DDR3L SDRAM"/256Mx16.
      Metadado do PDF em datasheet.iiic.cc (título via busca, corpo não aberto) cita "Rev.
