# DRAM" (ver avisos já registrados em winbond_ddr2_w97x_jb_2026-09-01.yaml pro PN "W971GG6JB" e em
# winbond_ddr3_w63x_kb_2026-09-01.yaml pro PN "W632GG6KB"): todo PN físico desta família carrega
# sufixo (-09/-11/-12, e variante industrial "I"). O candidato mais provável pra "W631GU6NB" é
# `W631GU6NB-11` — não só é o mais citado (4 fontes independentes: SnapEDA/SnapMagic, DigiKey ID
# 14290030, Arrow TRAY, Mouser), como é a MESMA família/organização (GU6, DDR3L x16) do PN de
# bancada. NÃO decidido sozinho: sinalizado aqui e na nota do PN, pra confirmação física do dono.
# Padrão se repetindo agora 3/3 nesta sessão — reforça a suspeita já registrada de que o scanner/
# leitura de bancada pode estar cortando especificamente o sufixo de velocidade nesta linha
# "Specialty DRAM" (não aconteceu no único PN da linha móvel LPDDR2 lido hoje, que veio completo
# com X2E incluso). Vale considerar com o dono uma checagem no processo de leitura/OCR desta linha.
#
