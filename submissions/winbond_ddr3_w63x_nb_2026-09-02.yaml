# hoje (1ª: pacote "JB" ausente na família DDR2 W97x; 2ª: pacote "KB" ausente em W632 na família DDR3
# W63x): fonte sistemática ≠ fonte completa — o distribuidor original só não listou/carregou esta
# combinação densidade×pacote, não significa que o fabricante não produziu.
#
# MAXIMIZAÇÃO NESTA RODADA: busquei "NB" em W631 nas duas organizações (GG=x16/x8, GU=x16/x8) e nas
# grades de velocidade disponíveis, incluindo variante industrial "I". Total: 10 known_parts novos.
#
