#   - W631+NB com sufixo de velocidade "-15": existe pra outros pacotes desta família (ex.:
#     W631GG6KB-15), mas não achei "...NB-15" em nenhuma fonte pra W631 — não presumido.
#
# Fonte: mistura de distribuidor direto (DigiKey — várias regionais/.com/.at/.cn — Mouser, Arrow,
# SZComponents, SnapEDA/SnapMagic, Avnet APAC, todos com página própria de produto) + agregadores
