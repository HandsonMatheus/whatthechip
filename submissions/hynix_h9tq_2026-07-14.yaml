      mesmo decode. Sunether (via DigiPart) tem entrada própria "H9TQ64A8JTMCUR-KUM" (SK
      Hynix, 30025un). Confirmado também em MountainView, Sense Electronic (2 linhas) e
      SILITECH pro PN base "H9TQ64A8JTMC" (manufacturer "HYNYX", provável erro tipográfico
      de "HYNIX") e Chipsea (limpo, "SKHYNIX", BGA, 31000un). Bate com pn[4:6]='64'→8GB e
      pn[6:8]='A8'→1GB, já mapeados — primeira confirmação de known_part especificamente pra
