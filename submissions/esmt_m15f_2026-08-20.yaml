# ESMT M15F -- DDR3 SDRAM (4a rodada, 2026-08-20). Disparado por PN AO VIVO do
# debug de estoque: M15F1G1664A veio 100% desconhecido (known:false,
# in_review_queue:true), fuzzy_suggestions apontava M15T1G1664A e M14D1G1664A --
# nenhum dos dois e o PN real.
#
# NOTA IMPORTANTE sobre chip_type: diferente do M14D/M14F (onde "DDR2L" nao existe
# no vocabulario e os dois prefixos foram forcados pra chip_type=DDR2), aqui "DDR3"
# e "DDR3L" SAO dois chip_types distintos e validos em chips/chip_types.py
# (confirmado via leitura direta do arquivo, nao suposicao). M15F usa chip_type=DDR3
# (nao DDR3L) porque todo datasheet/titulo indexado chama a familia de "DDR3 SDRAM"
# (sem "(L)"), e a unica confirmacao direta de tensao (M15F1G1664A, pagina oficial
# esmt.com.tw) mostra 1.5V-only -- diferente do M15T, que e "DDR3(L) SDRAM" dual
# 1.35V/1.5V. Isso NAO muda rentabilidade: DDR3 e DDR3L tem o mesmo ChipTypeSpec em
# chip_types.py (dram_pc/ddr/ddr, carries_generation=True) -- so deixa o tipo/label
# exibido mais preciso.
#
# M15F5121632A e sub-1Gb -- density_gbit vai fracionario ("0.5Gb"), mesma regra
# descoberta na rodada M14D (ver ESMT.md §1/§3.3): o parser _extract_gbit/_GBIT_RE
# do engine so reconhece o sufixo literal "Gb".
#
# M15F4G8512A (par x8 do M15F4G16256A) foi mencionado 1x numa listagem agregada do
# Alldatasheet, mas NAO tem pagina dedicada nem apareceu em nenhuma outra fonte
# (Satron, Sekorm, LCSC, IC-Components) apesar de busca dirigida -- excluido desta
# submissao por regra de ouro #12 (spec essencial nao confirmavel em Tier-1/2 =
# excluir, nunca estimar). Ver ESMT.md §3.4/§6.

brand: "ESMT"
known_parts:
  - part_number: "M15F1G1664A"
    chip_type: "DDR3"
    subtype: "DDR3"
    density_gbit: "1Gb"
    density_gb: "128MB"
    interface: "x16"
    confidence: confirmed
    source_url: "https://www.esmt.com.tw/en/Products/DRAM/DDR3(L)%20SDRAM-1-4"
    notes: >
      ESMT DDR3 SDRAM, 8M x16bit x8 bancos = 8.388.608 x 16 x 8 = 1.073.741.824 bit =
      1Gb = 128MB. PN AO VIVO do debug de estoque (2026-08-20), veio 100%
      desconhecido -- known:false, in_review_queue:true, fuzzy_suggestions apontava
      M15T1G1664A e M14D1G1664A (nenhum e o PN real, so vizinhos por edit-distance).
      3 fontes: pagina oficial de produtos esmt.com.tw/en/Products/DRAM/DDR3(L)%20SDRAM
      (tabela completa do catalogo atual, linha "1Gb | M15F1G1664A (2S) | 64Mbx16 |
      1.5V") + tabela da Satron Electronics (satronel.com/products/semiconductors/
      memoriy_ic/sdram/ddr3-sdram.html: M15F1G1664A(2S) e (2C), 64Mbx16, 1.5V, 96 Ball
      BGA) + Alldatasheet ID 1284530 (datasheet-pdf/pdf/1284530/ESMT/M15F1G1664A.html,
      citacao direta "8M x 16 Bit x 8 Banks DDR3 SDRAM", sem "(L)"). Tensao 1.5V-only
      confirmada em fonte oficial -- diferente do par M15T1G1664A (DDR3L, 1.35V/1.5V,
      ja confirmado nesta marca), mesma organizacao/densidade, tipo diferente.

  - part_number: "M15F2G16128A"
    chip_type: "DDR3"
    subtype: "DDR3"
    density_gbit: "2Gb"
    density_gb: "256MB"
    interface: "x16"
    confidence: confirmed
    source_url: "https://www.alldatasheet.net/view.jsp?sField=0&Searchword=M15&list=455"
    notes: >
      ESMT DDR3 SDRAM, 16M x16bit x8 bancos = 16.777.216 x 16 x 8 = 2.147.483.648 bit
      = 2Gb = 256MB. Organizacao citada via listagem Alldatasheet de prefixo "M15"
      ("16M x 16 Bit x 8 Banks DDR3 SDRAM"). Existencia cruzada em 4 fontes
      distribuidoras adicionais: datasheet4u.com (sufixos -EFBG2L e -DEBG2LS),
      electronicsdatasheets.com (-8CBG), datasheet-pdf.com (-DEBG2L), edinventory.com
      (-8CBG). CONFIANCA MENOR que os outros 3 M15F desta rodada: nao apareceu na
      tabela da Satron Electronics (que lista os outros 3) nem tem pagina Alldatasheet
      dedicada encontrada -- so a listagem agregada deu a organizacao. Recomendo
      revisar com atencao extra antes de aprovar, mesmo padrao ja usado pro
      M15T2G8256A na 1a familia desta marca (2026-08-05).

  - part_number: "M15F4G16256A"
    chip_type: "DDR3"
    subtype: "DDR3"
    density_gbit: "4Gb"
    density_gb: "512MB"
    interface: "x16"
    confidence: confirmed
    source_url: "https://www.alldatasheet.com/datasheet-pdf/pdf/1284528/ESMT/M15F4G16256A.html"
    notes: >
      ESMT DDR3 SDRAM, 32M x16bit x8 bancos = 33.554.432 x 16 x 8 = 4.294.967.296 bit
      = 4Gb = 512MB. 4 fontes: Alldatasheet ID 1284528 (pagina dedicada, citacao
      direta "32M x 16 Bit x 8 Banks DDR3 SDRAM", sem "(L)") + Sekorm
      (en.sekorm.com/doc/2032998.html, mesma citacao) + tabela da Satron Electronics
      (satronel.com: 4Gb, M15F4G16256A(2S), "256Mbx16" -- 256M total de palavras x16
      = 4.294.967.296 bit, bate exato) + listagem Alldatasheet de prefixo "M15".
      ATENCAO -- unica divergencia de tensao encontrada nesta rodada: a tabela da
      Satron cita esse PN especifico como "1.35V/1.5V" (dual, igual DDR3L), enquanto
      TODAS as outras citacoes (titulo do datasheet no Alldatasheet e no Sekorm)
      chamam o chip de "DDR3 SDRAM" sem "(L)". Mantive chip_type=DDR3 pelo sinal mais
      consistente (nome do datasheet, 2 fontes independentes) contra 1 valor de
      tensao discordante -- recomendo o dono revisar esse ponto especifico se a
      tensao exata importar pro caso de uso. Nao afeta rentabilidade (DDR3/DDR3L =
      mesmo ChipTypeSpec).

  - part_number: "M15F5121632A"
    chip_type: "DDR3"
    subtype: "DDR3"
    density_gbit: "0.5Gb"
    density_gb: "64MB"
    interface: "x16"
    confidence: confirmed
    source_url: "https://satronel.com/products/semiconductors/memoriy_ic/sdram/ddr3-sdram.html"
    notes: >
      ESMT DDR3 SDRAM, 4M x16bit x8 bancos = 4.194.304 x 16 x 8 = 536.870.912 bit =
      512Mb = 64MB. 3 fontes: tabela da Satron Electronics (satronel.com: 512Mb,
      "32Mbx16" total de palavras -- 32M x16bit = 536.870.912 bit, bate exato --
      1.5V, 96 Ball BGA) + listagem Alldatasheet de prefixo "M15" ("4M x 16 Bit x 8
      Banks DDR3 SDRAM") + titulo indexado datasheetspdf.com ("M15F5121632A SDRAM
      Datasheet pdf - DDR3 SDRAM"). Densidade SUB-1Gb -- density_gbit fracionario
      ("0.5Gb"), nunca "512Mb" (mesma armadilha documentada no M14D/M14F, ver
      ESMT.md §1/§3.3: o parser _extract_gbit/_GBIT_RE do engine so reconhece o
      sufixo literal "Gb").

# Familia M15F inteira (4 PNs) = mesma categoria comercial viva do M15T (dram_pc,
# NAO dram_legacy) -- rentabilidade depende do ProfitabilityConfig atual (admin,
# mutavel), igual ja documentado pro M15T -- nao e um veredito fixo como o DDR2
# M14D/M14F. M15F4G8512A (par x8) NAO incluido -- ver nota no topo do arquivo.
