# Submissão de known_parts — Samsung, família K4W (gDDR3)
# PN alvo: K4W2G1646P (busca 2026-07-13). Mesmo trabalho de varredura profunda já
# feito em submissions/samsung_k4w_2026-07-09.yaml + addendum (die-letters D/E/G em
# 1Gb, B/C/E/Q/S em 2Gb, B/D/E/Q em 4Gb). Local (seed + PSGs) NÃO tinha 'P' nem 'T'
# em nenhuma capacidade — confirmado via seed_known_parts.json (14 K4W, nenhum P/T)
# e as 2 submissões prévias. Grammar já decodifica certo hoje (pn[3:5]='2G' via
# DRAM_PC global → 256MB) — só faltava o PN exato no banco.
#
# 'P' (alvo) — 2Gb, achado em 11 fontes de distribuidor independentes convergentes,
# todas "SAMSUNG BGA" / gDDR3 série K4W2G1646, em estoque real (centenas a milhares
# de unidades cada): DigiPart (agregador — 10 revendedores distintos: Hongte, Ariat,
# YIC, Allchip, Atosn, New Strength, IC-Components, Sierra IC, Green Light, Chipsea)
# + Censtry.kr (listagem individual) + Kynix (73 un.) + IC-Components (11061 un.).
# ⚠ Diferente de C/E/Q/B/S (que tinham texto descritivo explícito "2Gb GDDR3
# SDRAM... 128Mx16... FBGA-96" citando o PN), NENHUMA fonte teve texto de spec
# citando 'P' literalmente — só confirmação de catálogo/estoque. Cheguei a checar o
# Product Selection Guide oficial Samsung (2H 2013, via mirror arrow.com) que listou
# a linha gDDR3 K4W inteira — mas essa edição específica só lista D/B (4Gb), Q/E
# (2Gb) e G (1Gb); nem P nem S nem C nem T aparecem nela (são variantes de bin de
# velocidade / edições de catálogo diferentes, não uma lista exaustiva histórica).
# Por isso confidence=distributor (não confirmed) — mesmo critério já usado pro
# die-letter Q em 2Gb (que tinha só 1 fonte distribuidora; aqui são 11). Capacidade
# 2Gbit÷8=256MB inferida com segurança da gramática já comprovada da família (não
# muda com o die-letter — mesmo padrão dos 5 die-letters já confirmados em 2Gb).
#
# 'T' — ACHADO BÔNUS (não era o alvo): apareceu nas seções "See Also" das páginas
# DigiPart de P, como K4W2G1646T-BC11 — mesmo perfil evidencial (7 revendedores
# independentes via DigiPart: Allchip, New Strength, Sierra IC, Haode, Green Light,
# Chipsea + estoques de centenas a 100mil unidades), também 2Gb, também ausente do
# PSG oficial. Mesmo tratamento: confidence=distributor.
#
# Nem P nem T encontrados em 1Gb ou 4Gb (buscas diretas "K4W1G1646P/T" e
# "K4W4G1646P/T" vazias, e as seções "See Also" de ambos não trazem essas
# combinações) — parecem existir só na fatia 2Gb, mesmo padrão de S (2Gb-only).
# Nenhuma classe de densidade 8Gb encontrada (mesma conclusão do addendum anterior).
