      DigiPart e NÃO achei listagem de distribuidor pra esta capacidade específica (Censtry devolve
      404 pra "emmc32g-v100"). Registrado mesmo assim por vir de fonte tier-manufacturer direta (o
      mesmo catálogo já provou bater exato com dados independentemente confirmados pras famílias
      KE4/S100) — mas sinalizando que não achei confirmação de mercado vivo pra ESTA capacidade,
