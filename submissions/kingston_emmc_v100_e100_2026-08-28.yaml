      próprio motor apontou "EMMC16G-S100" como parecido, mas confirmei que "V100" é geração REAL e
      DISTINTA de S100 — mesmo catálogo de origem lista as duas em tabelas separadas com specs
      diferentes: V100=TLC/eMMC 4.41/linha "Value", S100=MLC/eMMC 5.0/linha "Value A19nm" — não é
      erro de leitura). Pacote 153-ball BGA 11.5x13x1.0mm — confirmado no catálogo histórico Kingston
      "Embedded Memory" (mar/2014, espelhado via Arrow, validado por bater exato com specs já
      confirmadas independentemente pras famílias KE4/S100 na MESMA tabela) E corroborado em mercado
      vivo por 7+ fontes independentes: Avnet (distribuidor autorizado, PN exata do debug), Win-Source
      (listagem própria confirmada), Alldatasheet (3 variantes: base/-C06/-C30), Ciiva, OEMsTrade,
      Censtry, Ariat-Tech. Nenhuma fonte diverge em fabricante/pacote/capacidade.
    source_url: https://www.avnet.com/shop/us/products/kingston-technology/emmc16g-v100-3074457345626906430/

  - part_number: EMMC32G-V100
    chip_type: eMMC
