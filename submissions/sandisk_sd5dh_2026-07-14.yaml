# Submissão known_parts — SanDisk, família SD5DH (eMMC legado)
# Origem: investigação a partir do PN SD5DH26A4G (debug do estoque, 14/07/2026).
# Ver INVESTIGACAO_sandisk_sd5dh_2026-07-14.md para a análise completa, INCLUSIVE a ambiguidade
# de tipo do SD5DH26A4G (eMMC vs eMCP) e a decisão do dono de tratá-lo como eMCP (§2).
#
# 3 PNs confidence=manual: 2 eMMC (24A/24C, já documentados no tip da família, capacidade+device
# confirmados via cross-ref de reparo) + 1 eMCP (26A, decisão explícita do dono — triangulação via
# substituto Samsung pino-a-pino + aritmética de RAM batendo com o total do aparelho, não datasheet).
