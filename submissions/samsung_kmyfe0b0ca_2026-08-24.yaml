# Submissão de known_parts — Samsung, PN KMYFE0B0CA (família "KM" genérica eMCP)
# + KMYFG0C0CM (irmão real, achado ao pesquisar mais a pedido do dono — ver bloco
# antes da 2ª entrada, mais abaixo).
# PN 100% desconhecido no debug (nand/ram "não mapeada", grammar_complete=false,
# fuzzy_suggestions vazio). A 3ª letra do PN ('Y') NÃO existe no SAM_EMCP_GEN da
# gramática (D/F/G/I/J/K/L/N/Q/R/S/V — sem 'Y') nem no tip da família — não é
# omissão de documentação, é ausência real no mapa. Não mexi na gramática por
# isso (fora de escopo — pesquisar+confirmar known_part é o trabalho).
#
# Zero achado em Octopart (sem listagens), zero no índice mestre Puris/emcplist
# (nenhum PN "KMY*" catalogado), zero em distribuidor comum.
#
# ⚠⚠ ACHADO — este NÃO é um eMCP padrão de 2 componentes (LPDDR+eMMC) como a
# família "KM" assume. Fonte Tier-1/2 de altíssima qualidade: artigo da EDN
# (revista técnica respeitada, publicado 2008-09-19) "RIM's Blackberry Bold",
# citando análise de decapsulamento (die-level) feita pelos analistas da
# Semiconductor Insights (SI — empresa de engenharia reversa de semicondutores,
# hoje parte da TechInsights, a MESMA categoria de fonte que citei hoje para
# K4B1G0846F). Texto direto do artigo:
#   "The Bold's memory concerns are addressed by one Samsung multi-chip package
#   featuring the markings of KMYFE0B0CA. This is the first time the analysts
#   at Semiconductor Insights (SI) had come across this kind of Samsung device...
#   Based on the markings, the package was to contain three types of memory–
#   1 GB of moviNAND, 1 GB of OneNAND and 1 GB of SDRAM. Once the package was
#   decapped... there was no disputing which die were the SDRAM and the OneNand
#   devices. There were, however, disagreements over the moviNAND... What we saw
#   were two distinct dies, when we were expecting one. One photo corresponded
#   to 8 Gb of MLC NAND flash... The other die was the memory controller."
#
# Ou seja: pacote de ATÉ 4 DIES fisicamente distintos (SDRAM + OneNAND + NAND MLC
# 8Gb=1GB + controlador), não o par simples RAM+eMMC que os campos emcp_ram/
# emcp_nand do schema assumem. É um chip histórico/raro (BlackBerry Bold, 2008 —
# primeira vez que a própria SI via esse tipo de pacote Samsung), então:
#   - "SDRAM" aqui é SDRAM móvel PRÉ-LPDDR (2008, antes do LPDDR2 virar padrão
#     móvel ~2009-2010) — NÃO é "LPDDR{n} {cap}GB" como a convenção pede.
#     Escrevi o texto real (SDRAM) em vez de forçar um rótulo LPDDR falso.
#   - NAND-side é NAND(moviNAND, controlador+flash) + OneNAND (tecnologia Flash
#     DIFERENTE, não é eMMC) — também não é um "eMMC N GB" simples.
# Registrei como aproximação honesta (emcp_ram/emcp_nand em texto livre — o
# portão não valida formato desses 2 campos, só schema.py:182-183, str livre),
# com a ressalva completa nas notes. capacidade total ~3GB combinados
# (SDRAM 1GB + moviNAND-ish ~1GB + OneNAND 1GB) → claramente RENTÁVEL
# independente da composição exata interna (não sensível ao detalhe disputado).
# ⚠ Recomendo o dono revisar manual no admin antes de aprovar — é o único
# known_part de hoje que não se encaixa limpo no schema padrão de eMCP.
brand: "Samsung"
known_parts:
  - part_number: "KMYFE0B0CA"
    chip_type: "eMCP"
    subtype: "embedded Multi-Chip Package (LPDDR + eMMC)"
    interface: ""
    emcp_nand: "2GB"
    emcp_ram: "SDRAM 1GB"
    confidence: confirmed
    source_url: "https://www.edn.com/rims-blackberry-bold/"
    notes: >
      CORRIGIDO 2026-08-24 (auditoria do dono, "prosa em campo de medida"):
      emcp_ram/emcp_nand originalmente traziam texto livre — corrigido pra
      campo de medida único (regra CLAUDE.md §6), toda a explicação movida
      pra cá. emcp_nand="2GB" = soma de moviNAND ~1GB (NAND MLC 8Gb) +
      OneNAND 1GB — capacidade TOTAL de flash do pacote, não só a parcela
      moviNAND (decisão minha; se o dono preferir separar/tratar diferente,
      é o ajuste a fazer). PN alvo, 100% desconhecido no debug. Fonte: artigo
      EDN "RIM's Blackberry Bold" (2008-09-19), citando análise de
      decapsulamento da Semiconductor Insights (hoje TechInsights) — mesma
      categoria de fonte usada pra K4B1G0846F. ⚠⚠ Pacote de ATÉ 4 dies
      físicos (SDRAM + OneNAND + NAND MLC 8Gb + controlador NAND) — NÃO é o
      par simples LPDDR+eMMC que o schema eMCP assume. Os próprios analistas
      da SI tiveram "disagreements" sobre se a designação "moviNAND" é válida
      (esperavam 1 die, acharam 2 — NAND flash + controlador separados).
      "SDRAM" é RAM móvel PRÉ-LPDDR (dispositivo de 2008; LPDDR2 só virou
      padrão móvel ~2009-2010) — por isso o campo NÃO segue o molde
      "LPDDR{n} {cap}GB" (seria inventar geração LPDDR que não existe aqui).
      Capacidade total ~3GB combinados entre os 3 tipos de memória —
      RENTÁVEL claro por capacidade, independente da composição interna
      exata (que segue em aberto até hoje pra própria SI). Dispositivo
      histórico/raro (BlackBerry Bold 2008) — primeira vez que os próprios
      analistas viam esse tipo de pacote Samsung. ⚠ Não se encaixa limpo no
      schema padrão de eMCP (emcp_ram/emcp_nand assumem 1 componente cada) —
      considerar reclassificar chip_type="MCP" (Raw MCP, ver MICRON.md §4)
      numa próxima revisão; por ora mantido "eMCP" — revisar manual no admin
      antes de aprovar.

  # ── Pesquisei mais, a pedido do dono ("e só achou esse?") ──────────────────
  # Achei 1 irmão REAL: KMYFG0C0CM (mesma 3ª letra 'Y', mesma composição de 3
  # dies). Fonte igualmente forte: MESMA série de teardown IHS/iSuppli (autor
  # "IHS Electronics & Media", publicado via Electronics360/GlobalSpec) que
  # documentou o KMYFE0B0CA no Bold 9000 — desta vez no BlackBerry (RIM) Storm
  # 9530 (2008-11-14, CDMA/EvDO+WCDMA). Fetch direto da página primária (não só
  # resumo de busca):
  #   "MCP - Samsung Semiconductor - KMYFG0C0CM-D302 - 8Gb MLC moviNAND Flash +
  #   1Gb OneNAND Flash + 1Gb Mobile SDRAM" ($7.50 no BOM do Storm 9530, vs
  #   $10.45 no Bold 9000 — custo diferente, composição de memória idêntica).
  # PN completo com sufixo: "KMYFG0C0CM-D302" (mesmo padrão do alvo, que também
  # tem sufixo "-D300" confirmado na mesma fonte). Corroborado (não como fonte
  # de spec, só de existência do PN) por 2 distribuidores HK/Shenzhen
  # (ssfkg.com, icqqg.com) que listam ambos os PNs como "MCP SAMSUNG" em BGA.
  #
  # Busquei ativamente por MAIS irmãos antes de parar:
  #   - Brochura oficial "Samsung Fusion Memory" (pdf.directindustry.com) —
  #     confirma que existe uma linha de produto formal "moviMCP" (NAND/OneNAND
  #     + mDRAM, até 4GB) que contextualiza a categoria, mas NÃO lista um PN
  #     exato — não é uma "Part Number Matrix" como a brochura de eMMC que usei
  #     hoje mais cedo. Não force o rótulo "moviMCP" nos 2 known_parts (é
  #     contexto, não confirmação por PN).
  #   - BlackBerry Bold 9700 (próxima geração, 2009): usa Samsung
  #     KAT00F00NM-AE77 — prefixo DIFERENTE ("KAT", não "KMY"), pacote PoP de
  #     só 2 componentes (2Gb OneNAND + 2Gb SDRAM, sem NAND/moviNAND), e a
  #     PRÓPRIA fonte IHS marca como "(Estimated)". NÃO é irmão da família KMY
  #     — é outra família, com fonte mais fraca (estimativa, não medição). Não
  #     submeti (excluir, não adivinhar) — fica registrado aqui caso o dono
  #     queira um dia pesquisar a família "KAT" à parte, com fonte melhor.
  #   - BlackBerry Storm2 9550 e Curve 8900: pesquisado, zero teardown com PN
  #     de memória encontrado (nenhuma fonte cobre o componente exato).
  #   - Tentativas de PN por padrão (KMYJE*, KMYGE*): zero evidência real —
  #     não inventado.
  # Conclusão: cluster "KMY" real = 2 PNs (KMYFE0B0CA + KMYFG0C0CM). Não é
  # "só achei 1 e parei" — é o tamanho real do cluster nas fontes existentes.
  - part_number: "KMYFG0C0CM"
    chip_type: "eMCP"
    subtype: "embedded Multi-Chip Package (LPDDR + eMMC)"
    interface: ""
    emcp_nand: "2GB"
    emcp_ram: "SDRAM 1GB"
    confidence: confirmed
    source_url: "https://electronics360.globalspec.com/article/2198/blackberry-rim-storm-9530-mobile-phone-teardown"
    notes: >
      CORRIGIDO 2026-08-24 (mesma auditoria "prosa em campo de medida" do
