    source_url: "https://findcomponents.net/TYC0FH121660RA"
    notes: >
      PN da bancada, cluster já documentado no tip da família TYC: "TYC0FH12[XXXX]RA =
      mesmas specs, só lote diferente" — bate exatamente (TYC0FH12 + lote "1660" + RA).
      Confirmação de EXISTÊNCIA/pacote via múltiplos distribuidores (YIC Electronics,
      Allelco, findcomponents.net, AliExpress — "FBGA162 EMCP memory CHIP IC"), nenhum
      com capacidade individual explícita. Capacidade (4GB NAND / LPDDR2 512MB) segue o
      padrão já estabelecido no tip da família (pn[3:5]="0F"=4GB, pn[5]="H"=LPDDR2
      512MB). confidence=distributor por decisão do dono (2026-07-09): eMCP LPDDR2 é
      SEMPRE NÃO RENTÁVEL independente da capacidade exata.

