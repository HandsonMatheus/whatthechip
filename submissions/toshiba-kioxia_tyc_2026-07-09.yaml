# Submissão de known_parts — Toshiba-Kioxia, família TYC (eMCP LPDDR2 legado, já existente)
# Gerado pelo chat de marca Toshiba-Kioxia a partir da investigação do PN TYC0FH121660RA
# (busca na bancada, 2026-07-09). Família TYC já documentada na gramática desde 2026-06-26 —
# esta submissão NÃO muda gramática, só adiciona known_parts.
#
# Pesquisa: tentei achar fonte melhor que a já documentada no tip da família (Octopart — sem
# dado pra nenhum PN dessa família, diferente do que aconteceu com THGBF; YIC/Allelco/Kynix —
# listagens de estoque vazias ou com descrição toda errada/mismatched; findcomponents.net — só
# confirma que os PNs existem em catálogo; AliExpress — só confirma pacote FBGA162 + tipo EMCP).
# Não achei nada NOVO além do que já estava no tip da família (Tier 2-3, nunca Tier-1).
#
# 2ª rodada (a pedido do dono "só achou 1 PN de novo?"): o tip da família já documentava o
# cluster "TYC0FH12[XXXX]RA = mesmas specs, só lote diferente" — revisitei os resultados de
# busca (YIC "You May Be Also Be Interested In" + catálogo findcomponents.net) e achei mais 4
# PNs do MESMO cluster, só lote diferente: TYC0FH121597RA, TYC0FH121626RA, TYC0FH121642RA,
# TYC0FH121645RA. Batch/lote (pn[8:12]) não encode specs (já documentado no reasoning da
# família) — mesma capacidade/RAM que o TYC0FH121660RA já submetido. TYC0FH121638RA (outro
# irmão do cluster, já é o golden anchor da família em chips/tests.py) NÃO entrou aqui — o
# golden roda com --skip-known-parts (não conflita), mas fica de fora desta submissão só por
# já ser a âncora de teste; pode ser submetido depois se fizer sentido.
#
# Lead NÃO incluído: TYC0GH131619RA (cluster "0G"=8GB, capacidade DIFERENTE) — só 1 sighting
# (YIC), sem segunda fonte independente. Fica pra pesquisa futura.
#
# confidence=distributor em todos (não confirmed/manual — capacidade exata sem fonte individual;
# não estimated — decisão do dono 2026-07-09: LPDDR2 eMCP é SEMPRE NÃO RENTÁVEL independente da
# capacidade exata, "não importa a capacidade dele, ele já é lixo eletrônico" — então o padrão de
# confiança pode ser mais permissivo aqui, já que a imprecisão na capacidade não muda o destino
# comercial do chip. Capacidade/RAM seguem o padrão já documentado no tip da família (0F=4GB
# NAND, H=LPDDR2 512MB), não uma reconfirmação individual nova por PN.
#
# Uso:
#   python manage.py submit_known_parts submissions/toshiba-kioxia_tyc_2026-07-09.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/toshiba-kioxia_tyc_2026-07-09.yaml --commit --user <seu_usuario>
#
brand: "Toshiba-Kioxia"
