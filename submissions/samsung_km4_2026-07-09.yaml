# específica do PN — provavelmente por ser peça mais antiga/descontinuada), por
# isso a fonte aqui é Preduo+Puris (mesmo padrão de confiança já aceito no
# projeto pro anchor original).
#
# pn_length=10 fixo pra família KM4 — os PNs abaixo já são a forma completa
# (sem sufixo de grade tipo "-B321" grudado, igual ao padrão KMQ/KMD/KLM).
