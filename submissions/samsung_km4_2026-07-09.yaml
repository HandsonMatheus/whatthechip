#   - KM4X60002M-B321 → 32GB eMMC + 24Gb (3GB) LPDDR4X  [ALVO — mapa dava 2GB, errado]
# Mesmo padrão já visto neste projeto (chave compartilhada com valores reais
# diferentes por sufixo/família — casos X6 cross-family KMD/KM4/KMG e o '31'
# de 3 vias em KMQ): a correção certa é known_part confirmed por PN exato,
# SEM tocar no mapa (que continua servindo de default pra qualquer X6 ainda
# não confirmado nesta família).
#
# Fontes (2 independentes, concordam exatamente em "32+24" vs "32+16"):
#   - Preduo (distribuidor recorrente, mesma fonte já usada pro anchor X6 original)
#   - Puris (distribuidor independente, mesmo padrão de nomenclatura "NAND+RAM(Gb)")
# Confirmação por página própria de cada PN nos dois sites (não é lista genérica).
# KM4X6001KM-B321 também tem página própria confirmada no site oficial Samsung
