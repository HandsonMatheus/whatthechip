# Submissão de known_parts — Micron, FBGA D9FFD + família MT48LC4M32 (2026-08-28)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9FFD
# (não identificado na bancada, fila de revisão).
#
# ACHADO: D9FFD → MT48LC4M32B2B5-7:G. Prefixo MT48LC = SDRAM clássica
# (single data rate, pré-DDR), já confirmado nesta marca (família
# MT48LC16M16/D9DHW, 2026-08-05). Organização "4M32" = 4 Meg x 32 =
# 128Mbit — confirmado por 2 fontes independentes: (1) página de produto
# DigiKey do irmão de MESMA revisão ":G" MT48LC4M32B2F5-6:G (fetch direto,
# 2026-08-28): "Technology: SDRAM", "Memory Size: 128Mbit", "Memory
# Organization: 4M x 32"; (2) 11 irmãos da família com part-name direto da
# API Micron ("SDRAM 128M X32 VFBGA"/"TSOP", revisão ":L", sub-category
# sdram/obsolete-sdram). Aritmética: 4M×32bit=128Mbit=0,125Gb (fracionário,
# abaixo de 1Gb — 128÷1024=0,125). density_gb=16MB (128Mbit÷8) também
# preenchido pra deixar dram_density legível.
#
# ⚠ D9NRT (MT48LC4M32B2P-6A AIT:L) tem part-name com anomalia da própria
# API Micron: "SDRAM 0 X32 TSOP" (deveria ser "128M", não "0" — erro de
# dado da Micron, os outros 10 irmãos da mesma leva dizem "128M"
# corretamente). Reportado como veio; specs usam a organização do PN
# ("4M32") + os 10 irmãos corretos, não o "0" da API.
#
# Forward-lookup no PREFIXO DE PN "MT48LC4M32" (2026-08-28, delegado — WAF
# do micron.com bloqueado nesta sessão) devolveu 94 PNs. Filtro ES (regex
# de token "ES" delimitado no PRÓPRIO texto de cada entrada) excluiu 27.
# 3 sobrevivem com "MS" em vez de "ES" (D9CGX, DZFGM, Z9BWM) — mesmo
# padrão de anomalia já visto em Z9GMV/Z9BWN/Z9JXC/Z9NKT nesta sessão,
# reportado como veio, specs iguais ao resto (nenhuma fonte sugere que
# "MS" mude organização/densidade). Sobraram 67 (incl. o alvo) — 11 com
# part-name direto da Micron, 56 formula-extendidos (mesma organização
# "4M32" no próprio texto do PN).
#
# Sufixos de velocidade (-6/-6A/-7/-8/-10/-75M) e de temperatura/
# qualificação (IT/AT/AAT/AIT/XIT, die-rev G/L) NÃO entram em campo
# modelado — vão implícitos no PN completo (identidade), sem campo
# próprio. Pacotes B5/F5/P/TG/BC/FC (BGA/TSOP, variações de encapsulamento)
# também não decodificados em campo — não afetam organização/densidade.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente).
# Sem sobreposição com nenhuma submissão anterior (grep em
# submissions/*.yaml, zero match).
