      "NT5CB128M16IP-EKT" (mesma die "IP", sufixo com "T" a mais) com datasheet direto. NT5CB =
      DDR3 1.5V (nao DDR3L), padrao ja confirmado nas rodadas anteriores desta familia.
      Aritmetica: 128M x 16bit = 2048Mbit = 2Gb (bate). Cluster NT5CB128M16I = 40, quebrado
      IN(18)+IP(21)=39 (pequena discrepancia de indexacao, ja vista antes, nao e motivo de
      alarme dado o volume de fontes convergentes).

