      esta peca com sufixo "-EK". Confirmado por 8+ fontes convergentes: LCSC (com estoque real),
      Alibaba, Kynix, Rutronik24, Arrow, Worldway, SemiKey, Nyang-tech, todas descrevendo
      "Commercial, Industrial and Automotive DDR3(L) 2Gb SDRAM" / "DDR3 2Gb 128Mx16 933MHz
