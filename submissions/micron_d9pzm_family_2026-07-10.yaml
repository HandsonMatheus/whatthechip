# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9PZM
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (D9GZM, D9PCM, D9PTM, D9PXM, D9PZC) IGNORADO
# por construção — já são KnownPart aprovado.
#
# ACHADO: D9PZM → MT41J256M16HA-093G:E. Prefixo MT41J = DDR3 padrão
# (1,5V), mesma família já vista em D9LGQ. Capacidade: 256M × 16bit =
# 4096Mb = 4Gb — confirmado via Octopart ("4Gb", "256M x 16",
# "1.425V~1.575V"). chip_type="DDR3", interface="x16",
# density_gbit="4Gb".
#
# Forward-lookup no prefixo "MT41J256M16" (2026-07-10) achou 28 PNs: 15
# com fbga_code "D9*" (produção) + 13 "Z9*" (Engineering Sample,
# EXCLUÍDOS). Um dos 15 "D9" (D9SMQ, "MT41J256M16LY-091G ES:N") tem
# "ES" literal no PRÓPRIO part-number apesar do prefixo "D9" — mesmo
# padrão de exceção já visto nos lotes JW738/JW999 (JWC10/JW602/JW603)
# — EXCLUÍDO também. Restam 14 PNs de produção limpos (alvo + 13
# irmãos). Nenhum tem part-name direto da Micron (campo vazio em toda a
# leva) — capacidade e tipo apoiados na fórmula + confirmação Octopart
# do alvo + convenção MT41J já estabelecida.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente —
# regex ajustada pra pegar "ES:" além de "ES " isolado, depois do
# incidente D9RZH). Sem sobreposição com nenhuma submissão anterior
