# Submissão de known_parts — Micron, FBGA JW614 + família MT29C1G12M (2026-07-10)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA JW614
# (não identificado na bancada, fila de revisão — SearchLog 10/07/2026 14:42).
#
# fuzzy_sugest. do debug (JW314, JW414, JW654, JW694, JW714) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ACHADO: JW614 → MT29C1G12MAADYAKD-5 IT. Família MT29C (mesma do lote
# JW500, 2026-07-09 — chip_type="MCP", NAND+LPDRAM raw em PoP, ver
# MICRON.md §4 e a investigação daquele lote). Densidade "1G12M" = NAND
# 1Gb + LPDRAM código "12M"=0,5Gb — a MESMA progressão geométrica do
# datasheet oficial já usada no JW500 (lá era "8G96M"=8Gb+4Gb). Conta:
# NAND 1Gb÷8=128MB, LPDRAM 0,5Gb÷8=64MB. Confirmado pelo PRÓPRIO part-name
# da Micron: "MASSFLASH/MOBILE DDR 1.5G TFBGA" — 1Gb+0,5Gb=1,5Gb bate
# EXATO com "1.5G" (mesmo padrão de cross-check que funcionou pro JW500:
# lá "12G"=8Gb+4Gb).
#
# ⚠⚠ ESCALA + ACHADO NOVO: forward-lookup no prefixo "MT29C1G12M"
# (2026-07-10) devolveu 119 PNs de produção (+ dezenas de ES, não
# contados). Só 17 têm part-name preenchido pela própria Micron (a
# "confirmação forte" desta família, igual ao padrão AP-vs-BA/BB já
# documentado no lote JW500) — os outros ~100+ NÃO têm NENHUMA fonte
# Tier-1 (nem part-name, nem distribuidor achado) e por isso NÃO entram
# aqui (mesma regra do JW500: sem fonte, fora da submissão).
#
# Dos 17 com part-name, um NOVO PADRÃO apareceu que o lote JW500 não tinha
# visto: 10 dizem "MASSFLASH/MOBILE DDR" (RAM tipo mDDR1, igual ao JW500),
# mas 5 dizem "MASSFLASH/MOBILE SDR" (RAM tipo SDR — Single Data Rate,
# tecnologia MAIS ANTIGA que DDR — real, não é erro de digitação) e 2
# dizem só "NAND MCP" genérico (sem especificar DDR/SDR). Tratei cada um
# conforme o PRÓPRIO part-name diz — não copiei "mDDR1" pros SDR nem pros
# genéricos (seria inventar o tipo de RAM).
#
# ⚠ EXCLUÍDO E SINALIZADO (não decidido sozinho): JW658
# (MT29C1G12MAACAFAMD-6 IT) tem sub-category DIFERENTE de todos os outros
# 16 — "obsolete-emmc-based-mcp" (pageurl em /obsolete-emmc/...) em vez de
# "obsolete-nand-mcp-catalog" (pageurl em /obsolete-nand-mcp-catalog/...).
# O PN-irmão quase idêntico JW657 (MT29C1G12MAACAEAMD-6 IT — só a 5ª
# posição do config muda, "E"→"F") ESTÁ em obsolete-nand-mcp-catalog
# normal. Pode ser (a) capricho de catalogação da Micron sem significado
# técnico, ou (b) esse PN específico tem controller eMMC de verdade — o
# que mudaria o chip_type de MCP(dead) pra eMCP(comercial), com IMPACTO
# REAL na rentabilidade. Não decidi — fica de fora desta submissão até o
# dono decidir/pesquisar.
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_jw614_family_2026-07-10.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/micron_jw614_family_2026-07-10.yaml --commit --user <seu_usuario>
#
