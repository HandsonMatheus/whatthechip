      pra esta organizacao (bucket NT5CB128M8* = 105 resultados, quebrado so em F(52)+G(53)=105,
      sem "C" -- mesmo padrao ja visto varias vezes nesta serie: die real fora do crawl daquele
      indice). Confirmado por 2 fontes independentes com pagina dedicada (nao resumo de busca):
      (1) Kynix -- ficha estruturada completa, "In Stock: 1,056 units", atributos "Number of
      Words: 128000000" (=128M), "Supply Voltage-Nom: 1.5V" (confirma DDR3, nao DDR3L -- bate
      com o proprio tip do engine "NT5CB = DDR3 1.5V"), descricao tecnica "1Gb Double-Data-Rate-3
      (DDR3/L) B-die DRAM... transfer rates of up to 2133 Mb/sec/pin"; (2) Ariat-tech, PDF de
      datasheet dedicado ao mesmo PN exato. Aritmetica: 128M x 8bit = 1024Mbit = 1Gb (bate).
      Ressalva de sufixo (ja documentada em rodadas anteriores): "NT5CB128M8CN" (bancada, sem
      sufixo) normaliza diferente de "NT5CB128M8CNCG" -- normalize_pn nao equipara, entao este
      known_part so resolve o PN exato da bancada se o "-CG" estiver de fato gravado na peca
      fisica. Confirmar em sandbox mesmo assim.

