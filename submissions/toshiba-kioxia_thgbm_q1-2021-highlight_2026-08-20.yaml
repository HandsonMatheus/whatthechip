# lado a lado. Lido na íntegra via:
# https://datasheet.lcsc.com/datasheet/pdf/d13f57ada5388526cdd7cc63ef9f9410.pdf?productCode=C5365276
# (mirror LCSC do datasheet oficial; mesmo documento já citado antes na família THGAF desta marca)
#
# NÃO incluído: THGBMNG5D1LBAIL (mesma linha da tabela, capacidade 4GB/eMMC5.0) — já confirmado
