# Submissão de known_parts — Samsung, família K4W (gDDR3)
# Gerado a partir do PN não identificado K4W2G1646SBC12 (busca em 2026-07-09,
# 20:16). O local seed_known_parts.json já tinha 13 known_parts da família
# (die-letters C/D/E/B/Q em 1Gb/2Gb/4Gb) — este arquivo cobre 3 die-letters
# NOVOS, achados pesquisando o alvo e "todos os seus similares" (pedido do
# usuário): S (2Gb, o alvo), G (1Gb) e E (2Gb) — mais Q em 2Gb (Q já existia
# em 4Gb no seed, mas não em 2Gb). Nenhuma capacidade diverge da gramática
# (SAM já decodifica certo via DRAM_PC) — só faltavam os PNs exatos no banco.
#
# Convenção de PN: K4W tem pn_length=null (variável) — registro BASE e
# BASE+sufixo (sem hífen) pra cada die-letter, mesmo padrão já usado no seed
# existente (ex.: K4W2G1646C E K4W2G1646CHC12 separados).
