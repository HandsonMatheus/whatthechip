# Submissão de known_parts — Samsung, família KLM (eMMC), linha "E4x"
# (revisão posterior, NÃO é a mesma linha "High-Performance eMMC-Pro" da
# brochura 2013). PN alvo (debug 2026-08-27): KLM4G1YE4C.
#
# ⚠ NOTA sobre geração/interface (2ª rodada, dono pediu pra pesquisar mais):
# na 1ª entrega eu assumi interface "eMMC 5.0" por analogia com o sibling
# KLM4G1YEMD (mesma base de 8 chars "KLM4G1YE", já confirmado, brochura
# 2013). O catálogo Preduo (campo estruturado Sub-Type) classifica TODA a
# linha "E4A"/"E4C" como "eMMC 4.41" — mas isso DIVERGE do que a própria
# gramática da família decodifica pela letra pn[6] (regra já validada
# nesta sessão em dezenas de PNs KLM, com fonte Tier-1 — brochura oficial):
# Y→genérico (letra fora da tabela do tip), W→eMMC 5.0, G→eMMC 5.1.
# Como o `interface` do known_part NÃO sobrepõe o que a gramática mostra
# nesta família (quirk já registrado em [[wtc-k4b1g-klm-2026-08-24]] —
# `classify()` sempre usa o decode da letra, não o campo salvo), optei por
# registrar aqui o valor que a PRÓPRIA gramática já deriva pra cada letra
# (mais bem fundamentado que uma tag de categorização de 1 distribuidor só)
# em vez do "4.41" uniforme da Preduo — sinalizado, não é fato 100% fechado.
#
# CLUSTER COMPLETO (dono pediu pra pesquisar mais, não parar em 1):
# achei as 5 densidades da linha "E4x" via catálogo estruturado da Preduo
# (cada PN tem página própria com Type/Sub-Type/Package/Density — não é
# prosa de marketing, é campo de banco de dados do distribuidor) — as 5
# páginas se listam umas às outras como "Related products", confirmando
# que são reconhecidas como a MESMA linha de produto pelo distribuidor:
#   4GB  KLM4G1YE4C-B001  · eMMC 4.41 · BGA
#   8GB  KLM8G1WE4A-A001  · eMMC 4.41 · BGA
#   16GB KLMAG2WE4A-A001  · eMMC 4.41 · BGA
#   32GB KLMBG4WE4A-A001  · eMMC 4.41 · BGA
#   64GB KLMCG8GE4A-A001  · eMMC 4.41 · BGA (nota: letra muda de 'W' pra
#        'G' no 64GB, igual à brochura 2013 onde 32/64GB também trocavam
#        de letra vs. 8/16GB — padrão já visto nesta família)
# O alvo do debug (KLM4G1YE4C, sem sufixo) e o sufixo completo de cada
# distribuidor (Octopart usa "-B001000" com zeros extras; Preduo usa
# "-B001" — mesmo PN, formatação de padding diferente) entram como linhas
# separadas onde já tenho confirmação de ambas as formas.
brand: "Samsung"
known_parts:
  - part_number: "KLM4G1YE4C"
    chip_type: "eMMC"
    subtype: ""
    interface: ""
    capacity: "4GB"
    confidence: confirmed
