    notes: >
      PN alvo, forma BARE (sem sufixo) — igual a bancada leu. pn[6]='Y' não
      está na tabela de geração do tip da família (F/E/W/J/K) — geração
      deixada em branco por falta de mapeamento confiável, em vez de
      assumir por analogia (erro da 1ª entrega: assumi "eMMC 5.0" olhando
      só a base "KLM4G1YE" do sibling KLM4G1YEMD, que é linha DIFERENTE).
      Catálogo Preduo tag "eMMC 4.41" pra toda a linha "E4A"/"E4C", mas
      diverge da regra de letra já validada nesta família — sinalizado,
      não assumido como fechado. Capacidade 4GB confirmada (Preduo Density
