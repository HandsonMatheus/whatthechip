# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (NW922, JW312, JW412, JW712, JW812) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ACHADO: NW912 → MT29F512G08EEHAFJ4-3R:A. Família MT29F (NAND Flash
# cru), mesma base de NW813/NW814 — aqui organização "512G8" (512Gb
# totais, x8). TIPO + CAPACIDADE confirmados diretamente pelo part-name
# da própria Micron: "TLC 512G X8 VBGA", sub-category
# "obsolete-3d-nand". CAPACIDADE por fórmula: 512Gb ÷ 8bit = 64GB —
# cross-check independente via Octopart: "NAND Flash, 3D NAND Flash,
# 512Gb, 3.3V, 132-ball VBGA" + "512Gb 64G x 8 333MHz" (bate exato).
#
# Coleta máxima da família (conforme padrão desta sessão): forward-
# lookup no PREFIXO DE PN "MT29F512G08" (2026-07-15, não no prefixo do
# fbga_code — mesma situação do NW814: a família se espalha por vários
# prefixos de fbga_code: HS/NQ/NV/NW/NX/NY) devolveu 220 PNs. Filtrado
# por "tem part-name direto da Micron" (mesmo critério de NW813/NW814 —
# célula MLC/TLC NÃO é fixa pelo prefixo, exige confirmação por PN;
# confirmado ao vivo aqui: esta leva mistura 11 MLC + 14 TLC sob o MESMO
# prefixo "MT29F512G08") — sobraram 25 irmãos confirmados (incl. alvo),
# TODOS com capacidade de pacote 512Gb=64GB. O filtro "só com part-name"
# NÃO exclui por si só entradas com "ES" no PN (diferente das famílias
# DDR desta sessão): 3 dos 25 confirmados têm "ES" colado ao sufixo
# (HSA17 "-ITFES:G", NX902 "-37ITRES:E", NX910 "-3ITFES:A") mas MESMO
# ASSIM têm part-name+sub-category diretos da Micron — Tier-1 direto
# por PN individual prevalece sobre a heurística de "ES=amostra não
# confirmada" (essa heurística serve pra formula-extension SEM
# confirmação própria; aqui cada entrada tem confirmação própria da
# Micron, então entra). Cross-check no Octopart confirma que a variante
# ES desta família (ex. MT29F512G08EEHAFJ4-3RES:A) é um part-number
# distinto e cataloga-do — "ES" aqui não invalida a confirmação Tier-1
# específica daquele PN.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente).
# Sem sobreposição com nenhuma submissão anterior (grep em
# submissions/*.yaml, zero match, incl. NW813/NW814).
#
