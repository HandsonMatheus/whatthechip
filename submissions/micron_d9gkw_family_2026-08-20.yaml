# Submissão de known_parts — Micron, FBGA D9GKW + família MT47H32M16 (2026-08-20)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9GKW
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (D9GKX, D9GVW, D9VKW, D9ZKW, D8GKM) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ⚠ Reverse-lookup e forward-lookup rodados de FORA do sandbox (API oficial
# Micron bloqueando o IP daqui por reputação — F5 BIG-IP ASM, ver
# diagnóstico do dono 2026-08-20). Resultado colado no chat, verificado
# abaixo.
#
# ACHADO: D9GKW → MT47H32M16BN-37E:D. Prefixo MT47H = DDR2 (convenção já
# estabelecida nesta sessão, lotes D9KSL/Z9DNC). Bloco "32M16" = 32 Meg × 16
# (x16) — fórmula JEDEC oficial: 32.000.000 × 16 = 512.000.000 bits =
# 512Mbit = 0,5Gb. density_gbit em fração ("0.5Gb"), não "512Mb" — regra já
# documentada nesta sessão (extrator de densidade do engine só reconhece
# sufixo "Gb" literal).
#
# Cross-check Tier-1 do ALVO: DigiKey lista sibling quase idêntico (mesmo
# bloco "32M16") "MT47H32M16NF-25E:H" como "SDRAM - DDR2 Memory IC 512Mb
# (32M x 16)" — bate exato com a conta.
# https://www.digikey.com/en/products/detail/micron-technology-inc/MT47H32M16NF-25E-H/4747987
#
# Além disso, 4 SIBLINGS desta mesma família vieram com part-name PREENCHIDO
# pela própria API Micron: "DDR2 512M X16 TFBGA" — bate exato com a fórmula
# e confirma a extensão pra toda a família (mesmo bloco "32M16" em todos).
#
# Forward-lookup no prefixo "MT47H32M16" (2026-08-20) devolveu 146 PNs.
# Filtro ES (D9+Z9 combinados no texto do PN): 45 EXCLUÍDOS por "ES" literal
# no part-number (nenhum Z9 sobrevive nesta família). Restam 101 (incl. um
# fbga_code "B9DHG" — prefixo novo, mesma checagem de texto aplicada, sem
# "ES", incluído). Dos 101, 4 confirmados por part-name direto da API
# ("DDR2 512M X16 TFBGA" — D9SBJ/D9SBV/D9SCD/D9TCD), os outros 97 (incl. o
# alvo D9GKW) são extensão por fórmula, mesmo bloco "32M16" em todos.
# Variações de pacote (BT/CC/FT/GC/BN/FN/HR/HW/NF) e grade de velocidade
# não afetam capacidade.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de part_number_norm
# dentro da própria lista (checado programaticamente, ver check_d9gkw.py).
# Sem sobreposição com nenhuma submissão anterior (grep em submissions/*.yaml,
# zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9gkw_family_2026-08-20.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9gkw_family_2026-08-20.yaml --commit
#
