      voltagem no DDR2, diferente do DDR3(L) que usa 1 prefixo so pras duas tensoes;
      nao ha "DDR2L" no vocabulario de chip_types.py, entao mapeia pra chip_type=DDR2
      igual ao M14D (confirmado pelo portao Pydantic, nao decisao arbitraria).
      CONFIANCA MENOR que a maioria da familia: SO 1 fonte (tabela da Satron
