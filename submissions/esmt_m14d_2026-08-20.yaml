# Familia M14D/M14F inteira (6 PNs) = SEMPRE NAO RENTAVEL por geracao
# (chips/engine.py::assess_profitability, "DDR2 ou inferior -> NAO RENTAVEL",
# independente de capacidade) -- mesma regra ja em vigor pro NT5TU da Nanya. Ainda
# assim submeto os known_parts (nao so a gramatica) porque: (1) o PN M14D5121632A
# veio de um caso AO VIVO no debug de estoque, precisa de classificacao completa
# (nao so "tipo=DDR2, resto vazio"); (2) pedido explicito do dono nesta rodada foi
# "popular o maximo possivel", tier 1 OU tier 2.
