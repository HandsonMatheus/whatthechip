# ACHADO METODOLOGICO IMPORTANTE (2026-08-20): pra densidade sub-1Gb, `density_gbit`
# TEM que ser fracionario em "Gb" (ex. "0.5Gb"), NUNCA "512Mb". Motivo: o parser
# numerico do engine (chips/engine.py::_extract_gbit, regex `_GBIT_RE = r'(\d+(?:\.\d+)?)\s*Gb\b'`)
# so reconhece o sufixo literal "Gb" -- "512Mb" NAO bate no regex (é "Mb", nao "Gb"),
# entao density_gbit_num ficaria None mesmo com o campo "preenchido", quebrando a
# rentabilidade/preco em silencio (mesma classe de bug do caso H5AN, ver convention.py).
# Populei tambem `density_gb` (formato "NNMb" -> "NNMB", ex. "64MB") pra manter a
# leitura humana clara -- o engine mostra "0.5Gb = 64MB por die [OK]" (chips/engine.py::_known_dram_density).
# Esta e a 1a familia ESMT desta chat com densidade sub-1Gb; nenhuma família anterior
# (M15T, todas >=1Gb) precisou dessa checagem.

brand: "ESMT"
known_parts:
  - part_number: "M14D128168A"
    chip_type: "DDR2"
    subtype: "DDR2"
    density_gbit: "0.125Gb"
    density_gb: "16MB"
    interface: "x16"
    confidence: confirmed
    source_url: "https://suntsu-products-s3-bucket.s3.us-west-1.amazonaws.com/memory_datasheets/M14D128168A-1-5BG2Y.pdf"
    notes: >
      ESMT DDR2 SDRAM, 2M x16bit x4 bancos = 2.097.152 x 16 x 4 = 134.217.728 bit =
      128Mb = 16MB. 2 fontes: PDF hospedado pela Suntsu (distribuidor, mirror do
      datasheet oficial "M14D128168A-1.5BG2Y", pub. mai/2017 rev 1.2, citacao direta
      "2M x 16 Bit x 4 Banks", VDD=1.8V, SSTL_18, BGA 84-pin) + tabela da Satron
      Electronics (satronel.com/products/semiconductors/memoriy_ic/sdram/ddr2-sdram.html:
      128Mb, Organization "8Mbx16" -- 2M/banco x4bancos=8M total de palavras, bate
      exato). DDR2 = sempre NAO RENTAVEL por geracao (chips/engine.py), independente
      de capacidade -- mesma regra ja documentada em nanya.yaml::NT5TU.

  - part_number: "M14D2561616A"
    chip_type: "DDR2"
    subtype: "DDR2"
    density_gbit: "0.25Gb"
    density_gb: "32MB"
    interface: "x16"
    confidence: confirmed
    source_url: "https://www.alldatasheet.com/datasheet-pdf/pdf/302727/ESMT/M14D2561616A.html"
    notes: >
      ESMT DDR2 SDRAM, 256Mb, x16. 2 fontes: existencia confirmada via Alldatasheet
      (source_url, titulo) + tabela da Satron Electronics (satronel.com: 256Mb,
      Organization "16Mbx16" -- 16M total de palavras x16bit = 268.435.456 bit =
      256Mb = 32MB, bate exato). Numero de bancos (4) INFERIDO por padrao JEDEC DDR2
      -- confirmado diretamente nos irmaos 128Mb e 512Mb desta familia, nao neste PN
      especifico; nao afeta a densidade (independente de banco individual), so a
      documentacao. DDR2 = sempre NAO RENTAVEL por geracao, independente de capacidade.

