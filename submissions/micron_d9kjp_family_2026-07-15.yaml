# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9KJP
# (não identificado na bancada, fila de revisão).
#
# ACHADO: D9KJP → MT47H64M8JN-3:F. Prefixo MT47H = DDR2, mesma família
# base de D9RZH/D9MTG — aqui organização "64M8" (512Mb, x8). Sem
# part-name direto da Micron para o próprio alvo. Capacidade: 64M ×
# 8bit = 512Mb = 0,5Gb — confirmada via Octopart ("DDR2 Dram, 64MX8,
# 0.45NS, Cmos, PBGA60"). PRIMEIRA densidade fracionária (<1Gb) desta
# sessão — "0.5Gb" consistente com o suporte a decimais do campo
# density_gbit (mesmo padrão já usado em contexto de densidade eMCP
# nesta sessão, e com o fix histórico do _CAP_RE documentado no
# CLAUDE.md §7).
#
# Coleta máxima da família (conforme padrão desta sessão): forward-
# lookup no prefixo "MT47H64M8" (2026-07-15) achou 165 PNs: 85 com
# fbga_code "D9*" (produção) + 80 "Z9*" (Engineering Sample,
# EXCLUÍDOS). Dos 85 D9, 5 têm "ES" no próprio texto do PN apesar do
# prefixo D9 "de produção" (checado programaticamente, regex
# `(?:^| )ES(?:$|[ :])` — mesma lição dos lotes JW738/NW814/D9PZM) —
# EXCLUÍDOS: D9DCH, D9DCK, D9DCM, D9DCP, D9GCW (todos variante
# "CB-*E ES:B"). Restam 80 D9 de produção limpos. 3 têm part-name
# direto da Micron confirmando tipo+capacidade ("DDR2 512M X8 TFBGA":
# D9SBL ativo, D9SCC e D9SCG obsoletos); os outros 77 (alvo + 76
# irmãos) herdam a mesma organização por construção do próprio prefixo
# buscado (verificado programaticamente: todos os 80 part-numbers
# começam literalmente por "MT47H64M8", mesma lógica já usada em
