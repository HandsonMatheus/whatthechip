# Submissão de known_parts — Samsung, família K4B (DDR3/DDR3L discreta standalone).
# PN alvo (busca 2026-08-20): K4B4G0446D — grammar já decodifica certo hoje
# (pn[3:5]='4G' via DRAM_PC global → 4Gb=512MB, profitable=RENTÁVEL,
# grammar_complete=true) — mas o PN exato não estava confirmado no banco, e o
# campo Interface saía vazio ("—") porque largura NUNCA foi um decode
# funcional desta família (só texto no tip/reasoning, sempre preenchida via
# known_part).
#
# ⚠ ACHADO: largura "04" (pn[5:7]) NÃO é um typo. O tip da família só
# documentava 08=x8/16=x16 — mas a própria seed local (49 known_parts da
# família) também só tinha 08/16, ZERO com "04". Confirmei em três fontes
# independentes que "04"=x4 é um código real e sistemático da própria
# convenção Samsung, não um caso isolado deste PN:
#   1. alldatasheet.com — datasheet oficial dedicado "K4B4G0446D" (mirror,
#      32 páginas, "Product Guide DDR3 SDRAM Memory", Dec.2012, Direct Link
#      samsung.com/Products/Semiconductor). Página 2 é a "DDR3 SDRAM MEMORY
#      ORDERING INFORMATION" (a legenda oficial de decodificação da PRÓPRIA
#      Samsung p/ toda a família K4B) — lida diretamente (texto, não só
#      metadado): "04 : x 4 / 08 : x 8 / 16 : x16 / 33 : x32" — confirma x4
#      oficialmente, junto com x32 (nenhum dos dois documentado no tip antes
#      de hoje). Também lista "Similar Part No.": K4B4G0446A e K4B4G0446B
#      (mesmos código de capacidade+largura "0446", die-gens diferentes) —
#      prova que "0446" é padrão recorrente da família, não acidente.
#   2. datasheets.com — registros estruturados de irmãos na MESMA largura x4
#      em OUTRAS densidades da família: "K4B2G0446D-HCK0" (campo "DDR DRAM,
#      512MX4..." = 512M×4bit=2Gbit, bate com K4B2G) e "K4B1G0446D-HCH9"
#      (existe, indexado). Confirma o padrão "0446"=x4 se repete em 1G/2G/4G,
#      não é exclusividade do alvo.
#   3. win-source.net — K4B4G0446D-BYK0 (distribuidor, página dedicada,
#      título/meta batem exatamente) — sufixo BY=DDR3L 1.35V, mesma convenção
#      de tensão já documentada no tip da família.
# Capacidade/densidade não muda com a largura — já é a mesma aritmética que a
# gramática já produzia (4Gb÷8=512MB/die), só a largura (x4) e a
# identidade exata do PN são novidade.
#
# ⚠ NÃO incluído: "K4B4G0446D-BCMA" apareceu no índice do datasheets.com
# (título de resultado de busca "K4B4G0446D-BCMA SAMSUNG ELECTRONICS —
# Datasheet PDF & Tech Specs"), mas o fetch direto da página redirecionou pra
# busca genérica — não consegui ler o conteúdo real, só o título indexado.
# Sem confirmar o conteúdo eu mesmo, não registro (mesma disciplina de
# "excluir, não adivinhar" — aqui não é a capacidade que está em dúvida, é a
# grafia exata do sufixo de grade). BC=DDR3 1.5V já está confirmado como
# convenção da família (página Ordering Information, "Normal Power 1.5V"),
# só a string exata do sufixo "BCMA" ficou sem confirmação direta.
#
# Yaml da família (K4B) ganhou só documentação (tip/reasoning) — as 4
# larguras confirmadas (04/08/16/33). Largura não é decode funcional
# (não há decode_cap_map pra isso), então não muda comportamento do engine —
# só o texto informativo que a bancada lê.
brand: "Samsung"
known_parts:
  - part_number: "K4B4G0446D"
    chip_type: "DDR3"
    subtype: "DDR3"
    interface: "x4"
    capacity: "512MB"
    confidence: confirmed
    source_url: "https://www.alldatasheet.com/datasheet-pdf/pdf/1975720/SAMSUNG/K4B4G0446D.html"
    notes: >
      PN alvo (base, sem sufixo de grade). Datasheet oficial Samsung "Product
      Guide DDR3 SDRAM Memory" (Dec.2012, 32 páginas, mirror alldatasheet
      #1975720, Direct Link samsung.com/Products/Semiconductor) — página 2
      ("Ordering Information", lida diretamente) confirma "04 : x4" como
      código de largura oficial da família, junto com a densidade 4Gb via
      "4G : 4Gb". 4Gbit÷8=512MB/die — mesma aritmética que a gramática já
      calculava (DRAM_PC global). "Similar Part No." da mesma página lista
      K4B4G0446A/K4B4G0446B — confirma "0446" como padrão recorrente
      (múltiplos die-gens), não acidente isolado deste PN.

  - part_number: "K4B4G0446DBYK0"
    chip_type: "DDR3L"
    subtype: "DDR3L"
    interface: "x4"
    capacity: "512MB"
    confidence: confirmed
    source_url: "https://www.win-source.net/products/detail/samsung/k4b4g0446d-byk0.html"
    notes: >
      Forma com sufixo de grade "-BYK0" do alvo (win-source, página dedicada,
      título/meta conferidos: "K4B4G0446D-BYK0 Samsung – Price, Stock &
      Datasheet"). BY = DDR3L 1.35V, mesma convenção de tensão já documentada
      no tip da família (confirmada agora também na própria página Ordering
      Information do datasheet: "Low VDD(1.35V)"). Mesma densidade/largura do
      alvo (4Gb, x4) — só a tensão muda.
