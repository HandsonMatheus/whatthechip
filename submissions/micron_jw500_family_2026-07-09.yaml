  - part_number: "MTFC16GHKDH-WT"
    chip_type: "eMMC"
    subtype: ""
    interface: "eMMC"
    capacity: "16GB"
    fbga_code: "JW300"
    confidence: confirmed
    source_url: "https://www.om-nanotech.com/component/micron-emmc-part-catalog"
    notes: >
      Identidade via API FBGA oficial (2026-07-09). ⚠ CONFLITO DE FONTES
      resolvido — mostrando o caminho todo porque quase decidi errado:
      Octopart tem um campo estruturado "Density: 16 Gb" + Avnet descreve
      "NAND Flash 3.3V 16Gbit 2G x 8bit 169-Pin FBGA" — se essa densidade
      fosse o pacote inteiro, 16Gb÷8 = 2GB (não 16GB). MAS 2 fontes
      melhores contradizem isso: (1) catálogo estruturado da om-nanotech
      (distribuidor indiano, tabela com colunas Part/Density/Depth/Width,
      não é prosa solta) lista "MTFC16GHKDH-ET | 16GB" e "MTFC16GHKDH-WT |
      16GB" explicitamente; (2) datasheet OFICIAL Micron pra mesma família
      de densidade (MTFC4GLDDQ/8GLDDQ/16GJDDQ/32GJDDQ, "4GB,8GB,16GB,32GB:
      e-MMC", hospedado em e2e.ti.com) confirma que a faixa 4-32G desta
      linha MTFC é GB DIRETO — Table 2 "Ordering Information" lista
      "MTFC16GJDDQ-4M IT | 16GB | ... | 2 x 64Gb, MLC" (ou seja, o pacote
      de 16GB usa 2 dies de 64Gb cada = 128Gb de silício bruto — a
      densidade "16Gb" do Octopart não bate com NENHUM componente dessa
      conta, quase certamente erro/dado incompleto do Octopart/Avnet pra
      esse PN específico, não uma leitura literal do datasheet). Convenção
      MTFC{N}G=N GB direto reafirmada — Density Tier-1 confirmada por
      catálogo estruturado + datasheet oficial > 1 campo solto do Octopart.

