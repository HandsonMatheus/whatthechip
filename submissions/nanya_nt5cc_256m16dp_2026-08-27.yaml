      Debug ao vivo do estoque, 27/08/2026 16:00:53, PN "NT5CC256M16DP" -- gramatica ja
      reconhecia (familia NT5CC/DDR3L) mas known_exact=false, capacity=null,
      profitable=INDETERMINADO. Aritmetica: 256M x 16bit = 4096Mbit = 4Gb. **Este exato
      sufixo ("-DI") ja tinha sido PESQUISADO na rodada 19 desta sessao (2026-08-26) como
      um dos DOIS candidatos na investigacao do PN ambiguo "NT5CD256M16DP"** (o outro
      candidato era NT5CB256M16DP-EK, DDR3 1.5V) -- na epoca, confirmado por 8+ fontes
      incl. voltagem explicita (1.35V), mas NUNCA submetido como known_part porque o PN
      exato daquele debug era "NT5CD" (prefixo diferente, confirmado pelo dono como
      terceiro prefixo real e distinto). Agora o debug pede "NT5CC" diretamente (sem
      ambiguidade de prefixo -- a gramatica ja resolve NT5CC=DDR3L de forma inequivoca),
      entao completei a pesquisa que ficou pendente. Indice do Alldatasheet pro bucket
      "NT5CC256M16D" (38 resultados totais) reconcilia EXATO: DN(18)+DP(20)=38, sem
      sobra -- die "DP" (a do debug) tem 20 sufixos, TODOS documentados por datasheet
      OFICIAL da Nanya (pagina aberta e verificada: cada uma mostra "Manufacturer NANYA
      [Nanya Technology Corporation.]", mesmo documento de 163 paginas/4Mb, descricao
      "Commercial, Industrial and Automotive DDR3(L) 4Gb SDRAM" identica nas 20).
      Corroborado tambem por Octopart com estoque real em 5 distribuidores: Weyland, Win
      Source, ICPartonline, IC Components, Worldway. **Rodada com FONTE TIER-1
      SISTEMATICA (indice completo do fabricante) -- esgotei o cluster "DP": submeti as
      20 variantes com datasheet oficial confirmado.** Die irmã "DN" (18 sufixos, mesmo
      bucket "256M16D") NAO foi pedida neste debug -- fica de backlog, nao submetida
      agora. PN exato da bancada (sem sufixo) nao resolve mesmo apos aprovacao --
      ressalva de sempre nesta familia.
