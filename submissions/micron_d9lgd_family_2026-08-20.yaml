# Submissão de known_parts — Micron, FBGA D9LGD + família MT41J512M4 (2026-08-20)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9LGD
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (D9LBD, D9LFD, D9LGP, D9LGQ, D9LGR) IGNORADO por
# construção — já são KnownPart aprovado (D9LGQ inclusive resolvido nesta
# mesma sessão).
#
# ⚠ Reverse-lookup e forward-lookup rodados de FORA do sandbox (API oficial
# Micron bloqueando o IP daqui por reputação — F5 BIG-IP ASM, não rate limit
# de minutos; ver diagnóstico do dono, 2026-08-20). Requisição feita por
# terceiro de confiança, resultado colado no chat, verificado abaixo.
#
# ACHADO: D9LGD → MT41J512M4HX-15E:D. Família MT41J = DDR3 padrão (1,5V).
# Bloco de configuração "512M4" = 512 Meg × 4 (x4) — fórmula JEDEC oficial
# da Micron (mesma documentada no chart de ordering info do datasheet
# unificado LPDDR4X/LPDDR4, aplicada aqui à família DDR3): 512.000.000 × 4 =
# 2.048.000.000 bits = 2.048 Mbit = 2Gb.
#
# Cross-check Tier-1 do ALVO (part-name da API veio vazio para TODA a
# família, sem exceção): DigiKey lista o PN exato "MT41J512M4HX-15E:D" como
# "2Gbit capacity" — bate exato com a conta acima. Duas fontes
# independentes concordando: fórmula JEDEC (convenção oficial Micron) +
# DigiKey (listagem do PN exato).
# https://www.digikey.com/en/products/detail/micron-technology-inc/MT41J512M4HX-15E-D/2663627
#
# Forward-lookup no prefixo "MT41J512M4" (2026-08-20) devolveu 37 PNs, todos
# com o MESMO bloco "512M4" (mesma capacidade, 2Gb, pra qualquer um deles) —
# só variam pacote (THV/JE/THR/HX/DA) e grade de velocidade/revisão. Nenhum
# tinha part-name preenchido pela API (extensão por fórmula, não por
# confirmação direta de texto — mas a fórmula é a convenção OFICIAL de
# numeração da Micron, documentada no ordering guide, e o alvo já bate com
# fonte externa independente).
#
# Filtro ES (regra desta sessão, D9+Z9 combinados no PRÓPRIO texto do PN,
# não no prefixo do fbga_code): dos 19 fbga_code "Z9", 18 têm "ES"
# (Engineering Sample) literal no part-number — EXCLUÍDOS. Só Z9MCH
# (MT41J512M4THR-0 MS:D) não tem "ES" no texto — INCLUÍDO mesmo sendo Z9,
# mesma lógica já validada em Z9DNC/D9MNV.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de part_number_norm
# dentro da própria lista (checado programaticamente, ver check_d9lgd.py).
# Sem sobreposição com nenhuma submissão anterior (grep em submissions/*.yaml,
# zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9lgd_family_2026-08-20.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9lgd_family_2026-08-20.yaml --commit
#
