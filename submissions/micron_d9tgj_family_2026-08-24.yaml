# organização do PN, diferente de célula NAND que exige confirmação
# por PN individual). Cross-check independente do alvo via Alldatasheet
# ("MT40A512M8RH-075E ... 4Gbit capacity", 2026-08-24) — bate exato com
# 512M×8=4096Mbit=4Gb.
#
# Forward-lookup no PREFIXO DE PN "MT40A512M8" (2026-08-24, delegado —
# WAF do micron.com ainda bloqueado nesta sessão) devolveu 47 PNs.
# Filtro ES (regex de token "ES" delimitado, aplicado ao PRÓPRIO texto
# de cada entrada): 15 Z-prefixados excluídos (Z8CGD + 14 Z9, TODOS com
