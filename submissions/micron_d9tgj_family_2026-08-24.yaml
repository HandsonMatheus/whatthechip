# prefixo NOVO nesta sessão, confirmado via micron.com part-catalog +
# DigiKey + Alldatasheet antes de usar), organização "512M8" (depth
# 512M x width 8 = 4096Mbit = 4Gb). O part-name da própria API NÃO veio
# preenchido para o alvo, mas 15 irmãos da MESMA família (mesmo bloco
# "512M8") vieram com part-name direto da Micron confirmando "DDR4 4G
# X8 TFBGA" — validando a organização "512M8"=4Gb dentro desta família
# específica, formula-extendida pros demais (mesmo padrão desta sessão
