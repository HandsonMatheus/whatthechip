# D-prefixados, TODOS sem "ES" — 15 com part-name direto da Micron
# ("DDR4 4G X8 TFBGA"), 17 formula-extendidos (incl. o alvo).
#
# Sufixos de temperatura/revisão/embalagem (IT/AIT/AAT/AUT/AT, letra de
# die-rev A-H) NÃO entram em campo modelado — vão no notes.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente,
