# 3) O datasheet oficial atual (mesma fonte acima) define a
#    configuração "MT41J256M8" = 32 Meg x 8 x 8 bancos = 2Gb.
# Aritmética: 32M(banco) × 8bancos × 8bit = 2048Mbit = 2Gb
