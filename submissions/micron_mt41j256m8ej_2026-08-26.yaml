# (2ª linha da marcação, descritiva, não é PN nem FBGA — por isso o
# motor nem tentou decodificar). O dono leu a 1ª linha do chip:
# "MT41J256M8EJ", sem sufixo de grade de velocidade/revisão visível
# (chip antigo, marcação já desgastada) — confirmado pelo dono após
# eu questionar explicitamente se havia mais caracteres.
#
# CASO ATÍPICO — sem fbga_code, sem PN completo, sem hit em NENHUMA
