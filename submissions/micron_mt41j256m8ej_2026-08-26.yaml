# - Reverse/forward-lookup na API oficial da Micron: zero resultado
#   pro prefixo "MT41J256M8EJ" (2026-08-26).
# - DigiKey/Octopart/Mouser/Google: nenhum PN "M8EJ" (nem M4EJ/M16EJ
#   em qualquer densidade DDR3 da Micron).
# - Datasheet oficial ATUAL (Mouser/Micron, "2Gb_DDR3_SDRAM.pdf" Rev.
