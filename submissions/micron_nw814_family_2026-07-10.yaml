# Submissão de known_parts — Micron, FBGA NW814 + família MT29F64G08 (2026-07-10)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA NW814
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (JW814, NW813, JW314, JW414, JW614) IGNORADO por
# construção — já são KnownPart aprovado (NW813 inclusive, do lote
# 2026-07-09).
#
# ACHADO: NW814 → MT29F64G08CBCGBJ4-5M:G. Família MT29F (NAND Flash
# cru), mesma base do NW813 — confirma de novo que prefixo FBGA "N" NÃO
# é regra determinística de uMCP (é NAND cru aqui também). Sem
# part-name direto da Micron para o alvo — capacidade/célula via
# Octopart + Mouser (2 fontes batendo): 64Gb ÷ 8bit = 8GB, célula MLC.
#
# Forward-lookup no PREFIXO DE PN "MT29F64G08" (2026-07-10, não no
# prefixo do fbga_code — aqui a mesma família de PN se espalha por
# vários prefixos de fbga_code: FY/N9/NQ/NW/NX, ao contrário dos lotes
# anteriores onde prefixo de PN e de fbga_code coincidiam) devolveu 150
# PNs. Filtrado por "tem part-name direto da Micron" (mesmo critério do
# NW813: célula MLC/SLC não é fixa pelo prefixo, exige confirmação por
# PN) — sobraram 13 irmãos confirmados, TODOS com capacidade de pacote
# 64Gb=8GB (2 deles, NQ169/NQ181, reportam "32G X8 DDP" no part-name —
# é densidade POR DIE em pacote dual-die, 2×32Gb=64Gb total, ver nota
# de cada um). O filtro "só com part-name" também excluiu, como efeito
# colateral, todo Engineering Sample da leva — nenhum dos 13 confirmados
# tem "ES" no PN (checado programaticamente); os PNs claramente ES (ex.
# N9BYZ "...ITZ1ES:A", FY271 "...UAAC5 ES:A") não têm part-name mesmo,
# já ficaram de fora pelo filtro principal.
#
# Célula: 10 MLC (incl. alvo) + 4 SLC — célula lida do PRÓPRIO part-name
# de cada PN, nunca herdada/assumida. Sem PN duplicado, sem fbga_code
# duplicado, sem colisão de part_number_norm dentro da própria lista
# (checado programaticamente). Sem sobreposição com nenhuma submissão
# anterior (grep em submissions/*.yaml, zero match, incl. NW813).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_nw814_family_2026-07-10.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_nw814_family_2026-07-10.yaml --commit
#
