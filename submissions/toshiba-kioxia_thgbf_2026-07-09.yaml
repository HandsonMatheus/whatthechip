# Nenhum PN adicional identificado até agora além dos 3 acima. Se aparecerem mais PNs desta
# família (padrão esperado pelo mapa reaproveitado: G7=16GB, T1=256GB, T2=512GB — ainda não
# vistos em nenhuma fonte para o prefixo THGBF), aplicar o mesmo processo: abrir o Octopart
# direto, cruzar Avnet/IHS, e checar se pn[6:8] bate com THGAF_CAP antes de submeter.
