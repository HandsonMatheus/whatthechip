# Submissão de known_parts — Toshiba-Kioxia, sub-família THGBM "5G/AG" (eMMC 4.41/4.5, era 2012-13)
# Gerado pelo chat de marca Toshiba-Kioxia a partir da investigação do PN THGBM5G5A1JBAIR (busca
# na bancada, 2026-07-09). THGBM já tinha decode completo, mas só pra era BiCS/2015+ (letras
# B/D/F/G/H/J/N/T/U em pn[5] → eMMC 5.0/5.1). Este PN usa pn[5]="5" (DÍGITO) — um esquema mais
# antigo (2012-2013, NAND FG, não BiCS) que não batia com nenhuma chave mapeada.
#
# Achado: existe uma tabela oficial de produto Toshiba ("Card Interface : e-MMC", capturada da
# semicon-storage.co.jp via mirror Arrow.com, dez/2013) cobrindo 4GB→64GB desta sub-família em
# TRÊS classes comerciais — Premium ("5G..."=eMMC 4.41α / "AG..."=eMMC 4.5, mesma capacidade,
# só a versão muda), Supreme ("5G..xBy.."/"AG..xBy..", pacote maior VFBGA169/TFBGA169) e Prime
# ("7G..xTy..").
#
# ⚠ 2026-07-09 (pedido do dono): pesquisa adicional dedicada aos 2 PNs da classe Prime
# (THGBM7G8T4JBAIR 32GB, THGBM7G9T8JBAIG 64GB) pra confirmar a versão eMMC antes de submeter —
# regra do dono: "não sobe nenhum chip sem essa informação". Resultado: NÃO CONSEGUI CONFIRMAR.
# A própria tabela oficial (única fonte encontrada com esses 2 PNs citados) deixa a coluna de
# versão em BRANCO especificamente nas linhas Prime (Premium/Supreme têm "4.41α"/"4.5" ao lado;
# Prime não tem nada). Busquei datasheet individual (não achei nenhum, diferente de Premium/
# Supreme que têm datasheets completos no boardcon.com/Arrow.com), busquei catálogo Toshiba mais
# recente (FAB_201611, Q4/2016, mouser.com/catalog/specsheets/tosc-s-a0002841067-1.pdf) — a
# classe "Prime" SUMIU desse catálogo (só sobrou Premium/Supreme com JEDEC 5.0/5.1), o que sugere
# que Prime foi descontinuada/substituída pouco depois de dez/2013, possivelmente nunca chegou a
# ter datasheet individual publicado. Por isso os DOIS PNs Prime FICARAM DE FORA desta submissão
# (ver rodapé "NÃO submetidos") — a capacidade (32GB/64GB) permanece na gramática (THGBM_CAP:
# 8T4/9T8, fonte é a mesma tabela, capacidade não estava em branco), mas nenhum known_part foi
# criado pra esses 2 PNs, e pn[5]="7" continua fora do THGBM_GEN.
#
# Promovi a gramática (chips/knowledge/toshiba-kioxia.yaml): THGBM_GEN += 5=eMMC 4.41 · A=eMMC 4.5;
# THGBM_CAP += 5A1=4GB · 6A2=8GB · 7A2=16GB · 7B2=16GB · 8A4=32GB · 8B4=32GB · 8T4=32GB · 9A8=64GB
# · 9B8=64GB · 9T8=64GB. Esta submissão (Trilha B) registra 21 PNs individuais da mesma tabela
# (23 confirmados menos os 2 Prime sem versão).
#
# Hierarquia de fonte: Tier-1 = (1) datasheet COMPLETO oficial Toshiba de THGBM5G6A2JBAIR
# (boardcon.com, PDF genuíno "Preliminary THGBM5G6A2JBAIR, June 7th 2012, TOSHIBA e-MMC Module",
# rev0.2) — confirma 8GB + "JEDEC/MMCA Version 4.41" (com nota "V4.41α", compatível com 4.41 e
# parte das features de 4.5); (2) página oficial de produto Toshiba semicon-storage.co.jp "Card
# Interface : e-MMC" (mirror Arrow.com, capturada dez/2013) — tabela completa PN×capacidade×
# classe×versão×pacote pra toda a sub-família 4GB-64GB, incluindo a nota de rodapé "Ver.4.41α is
# compatible with Ver.4.41 and has some of the major features of Ver.4.5" que distingue as 2
# versões. confidence=confirmed para os 21 PNs: todos aparecem na MESMA tabela oficial, com
# capacidade E versão explícitas (nenhum campo em branco ou "T.B.D." — os "T.B.D." do datasheet
# individual são só de performance/corrente, não de capacidade/versão).
#
# Uso:
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgbm5g_2026-07-09.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgbm5g_2026-07-09.yaml --commit --user <seu_usuario>
#
