# Submissão known_parts — Kingston, eMMC standalone (linha "eMMC Embedded Flash")
# Chat de marca Kingston, 2026-08-19. Pesquisa disparada pelo PN físico EMMC04GM627, visto no
# debug de estoque do próprio WTC ("known": false, in_review_queue: true).
#
# ACHADO: fecha o gap "eMMC standalone" do KINGSTON.md §5 (nunca pesquisado até hoje). Kingston TEM
# linha própria de eMMC embarcado avulso (kingston.com/en/embedded/emmc-embedded-flash), separada
# do eMCP (que é eMMC+RAM composto, coberto por gramática). chip_type="eMMC" já existe no
# vocabulário (chips/chip_types.py, categoria managed_nand) — sem tipo novo, sem handshake.
# subtype fica VAZIO (mesma convenção do eMCP/UFS — não há geração de RAM pra carregar aqui).
# capacidade é GB LITERAL (sem conta Gb÷8 — diferente da DRAM discreta, igual ao lado NAND do PN eMCP).
#
# ⚠ CORREÇÃO 2026-08-19 (pós-entrega inicial): a primeira versão deste arquivo tinha só as 2 PN
# legadas (M627/W627) — os outros 18 PN do CLUSTER vigente (já extraídos dos 3 flyers oficiais na
# MESMA rodada de pesquisa, inclusive EMMC04G-WT32) ficaram de fora. O dono teve que colar um NOVO
# debug (EMMC04GWT32) pra eu perceber o buraco — eu já tinha os specs prontos e não submeti. Regra
# 11 do KINGSTON.md ("pesquise o cluster inteiro") existia mas não era operacional o suficiente;
# reforçada em §7/regra 11 pra deixar explícito: TODO PN visto em QUALQUER fonte buscada na rodada
# entra no arquivo, não só o que casa com o padrão do alvo original. Este arquivo agora cobre as
# 3 famílias vigentes (comercial/industrial/automotive) inteiras + o par legado "627".
#
# TIER: o par legado (M627/W627) NÃO está nos flyers oficiais vigentes — ver bloco de notas próprio
# mais abaixo (corroboração tier-inferior, terceiro caso do padrão "família legada fora dos flyers
# vigentes", depois de MCAB e EC4B — ver KINGSTON.md §7). Os outros 18 PN SÃO Tier-1 direto:
# extraídos das 3 tabelas oficiais em media.kingston.com (comercial, industrial i-Temp, automotive) —
# confidence:confirmed mais forte aqui, sem precisar de corroboração externa.
#
# EXCLUÍDO: "E04GS14DXI" (linha da tabela i-Temp, formato de PN destoante — sem o prefixo "EMMC"
# que todo outro PN do catálogo usa). WebSearch não achou nenhuma fonte independente fora dos
# espelhos do próprio flyer — provável artefato de extração de PDF, não um PN real. Não adivinhei.
#
# Busquei irmãs de outra capacidade (08G/16G/32G) pro par legado "627" e NÃO achei nenhuma — o
# cluster legado parece ser só M627+W627. Já os 18 PN vigentes (1ª expansão) SÃO o cluster completo
# dos 3 flyers (toda linha/capacidade/pacote publicado, nada deixado de fora por amostragem).
#
# ⚠ ADENDO 2026-08-19 (2ª expansão, mesmo dia): PN físico EMMC16GTB28 (novo debug do dono) revelou
# que a linha eMMC standalone da Kingston tem MUITO mais gerações de sufixo coexistindo do que os
# 3 flyers "vigentes" sozinhos mostram — achei pelo menos 4 famílias de sufixo paralelas
# (TB28/TB29/TA29/TX29, todas de capacidades na faixa 16-128GB, pacotes e datasheets diferentes
# entre si) além da já conhecida "627". Diferente do padrão anterior (1 geração legada isolada por
# capacidade, visto em MCAB/EC4B/627), aqui parece ser NORMAL ter várias gerações coexistindo por
# capacidade — Kingston revisou o pacote/processo várias vezes ao longo dos anos. Submeti as que
# consegui confirmar com specs completos de fonte direta (5 PN novos, ver abaixo). EXCLUÍDO por
# specs não confirmados (existência confirmada em 3+ distribuidores cada, mas nenhuma fonte aberta
# rendeu tabela de specs completa apesar de 2 tentativas cada): `EMMC04G-M657` (irmã de MK27/M627 na
# faixa 4G), `EMMC64G-W525` (achado incidental, nem sequer specs de capacidade confirmados).
# `EMMC64G-TA29`/`EMMC32G-TA29`/`EMMC128-TA29` e `EMMC64G-TX29`/`EMMC128-TX29`/`EMMC32G-TX29` foram
# RESOLVIDAS na rodada de 2026-08-20 (ver adendo abaixo) — não ficam mais na lista de excluídos.
# Não adivinhei nenhum PN excluído — ver KINGSTON.md §5/§7 pro gap documentado. Nota: `EMMC04G-M627`
# também aparece num SEGUNDO flyer oficial Kingston
# (media.kingston.com/pdfs/emmc/eMMC_Product_flyer.pdf, achado nesta rodada) — reforça a
# confirmação já existente via tier-inferior, não muda o confidence.
#
# ⚠ ADENDO 2026-08-20 (3ª expansão) — `EMMC64G-TA29` voltou no debug de estoque do dono (PN físico
# real, known:false), disparando nova tentativa nas duas gerações que tinham sido excluídas ontem
# por "specs não confirmados". Dessa vez achei bem mais fonte que nas 2 tentativas de ontem:
# datasheet oficial Kingston (Future Electronics, documento único cobrindo EMMC16G-TB29-90F01 +
# EMMC32G-TB29-90F01 + EMMC32G-TA29-90F01 + EMMC64G-TA29-90F01 + EMMC128-TA29-90F01 juntas) +
# distribuidores de peso (Arrow, Avnet, DigiKey, Mouser, TrustedParts, Octopart) pras duas gerações
# TA29 e TX29. Lição igual à do caso KE4 mais cedo hoje: "não achei em 2 tentativas" não é "não
# existe fonte" — insistir com mais distribuidores resolveu o que ontem tinha ficado como gap. TA29
# e TX29 (32/64/128GB cada) entraram como known_parts confirmados abaixo — 6 PN novos.
#
# ⚠ TERRENO NOVO: primeiro known_part de eMMC standalone deste chat — o mapeamento pro campo
# `capacity` (em vez de emcp_nand/emcp_ram, que são só pro eMCP composto) é inferência minha por
# analogia ao padrão já visto (Foresee também usa "eMMC/UFS literal-GB" por nota de memória do
# projeto), não um precedente que eu tenha copiado de known_part Kingston anterior. Confira o
# dry-run antes do --commit.
#
# brand: é TEXTO PURO (Brand.objects.filter(name=<valor>) direto) — nunca o bloco name/code/notes
# do schema da GRAMÁTICA. Confirmado via AUTORIA.md §4 + commit dcad9ae, 2026-08-19 (mordeu 2x antes).
#
# validar: python manage.py submit_known_parts submissions/kingston_emmc_standalone_2026-08-19.yaml

