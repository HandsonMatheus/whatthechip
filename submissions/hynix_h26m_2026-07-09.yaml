# Submissão de known_parts — SK Hynix, família H26M (eMMC standalone, JÁ EXISTENTE)
# Gerado pelo chat de marca SK Hynix a partir da investigação do PN H26M41208HPRN
# (busca na bancada, 2026-07-09). Família H26M e mapa HYX_EMMC_CAP JÁ EXISTIAM e já
# decodificavam o PN buscado certo (known=true, grammar_complete=true, RENTÁVEL).
# SEM fix de gramática nesta rodada — só Trilha B (known_parts) + reasoning novo no yaml.
#
# FONTE: datasheet OFICIAL SK Hynix "e-NAND Product Family eMMC5.1 Compatible -
# Automotive" (Rev 1.8, Sep/2020, hospedado na DigiKey — é o datasheet do
# FABRICANTE, não catálogo de terceiro):
#   https://media.digikey.com/pdf/Data%20Sheets/Netlist%20Inc%20PDF/H26M%20Series.pdf
# A seção "1.2 Product Line-up" (p.4) lista o Product Family INTEIRO: 4 capacidades
# (8/16/32/64GB) × 4 grades de temperatura (AAT/AIT/IT/CT), com PN completo de cada
# combinação — é uma tabela oficial do fabricante, não inferência. Por isso
# confidence=confirmed (mesmo padrão do exemplo no docstring do submit_known_parts:
# "datasheet SK Hynix rev.1.2" → confirmed).
#
# A tabela também corrobora, com prova direta do fabricante, a ressalva já existente
# no tip da família: "H26M64...=32GB (NÃO 64GB)" — H26M64208EMRN é código pn[4]='6'
# e a tabela confirma 32GB (Density column), não 64GB.
#
# Todos eMMC standalone: sem RAM (emcp_nand/emcp_ram vazios), capacity em GB.
# Suffix final (Q/A/I/N) = grade de temperatura (AAT/AIT/IT/CT) — não tem campo
# próprio no modelo, fica só documentado aqui e no reasoning da família.
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h26m_2026-07-09.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h26m_2026-07-09.yaml --commit --user <seu_usuario>
#
brand: "SK Hynix"
known_parts:
