    capacity: "8GB"
    confidence: confirmed
    source_url: "https://media.digikey.com/pdf/Data%20Sheets/Netlist%20Inc%20PDF/H26M%20Series.pdf"
    notes: >
      PN original buscado na bancada. Datasheet oficial SK Hynix, Product Line-up
      (p.4), grade CT: "8GB H26M41208HPRN 64Gb x 1 11.5x13x0.8 153FBGA". pn[4]='4'
      → 8GB, bate com o mapa HYX_EMMC_CAP já existente.

