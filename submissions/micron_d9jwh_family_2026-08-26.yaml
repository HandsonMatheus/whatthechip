# Submissão de known_parts — Micron, FBGA D9JWH + família MT47H256M4 (2026-08-26)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9JWH
# (não identificado na bancada, fila de revisão).
#
# ACHADO: D9JWH → MT47H256M4HQ-3:G. Prefixo MT47H = DDR2 (já confirmado
# nesta sessão, investigação D9GKW). Organização "256M4" = 256 Meg x 4 =
# 1024Mbit = 1Gb — confirmado por datasheet oficial Micron/DigiKey ("1Gb:
# x4, x8, x16 DDR2 SDRAM", MT47H256M4,128M8,64M16.pdf): "MT47H256M4 – 32
# Meg x 4 x 8 banks"; pacote HQ = Rev G (60-ball 8x11.5mm, Pb-free, x4/x8).
#
# Forward-lookup no PREFIXO DE PN "MT47H256M4" (2026-08-26, delegado — WAF
# do micron.com ainda bloqueado nesta sessão) devolveu 79 PNs. Processado
# programaticamente (lote grande, mesmo padrão de D9GKW/D9LGK/D9TGJ/D9GCK
# desta sessão — evita erro de transcrição manual): filtro ES (regex de
# token "ES" delimitado no PRÓPRIO texto de cada entrada) excluiu 28,
# todos Z9-prefixados, todos com "ES" confirmado individualmente. Sobraram
# 51 (incl. o alvo) — 2 com part-name direto da Micron ("DDR2 1G X4
# FBGA"), 48 formula-extendidos.
#
# ANOMALIA: Z9GMV = "MT47H256M4B7-0 MS:D" sobrevive ao filtro ES (tem
# "MS", não "ES") — mesmo padrão já visto em Z9BWN (D9GCK, 2026-08-26).
# Reportado exatamente como veio da API.
#
# Sufixos de temperatura/revisão/embalagem (IT/AIT/L/X/XIT, die-rev
# A/B/D/E/G/H/M) NÃO entram em campo modelado — vão implícitos no PN
# completo (identidade), sem campo próprio.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente,
# ver check_d9jwh.py). Sem sobreposição com nenhuma submissão anterior
# (grep em submissions/*.yaml, zero match — incl. D9GKW, mesma marca
# MT47H mas organização "32M16" diferente, sem overlap de PN).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9jwh_family_2026-08-26.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9jwh_family_2026-08-26.yaml --commit --fill-empty
#
