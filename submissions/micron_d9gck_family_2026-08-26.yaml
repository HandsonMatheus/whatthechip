# Submissão de known_parts — Micron, FBGA D9GCK + família MT46V32M16 (2026-08-26)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9GCK
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (D9GCG, D9GCH, D9GCQ, D9GCT, D9GCV) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ACHADO: D9GCK → MT46V32M16BN-6:F. Prefixo MT46V = DDR1 (já confirmado
# nesta sessão contra chips/chip_types.py, investigação D9GBM,
# 2026-08-20). Organização "32M16" = depth 32M x width 16 = 512Mbit =
# 0,5Gb. MESMA DENSIDADE TOTAL da família D9GBM (128M4 = 512Mbit) — só
# organização de barramento diferente (x16 vs x4); confirmado por um
# ÚNICO datasheet Micron que cobre as duas famílias juntas (DigiKey:
# "512Mb DDR SDRAM (x4, x8, x16) Component Data Sheet",
# MT46V128M4,_64M8,_32M16.pdf).
#
# Forward-lookup no PREFIXO DE PN "MT46V32M16" (2026-08-26, delegado —
# WAF do micron.com ainda bloqueado nesta sessão) devolveu 77 PNs.
# Processado programaticamente (lote grande, mesmo padrão de
# D9GKW/D9LGK/D9TGJ desta sessão — evita erro de transcrição manual):
# filtro ES (regex de token "ES" delimitado no PRÓPRIO texto de cada
# entrada) excluiu 23 (22 Z9-prefixados + 1 G9-prefixado "G9ZKR", todos
# com "ES" confirmado individualmente). Sobraram 54 — 10 com part-name
# direto da Micron ("DDR 512M X16 FBGA" ou "TSOP"), 44 formula-
# extendidos (incl. o alvo).
#
# ANOMALIA: Z9BWN = "MT46V32M16FN-0 MS" sobrevive ao filtro ES (tem
# "MS", não "ES") — sufixo "-0 MS" foge do padrão normal de grade de
# velocidade + die-rev desta família. Reportado exatamente como veio da
# API, sinalizado no notes da própria entrada.
#
# Sufixos de temperatura/revisão/embalagem (IT/AIT/AAT/X/XIT/L, die-rev
# C/F/J) NÃO entram em campo modelado — vão no notes.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente,
# ver check_d9gck.py). Sem sobreposição com nenhuma submissão anterior
# (grep em submissions/*.yaml, zero match — incl. D9GBM, mesma marca
# MT46V mas organização "128M4" diferente, sem overlap de PN).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9gck_family_2026-08-26.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9gck_family_2026-08-26.yaml --commit --fill-empty
#
