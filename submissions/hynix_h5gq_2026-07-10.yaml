# Submissão de known_parts — SK Hynix, família H5GQ (GDDR5 standalone, FAMÍLIA NOVA no
# hynix.yaml). Gerado a partir da investigação do PN H5GQ4H24AJR (busca na bancada, 2026-07-10).
#
# FIX DE GRAMÁTICA (Trilha A, família nova): H5GQ adicionado ao hynix.yaml com decode
# posicional de capacidade — pn[4] é o próprio dígito de densidade em Gb (1/2/4/8), sem tabela
# de código arbitrário. Mapa novo `HYX_GDDR5_H5GQ_CAP` (['1',128MB]/['2',256MB]/['4',512MB]/
# ['8',1GB]). Confirmado em 4 pontos de densidade, cada um com fonte de distribuidor/datasheet
# explícita (aritmética MxN conferida em todos: 32Mx32=1Gbit, 64Mx32=2Gbit, 128Mx32=4Gbit,
# 256Mx32=8Gbit — dobra a cada degrau). Âncora golden adicionada em chips/tests.py
# (H5GQ4H24AJR, GDDR5/512MB/RENTÁVEL — família nunca tinha golden, exigido pela regra).
#
# ⚠ IMPORTANTE (documentado no tip da família): a capacidade decodificada é SEMPRE por CHIP
# individual (die), não da placa de vídeo inteira — placas GDDR5 usam vários chips juntos (ex.:
# 8x H5GQ4H24AJR = 4GB de VRAM numa GPU). O sufixo depois do miolo (ex. "-R4C"/"-T2C") é grade
# de velocidade/revisão, não afeta capacidade — grammar decodifica igual com ou sem sufixo.
#
# FONTES: 2 datasheets OFICIAIS Hynix indexados no AllDataSheet (categoria com densidade
# explícita, fabricante="HYNIX", link direto pro site oficial skhynix.com) + 2 distribuidores
# (WinSource, via DigiPart, fetch direto, unidade "Gb" minúsculo sem ambiguidade Gb/GB).
# confidence=manual em todos (não abri o PDF do datasheet em si, só a categoria/metadado do
# AllDataSheet — mais forte que listagem de distribuidor comum, mas não é "confirmed").
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h5gq_2026-07-10.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h5gq_2026-07-10.yaml --commit --user <seu_usuario>
#
brand: "SK Hynix"
known_parts:
  - part_number: "H5GQ4H24AJR"
    chip_type: "GDDR5"
    subtype: "GDDR5"
    interface: ""
    capacity: "512MB"
    confidence: manual
    source_url: "https://www.win-source.net/products/detail/hynix-semiconductor/h5gq4h24ajr-r4c.html"
    notes: >
      PN buscado na bancada (sem sufixo de grade de velocidade). A forma completa/vendida
      H5GQ4H24AJR-R4C é atestada por ~10 distribuidores via DigiPart; WinSource (fetch direto)
      descreve "GDDR5 4.0GHz 128Mx32 (4Gb)" — unidade Gb minúsculo, sem ambiguidade. 128Mx32 =
      128×1024×1024×32 bits = 4Gbit ÷8 = 512MB. Bate com pn[4]='4'→512MB, já mapeado. O sufixo
      "-R4C" (grade de velocidade 4.0GHz) não afeta a capacidade — grammar decodifica o PN sem
      sufixo igual ao PN completo (mesma posição pn[4], fora do range do sufixo).

  - part_number: "H5GQ1H24BFR-T2C"
    chip_type: "GDDR5"
    subtype: "GDDR5"
    interface: ""
    capacity: "128MB"
    confidence: manual
    source_url: "https://www.alldatasheet.com/datasheet-pdf/pdf/333509/HYNIX/H5GQ1H24AFR.html"
    notes: >
      Chave '1'→128MB. AllDataSheet indexa o datasheet OFICIAL Hynix da família (H5GQ1H24AFR,
      mesmo miolo "1H24", fabricante="HYNIX", 173 páginas), categoria "1Gb (32Mx32) GDDR5
      SGRAM". 32Mx32 = 1Gbit ÷8 = 128MB. Bate com pn[4]='1'→128MB, primeiro degrau da família.

  - part_number: "H5GQ2H24AFR-R2C"
    chip_type: "GDDR5"
    subtype: "GDDR5"
    interface: ""
    capacity: "256MB"
    confidence: manual
    source_url: "https://www.alldatasheet.com/datasheet-pdf/pdf/1242863/HYNIX/H5GQ2H24AFR.html"
    notes: >
      Chave '2'→256MB. AllDataSheet indexa o datasheet OFICIAL Hynix (H5GQ2H24AFR, fabricante=
      "HYNIX", 172 páginas), categoria explícita "2Gb (64Mx32) GDDR5 SGRAM". 64Mx32 = 2Gbit ÷8 =
      256MB. Bate com pn[4]='2'→256MB, confirma o degrau intermediário da família.

  - part_number: "H5GQ8H24MJR-R4C"
    chip_type: "GDDR5"
    subtype: "GDDR5"
    interface: ""
    capacity: "1GB"
    confidence: manual
    source_url: "https://www.win-source.net/products/detail/hynix-semiconductor/h5gq8h24mjr-r4c.html"
    notes: >
      Chave '8'→1GB, maior densidade confirmada da família (usada em placas de vídeo AMD RX
      580 8GB, 8 chips por placa). WinSource (via DigiPart, fetch direto): "GDDR5 4.0GHz
      256Mx32 (8Gb)". 256Mx32 = 8Gbit ÷8 = 1GB. Bate com pn[4]='8'→1GB, fecha os 4 degraus de
      densidade da família (1/2/4/8Gb → 128MB/256MB/512MB/1GB).
