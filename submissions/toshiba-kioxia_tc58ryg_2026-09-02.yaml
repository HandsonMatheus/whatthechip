# bloco central), bate com o pacote "63/67 Ball BGA" que o catálogo oficial 2016 usa pra
# família NAND crua (NVG) em 1-8Gbit, muito menor que os 132-169 esferas da linha gerenciada
# de alta capacidade (THGBM) — contradiz fisicamente qualquer leitura de alta capacidade.
# Decisão do dono (2026-09-02, após ver a foto e o raciocínio completo): registrar como
