# truncado do PN completo H9HKNNNCPMMUJR-NMH, atestado em ~10 distribuidores via agregador
# DigiPart. Mapa HYX_LPDDR4_H9HC_CAP (compartilhado com H9HC/H9HCN) JÁ EXISTIA e já decodificava
# certo (C=4GB, RENTÁVEL) — SEM fix de gramática nesta rodada.
#
# ⚠ CORREÇÃO DE PROCESSO aplicada PROATIVAMENTE (pedido do dono, rodada anterior H26M,
# 2026-07-10): mesmo com o código 'C' já sendo o mais confirmado da família inteira (5
# known_parts antes desta rodada), a rodada foi framed desde o início em torno de "fechar
# lacunas" da família — códigos 'D' e '8' JAMAIS tinham known_part apesar de mapeados desde
# sempre no HYX_LPDDR4_H9HC_CAP. Resultado: 5 known_parts novos (não 1), fechando as duas
# lacunas + reforçando C/F com PNs genuinamente novos (variante de package 556ball_4x, ainda
# não coberta — só 366/320ball estavam representados antes).
#
# FONTES: Preduo e Puris (catálogos de broker estruturados, fetch direto) + WinSource via
# agregador DigiPart. Aritmética Gbit→GB mostrada em cada nota (todas em Gbit bruto ÷8=GB).
# Cruzado contra hynix_h9hk_2026-07-09.yaml antes de finalizar — nenhum PN abaixo é duplicata
# (mesmo quando o sufixo é parecido: ex. CRMAVAR-NEH é diferente de CRMAUDR-NEH/CRMMVBR-NEH já
# submetidos; FBMAVAR-NEH é diferente de FBMAUDR-NEH/FBMBUDR-NEH já submetidos).
#
# LACUNA NÃO FECHADA — código '4' (512MB): busca extensa (WebSearch ampla ×3, DigiPart,
# Octopart agregado, Puris/Preduo site-search dedicado) não encontrou nenhum PN real usando
# esse código nesta família. Diferente do caso H26M (onde a lacuna foi fechada via página
# "Part Number List"), aqui não há evidência de que a SK Hynix tenha produzido essa densidade
# (512MB) no formato H9HK x64 366/556ball — pode ser um SKU que nunca existiu comercialmente
# nesta família específica (families vizinhas tipicamente pulam a densidade mais baixa quando
# não há demanda). Não incluído — não inventar.
#
# ACHADO PARALELO (fora do escopo desta submissão, não resolvido) — possível código NOVO 'I':
# H9HKNNNIAMMVAR-NEH aparece no mapa de navegação do Puris (nunca visto antes na família).
# Puris (fetch direto, archives/6036): "80Gbit" (÷8=10GB). Alibaba (título de listagem,
# NÃO aberto/confirmado como página de produto real): "LPDDR4X 16GB". As duas fontes DIVERGEM
# (10GB vs 16GB) para um código que não existe ainda no HYX_LPDDR4_H9HC_CAP — não é possível
# decidir sozinho qual está certa (ou se ambas erram). NÃO adicionado à gramática. Fica como
# achado para o dono decidir se vale investir mais pesquisa numa rodada futura.
#
# ACHADO PARALELO 2 — TechInsights confirma existência de H9HKNNNEBMBUDRNEH: a rodada anterior
# (2026-07-09) excluiu esse PN por suspeita de erro de transcrição do Puris (Puris citava
# "64Gbit", mas o sufixo "BMBUDR-NEH" é idêntico ao irmão F=8GB já confirmado, então parecia
# cópia indevida). Nesta rodada, encontrei 3 produtos pagos da TechInsights (analyses técnicas
# reais, não listagem de marketplace) titulados exatamente "SK Hynix H9HKNNNEBMBUDRNEH" —
# forte evidência de que o PN em si é genuíno (TechInsights faz decap físico, não replica typo
# de distribuidor). Isso NÃO resolve a capacidade (a página paga não expõe a spec; o único
# dado numérico que já tínhamos pra esse PN específico continua sendo o "64Gbit" isolado do
# Puris, não corroborado por mais ninguém). Mantido EXCLUÍDO desta submissão — identidade agora
# parece real, mas capacidade ainda sem 2ª fonte independente. Não decidido sozinho.
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h9hk_2026-07-10.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h9hk_2026-07-10.yaml --commit --user <seu_usuario>
#
