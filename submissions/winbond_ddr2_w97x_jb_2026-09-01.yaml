# Submissão known_parts — Winbond, cluster DDR2 SDRAM "Specialty DRAM", PACOTE "JB" (2026-09-01).
# Origem: debug do estoque com PN de bancada "W971GG6JB" (known=false, in_review_queue=true, sem
# sufixo de velocidade — ver JSON colado pelo dono, 20:36:18).
#
# MESMA FAMÍLIA já mapeada em winbond_ddr2_w97x_2026-09-01.yaml (ver [[wtc-winbond-ddr2-w97x-specialty-dram]]):
# DDR2 SDRAM "Specialty DRAM", W9712G=128Mb / W9725G=256Mb / W9751G=512Mb / W971GG=1Gb / W972GG=2Gb,
# dígito "6"=x16 / "8"=x8. NÃO é família nova — é um PACOTE ("JB") que a fonte sistemática usada na
# rodada anterior (tabela NAC Semi) simplesmente NÃO CARREGA/LISTA, então ficou de fora inteiro da
# 1ª entrega (só W9751G6JB-25, achado por outra via, tinha entrado). Este arquivo fecha essa lacuna.
#
# ATENÇÃO — PN de bancada NÃO confirmado literal (golden #10/#12, nunca decidir PN ambíguo sozinho,
# mesmo padrão já visto no PN de bancada da rodada anterior "W9751G6JBB25"→W9751G6JB-25): "W971GG6JB"
# (sem sufixo de velocidade) não bate string exata de nenhum chip real — TODO PN físico desta família
# carrega sufixo de velocidade (-25/-18/-3) e às vezes temperatura (25I). O candidato mais bem
# documentado (7+ fontes independentes: Alldatasheet, Octopart, Arrow, IC-Components, Lisleapex,
# Datasheets.com, TechInsights, DigiPart) e o ÚNICO sufixo de velocidade usado em TODOS os 12
# known_parts já submetidos desta família é "-25" — então `W971GG6JB-25` é o candidato mais provável
# pra identidade real do PN de bancada (sufixo de velocidade não lido/colado). NÃO decidido sozinho:
# sinalizado aqui e na nota do PN, pedindo confirmação física do dono antes de aprovar.
#
# MAXIMIZAÇÃO NESTA RODADA (regra permanente — esgotar a fonte sistemática): ao pesquisar "JB" pra
# fechar a lacuna de W971GG (1Gb, o PN de bancada), descobri que o pacote "JB" é uma linha PARALELA
# completa às linhas KB/NB/SB/SS/KS já submetidas — existe (com fonte direta confirmada) nas outras
# 4 densidades também (128Mb/256Mb/512Mb/2Gb), em x16 E x8 (x8 só confirmado em 1Gb). Mapeei tudo que
# consegui confirmar por citação direta nesta mesma rodada em vez de deixar pra próximas: 15 known_parts
# novos (W9751G6JB-25 da rodada anterior NÃO é reincluído aqui, já está no arquivo original).
#
# Sufixos de velocidade confirmados por citação direta: "-25" (praticamente universal), "-18" (5
# densidades* citadas), "-3" (timing mais rápido, ~0.45ns/667MHz por Octopart — NÃO é duplicata de
# "-25", specs distintas), "-25I" (variante industrial do "-25", sufixo "I" colado sem hífen — mesma
# convenção dos pacotes KB/NB/SB já na família). "TR" (tape-reel) tratado como embalagem de remessa,
# não marcação do chip — sempre removido do PN registrado (mesma convenção já usada nos arquivos
# anteriores desta marca).
#
# EXCLUÍDO desta rodada (buscado, não confirmado o suficiente — excluir, não adivinhar):
#   - Sufixo "25A" (ex.: "W971GG6JB25A", "W9712G6JB-25A") — aparece em 2 fontes esparsas (ic37, um 2º
#     PDF ID distinto no Alldatasheet) sem diferenciação de spec clara frente ao "-25" simples; pode
#     ser artefato de revisão de datasheet ("Rev. A") em vez de sufixo real de marcação — não submetido.
#   - "-18"/"-3"/"-25I" em W9712G (128Mb): busquei explicitamente, só "-25" tem citação.
#   - "-25I" em W972GG (2Gb): busquei explicitamente, não achei citação.
#   - Organização x8 do pacote JB ("...8JB") em W9712G/W9725G/W972GG: busquei, só confirmei em W971GG
#     (1Gb) — "-25" e "-18". "-3"/"-25I" do x8 em W971GG também buscados e não encontrados.
#   - "-18"/"-3"/"-25I" adicionais em W9751G (512Mb) que a rodada anterior já tinha aberto com só
#     "-25": aqui SIM confirmei e incluí "-18"/"-3"/"-25I" novos pra essa densidade (não é exclusão,
#     é o mapeamento completo do pacote JB nela).
#
# Fonte: mistura de distribuidor direto (DigiKey/Arrow — várias com página própria de produto, Tier-2
# forte) + agregadores (Alldatasheet/Octopart/IC-Components/Veswin/Jotrin/Datasheet4u) batendo
# densidade/organização entre si. winbond.com (Tier-1 direto) confirma a EXISTÊNCIA do PN-base (páginas
# oficiais .../specialty-dram/ddr2-sdram/?partNo=W971GG6JB etc., achadas via busca) mas bloqueia fetch
# por robots.txt — mesma limitação já documentada nesta marca.
#
# Convenção Winbond (WINBOND.md golden #6): nomenclatura da marca é em BIT; capacity/density_gb aqui
# são SEMPRE byte (Gb÷8). Aritmética mostrada em cada `notes`. density_gbit sempre fração de Gb pra
# sub-1Gb (regra permanente pós-incidente, ver [[wtc-density-gbit-subgb-precisa-fracionario]]) —
# verificação mecânica rodada antes de entregar.
#
# Rodar (o DONO):
#   python manage.py submit_known_parts submissions/winbond_ddr2_w97x_jb_2026-09-01.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/winbond_ddr2_w97x_jb_2026-09-01.yaml --commit     # grava (submitted) → aprovar no admin
