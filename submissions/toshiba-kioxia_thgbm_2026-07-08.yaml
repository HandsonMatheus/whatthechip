# Submissão de known_parts — Toshiba-Kioxia, família THGBM (eMMC, decode completo)
# Gerado pelo chat de marca Toshiba-Kioxia a partir da investigação do PN THGBMBG5D1KBAIL
# (busca na bancada, 2026-07-08, Octopart: https://octopart.com/part/toshiba/THGBMBG5D1KBAIL).
# A família THGBM já decodifica B=eMMC5.0 e 5D1=4GB pela gramática (não é família nova) — o
# trabalho aqui foi (1) confirmar individualmente o PN original e (2) levantar TODOS os PNs
# irmãos rastreáveis da mesma família, em vez de só o chip pedido, seguindo a convenção do
# projeto ("nunca 1 chip só"). Achei uma tabela oficial de produto Toshiba/TAEC (via Mouser,
# copyright jun/2016) que lista 10 SKUs com densidade explícita, mais uma lista de outros SKUs
# reais na mesma página do fabricante, e baixei 2 datasheets completos individuais (Kioxia 2018
# e Toshiba 2013) que confirmam PNs fora da tabela. Isso revelou 2 chaves de geração (D, G) e
# 2 chaves de capacidade (0C8, 0T8) que NÃO estavam no THGBM_GEN/THGBM_CAP — adicionadas ao
# chips/knowledge/toshiba-kioxia.yaml nesta mesma entrega (Trilha A), com a fonte de cada uma
# registrada no `reasoning` da família. D e 0C8 vêm de fonte Tier-1-equivalente (datasheet
# oficial); G e 0T8 vêm de Tier-2/3 (Octopart+Avnet+Puris, sem datasheet individual) — sinalizado
# nas notes abaixo para o revisor dar atenção extra a esses dois.
#
# Hierarquia de fonte usada (TOSHIBA-KIOXIA.md §5): Tier-1 = datasheet oficial (kioxia.com /
# toshiba.semicon-storage.com, ou mirror que reproduz o datasheet completo/original, ex.: LCSC,
# faiusr). Tier-2 = Octopart/Mouser/DigiKey/TrustedParts com fonte-fabricante (specs técnicas
# reais, não só "em estoque"). Tier-3 = utmel/censtry/AIChipLink/Puris/WinSource/findcomponents
# (só corroboração, nunca fonte única de capacidade).
#
# Uso:
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgbm_2026-07-08.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgbm_2026-07-08.yaml --commit --user <seu_usuario>
#
brand: "Toshiba-Kioxia"
