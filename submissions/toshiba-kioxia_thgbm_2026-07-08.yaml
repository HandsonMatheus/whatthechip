  #    dedicado a ESTE PN específico, mas 7+ fontes independentes concordam sem exceção, e os
  #    dois componentes do decode — geração B e chave 5D1 — foram confirmados em Tier-1 separado
  #    via os PNs irmãos abaixo). Por isso confidence=manual, não confirmed. ──
  - part_number: "THGBMBG5D1KBAIL"
    chip_type: "eMMC"
    interface: "eMMC 5.0"
    capacity: "4GB"
    confidence: manual
    source_url: "https://octopart.com/part/toshiba/THGBMBG5D1KBAIL"
    notes: >
      4GB eMMC, JEDEC/MMCA 5.0, 153-ball WFBGA, obsoleto. Concordância unânime entre 7+ fontes
      independentes: Octopart (specs técnicas: 153 terminais, 2.7-3.6V, -25/85°C — fonte-fabricante,
      Tier-2), Jotrin, Veswin, datasheet4u (2 páginas distintas), datasheetcafe, Lisleapex,
