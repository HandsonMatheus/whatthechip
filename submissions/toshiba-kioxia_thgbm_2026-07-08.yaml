# ── NÃO submetidos (ficam de fora de propósito) ──────────────────────────────
# THGBM1G8D8EBAI2 — aparece em várias buscas ("Toshiba launches largest density embedded eMMC"),
# mas é uma sub-família MAIS ANTIGA e DIFERENTE: JEDEC/MMCA Ver.4.3 (não 5.0/5.1), package
# 169-ball FBGA 14x18mm (não 153-ball), lançamento 2008. pn[5]='1' (dígito) e pn[7:10]='8D8' não
# seguem o esquema de decode do THGBM_GEN/THGBM_CAP atual (que é da era 15nm/JEDEC5.x). Não é
# "irmão" no sentido que interessa à gramática atual — precisaria de investigação e possivelmente
# uma família/decode separados se algum dia aparecer na bancada. Fonte: datasheet.octopart.com/
# THGBM1G8D8EBAI2-Toshiba-datasheet-11973698.pdf (press release, JEDEC 4.3, 32GB, BGA169).
#
# THGBM4G5D1HBAIR — apareceu em UMA única página (datasheet4u), com pn[5]='4' (dígito), o que não
# tem precedente em nenhuma outra fonte consultada e pode ser erro de OCR/scraping do próprio
# datasheet4u (ex.: confusão com outro PN). Sem segunda fonte independente que confirme o '4' —
# não incluí para não arriscar introduzir uma chave de geração inventada. Precisa reverificação
# individual antes de qualquer decisão.
