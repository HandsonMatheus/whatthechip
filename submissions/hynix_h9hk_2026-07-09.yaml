# Submissão de known_parts — SK Hynix, família H9HK (LPDDR4/LPDDR4X standalone x64, JÁ EXISTENTE)
# Gerado a partir da investigação do PN H9HKNNNCTUM (busca na bancada, 2026-07-09) — fragmento
# truncado do PN completo H9HKNNNCTUMUBR-NMH, atestado em ~25 distribuidores via agregador
# DigiPart. Família H9HK e mapa HYX_LPDDR4_H9HC_CAP (compartilhado com H9HC/H9HCN) JÁ EXISTIAM
# e já decodificavam certo (C=4GB, RENTÁVEL) — SEM fix de gramática nesta rodada. Família não
# tinha NENHUM golden anchor até hoje — adicionado 1 em chips/tests.py (H9HKNNNCTUMUBR-NMH).
#
# FONTES: Preduo e Puris (catálogos de broker estruturados, fetch direto) + WinSource via
# agregador DigiPart. Aritmética Gbit→GB mostrada em cada nota (todas em Gbit bruto ÷8=GB).
#
# ⚠ ACHADO — erro de unidade em distribuidor (Censtry): descreve H9HKNNNCTUMUBR-NMH como
# "LPDDR4 32GB 256Mx16 PC3733", mas WinSource (mesmo PN, via DigiPart) mostra corretamente
# "LPDDR4-3733 (32Gb)" — 32Gb÷8=4GB, batendo com o código 'C' já mapeado. Tratado como erro de
# descrição da Censtry (confundiu Gb com GB), não como conflito real — não afeta a submissão.
#
# ⚠ ATUALIZAÇÃO (pedido do dono: pesquisar mais PNs do código 'E' pra resolver 6 vs 8GB):
# RESOLVIDO — código 'E' = 6GB confirmado por 4 fontes/distribuidores independentes em 2 PNs
# reais: H9HKNNNEBUMUBR-NMH (Preduo "48Gbit" + Chipsea/DigiPart "LPDDR4373348GbFBG") e
# H9HKNNNEBMAVAR-NEH (Preduo E Puris, ambos "48Gbit", + WinSource/DigiPart "LPDDR4X-4266
# (48Gb)") — todos ÷8=6GB. O PN H9HKNNNEBMBUDR-NEH (a fonte da dúvida original, Puris "64Gbit")
# NÃO tem nenhuma corroboração: os outros 3 distribuidores que vendem esse PN exato (Ariat/YIC/
# IC Components, via DigiPart) não mostram capacidade nenhuma. Esse PN difere por 1 único
# caractere do irmão de código F já confirmado em 8GB (H9HKNNNFBMBUDR-NEH, mesmo sufixo
# "BMBUDR-NEH") — muito provável erro de transcrição do Puris (confundiu E com F). Continua
# excluído da submissão por identidade incerta, mas o código E=6GB está confirmado com
# confiança alta agora (mapa não muda).
#
# Também achado: H9HKNNNEBMAVAR-NEHR (sufixo com "R" extra) aparece na AB Sunshine Electronics
# como "8GB LPDDR4" — fonte única, distribuidor menor sem precedente de confiabilidade no
# projeto, campo "Part No" genérico (parece categorização, não spec verificada). Não incluído
# (nem como 6GB nem como 8GB) por identidade/fonte fraca — PN diferente do "-NEH" confirmado.
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h9hk_2026-07-09.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h9hk_2026-07-09.yaml --commit --user <seu_usuario>
#
