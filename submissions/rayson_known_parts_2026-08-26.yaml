      encontrou "RS512M32LZ" sem digito em NENHUMA fonte -- toda ocorrencia real e
      "RS512M32LZ4...". Motivo estrutural pra desconfiar que nao e peca distinta: datasheet
      oficial Rayson (irma RS128M32LZ4D1ANP-75BT) decodifica "LZ4" como bloco UNICO de 3
      caracteres ("Product Family"), nao "LZ"+"4" separavel; nenhum datasheet Rayson acessado
      tem tabela de marcacao fisica (top-mark) que justificasse uma leitura truncada.
      CONFIRMACAO: dono verificou o chip fisico e confirma que a marcacao real nao tem o
      digito final -- tratado aqui como equivalente ao known_part ja existente RS512M32LZ4
      (mesma familia, mesma profundidade 512M32), por instrucao direta do dono (nao por fonte
      externa -- nenhuma fonte confirma essa equivalencia, so a inspecao fisica dele). Specs
      herdados de RS512M32LZ4D2ANP-75BT (JLCPCB C2840157, Glochip, SnapEDA, todas concordantes):
      2GB, FBGA-200, -25~85C. Datasheet Rayson da irma 128M32 da mesma linha LZ4 documenta
      tensao dual "0.60V ou 1.10V" (peca unificada LPDDR4/LPDDR4X) -- por isso chip_type=LPDDR4,
      nao 4X, mesma convencao ja usada em toda a familia RS512M32L nas entregas anteriores
      (LM4/LO4/LF4/LV4, ver rayson_known_parts_2026-08-20.yaml). Capacidade: formula
      512M x 32 / 8 = 2GB, confere com o padrao "Total Capacity: 2GB (16 gigabits)" da familia.
      Nao incluo sufixo de velocidade nem device especifico aqui porque a marcacao fisica nao
      trouxe essa informacao (so "RS512M32LZ" mesmo) -- ver ressalva de velocidade conflitante
      no known_part RS512M32LZ4 (entrada separada nesta mesma submissao).
