      '8D4' (pn[8:11], bloco logo após "ZZZ") aparece no PN-irmão
      MT29PZZZ8D4BKFSK-18 (FBGA JWB12, mesma família, achado no
      forward-lookup 2026-07-09), que TEM part-name oficial Micron direto:
      "MLC EMMC/LPDDR2 40G VFBGA" = 40Gb ÷ 8 = 5GB = 4GB+1GB — bate exato
      com o valor do mapa. RKKEQ vs BKFSK é variação de
      encapsulamento/velocidade (fora do bloco de capacidade, que é sempre
      pn[8:11]), não afeta a conta. LPDDR2 confirmado pela família
      (uniforme) + part-name do irmão JWB12.
