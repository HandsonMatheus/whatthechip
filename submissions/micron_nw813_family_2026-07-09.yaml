  - part_number: "MT29PZZZ8D4RKKEQ-3 W.6V4"
    chip_type: "eMCP"
    subtype: "LPDDR2"
    interface: "eMMC + LPDDR2"
    emcp_nand: "4GB"
    emcp_ram: "LPDDR2 1GB"
    fbga_code: "JW713"
    confidence: confirmed
    source_url: "https://www.micron.com/content/micron/us/en/sales-support/design-tools/fbga-parts-decoder/_jcr_content.products.json/getpartbyfbgacode/-/-/-/en_US/-/-/JW713"
    notes: >
      Identidade via API FBGA oficial (2026-07-09). Capacidade: chave '8D4'
      já mapeada em MIC_MCP_CAP (chips/knowledge/micron.yaml linha 15:
