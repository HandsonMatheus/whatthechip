      Sufixo real visto em catálogo de distribuidor com DOIS códigos diferentes antes do T/Y:
      "SDED5-002G-AC(Y)" e "SDED5-002G-NC(T/Y)" — significado do código de 2 letras (tensão?
      tecnologia SLC/MLC?) NÃO decodificado, não é ordering table lida na íntegra pra esse detalhe;
      capacidade e pacote continuam confirmados pelo datasheet independente do código.
    source_url: "https://www.alldatasheet.com/html-pdf/520032/SANKEN/SDED5-001G-NAT/452/2/SDED5-001G-NAT.html"

