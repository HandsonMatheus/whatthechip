#   python manage.py submit_known_parts submissions/sandisk_sded5_2026-09-02.yaml --commit    # grava (submitted, oculto) + aprovar no admin depois
#
# ⚠ Família NOVA: grammar SDED entra via `load_brands --brand sandisk --commit` (rodar ANTES
# deste submit, senão o portão não reconhece o prefixo). Golden test: SDED5001G já é âncora de
# INDETERMINADO em chips/tests.py::_SD_GOLDEN (não testado contra a suíte real — sandbox sem venv
# utilizável; se a tupla não bater, é ajuste de 1 linha).

brand: "SanDisk"
known_parts:
  - part_number: "SDED5001G"
    chip_type: "eMMC"
    subtype: ""
    capacity: "1GB"
    interface: "proprietária mDOC (paralela/memory-mapped — NÃO é MMC)"
    device: "115-ball FBGA 9x12mm — mDOC H3, TrueFFS embarcado, 1.8V ou 3.3V core/IO (auto-detect)"
    confidence: confirmed
    notes: >
      PN do caso original (debug do estoque 02/09/2026). Datasheet oficial SanDisk 92-DS-1205-10
      Rev.1.3 ("mDOC H3 EFD Featuring Embedded TrueFFS", maio/2008, 86 págs, © 2007 SanDisk
      Corporation) lido via mirror alldatasheet.com — pág.1 confirma o produto/geração, pág.2
      confirma "1Gb (128MB) – 64Gb (8GB) data storage capacity" e pacote "mDOC H3 1Gb/2Gb - 115-ball
      FBGA 9x12mm". 1Gb=128MB na escala de densidade do datasheet; "001G" no sufixo do PN é
      CAPACIDADE EM BYTE (1GB = 8Gbit), confirmado independentemente por distribuidor (Jotrin/
      veswin, listagem "SDED5-001G-NA(T/Y)": "IC FLASH 8GBIT 115BGA", 1.65V~1.95V, -25°C~85°C —
      8Gbit = 1GB, bate). ⚠ NÃO é MMC — mDOC usa interface paralela/memory-mapped (Demux ou
      Multiplexed, datasheet cap.9) com TrueFFS rodando como firmware no controlador; não confunde
      com eMMC serial. Sufixo completo real é "SDED5-001G-NAT"/"-NAY" (T=tape&reel, Y=tray,
      confirmado por distribuidor — packaging, não spec); submetido sem o sufixo de embalagem,
      igual ao resto da marca. Datasheet atribuído a "Sanken electric" no índice do alldatasheet.com
      (metadado errado do agregador) — o conteúdo do documento é inequivocamente SanDisk.
    source_url: "https://www.alldatasheet.com/html-pdf/520032/SANKEN/SDED5-001G-NAT/452/2/SDED5-001G-NAT.html"

  - part_number: "SDED5002G"
