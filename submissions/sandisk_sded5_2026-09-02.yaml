# Submissão known_parts — SanDisk, família NOVA "SDED" (mDOC H3 / DiskOnChip embarcado)
# Origem: debug do estoque, PN SDED5001G, 02/09/2026 13:43:34 (prefixo desconhecido, known=false,
# zero fuzzy_suggestions — nenhuma família batia). Ver INVESTIGACAO_sandisk_sded5_2026-09-02.md.
#
# 6 PNs confidence=confirmed — datasheet oficial SanDisk lido (86 páginas, mirror alldatasheet.com):
# "mDOC H3 EFD Featuring Embedded TrueFFS", doc 92-DS-1205-10 Rev.1.3, Data Sheet maio/2008,
# © 2007 SanDisk Corporation (pág.1). Pág.2 confirma densidade (1Gb/128MB – 64Gb/8GB) e pacote
# (115-ball FBGA, 9x12mm ou 10x14mm conforme densidade). Capacidade da SDED5001G corroborada
# também por distribuidor (Jotrin/veswin: "IC FLASH 8GBIT 115BGA", 1.65-1.95V, -25~85°C).
#
# ⚠ mDOC NÃO é protocolo MMC — é interface paralela/memory-mapped proprietária (TrueFFS embarcado
# no controlador). Classificado chip_type=eMMC só por ser a categoria mais próxima do vocabulário
# fechado do sistema (mesma decisão já tomada pra SDIN2xx). Ver tip da família no yaml.
#
