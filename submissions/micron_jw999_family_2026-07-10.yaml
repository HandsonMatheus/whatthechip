# Submissão de known_parts — Micron, FBGA JW999 + família MTFC2G (2026-07-10)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA JW999
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (JW299, JW699, JW899, JW919, JW929) IGNORADO
# por construção — já são KnownPart aprovado.
#
# ACHADO: JW999 → MTFC2GMDEA-0M WT. Família MTFC (eMMC), mesma base do
# lote JZ067 (2026-07-08). Capacidade: convenção do PN "MTFC2G" = 2GB
# direto — confirmado pelo próprio part-name da Micron: "EMMC 16G
# WFBGA" (2GB×8=16Gb, bate exato).
#
# Forward-lookup no prefixo "MTFC2G" (2026-07-10) achou 61 PNs: 35 com
# fbga_code "JW*" (produção) + 1 "JQ*" (qualification sample, EXCLUÍDO)
# + 25 "JY*" (Engineering Sample — quase todos com "ES" literal no PN;
# UM caso, JY443 "MTFC2GMGDQ-AIT", não tem "ES" no texto apesar do
# prefixo JY — fora do escopo mesmo assim, por consistência de critério
# com o resto da leva "JY", não investigado a fundo). Dos 35 "JW", 2 têm
# "ES" literal no PRÓPRIO part-number apesar do prefixo "JW" (JW602,
# JW603 — mesmo padrão de exceção já visto no lote JW738/JWC10) e foram
# EXCLUÍDOS. Restam 33 PNs de produção limpos.
#
# Só 2 dos 33 têm part-name direto da Micron (o alvo JW999 e o irmão
# JWD12, mesmo corpo de PN + sufixo "A") — mas AQUI a capacidade é
# extensível por fórmula com segurança (diferente das famílias MCP/NAND
# processadas antes nesta sessão): "MTFC2G" é uma convenção de PN já
# Tier-1 confirmada de forma GERAL (numemmc.pdf, ciclo JZ067) — não há
# atributo independente e imprevisível tipo célula NAND (MLC/SLC) ou
# tecnologia de RAM (DDR/SDR) que dependa de confirmação por PN
# individual. A versão exata do eMMC (4.5/5.0/5.1) fica de fora — não
# inventada, interface genérica "eMMC" em todos, igual ao padrão já
# usado no JZ067/NW813.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente).
# Sem sobreposição com nenhuma submissão anterior (grep em
# submissions/*.yaml, zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_jw999_family_2026-07-10.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_jw999_family_2026-07-10.yaml --commit
#
