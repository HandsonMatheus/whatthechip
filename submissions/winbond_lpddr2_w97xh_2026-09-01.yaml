# submissions/winbond_lpddr2_w97xh_2026-09-01.yaml
#
# Origem: debug do estoque colado pelo dono — PN de bancada W978H6KBVX2E veio known=false,
# in_review_queue=true, todos os campos vazios.
#
# FAMÍLIA NOVA para a chat Winbond: "Mobile DRAM > Low Power DDR2 SDRAM" (nome oficial
# winbond.com), datasheet chama de "LPDDR2-S4B" — é a linha "LPDDR–LPDDR4X: DRAM móvel padrão"
# que o WINBOND.md §3.1 tinha como placeholder "[A CONFIRMAR em Tier-1]". Prefixo confirmado:
# W97xH, onde x = 8/9/A/B decodifica a densidade (8=256Mb, 9=512Mb, A=1Gb, B=2Gb) — sequência
# hexadecimal confirmada via datasheet oficial + 3 distribuidores concordando.
#
# Decodificação do PN (fonte primária: datasheet oficial Winbond "W979H6KB / W979H2KB LPDDR2-S4B
# 512Mb", winbond.com/resource-files/w979hxkb_datasheet_pkg_a01-003_20160218.pdf — bloqueado por
# robots.txt no fetch direto, espelho lido via Mouser:
# mouser.com/datasheet/2/949/w979hxkb_datasheet_pkg_a01-003_20160218-1489754.pdf):
#   W97[8/9/A/B]H [6/2] KBV [X1/X2] [E/I]
#     978H/979H/97AH/97BH = densidade (256Mb/512Mb/1Gb/2Gb)
#     6 = x16 · 2 = x32                              (organização/interface)
#     KBV = pacote 134-VFBGA 10x11.5mm (o "V" final)  ("Q" = 168-WFBGA, pacote DIFERENTE — existe
#                                                       pra 97AH, ver escopo abaixo, NÃO incluído)
#     X1 = 533MHz · X2 = 400MHz                        (grade de velocidade — bench é X2/400MHz)
#     E = Extended -25°C~85°C · I = Industrial -40°C~85°C
#   Tabela oficial confirma "16 valid part numbers" pra 512Mb = 2(org) x 1(pacote V, neste doc) x
#   2(speed) x 2(temp) x [+ variante pacote Q noutro doc] — a matriz é ORTOGONAL (todo cruzamento é
#   válido), não um catálogo arbitrário de combinações soltas.
#
# ESCOPO desta entrega — só pacote KBV (134-VFBGA), só 256Mb/512Mb/1Gb (3 densidades):
#   - 97BH (2Gb) EXISTE (confirmado via TECHDesign, pacote "MBV") mas usa sufixo de velocidade
#     "A1/A2" em vez de "X1/X2" — não achei o datasheet específico pra confirmar se A1/A2 mapeia
#     pra 533/400MHz na mesma ordem de X1/X2 (não presumido, ver nota nas entradas). Excluído desta
#     rodada; posso voltar se o dono quiser ou se aparecer um PN de bancada "97BH...MBV...".
#   - 97AH também existe em pacote "KBQ" (168-WFBGA, confirmado via RS Online) — pacote FÍSICO
#     diferente do que está na bancada (KBV). Não incluído — mesma lógica.
#   - "TR" (tape & reel) é só embalagem de remessa, não uma marcação de die distinta — não vira
#     known_part próprio (mesmo critério já usado nas famílias DDR3 W63x/DDR2 W97x).
#
# Confidence: "confirmed" nas 3 combinações que bateram em 2+ fontes independentes concordando
# ponto a ponto (density_gbit_num CONFERIDO abaixo pra todas, sub-1Gb sempre em fração de Gb —
# checagem mecânica rodada, ver rodapé).
#
# VERIFICAÇÃO MECÂNICA (rodada antes de entregar, dono pediu que virasse padrão permanente):
#   grep -nE 'density_gbit:.*[0-9]+\s*Mb' submissions/winbond_lpddr2_w97xh_2026-09-01.yaml
#     → vazio
#   python3 (mesmo regex do engine, _GBIT_RE = r'(\d+(?:\.\d+)?)\s*Gb\b') → todas as 24 batem.
#
# chip_type/subtype: "LPDDR2" (confirmado em chips/chip_types.py linha 89 — tipo JÁ REGISTRADO,
# category="dram_mobile", kind="lpddr", carries_generation=True — NÃO é tipo novo, não precisa
# decisão comercial do dono, ao contrário do caso PSRAM/HyperRAM).
#
# Uso:
#   python manage.py submit_known_parts submissions/winbond_lpddr2_w97xh_2026-09-01.yaml
#   python manage.py submit_known_parts submissions/winbond_lpddr2_w97xh_2026-09-01.yaml --commit

