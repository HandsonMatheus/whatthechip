# Submissão de known_parts — SK Hynix, família H5TQ (DDR3 standard-voltage standalone,
# JÁ MAPEADA). Gerado a partir da investigação do PN H5TQ1G83AFP (busca na bancada,
# 2026-08-27). Mesmo padrão "die-revision-letter" já visto várias vezes nesta família
# (H5TC/H5TQ, rodadas 07-13/07-15/08-20/08-26): dentro da MESMA densidade, um sufixo
# diferente é uma REVISÃO/DOCUMENTO distinto; pn[6:8] ("83"/"63"/"43") é a LARGURA de
# barramento (x8/x16/x4), não muda a densidade total. A gramática já decodifica certo
# (pn[4:6]="1G"→dram_density="1Gb = 128MB por die [✓]", grammar_complete=true no debug)
# — é known_parts-only (Trilha B), sem fix de gramática. Objetivo é o BANCO, não a
# gramática já decodificar certo (correção do dono, 2026-08-24 —
# ver [[wtc-objetivo-banco-nao-gramatica]]).
#
# ⚠ AMBIGUIDADE P×R INVESTIGADA E DESCARTADA (não é erro de leitura): a princípio,
# "AFP" (bancada) vs "AFR" (sufixo fixo em TODA a família até aqui, ex.:
# H5TQ2G83DFR/AFR/BFR/CFR/FFR já submetidos) parece candidato a confusão visual P/R —
# mas AMBOS existem como listagens DISTINTAS e INDEPENDENTES em catálogos de
# distribuidor diferentes (não é 1 fonte dominante + 1 variante rara, como no caso
# H8BE/H8BC): H5TQ1G83AFP tem página PRÓPRIA no censtry.com; H5TQ1G83AFR aparece em
# listagem eBay de peça física (título repete a string 2×) + AB Sunshine. Ou seja, são
# dois PNs reais e distintos — mesmo padrão já visto no corpo do datasheet oficial do
# H5TQ2G83DFR (lido na íntegra nesta sessão): a MESMA base de PN легitimamente tem
# várias variantes de sufixo/grade coexistindo (ali eram C/I/J/L; aqui é P vs R, mais
# um code de grade/pacote). Não tratei como duplicata — submeto os dois.
#
# COBERTURA DE CLUSTER (pedido do dono, 2026-08-26/27: "pesquise mais... tem que
# pesquisar o maximo possivel, nao so 1"): busquei sistematicamente as 3 larguras
# (x8/x16/x4) da revisão "A" em 1Gb. ANTES de pesquisar, CHEQUEI submissions/*.yaml já
# commitadas (grep) — nenhuma das 3 abaixo tinha sido submetida ainda.
#   NOVOS nesta rodada: H5TQ1G83AFP (ALVO, x8), H5TQ1G83AFR (x8, sufixo irmão),
#   H5TQ1G63AFR (x16).
#   TENTADO e NÃO achado (excluir, não adivinhar): H5TQ1G43AFR (par x4 da revisão A) —
#   a única menção foi uma INFERÊNCIA por analogia de um resumo de busca ("seria um
#   x4"), sem nenhuma listagem/fonte própria — não incluído.
#   FONTE DESCARTADA por baixa confiança: prodisknetwork.com listava H5TQ1G83AFP-G7C-C,
#   mas a página tem todas as marcas de conteúdo gerado em massa (texto genérico
#   reaproveitado tipo "workload fit: Hadoop/Spark cluster compute" pra um chip DDR3 de
#   1Gb de ~2012, "reviews" de cliente idênticas às do censtry.com) — não usei como
#   fonte, só o censtry.com (página estruturada e específica, sem esse padrão).
#
# ARITMÉTICA (1Gb÷8=128MB, confirmada em toda fonte da leva, bate com o decode ATUAL da
# gramática): x8: 128M×8=1024Mbit=1Gb. x16: 64M×16=1024Mbit=1Gb (mesma densidade total,
# largura diferente — H5TQ1G63AFR "1Gbit 64MX16" confere exato).
#
# FONTES:
#   H5TQ1G83AFP (ALVO): censtry.com — página PRÓPRIA e dedicada ("H5TQ1G83AFP-H9C",
#     "DDR3 128Mx8 PC1333 CL9", Manufacturer=Hynix, package BGA), com "Related Products"
#     citando irmãos REAIS já confirmados nesta sessão (H5TQ4G83EFR-RDC,
#     H5TQ2G83DFR-PBC, H5TQ1G83BFR-H9C) — corrobora que o catálogo da página é genuíno,
#     não gerado. confidence=manual.
#   H5TQ1G83AFR: eBay — anúncio de peça física ("1 Piece New HYNIX H5TQ1G83AFRG7C
#     H5TQ1G83AFR-G7C BGA78 IC Chip", string repetida 2×) + AB Sunshine (listagem
#     própria, ainda que formatada em conjunto com BFR-H9C-C). 128Mx8, mesma família/
#     densidade/largura do alvo, revisão "A" — só o sufixo P×R difere (ver nota acima).
#     confidence=manual.
#   H5TQ1G63AFR: datasheets.com ("SK hynix Inc | H5TQ1G63AFR-G7C — DRAM chip DDR3 SDRAM
#     1Gbit 64MX16, 96-pin FBGA") + AB Sunshine (H5TQ1G63AFR-PBC, listagem própria).
#     Par x16 da revisão A. confidence=manual.
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h5tq1g_rev_a_2026-08-27.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h5tq1g_rev_a_2026-08-27.yaml --commit
#
