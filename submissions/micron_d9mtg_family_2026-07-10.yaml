# outros 32 herdam a mesma organização por construção do próprio
# prefixo buscado (verificado programaticamente: todos os 37
# part-numbers começam literalmente por "MT47H256M8", mesma lógica já
# usada no D9RZH/D9LGQ/D9PQL). Sem PN duplicado, sem fbga_code
# duplicado, sem colisão de part_number_norm dentro da própria lista
