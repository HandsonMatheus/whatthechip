  - part_number: RS1G16Z4DD-62DT
    chip_type: DDR4
    subtype: DDR4
    density_gbit: 16Gb
    confidence: confirmed
    source_url: "https://www.szrayson.com/static/upload/file/20240722/1721629326630807.pdf"
    notes: >
      Rayson HI-TECH — fonte TIER-1 (datasheet oficial szrayson.com, título "DDR4 Datasheet
      RS1G16Z4DD-62DT 96-Ball, Revision 1.0"). Chart de PN: "1G16 = 1 Gig x 16 / Z4 = [família] /
      D = 1.2V / 62 = 3200Mb/s/pin / DD = 96-ball FBGA-7.5x13 / T = 0C a +95C". Densidade: 1024M x
      16 = 16.384Mb = 16Gb (conta refeita à mão). ATENÇÃO: o PRÓPRIO datasheet oficial da Rayson
      escreve "16 Gigabyte" pra densidade num ponto do documento — isso é erro de unidade do
      FABRICANTE (Gb confundido com GB), não deste known_part; 16Gb (densidade) é o valor correto
      pra density_gbit, consistente com a linguagem "Gb" usada no resto da família (8Gb/4Gb acima).
      Se algum dia essa peça aparecer com capacity em vez de density_gbit em outro lugar do
      sistema, NÃO usar "16GB" — seria a densidade em bits mal-convertida, não a capacidade real.
