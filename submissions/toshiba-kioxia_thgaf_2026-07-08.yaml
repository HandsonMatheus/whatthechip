# Submissão de known_parts — Toshiba-Kioxia, família THGAF (UFS 2.1, promovida a decode posicional)
# Gerado pelo chat de marca Toshiba-Kioxia a partir da investigação do PN THGAF4T0N8LBAIR
# (busca na bancada, 2026-07-08) — família já existia como "magra" (só prefixo, sem decode de
# capacidade, adicionada 2026-06-26). Nesta rodada encontrei DUAS tabelas oficiais Kioxia
# (consumer + automotive) que usam a MESMA chave de 2 caracteres pn[6:8] para capacidade,
# permitindo promover a família a decode posicional (Trilha A, ver
# chips/knowledge/toshiba-kioxia.yaml) além desta submissão de known_parts (Trilha B).
#
# Chave descoberta: pn[6:8] (2 chars) → G7=16GB · G8=32GB · G9=64GB · T0=128GB · T1=256GB ·
# T2=512GB (progressão binária, cada passo dobra). Confirmada IDÊNTICA nas duas tabelas nos 4
# pontos em que se sobrepõem (G8/G9/T0/T1) — prova que pn[5] (grade: 8=consumer · 9/B/E=automotive
# · 4=variante de campo) NÃO afeta a capacidade, só a chave pn[6:8] importa.
#
# Hierarquia de fonte usada: Tier-1 = PDF oficial KIOXIA lido diretamente (Managed Flash Memory
# Highlight Q1/2021, hospedado no servidor oficial de documentos da DigiKey — distribuidor
# autorizado espelhando o documento do fabricante; e Automotive Managed Flash Solutions Product
# Brief Rev.2.0 out/2020, hospedado em americas.kioxia.com — site oficial do fabricante).
# confidence=manual = capacidade derivada da MESMA chave pn[6:8] já provada 2-3x em fontes Tier-1
# para PNs de grade diferente, mas SEM sighting direto dessa variante específica (pn[5]="4") em
# nenhuma tabela oficial encontrada — mesmo padrão de "concordância entre múltiplas fontes
# independentes sem 1 datasheet nomeando o PN exato" usado no THGBM (THGBMBG5D1KBAIL).
#
# Uso:
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgaf_2026-07-08.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/toshiba-kioxia_thgaf_2026-07-08.yaml --commit --user <seu_usuario>
#
