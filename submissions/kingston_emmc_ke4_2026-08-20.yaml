# Submissão known_parts — Kingston, linha "eMMC gerenciado" prefixo KE4 (standalone, sem RAM combo)
# Chat de marca Kingston, 2026-08-20. Disparado pelo PN físico `KE4CN2L2SA5H2A` no debug de estoque
# (known:false, TUDO vazio — chip_type/brand/família nenhum, nem fallback genérico bateu).
#
# CONTEXTO: essa linha já era um gap sinalizado (KINGSTON.md §5, achado lateral em 2026-08-19
# buscando outra coisa via RS Components, nunca pesquisado a fundo). Esta rodada pesquisou a fundo.
#
# ⚠ DESCOBERTA IMPORTANTE: a linha "KE4" tem PELO MENOS DUAS gerações/formatos de PN bem diferentes:
#   (a) forma CURTA `KE4CN[dígito][letra][dígito]A` (9 chars, ex. KE4CN2H5A) — confirmada em 6-7
#       PNs via RS Components (distribuidor estruturado, capacidade+pacote no campo próprio).
#   (b) forma LONGA `KE4CN2L2[...]` (14+ chars, ex. KE4CN2L2HA5A2A-A58A) — mesmo prefixo "KE4CN2L2"
#       do PN físico do debug.
#
# ATUALIZAÇÃO 2026-08-20 (mesmo dia) — dono pediu confirmar em tier 2, tentei mais fontes e achei:
# Win Source (via agregador Octopart, 2 buscas independentes confirmaram o mesmo PN sozinho na
# página, sem mistura com outro registro) lista `KE4CN2L2SA5H2A` como "4GB + 4GB" / "162 Ball Fbga
# Tsb 19NM". Interpretação: 2 dies NAND de 4GB empilhados no mesmo pacote = **8GB total** — bate com
# o dígito "2" logo depois de "KE4CN" (mesma posição que na forma CURTA significa "4GB", ex.
# KE4CN2H5A=4GB — aqui o "2" provavelmente descreve o die UNITÁRIO de 4GB, e o resto do PN longo
# descreve o empilhamento/revisão que a forma curta não precisa ter por ser die único). "Tsb" no
# meio da descrição do pacote é abreviação de **Toshiba** — mesmo padrão já visto em FH32B08UCT1/
# FH64B08UCT1 (Kingston empacota célula NAND de terceiro sob a própria marca; aqui o terceiro é
# Toshiba de novo). Processo 19nm.
# ⚠ Contraponto não escondido: cross-referenciei o PN via serviceemmc.com (lista de equivalência
# eMMC↔aparelho, comum em assistência técnica) → `KE4CN2L2SA5H2A` = usado no Huawei Y221-U22. O
# GSMArena lista a Y221-U22 com "4GB" de armazenamento interno (não 8GB) — pode ser só arredondamento
# de marketing / espaço de sistema reservado (comum nesse segmento de aparelho de entrada ~2014,
# onde o "GB nominal" já historicamente sobra bem menos de usável), ou pode ser uma variante regional
# com chip diferente — não day pra saber ao certo qual. Documentei os dois lados; capacidade
# registrada abaixo é a do CHIP (8GB, fonte direta pro PN), não a do "storage" anunciado do aparelho.
#
# CLUSTER CONFIRMADO (forma curta, todos via RS Components — título do produto atribui "Kingston",
# campos estruturados de capacidade/pacote/pin-count):
#   KE4CN2H5A → 4GByte, 153-Pin BGA
#   KE4CN3H5A → 8GByte, 153-Pin BGA
#   KE4CN3K6A → 8GByte, 169-Pin BGA
#   KE4CN4A5A → 16GByte, 153-Pin BGA
#   KE4CN4K6A → 16GByte, 169-Pin BGA
#   KE4BT4B6A → 16GByte, 169-Pin FBGA (prefixo "KE4BT", não "KE4CN" — variante de linha, incluído
#               mesmo assim por ser o mesmo padrão geral KE4 + specs igualmente confirmados na RS)
# Versão eMMC: só 1 PN da família (KE4CN5B6A, excluído abaixo) tinha na página "Designed to JEDEC
# 4.5 specification" explícito — apliquei "eMMC 4.5" aos 6 PNs acima por inferência de família (
# mesmo prefixo/geração/pacote, catalogados em sequência pela própria RS), não confirmado PN a PN.
#
# EXCLUÍDO na entrega original (2026-08-20) — `KE4CN5B6A`: RS mostra capacidade "32Gbit" (não "GByte"
# como todos os outros — texto genuinamente diferente, não parece erro de digitação da RS). Se for
# GByte por padrão de dobra (2→4GB,3→8GB,4→16GB,5→32GB) seria 32GB; se for Gbit literal ÷8 seria só
# 4GB — os dois são plausíveis e a página não desambiguou. Não incluí — spec contraditória, não
# adivinhei qual.
# ⚠ RESOLVIDO na 3ª rodada (2026-08-26, ver atualização mais abaixo): Octopart confirma
# independentemente "32GByte" + "eMMC V4.5" explícito — KE4CN5B6A JÁ ESTÁ incluído como known_part
# confirmado no final deste arquivo, esta linha fica só como registro histórico da exclusão original.
#
# NÃO PERSEGUIDO nesta rodada: achei também "KE4CN2H5A-A58" e "KE4CN2H5C" (variantes de sufixo/
# revisão da forma curta, via findchips) sem abrir specs — fica sinalizado, não é o gatilho desta
# rodada (o PN do debug é forma longa, não curta).
#
# Convenção de campos: chip_type="eMMC" (standalone, SEM combo de RAM — "Cell Type: NAND" na RS,
# nenhuma menção de LPDDR) — mesma convenção já usada pro eMMC standalone `EMMC…G-…` (KINGSTON.md
# §1: subtype vazio, interface=versão eMMC, capacity=GB literal). `device` = pacote/pin-count
# (mesma inferência de campo já usada na submissão NAND cru, não existe campo dedicado no schema).
#
#
# ── ATUALIZAÇÃO 2026-08-26 (3ª rodada) — 3º FORMATO de PN na linha KE4 + resolução de ambiguidade ──
# Disparada por PN físico do debug de estoque `KE44B26BN8GB` (lido sem separador; forma real com
# separadores é `KE44B-26BN/8GB`, confirmada via RS Components + Octopart + Elnec).
#
# NOVO FORMATO descoberto: "KE44B-[dígito][letra]AN/[cap]GB" — usa hífen E barra, com a CAPACIDADE
# ESCRITA LITERAL no sufixo (diferente dos formatos curto/longo já documentados acima, que codificam
# capacidade num dígito compacto sem separador). Também é uma GERAÇÃO eMMC DIFERENTE: "eMMC 4.41"
# (JEDEC JESD84-A4411) confirmado EXPLÍCITO em 2 dos 3 PNs (RS Components pro /8GB: "Designed to...
# JESD84-A4411"; Octopart pro /2GB: "Embedded MMC 4.41"), vs. "eMMC 4.5" da família KE4CN/KE4BT
# (curta/longa) já documentada acima — a linha "KE4" cobre pelo menos 2 gerações eMMC distintas.
#
# CLUSTER (RS Components, cross-referenciado com Octopart):
#   KE44B-25AN/2GB → 2GB, 153-Pin FBGA, eMMC 4.41 confirmado
#   KE44B-26BN/4GB → 4GB, 169-Pin FBGA, eMMC 4.41 por inferência (irmã entre as 2 confirmadas)
#   KE44B-26BN/8GB → 8GB, 169-Pin FBGA, eMMC 4.41 confirmado — PN FÍSICO do debug, 26/08/2026
# ⚠ Achado de disambiguação: RS lista a capacidade do KE44B-25AN/2GB como "2Gbit" no campo curto de
# "Capacity", mas o campo "Organisation" da MESMA página diz "2G x 1 bit, 2G x 4 bit, 2G x 8 bit" (bate
# com 2GByte, não 2Gbit) e o próprio sufixo do PN diz "/2GB" — 2 contra 1 dentro da própria RS, e
# Octopart confirma independentemente "2GB" puro. Concluí 2GByte (capacity: 2GB), tratando o "2Gbit"
# do campo curto como inconsistência de template da RS, não spec real — mesmo tipo de inconsistência
# que resolveu o achado abaixo.
#
# Tentei e não achei (excluído): "KE44B-" com capacidade 16GB ou 32GB (varri múltiplos espelhos
# regionais da RS, só apareceram os 3 stock numbers 761-0351/354/358 = 2/4/8GB); revisões de sufixo
# além das 3 formas-base.
#
# ── RESOLUÇÃO DE AMBIGUIDADE ANTIGA: KE4CN5B6A (excluído na entrega original acima) ──
# Motivo da exclusão original: RS mostrava "32Gbit" (não "32GByte" como as demais irmãs da família
# curta) — ambíguo entre 32GB (padrão de dobra 2→4,3→8,4→16,5→32) e 4GB (32Gbit÷8 literal), página não
# desambiguava, não incluí por spec contraditória.
# RESOLVIDO nesta rodada: Octopart (fonte independente da RS) confirma "32G-byte (32GB)" E "32GB eMMC
# V4.5" explícito — bate com o padrão de dobra da família curta (dígito "5"→32GB) E confirma eMMC 4.5
# (mesma geração das irmãs KE4CN/KE4BT). O "32Gbit" da RS era o MESMO tipo de inconsistência de
# template achada agora no KE44B-25AN/2GB (campo curto usa unidade errada) — não uma spec real
# diferente. Adicionado abaixo como known_part confirmado, substituindo a exclusão anterior.
#
# CLUSTER adicional (irmã de pacote/capacidade, achada nesta rodada varrendo a mesma família KE4BT):
#   KE4BT5D6A → 32GB, 169-Pin FBGA — irmã de capacidade da KE4BT4B6A (16GB) já confirmada acima.
#
#
# ── ATUALIZAÇÃO 2026-09-02 (4ª rodada) — SUB-FAMÍLIA eMCP dentro do prefixo "KE4CN2L2" ──
# Disparada por PN físico do debug de estoque `KE4CN2L2HA5A2A` (01/09/2026 21:18, known:false,
# tudo vazio; fuzzy_sugest. apontou pro irmão já confirmado `KE4CN2L2SA5H2A` acima). Por
# wtc-fuzzy-sugest-ja-confirmado-nao-pesquisar, não pesquisei o fuzzy_sugest. em si — só o PN
# literal do debug.
#
# DESCOBERTA: `KE4CN2L2HA5A2A` é PN REAL e distinto — achado em 4 fontes independentes (Jotrin,
# Prom.ua, Techmaster, HKinventory — esta última já lista uma variante de revisão `-A58A`). NÃO é
# erro de leitura do irmão `SA5H2A` (mesmo prefixo de 8 chars "KE4CN2L2", mas família à parte).
#
# Mas: o padrão "H" nesse mesmo prefixo parece ser uma SUB-LINHA DIFERENTE — não eMMC puro como
# `SA5H2A` (que é só NAND, 1 fabricante — Toshiba — nos 2 dies empilhados). Octopart/Win Source
# (mesma fonte já usada pro SA5H2A) descreve:
#   `KE4CN2L2HA5A2A`  → "eMCP 32GB + 4GB" (rótulo eMCP explícito = combo NAND+RAM)
#   `KE4CN2L2HA8A2A`  → "4GB + 8GB, 162 Ball Fbga Tsb 19NM Nanya 30NM" (acha um SEGUNDO
#                        fabricante de die — Nanya, historicamente só DRAM — ao lado de Tsb/
#                        Toshiba, batendo com a hipótese eMCP; achado varrendo o mesmo prefixo,
#                        não veio do fuzzy_sugest.)
# Números de capacidade não fecham limpo entre os dois PNs (32+4 vs 4+8) e nenhuma fonte
# Tier-1/Kingston oficial cobre PN dessa era (flyer oficial eMCP_en.pdf da Kingston não lista
# nada com prefixo "KE4" — só a linha moderna "[cap]EM[cap]-[suffix]"). Levei a ambiguidade
# categoria+capacidade ao dono via AskUserQuestion em vez de adivinhar — ver
# wtc-confirmacao-fisica-dono-sobrepoe-ausencia-tier1. Resposta: **"Tenho o chip, é eMCP de
# verdade"** — confirma por posse física que É combo NAND+RAM (pacote/dies visíveis bate), sem
# fornecer números próprios — autorizou usar os do Octopart quando não soubesse os exatos.
#
# Registrei os 3 PNs abaixo como eMCP com os números LITERAIS do Octopart (maior número = NAND,
# menor = RAM — inferência de ordem, não confirmada campo-a-campo; documentada, não escondida).
# `subtype` (geração LPDDR) fica VAZIO — nenhuma fonte confirmou LPDDR2/3/4/etc, dono confirmou só
# a CATEGORIA (é eMCP) via posse física, não a geração de RAM especificamente; campo é blank=True
# no model, não adivinhei. `interface` = "eMMC 4.5" por herança do resto da família KE4CN2L2/KE4CN/
# KE4BT (mesmo prefixo/era, nenhuma fonte sugeriu versão diferente para o sub-grupo "H") — inferência
# de família, não confirmada PN a PN (mesma convenção já usada pros 6 PNs da forma curta acima).
# confidence="manual" nos 3 (categoria por posse física do dono, números de capacidade só Tier-2 sem
# cross-check limpo — mesmo critério de wtc-manual-nao-e-quase-confirmado: autoritativo, não "quase").
#
# CLUSTER eMCP (Octopart/Win Source, mesma fonte já confiável pro SA5H2A):
#   KE4CN2L2HA5A2A        → eMCP, NAND 32GB + RAM 4GB
#   KE4CN2L2HA5A2A-A58A   → irmã de revisão da HA5A2A (specs herdadas, achada via HKinventory)
#   KE4CN2L2HA8A2A        → eMCP, NAND 8GB + RAM 4GB (RAM só em notes, ver correção abaixo)
#
# ── CORREÇÃO 2026-09-02 (mesmo dia, depois) — emcp_ram AMBÍGUO no audit_campo_forma ──
# Dono rodou o dry-run e `audit_campo_forma` marcou os 3 `emcp_ram: 4GB` acima como AMBÍGUO: a
# forma canônica do campo exige prefixo de geração de RAM (LPDDR2/3/4[X]/GDDR.../DDR.../SDRAM/
# RDRAM — vocabulário fechado em `chips/conventions.py::_RAM_GEN_RE`), e eu só tinha o número (4GB)
# sem geração confirmada (dono confirmou a CATEGORIA eMCP, não a geração da RAM; nenhuma fonte deu
# isso tampouco). Não existe token "geração desconhecida" no vocabulário — não dava pra corrigir a
# FORMA sem inventar um LPDDRx que eu não confirmei. Deixei `emcp_ram` VAZIO nos 3 (mesmo
# tratamento já dado ao `subtype`) e mantive o número "4GB" só no `notes` — resolve o AMBÍGUO sem
# adivinhar. Consequência documentada: sem `emcp_ram` preenchido, a precificação/caixa (F12) só lê
# o lado NAND desses 3 known_parts até a geração da RAM ser confirmada (fica pra rodada futura, ou
# se o dono conferir a marcação do lado da RAM no chip físico).
#
# validar: python manage.py submit_known_parts submissions/kingston_emmc_ke4_2026-08-20.yaml --fill-empty

