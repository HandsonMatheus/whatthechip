      de FAQ), pacote BGA153 bate com o resto da família. ⚠ Fonte ÚNICA e de tier mais baixo
      que os outros 2 PNs desta submissão (revenda avulsa, não catálogo de distribuidor
      B2B/agregador técnico) — tentei achar 2ª fonte independente (Octopart, WinSource,
      Datasheets.com, Elnec) sem sucesso (páginas sem dado ou não carregaram). Consistente com
      pn[4]='3'→4GB da gramática, sem contradição. Sinalizando o tier mais baixo para o dono
