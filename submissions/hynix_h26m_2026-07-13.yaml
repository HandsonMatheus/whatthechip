      3.3V Prom PBGA153". As 3 fontes batem exatamente no mesmo código de organização (4GX8) e
      pacote (PBGA153). ⚠ A seção "Description"/FAQ em prosa da MESMA página Lisleapex está
      contaminada por conteúdo gerado por IA e incorreta (afirma fabricante "Samsung" e
      capacidades "32GB"/"128GB" contraditórias entre si) — ignorada; usei só a tabela de
      especificações estruturada, que é consistente e bate com as outras 2 fontes.

  - part_number: "H26M31002GRR"
    chip_type: "eMMC"
    subtype: ""
    interface: "eMMC 5.x"
    capacity: "4GB"
    confidence: manual
    source_url: "https://imall.com/product/H26M31002GRR-EMMC-BGA153-4G-H26M32001DAR-H26M44001ECR-8G/Security-Protection-Consumer-Electronics-Games-Accessories/aliexpress.com/4000302190320/144-76171993/en"
    notes: >
      Achado na 2ª rodada de busca (dono pediu mais cobertura além dos 2 PNs iniciais). Irmão
      do PN alvo (mesma chave '3', miolo "31002" — mesmo miolo do já confirmado H26M31002GPR,
