      específica: Elnec lista SDIN4C2-8G-U [FBGA169] como dispositivo suportado (mesma família de
      programador/pinout real); serviceemmc.com (lista de compatibilidade de técnicos) cita
      SDIN4C2-8G = Samsung Galaxy S I9000 como cross-ref de dispositivo real. Capacidade 8GB =
      sufixo declarativo padrão.
    source_url: "https://www.elnec.com/en/device/SanDisk/"

