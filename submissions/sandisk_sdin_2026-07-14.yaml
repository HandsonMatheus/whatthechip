      PROSA TÉCNICA de teardown real (não título de anúncio comercial) — "SanDisk SDIN4C2-16G 16GB
      Flash memory" no Motorola Droid Bionic Teardown
      (ifixit.com/Teardown/Motorola+Droid+Bionic+Teardown/6449) E "SanDisk SDIN4C2 16GB MLC NAND
      flash" no Nexus S Teardown (ifixit.com/Teardown/Nexus+S+Teardown/4365) — dois aparelhos
      distintos, duas equipes de desmontagem distintas, mesma leitura de capacidade. Estabelece a
      convenção "-16G = 16GB" pro cluster inteiro.
    source_url: "https://www.ifixit.com/Teardown/Motorola+Droid+Bionic+Teardown/6449"
