  # ── Cluster SDIN4C2 (inclui o PN do caso original) — SEM datasheet público localizado ──
  # confidence=manual: evidência não é revenda simples (seria distributor) — é engenharia real
  # verificada (fórum TI E2E citando datasheet do fabricante em mãos + fabricante de programador
  # Elnec com pinout real + iFixit confirmando em prosa técnica de teardown, não título de anúncio).
  # Ver §4 da investigação para o detalhe completo de cada fonte.
  - part_number: "SDIN4C24G"
    chip_type: "eMMC"
    subtype: ""
    capacity: "4GB"
    interface: "eMMC (geração não confirmada, ~2008-2009)"
    device: "169-ball FBGA (convergência de distribuidor)"
    confidence: manual
    notes: >
      PN do caso original (debug do estoque 14/07/2026). SEM datasheet oficial localizado
      (geração "4" fica entre o doc 2007/SD-SPI e o doc 2010/e.MMC 4.41 — buraco documental real).
      Evidência: (1) TI E2E forum, thread de engenheiro integrando SDIN4C2-4G numa placa DM365
      (TI DaVinci), cita "the data sheet for the SDIN4C2-4G device" em mãos —
      https://e2e.ti.com/support/processors-group/processors/f/processors-forum/124680/; (2) Elnec
      (fabricante de programador de chip) lista SDIN4C2-4G-U [FBGA169] como dispositivo suportado,
      com adaptador de hardware específico — precisa de pinout real, não é revenda —
      elnec.com/en/device/SanDisk/; (3) 7+ distribuidores independentes convergem em "4GB,
      169FBGA". Capacidade 4GB = leitura direta do sufixo declarativo padrão SanDisk (convenção já
      confirmada na marca inteira). Geração exata da célula NAND/versão eMMC não confirmada —
      por isso capacidade vai no known_part mas subtype/interface ficam conservadores.
    source_url: "https://e2e.ti.com/support/processors-group/processors/f/processors-forum/124680/"

  - part_number: "SDIN4C28G"
    chip_type: "eMMC"
