# Submissão known_parts — SanDisk, família SDIN (eMMC iNAND legado)
# Origem: investigação a partir do PN SDIN4C24G (debug do estoque, 14/07/2026).
# Ver INVESTIGACAO_sandisk_sdin_2026-07-14.md para a cronologia completa (3 gerações de protocolo).
#
# 18 PNs confidence=confirmed (3 datasheets oficiais SanDisk, verificados por fetch direto e leitura
# integral — não é relato de agente) + 3 PNs confidence=manual (cluster SDIN4C2, sem datasheet
# público, mas triangulado por TI E2E forum + Elnec + iFixit — ver §4 da investigação).
#
# ⚠ RODAR O PRECHECK ABAIXO ANTES DO --commit (lição do incidente SDADB48K16G de ontem: o lookup
# do submit_known_parts é por part_number EXATO, não normalizado — um PN já existente com grafia
# diferente, ex. com traço, não é encontrado e o INSERT duplicado quebra a constraint do banco):
#
#   python manage.py shell <<'EOF'
#   from chips.normalize import normalize_pn
#   from chips.models import KnownPart
#   pns = ["SDIN2C1512M","SDIN2C21G","SDIN2C22G","SDIN2C24G","SDIN2B24G","SDIN2B28G",
#          "SDIN5D22G","SDIN5C24G","SDIN5C14G","SDIN5C28G","SDIN5C18G","SDIN5C216G",
#          "SDIN5C116G","SDIN5B232G","SDIN5E132G","SDIN5F164G","SDIN7DP24G","SDIN7DP28G",
#          "SDIN4C24G","SDIN4C28G","SDIN4C216G"]
#   for pn in pns:
#       norm = normalize_pn(pn)
#       existing = KnownPart.objects.filter(part_number_norm=norm)
#       if existing.exists():
#           for e in existing:
#               print(f"COLISÃO {pn} (norm={norm}) -> já existe id={e.id} part_number={e.part_number!r} "
#                     f"review_status={e.review_status} confidence={e.confidence}")
#       else:
#           print(f"livre    {pn}")
#   EOF
#
# Qualquer PN que aparecer como COLISÃO deve ser removido deste arquivo antes do --commit (a
# correção do registro existente é feita direto no admin, não por este comando).
#
# Uso (o DONO roda, nunca o chat):
#   python manage.py submit_known_parts submissions/sandisk_sdin_2026-07-14.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/sandisk_sdin_2026-07-14.yaml --commit    # grava (submitted, oculto) + aprovar no admin depois
#
# ⚠ Golden test: SDIN5C116G, SDIN5C14G, SDIN5C18G já existem em chips/tests.py::_SD_GOLDEN como
# âncora de INDETERMINADO. Depois de aprovar, esses 3 vão sair de INDETERMINADO — characterize_baseline
# --diff vai acusar; atualização do tests.py é o dono (fora do escopo deste chat mexer em .py).

brand: "SanDisk"
