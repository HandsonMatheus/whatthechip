# Submissão de known_parts — Micron, FBGA D9SXC e vizinhos fuzzy (2026-07-09)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9SXC
# (não identificado na bancada, fila de revisão — SearchLog 09/07/2026 11:07).
# Mesmo processo do lote JZ067 (2026-07-08): resolvido via API FBGA oficial
# da Micron + as 5 sugestões fuzzy do próprio motor (D9SKC/D9SKG/D9SSC/D9SVC/
# D9SXB), cada capacidade com aritmética mostrada e 2+ fontes batendo — nunca
# só o número final (ver memória wtc-mostrar-aritmetica-gb-gbit).
#
# ⚠ ACHADO PRINCIPAL: D9SXC (o alvo) é GDDR5 — família MT51J, que NÃO existe
# em chips/knowledge/micron.yaml hoje (só temos MT52L/MT53B/D/E). É memória
# de GPU, não mobile/desktop DRAM. Proposta de gramática (Trilha A) no final
# deste arquivo, como comentário — NÃO apliquei no yaml (preciso de
# load_brands --dry-run + golden test, que só rodam na sua máquina/CI;
# AUTORIA.md exige golden pra família de prefixo novo).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9sxc_family_2026-07-09.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/micron_d9sxc_family_2026-07-09.yaml --commit --user <seu_usuario>
#
brand: "Micron"
known_parts:
  # ── D9SXC — o alvo original, FAMÍLIA NOVA (GDDR5, MT51J) ──────────────────
  - part_number: "MT51J256M32HF-60:A"
    chip_type: "GDDR5"
    subtype: "GDDR5"
    interface: "x32"
    density_gbit: "8Gb"
    fbga_code: "D9SXC"
    confidence: confirmed
    source_url: "https://octopart.com/part/micron/MT51J256M32HF-80:B"
    notes: >
      Identidade via API oficial FBGA Decoder da Micron (fetch direto,
      2026-07-09): D9SXC → MT51J256M32HF-60:A. Capacidade: campo estruturado
      Octopart "Density: 8 Gb" (não é descrição solta — é atributo técnico) +
      2 distribuidores citando "GDDR5 8Gb" (Unikeyic) e "GDDR5 8G" (Avnet) +
      conta pelo PN: 256M(profundidade) × 32bit(largura) = 8192Mb = 8Gb —
      as 3 fontes batem. ⚠ Campo é density_gbit (Gb), NÃO capacity — DRAM
      discreta usa density_gbit por convenção (CLAUDE.md §6), diferente do
      LPDDR avulso (capacity em GB) que os outros 4 known_parts deste arquivo
      usam. Interface "x32" vem do "M32" no PN (largura de barramento).
      ⚠⚠ FAMÍLIA NOVA — chips/knowledge/micron.yaml não tem prefixo MT51J
      nem chip_type=GDDR5 pra Micron (só K4N.../Samsung usa GDDR hoje). Ver
      proposta de gramática comentada no fim deste arquivo antes de aprovar
      — sem ela, PNs "irmãos" (MT51J256M32HF-70/80/50, MT51J128M32HF-70,
      achados no forward-lookup) continuam invisíveis mesmo depois deste
      known_part entrar.

  # ── Sugestões fuzzy do motor — famílias JÁ existentes na gramática ─────────
  - part_number: "MT41K64M16TW-125:J"
    chip_type: "DDR3L"
    subtype: "DDR3L"
    interface: "x16"
    density_gbit: "1Gb"
    fbga_code: "D9SKC"
    confidence: confirmed
    source_url: "https://octopart.com/part/micron/MT41K64M16TW-125:J"
    notes: >
      Identidade via API FBGA oficial (2026-07-09). Capacidade: Octopart
      "DDR3L SDRAM 1G-Bit" (título) + "Density" não exposto no card mas IHS
      cita "1GBIT" + AAA Chips cita "1073741824bit" = 2^30 bits = exatamente
      1Gb (contagem bruta, sem ambiguidade) + conta pelo PN: 64M × 16bit =
      1024Mb = 1Gb. 4 fontes batendo. Família MT41K já existe no yaml
      (chip_type/subtype corretos) mas SEM decode de capacidade
      (decode_cap_pos/decode_density_type vazios) — por isso density_gbit
      explícito aqui é o único jeito de a bancada mostrar a capacidade.
      Lifecycle "Obsolete" no Octopart (Last Updated há 6 meses) — normal
      pra reciclagem.

