# Correção do dono (2026-08-24): eu tinha descartado submeter a forma sem sufixo
# "H9HKNNNCTUMU" por "a gramática já decodifica igual" — ERRADO. Objetivo é PN
# CONFIRMADO NO BANCO, gramática é problema separado (mesma regra de sempre).
# Voltando atrás e submetendo.
#
# CONTEXTO: a bancada de hoje leu "H9HKNNNCPUMU" (14 caractere) — na prática a
# leitura foi da forma SEM SUFIXO da família (12 caracteres), com 1 caractere
# errado (P em vez de T). O dono confirmou a identidade certa é "H9HKNNNCTUMU"
# (2 links: DigiPart CUUMU + mic-checker CRMAVAR — ambos irmãos já confirmados
# em submissão de jul/2026, ver hynix_h9hk_2026-07-09/10/14.yaml). Ou seja: a
# forma sem sufixo é exatamente o que sai direto da bancada — merece known_part
