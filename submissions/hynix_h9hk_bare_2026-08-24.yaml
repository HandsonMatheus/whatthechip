# (H9HKNNNCTUMUBR-NMH, submetido e aprovado em hynix_h9hk_2026-07-09.yaml,
# confidence=manual) — LPDDR4X 4GB. O sufixo de grade/temperatura não muda a
# identidade elétrica/capacidade, só a faixa de temperatura/pacote comercial.
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h9hk_bare_2026-08-24.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h9hk_bare_2026-08-24.yaml --commit
#
