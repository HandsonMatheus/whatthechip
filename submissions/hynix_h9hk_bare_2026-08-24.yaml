#
# IDENTIDADE: "H9HKNNNCTUMU" é PN real orderável, não só um prefixo de busca —
# a DigiPart lista ele como linha própria de estoque (distribuidor "New Strength
# Electronic co.,Limited", DC:2016+, BGA-366, estoque 1175 unidades), separado
# das variantes com sufixo de grade/temperatura (AR-NLH/BR-NLH/BR-NMH/TR-NLH/
