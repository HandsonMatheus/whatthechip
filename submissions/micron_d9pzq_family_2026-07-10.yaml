# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9PZQ
# (não identificado na bancada, fila de revisão — SearchLog 10/07/2026 11:20).
#
# fuzzy_sugest. do debug (D9PWQ, D9XZQ, D9ZZQ, D8JZQ, D9CSQ) IGNORADO por
# construção — já são KnownPart aprovado (ver memória
# wtc-fuzzy-sugest-ja-confirmado-nao-pesquisar). Só o alvo foi pesquisado.
#
# ⚠ ACHADO DE ESCALA + DECISÃO DO DONO (2026-07-10): forward-lookup no
# prefixo "MT41K256M16" (mesma organização do alvo) devolveu 92 PNs/FBGAs
# distintos (53 produção "D9*" + 39 Engineering Sample "Z9*"). TODOS são
# matematicamente a MESMA densidade (256M×16bit=4096Mb=4Gb). Perguntei ao
# dono se valia bulk-submeter a família inteira — resposta: "bulk agora".
#
# ⚠⚠ DUAS RODADAS DE CORREÇÃO PÓS --commit (2026-07-10), documentando pra
# não repetir:
#   1ª rodada: D9PXV (MT41K256M16HA-125:E) quebrou o --commit com
#   UniqueViolation em part_number_norm — o banco já tinha uma VARIANTE DE
#   FORMATAÇÃO do mesmo PN normalizado (submit_known_parts.py só pula
#   duplicata em match EXATO da string; uma variante de formatação passa
#   direto pro INSERT e esbarra na constraint do banco). Removido.
#   2ª rodada: rodei uma query read-only (KnownPart.objects.filter(
#   part_number_norm__in=...)) pra checar os 51 restantes ANTES de tentar
#   de novo — achou mais 26 colisões: 25 são o PACOTE INTEIRO "TW" (die-rev
#   :P e :R, ex. MT41K256M16TW-107:P) já **approved/confirmed** no banco
#   com a MESMA string exata (entrou por outro canal — provavelmente
#   import_micron_catalog ou uma sessão anterior, fora da minha
#   visibilidade); a 26ª é outra variante de formatação (MT41K256M16LY-
#   107:N → banco tem "MT41K256M16LY107N"). Todas as 26 removidas.
# RESULTADO: pacotes RE/HA/LY (die-rev :D/:E/:N) NÃO estavam no banco — só
# esses entram aqui (24 + o alvo D9PZQ = 25). O pacote TW inteiro já estava
# coberto; incluí-lo de novo seria puro trabalho redundante.
#
# METODOLOGIA: capacidade de CADA entrada vem da mesma fórmula
# profundidade×largura (invariante pra família 256M16, 4Gb), já validada
# por fonte Tier-1 3x nesta família (D9SKC/D9SKG no lote D9SXC, D9TCS/D9TDS
# no lote D9TXS, D9PZQ via Octopart). Identidade (FBGA→PN) de cada entrada
# vem direto da API oficial da Micron, por fbga_code. TODAS as 25 abaixo
# foram confirmadas ausentes do banco via query read-only em 2026-07-10
# (não apenas ausentes do fuzzy_sugest./minhas submissões anteriores).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9pzq_family_2026-07-10.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/micron_d9pzq_family_2026-07-10.yaml --commit --user <seu_usuario>
#
