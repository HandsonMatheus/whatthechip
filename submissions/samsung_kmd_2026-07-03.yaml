# (busca em: 2026-07-03). Uso:
#   python manage.py submit_known_parts submissions/samsung_kmd_2026-07-03.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/samsung_kmd_2026-07-03.yaml --commit --user <seu_usuario>
brand: "Samsung"
known_parts:
