      (24Gb÷8=3GB). [2026-07-06: gramática corrigida em 04/07 — SAM_EMCP_RAM_KMD
      já mapeia X6=3GB corretamente. Este known_part era a correção antes do
      fix; hoje é só reforço/confirmação, mantido pela fonte Tier-2 direta.]

  - part_number: "KMDP6001DA"
    chip_type: "eMCP"
