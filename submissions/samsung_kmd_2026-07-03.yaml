    chip_type: "eMCP"
    subtype: "LPDDR4X"
    interface: ""
    emcp_nand: "eMMC 5.1 32GB"
    emcp_ram: "LPDDR4X 3GB"
    confidence: confirmed
    notes: >
      PN original buscado. Compartilha "KMDD6" (posições 0-4, as que a gramática
