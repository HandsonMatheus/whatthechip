      confirmado pelo próprio Octopart ("eMCP 32GB eMMC + LPDDR4 24Gb" = 24Gb÷8=3GB).
      Sufixo "BM" (posições 8-9) não achado isoladamente, mas não afeta a
      capacidade — mesma lógica de suffix não-decodificado do caso K3QF anterior.

  - part_number: "KMDD60018M"
    chip_type: "eMCP"
    subtype: "LPDDR4X"
