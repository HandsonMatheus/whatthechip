# Submissão de known_parts — Samsung, família K3QF (LPDDR3 alta-densidade),
# chave de capacidade '1' (pn[4]='1' = 1GB / 8Gb). PRIMEIRA cobertura desta
# chave: seed_known_parts.json tinha K3QF confirmado só pras chaves 2/3/4/5/7
# (2GB/2GB-rev/4GB/1.5GB/3GB) — a chave '1' (1GB) nunca teve known_part,
# apesar do tip da família já documentar ela extensamente.
#
# PN alvo (debug 2026-08-27): K3QF1F10DM (bancada digitou sem sufixo).
#
# ⚠ ACHADO IMPORTANTE — confusão Gb/GB em múltiplos distribuidores: vários
# sites (absunshine, prodisknetwork) rotulam K3QF1F10DM-AGCE como "8GB".
# Isso é o erro clássico de confundir densidade em Gb (gigabit) com
# capacidade em GB (gigabyte) — o documento oficial de validação da INTEL
# (lpddr3-1866-memory-down-validation-results.pdf, fonte Tier-1 de terceira
# parte, não Samsung mas tecnicamente rigorosa) descreve o irmão exato
# "K3QF1F10EM-AGCF" como "8Gb, 4Gb die, DDP, x64" — ou seja, 8Gb TOTAL
# (2×4Gb dies em DDP) = 1GB em bytes. Confirma exatamente o que o tip da
# família já dizia (pn[4]='1'=1GB). Reforçado por listagens Alibaba limpas
# e estruturadas (não prosa de marketing) pro mesmo PN base com outros
# sufixos: "K3QF1F10DM-BGCE LPDDR3 1GB 1600Mbps 216FBGA" e
# "K3QF1F10DM-BGCF LPDDR3 1GB 1866Mbps 216FBGA" — ambas dizem 1GB
# explicitamente. Suffix não muda capacidade (mesma lógica já estabelecida
# nesta família, ver submissions anteriores K3QF/KMD).
#
# ⚠ REPORTAR AO DONO: o debug mostrou profitable=RENTÁVEL pra este PN
# NÃO confirmado (pn_not_in_db=true), mas o tip da família diz "1GB
# (K3QF1...): sem liquidez B2B atual. Destino: resíduo" — deveria ser NÃO
# RENTÁVEL. Validado em sandbox: o mesmo resultado persiste mesmo DEPOIS
# de confirmar via known_part. Parece o mesmo padrão de limiar/threshold já
# visto no K4B1G1646E nesta sessão (chave de capacidade pequena cruzando um
# limiar genérico de "LPDDR3 mínimo" sem respeitar a exceção específica
# desta família/capacidade). Não investigado/corrigido — fora do escopo do
# chat de marca.
