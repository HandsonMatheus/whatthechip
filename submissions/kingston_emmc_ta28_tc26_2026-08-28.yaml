#   - EMMC32G-TC26: SÓ a capacidade que o dono tem o chip físico na mão (32G, igual ao PN do debug).
#     NÃO inventei EMMC64G-TC26/outras capacidades por analogia à TA28 — o dono autorizou tratar O
