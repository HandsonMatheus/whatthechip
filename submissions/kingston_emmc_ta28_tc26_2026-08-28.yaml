# régua já usada pras outras gerações desta família.
#
# ESCOPO DA SUBMISSÃO — só o que tem base real, sem inventar cluster:
#   - EMMC32G-TA28 + EMMC64G-TA28: as 2 capacidades achadas com fonte real (busquei 04G/08G/16G/
