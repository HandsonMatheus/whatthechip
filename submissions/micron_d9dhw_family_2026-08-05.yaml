# desta sessão. Confirmado diretamente pelo part-name da própria Micron:
# "SDRAM 256M X16 VFBGA", sub-category "obsolete-sdram". Cross-check via
# Octopart, mesmo PN/revisão ":D": "DRAM Chip SDRAM 256M-Bit 16Mx16 3.3V
# 54-Pin VFBGA T/R" — bate exato. Capacidade: 16M × 16bit = 256Mbit =
# 0,25Gb. "SDRAM" verificado como token canônico válido em
# chips/chip_types.py antes do uso (categoria "dram_legacy", vida="dead").
#
# Coleta máxima da família (regra vigente desde Z9DNC — só exclui quem
