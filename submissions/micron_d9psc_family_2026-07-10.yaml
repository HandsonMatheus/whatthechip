# (não identificado na bancada, fila de revisão — SearchLog 10/07/2026 14:32).
#
# fuzzy_sugest. do debug (D9PSF, D9PSH, D9PSK, D9PSL, D9PSN) IGNORADO por
# construção — já são KnownPart aprovado (ver memória
# wtc-fuzzy-sugest-ja-confirmado-nao-pesquisar).
#
# ACHADO: D9PSC → MT41K512M4DA-125:K, DDR3L. Identidade com confirmação
# FORTE: a própria API FBGA da Micron devolveu part-name preenchido —
# "DDR3 2G X4 FBGA" (raro; a maioria dos FBGA não tem esse campo) — bate
# EXATO com a conta pelo PN: 512M × 4bit = 2048Mb = 2Gb ("2G X4"). Forward-
# lookup no prefixo "MT41K512M4" achou 35 PNs/FBGAs (17 produção "D9*" + 18
# Engineering Sample "Z9*"), TODOS a mesma organização 512M4 = 2Gb —
# variam em pacote (THR/THV/HX/DA/EF), speed grade (-107/-125/-15E/-187E)
# e die-rev (:D/:F/:H/:J/:K/:M/:N). Entram aqui os 17 de produção (alvo +
# 16 irmãos), seguindo o mesmo padrão já validado nos lotes D9PZQ e D9SXD
# (densidade invariante por organização, fórmula já Tier-1-confirmada pro
# alvo, irmãos apoiados na mesma fórmula + identidade individual via API).
#
# ⚠ PENDENTE — ainda não rodei/recebi a query read-only de pré-checagem
