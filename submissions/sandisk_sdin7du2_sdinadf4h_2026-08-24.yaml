      Solutions-US-0217-02" (©2017), lido na íntegra via fetch direto do PDF hospedado em
      mouser.com (o link direto em sandisk.com não renderizou no fetch — mouser.com funcionou como
      espelho). Tabela "Ordering Information": produto "iNAND 7232", capacidade 16GB-128GB,
      interface e.MMC 5.1 HS400, SKU "SDINADF4-16G-L/H". Confirmado em mercado real (não só na
