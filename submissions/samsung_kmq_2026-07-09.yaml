#
# ⚠ CORREÇÃO — mesmo dia (2026-07-09): a primeira versão deste arquivo tinha
# emcp_ram="LPDDR3 1.5GB" pra estes PNs, baseado em fontes web (yoycart
# "1.5G+8G" + Preduo "8+12" + cruzamento com specs de aparelho J500F/J320).
# Ao checar dados JÁ EXISTENTES localmente (seed_known_parts.json, que tem
# known_parts de sessões anteriores), achei DUAS confirmações FÍSICAS
