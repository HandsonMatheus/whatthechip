# (yoycart/Preduo/Alibaba podem estar repetindo o mesmo erro original — o
# projeto já viu isso antes). SUBSTITUÍ 1.5GB por 1GB. Ver correção completa
# no addendum 2026-07-09 de INVESTIGACAO_sam_emcp_cap_X6_2026-07-03.md.
#
# Resultado: a chave 'N1' do SAM_EMCP_CAP (hoje [N1, 8GB, 1GB]) estava CERTA
