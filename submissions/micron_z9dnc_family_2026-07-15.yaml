# Submissão de known_parts — Micron, FBGA Z9DNC + família MT47H16M16 (2026-07-15)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA Z9DNC
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (Z8DNC, Z9SNC, Z9XNC, Z9ZNC, Z9SNG) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ACHADO: Z9DNC → MT47H16M16BG-3:B. Família MT47H (DDR2), mesma base de
# D9RZH/D9MTG/D9KJP/D9KSL — aqui organização "16M16" (256Mb, x16).
# Capacidade: 16M × 16bit = 256Mbit = 0,25Gb — confirmada via Octopart
# ("Ddr Dram, 16MX16, 0.45NS..." + "DDR2 SDRAM 256M-Bit 16Mx16 1.8V
# 84-Pin FBGA Tray", ambos o MESMO PN exato).
#
# *** MUDANÇA DE METODOLOGIA NESTA RODADA ***
# Até este PN, a sessão tratava TODO fbga_code com prefixo "Z9" como
# Engineering Sample e excluía em bloco (sem checar o texto do PN),
# baseado no padrão observado nas famílias MT47H64M8/MT47H128M8/etc.
# onde Z9 era majoritariamente amostra. Z9DNC quebrou essa suposição:
# Octopart confirma ESTE PN exato (MT47H16M16BG-3:B) como produção
# ativa/RoHS, sem qualquer marca de amostra — e o próprio texto do PN
# não tem "ES". Verificado no forward-lookup: Z9DNC (sem ES) está ao
# lado de Z9DNB "...3 ES:B" e Z9DND "...37E ES:B" (ambos COM ES) — ou
# seja, o pool "Z9" mistura produção e amostra, igual o pool "D9" já
# fazia. Dono decidiu (2026-07-15): daqui em diante, D9 e Z9 recebem o
# MESMO tratamento — só exclui quem tem "ES" no PRÓPRIO texto do PN
# (regex `(?:^| )ES(?:$|[ :])`), não mais por prefixo do fbga_code.
# Lotes anteriores desta sessão (D9RZH, D9MTG, D9PZM, D9MNT, D9NMW,
# D9KJP, D9KSL, D9PQL, JW738, NW814, JW999) NÃO foram revisitados —
# mudança vale só daqui pra frente, por decisão explícita do dono.
#
# Coleta máxima da família: forward-lookup no prefixo "MT47H16M16"
# (2026-07-15) achou 49 PNs (30 "D9*" + 19 "Z9*", SEM separar por
# prefixo desta vez). Aplicado SÓ o filtro "ES no próprio texto do PN"
# (checado programaticamente) — excluídos 20 (3 do bloco D9, 17 do
# bloco Z9). Restam 29 PNs de produção real (alvo + 28 irmãos), TODOS
# com a mesma organização "16M16" por construção do prefixo buscado
# (verificado programaticamente). Nenhum tem part-name direto da Micron
# (campo vazio em toda a leva) — todos apoiados na fórmula + confirmação
# Octopart do alvo, mesmo padrão do lote D9NMW.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente).
# Sem sobreposição com nenhuma submissão anterior (grep em
# submissions/*.yaml, zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_z9dnc_family_2026-07-15.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_z9dnc_family_2026-07-15.yaml --commit
#
