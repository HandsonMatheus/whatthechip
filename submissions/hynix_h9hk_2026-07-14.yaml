# completo por trás do fragmento desta rodada, atestado em 5 distribuidores independentes,
# nenhum overlap com o CRMMVBR-NEH já submetido.
#
# ⚠ EXPANDIDO (pedido explícito do dono: "colete mais da mesma família, não só 1" — a
# rodada original checou só o prefixo estreito "H9HKNNNCRM" e achou o cluster já saturado, mas
# não olhou a FAMÍLIA inteira). Ampliei a varredura via catálogo próprio da OMO Electronic
# pros prefixos mais largos "H9HKNNN8" (que a busca da OMO redirecionou pro geral "H9HKNNN",
# 50 PNs indexados) e "H9HKNNNB" (11 PNs). Cruzando contra os 8 known_parts já submetidos
# (2026-07-09 + 2026-07-10 + este arquivo), os códigos MAIS FINOS da família eram B=2GB e
# D=3GB — só 1 confirmação CADA antes desta expansão (contra 7 do código C). Adicionei 5 PNs
# novos, priorizando mid-fills genuinamente distintos (não só variação de sufixo de grade do
# mesmo PN já confirmado): 2 pro código B, 2 pro código D, 1 reforço pro código E (já tinha 2,
# agora 3). 2 das 5 fontes têm campo ESTRUTURADO de densidade batendo exato (não só presença
# em massa de distribuidor):
#   - H9HKNNNBTUMUAR-NLH: WinSource "LPDDR4-3200 (16Gb)" — 16Gb÷8=2GB, bate com 'B'.
#   - H9HKNNNDGUMUAR-NLH: WinSource "LPDDR4-3200 (24Gb)" — 24Gb÷8=3GB, bate com 'D'.
# Os outros 3 (BRMMUUR-NEH, DBUMUBR-NMH, EBMMUER-NMH) não tinham campo estruturado de
# densidade próprio, mas têm 8-12 distribuidores independentes cada, manufacturer HYNIX/
# SKHYNIX/"HY" (abreviação, não fabricante diferente) consistente — capacidade inferida do
# código pn[7] já mapeado e confirmado por múltiplas outras fontes na família.
#
# ⚠ Mesmo padrão de mislabel de fabricante já visto nesta sessão: Allchip Electronic e
# SILITECH rotularam H9HKNNNDGUMUAR-NLH como "SAMSUNG" — 8 outras fontes convergem em SK
# Hynix/SKHYNIX/Hynix, não usado como fonte.
#
# Também observado (NÃO incluído, fonte única): "H9HKNNNCRMMUER-NMN" (sufixo "-NMN" em vez de
# "-NMH") aparece só na Conevo, sem 2ª fonte — mesmo padrão de sufixo de grade já visto na
# família (NLH/NMH), mas sem corroboração suficiente pra submeter agora.
#
# ⚠ 2ª RODADA (novo PN buscado na bancada, mesma família, 2026-07-14): H9HKNNNCRMMUDRNMH —
# desta vez o PN veio COMPLETO (18 caracteres, não é fragmento truncado como os anteriores).
