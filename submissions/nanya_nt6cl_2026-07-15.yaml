    chip_type: "LPDDR3"
    subtype: "LPDDR3"
    capacity: "1GB"
    interface: "x32"
    confidence: confirmed
    source_url: "https://www.alldatasheet.com/datasheet-pdf/pdf/1145669/NANYA/NT6CL256M32AM.html"
    notes: >
      PN EXATO do debug ao vivo do estoque (15/07/2026 16:27) -- forma base, sem sufixo de
      grade/pacote, indexada como entrada de catalogo propria no Alldatasheet (mesmo padrao
      ja visto em NT5CB64M16FP). Familia NT6CL = LPDDR3 mobile Nanya, empilhamento SDP/DDP/QDP
      (nao existia no yaml antes desta submissao -- ChipFamily nova adicionada, ver nanya.yaml
      `reasoning`). Confirmado via tabela "Ordering Information" do datasheet oficial (pagina 2
      de 159, NT6CL256M32AM-H1 v1.6, 02/2019), aberta diretamente:
      "8Gb (SDP) 256M x 32 -> NT6CL256M32AQ-H11 / NT6CL256M32AM-H01 / NT6CL256M32AM-H1".
      A letra "M" logo apos a profundidade indica SDP (1 die) -- ver nota de metodo no dossie.
      Aritmetica: 256M x 32bit = 8192Mbit = 8Gb (densidade do die) / 8 = 1GB (capacidade do
      pacote -- convencao "LPDDR avulso" do CLAUDE.md §6 usa `capacity` em GB, nao
      `density_gbit`, campo que e so pra DDR/GDDR/SDRAM discreta).

