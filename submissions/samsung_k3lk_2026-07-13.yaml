# Gb) | DRAM | Samsung Semiconductor Global" — Tier-1, mesma capacidade
# 48Gbit=6GB). confidence=confirmed (fonte Tier-1 direta).
#
# Busquei também K3LK2K20CM-JUCP (paralelo ao 4K40CM-JUCP já confirmado
# localmente) — NENHUMA fonte dedicada encontrada (só menção genérica
