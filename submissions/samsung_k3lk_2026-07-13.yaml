# sem evidência não invento.
#
# --- RODADA 2 (mesmo dia): usuário pediu para sempre tentar o máximo ---
# Varredura sistemática: pra CADA base já confirmada localmente (BK, 2K,
# 3K, 4K [BM e CM], 6K, 7K, CK, DK), busquei TODOS os sufixos direto no
# site oficial Samsung (semiconductor.samsung.com) pra achar variantes
# que nem seed nem os 2 CSVs PSG ainda tinham. Confirmei 2 sufixos
# GENUINAMENTE NOVOS (Tier-1, título indexado já mostra a capacidade):
#
# - K3LK4K40BMCGCN: base 4K40BM já tinha só o sufixo BGCN local; CGCN é
#   um 2º sufixo real da mesma base, "(96 Gb)" = 12GB, bate com 4K=12GB.
# - K3LK7K70BMJHCP: base 7K70BM já tinha 3 sufixos locais (BGCP/JGCP/
#   JUCP); JHCP é um 4º sufixo real, "(64 Gb)" = 8GB, bate com 7K=8GB.
#
# Todas as outras combinações batidas na varredura (BKB0BM-MGCP,
# 2K20BM-BGCN, 3K30EM-BGCN/CGCN, 4K40CM-BGCP/JFCP/JHCP/JUCP,
# 6K60BM-BGCP/JGCP, CKC0BM-MFCP/MGCP/MUCP, DKD0CM-BGCP) JÁ estavam no
# seed ou nos CSVs — não duplicadas aqui.
