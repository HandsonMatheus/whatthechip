# Submissão de known_parts — Micron, FBGA D9LGQ + família MT41J128M16 (2026-07-10)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9LGQ
# (não identificado na bancada, fila de revisão — SearchLog 10/07/2026 15:24).
#
# fuzzy_sugest. do debug (D9LGW, D9LGX, D9LGZ, D9SGQ, D9VGQ) IGNORADO por
# construção — já são KnownPart aprovado (D9LGW/D9LGX/D9LGZ, aliás, são do
# lote D9PSC/MT41K512M4 já commitado — puro acaso visual, família
# diferente).
#
# ⚠ ACHADO: D9LGQ → MT41J128M16HA-15E:D. Prefixo MT41J — DIFERENTE do
# MT41K que apareceu em todos os lotes anteriores (D9PZQ/D9TXS/D9PSC).
# MT41J = DDR3 PADRÃO (1,5V) — MT41K = DDR3L (1,35V, baixa tensão).
# Confirmado via Octopart (campo estruturado "Memory Type: DDR3 SDRAM,
# RAM" + "Nominal Supply Voltage (DC): 1.5 V" + "Max Supply Voltage:
# 1.575V" — tensão de DDR3 padrão, não DDR3L) e reforçado por 3 PNs
# irmãos com part-name direto da própria Micron ("DDR3 2G X16 FBGA",
# sem "L"). chip_type="DDR3" (não "DDR3L") nesta submissão — primeira
# vez que este prefixo aparece nesta conversa, atenção pra não repetir
# o padrão DDR3L por hábito.
#
# Capacidade: 128M × 16bit = 2048Mb = 2Gb — bate exato com o campo
# estruturado "Density: 2 Gb" do Octopart.
#
# Forward-lookup no prefixo "MT41J128M16" (2026-07-10) achou 31 PNs (20
# produção "D9*" + 11 Engineering Sample "Z9*"), TODOS a mesma
# organização 128M16 = 2Gb — variam em pacote (HA/JT), speed grade
# (-107/-125/-15E/-187E/-093), temperatura (IT/AIT/AAT/XIT/P) e sufixo
# de revisão (G/D). Entram aqui os 20 de produção (alvo + 19 irmãos).
# 3 deles (D9PRS/D9PRW/D9PSL) têm part-name Micron direto confirmando
# "DDR3 2G X16" — reforça a convenção pra família toda.
#
# ⚠ PENDENTE — ainda não rodei/recebi a query read-only de pré-checagem
# (ver memória wtc-precheck-part-number-norm-antes-de-bulk) pra estes 20
# PNs. Ver comando no chat.
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9lgq_family_2026-07-10.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/micron_d9lgq_family_2026-07-10.yaml --commit --user <seu_usuario>
#
