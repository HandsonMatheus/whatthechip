      a capacidade dela como fonte). Capacidade real pela fórmula confirmada: 512M×32bit÷8 = 2048MB =
      2GB (= 16Gb, bate com o rótulo "512Mx32" que TODAS as fontes concordam). chip_type=LPDDR4X por
