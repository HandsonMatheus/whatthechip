      "DL" trocadas — deveria ser "LD" (LPDDR, confirmado pelo decode oficial da família); (b) posição
      7 "4" — no decode oficial essa posição é CS-count e só aceita "1" ou "2" ("4" é valor inválido,
      reforça leitura errada de "1"). Corrigindo os 2 chars: "NCDLXC4MJ512M32" → "NCLDXC1MJ512M32",
      que EXISTE e é multiplamente confirmado (netComponents: 9 line items/8 fornecedores/3 países,
      27.922 unidades em estoque agregado; Arrow.com: página de produto Shenzhen Longsys Electronics;
