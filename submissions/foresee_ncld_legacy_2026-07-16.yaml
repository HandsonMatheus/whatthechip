# Submissão known_parts — Foresee (Longsys), família LEGADA "NCLD" de LPDDR4/LPDDR4X standalone
# (2026-07-16). Origem: PN buscado na bancada "NCDLXC4MJ512M32" (debug estoque, known=false,
# in_review_queue=true, 0 fuzzy_suggestions) — NÃO existe como string em nenhuma fonte. Investigado
# como possível erro de transcrição do operador (ver nota do 1º known_part abaixo). Pedido do dono:
# coletar o PN + TODAS as variantes do cluster, não só 1.
#
# ⚠ ESTRUTURA DECIFRADA (Tier-1, datasheet oficial Longsys "NCLD4CXMAXXXM32" Rev B2 2017, die Micron):
#   NC (Longsys) + LD+{geração, ex. "4"=LPDDR4} + C (pacote 200-ball) + {CS: "1"=1CS ou "2"=2CS} +
#   {2 chars = código do die/fornecedor, ex. "MA"=die Micron} + {profundidade}M{largura} (capacidade).
#   Capacidade = profundidade × largura ÷ 8 = bits totais — CONFIRMADO literalmente na tabela do
#   datasheet p/ 4 PNs (256M32=8Gb, 512M32=16Gb, 768M32=24Gb, 1024M32=32Gb) E no catálogo oficial
#   (NCLDXC1MG256M32=8Gb). Fórmula validada contra 5 âncoras Tier-1 antes de aplicar aos irmãos.
# ⚠ DUAS SUB-FAMÍLIAS, tipo DIFERENTE (não confundir):
#   "NCLD4C..." (die Micron, datasheet SEM opção 0.6V) = LPDDR4 PADRÃO (não-X).
#   "NCLDXC..." (catálogo oficial LISTA com opção 0.6V, seção "LPDDR4x") = LPDDR4X.
#   Aplico "LPDDR4X" aos irmãos NCLDXC* não vistos em datasheet próprio, por consistência de
#   subfamília com o único confirmado (NCLDXC1MG256M32) — mesma disciplina do eMCP3→LPDDR3 (FEPN).
# ⚠ GAP "NCLD3B" RESOLVIDO (16/07/2026, PN buscado na bancada foi exatamente "NCLD3B2256M32" —
#   debug estoque, known=false, in_review_queue=true). Era LPDDR3, não ambiguidade 4/4X: achei o
#   datasheet oficial "D-00151 FORESEE - LPDDR3 - NCLD3B1256M32 - 178ball - 11x11.5 - 1333Mbps - SPEC"
#   (mirror Scribd) + a página oficial longsys.com/products/embedded-storage/embedded-storage/lpddr.html
#   confirma a linha "FORESEE LPDDR3" existe (667/800MHz). Estrutura: mesmo esqueleto NC+LD+<geração
#   ex.'3'>+<pacote ex.'B'>+<CS 1/2>[+2 chars vendor opcional]+<profundidade>M<largura> — "B"=pacote
#   178-ball (LPDDR3), diferente de "C"=200-ball (LPDDR4/4X das 2 subfamílias já confirmadas acima).
#   Sem o código de vendor de 2 chars a maioria das vezes (ex. NCLD3B2256M32), mas existem variantes
#   COM vendor (NCLD3B1M7256M32, NCLD3B1M5128M32, NCLD3B2M7512M32 — vistas no netComponents, mesma
#   capacidade das "limpas" equivalentes, não submetidas agora — lote extra se pedido). Submeti as 4
#   PNs "limpas" abaixo (1256/2256/1128/2512, cobrindo 0.5/1/1/2GB — sim, 1256 e 2256 dão a MESMA
#   capacidade 1GB com CS diferente, como já visto no par NCLD4C1MA256M32/NCLDXC1MG256M32).
# ⚠ netComponents cross-validou a PRÓPRIA CONFIABILIDADE: os totais de estoque pra NCLDXC1MJ512M32
#   (27.922un) e NCLDXC1MC512M32 (27.150un) que citei acima bateram EXATOS com uma nova consulta feita
#   agora — mesma fonte, mesmo dado, 2 buscas independentes no tempo.
# ⚠ CATCH de alucinação (3ª vez nesta sessão): resumo de busca automático alegou que a página HQonline
#   de NCLD3B2512M32 dizia "2GiB LPDDR3 533MHz, 16Gb, 512Mx32" — abri a página eu mesmo: os campos
#   estruturados reais são de OUTRO tipo de componente (SOIC-16, isolador, "Number Of Channels: 2"),
#   claramente um artefato de template da HQonline, "Description" vazio. Descartei a alegação; a
#   capacidade de NCLD3B2512M32 abaixo vem SÓ da fórmula validada (não de fonte lida diretamente).
# ⚠ NÃO propus ChipFamily nova (Trilha A) apesar da estrutura decifrada, agora com 3 subfamílias
#   confirmadas (4C/XC/3B) — é decisão arquitetural do dono (mais poderosa/arriscada que known_part
#   avulso); o plano pré-existente no FORESEE.md já dizia "avulso se aparecer". Sinalizo a possibilidade
#   no chat, não decido sozinho — com 3 pontos de dado o caso pra uma ChipFamily de verdade fica mais
#   forte, mas continua sendo call do dono.
#
# Rodar (o DONO): submit_known_parts submissions/foresee_ncld_legacy_2026-07-16.yaml            # dry-run = portão
#                 submit_known_parts submissions/foresee_ncld_legacy_2026-07-16.yaml --commit    # grava (submitted) → aprovar
