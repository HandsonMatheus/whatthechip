# confiança, resultado colado no chat, verificado abaixo.
#
# ACHADO: D9LJJ → MT41K256M8HX-15E:D. Família MT41K = DDR3L (1,35V) —
# distinta de MT41J=DDR3 padrão (1,5V), já separadas nos lotes D9MNV/D9RVX
# desta sessão. Bloco "256M8" = 256 Meg × 8 (x8) — fórmula JEDEC oficial:
# 256.000.000 × 8 = 2.048.000.000 bits = 2.048 Mbit = 2Gb.
#
# Cross-check Tier-1 do ALVO: DigiKey lista o PN exato "MT41K256M8HX-15E:D"
# como "2Gbit capacity" — bate exato com a conta. Além disso, 7 SIBLINGS
# desta mesma família vieram com part-name PREENCHIDO pela própria API
# Micron: "DDR3 2G X8 FBGA" — "2G X8" bate exato com a fórmula (256M×8=2Gb)
# e confirma a extensão pra TODA a família (mesmo bloco "256M8" em todos).
# Três fontes independentes concordando: fórmula JEDEC + DigiKey (alvo) +
# part-name oficial Micron (7 siblings da mesma família).
# https://www.digikey.com/en/products/detail/micron-technology-inc/MT41K256M8HX-15E-D/2663636
#
# Forward-lookup no prefixo "MT41K256M8" (2026-08-20) devolveu 60 PNs.
# Filtro ES (D9+Z9 combinados no texto do PN): dos 20 fbga_code "Z9", TODOS
# têm "ES" literal no part-number — EXCLUÍDOS por completo (diferente do
# lote D9LGD, aqui nenhum Z9 sobrevive). Restam os 40 "D9" — nenhum tem "ES"
# no texto, todos incluídos.
#
# Dos 40, 7 têm part-name direto da API ("DDR3 2G X8 FBGA", sub-category
# ddr3-sdram ou obsolete-ddr3-sdram) — confirmação forte. Os outros 33 são
# extensão por fórmula (mesmo bloco "256M8" em todo PN da lista, capacidade
