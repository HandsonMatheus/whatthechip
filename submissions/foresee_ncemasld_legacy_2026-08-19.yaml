# Submissão known_parts — Foresee (Longsys), família LEGADA "NCEMASLD" de eMMC industrial
# (2026-08-19). Origem: PN buscado na bancada "NCEMASLD32G" (debug estoque, known=false,
# in_review_queue=true, 0 fuzzy_suggestions) — sem hífen na busca, mas o PN real/catalogado é
# "NCEMASLD-32G" (confirmado em MÚLTIPLAS fontes, ver abaixo). Pedido padrão do dono desde as
# rodadas anteriores: coletar o PN + toda a família/variantes, nunca só 1.
#
# ⚠ ESTRUTURA — mesma "raiz legada NC" já decifrada em NCLD (submissão foresee_ncld_legacy_*):
#   "NC" (raiz Longsys legada) + código de TIPO de 2 chars ("LD"=LPDDR já visto; aqui "EM"=eMMC,
#   espelhando o par pn[1:3] "EM"=eMMC já documentado pro prefixo MODERNO "FE_" em FORESEE.md §2) +
#   código de vendor/produto de 4 chars ("ASLD") + capacidade (literal GB, mesma convenção eMMC de
#   sempre) + hífen opcional. Ou seja: a raiz "NC" tem um esquema GERAL — "NC"+<tipo 2ch>+<produto>+
#   <capacidade> — que vale tanto pra LPDDR (NCLD) quanto pra eMMC (NCEM). Insight novo, útil pra
#   prever prefixos futuros na bancada (ex. "NCUF..." seria UFS, por analogia).
# ⚠ FONTE-OURO pro 32G: Test Report OFICIAL da própria Longsys (papel timbrado "Longsys
#   Confidential", hospedado pela Radxa como documentação de qualificação do Rock Pi) — abri o PDF
#   e confirma "Brand: FORESEE / Model: NCEMASLD-32G / Capacidade: 29600 MByte / Dimensões:
#   11.5x13x1.0mm / JEDEC v5.1 / Density 32GB, NAND 256Gb". É a fonte mais forte já vista nesta
#   marca — teste de qualificação real, não datasheet comercial nem distribuidor.
# ⚠ 64G e 128G seguem o MESMO die de 256Gb (2 e 4 dies respectivamente — 256Gb×2=64GB,
#   256Gb×4=128GB, aritmética batendo exato com o dígito do PN), com código de datasheet próprio
#   na LCSC/JLCPCB (C719491/C719493) + distribuidores reais com estoque — mas sem um documento
#   próprio aberto (só o 32G teve o test report lido na íntegra). Capacidade pela convenção literal
#   já validada sem exceção em 9+ irmãos eMMC desta marca.
# ⚠ HIPÓTESE DE LINHAGEM (não bloqueia a submissão, é só contexto histórico): "ASLD" é o MESMO
#   sufixo que aparece em "FSEIASLD-32G/64G/128G" (já documentado em FORESEE.md como equivalente
#   legado de FEMDRM032G/064G/0128G). "NCEMASLD" pode ser um estágio AINDA MAIS ANTIGO do mesmo
#   produto físico (Longsys pré-marca-Foresee → FSEIASLD → FEMDRM atual), dado o mesmo sufixo +
#   mesmas 3 capacidades + mesmo pacote FBGA-153 + mesma linha industrial. Não afeta a classificação
#   (chip_type/capacidade já bem confirmados por conta própria), só registrado como nota histórica.
# ⚠ CLUSTER MAIOR NÃO PERSEGUIDO AGORA: o agregador DigiPart revelou uma família bem maior de
#   irmãos "NCEM*" com códigos de produto DIFERENTES (não "ASLD"): NCEMAD9D-16G, NCEMAHBD-08G,
#   NCEMASKG-16G, NCEMAD6B-32G/16G, NCEMAD7B-08G, NCEMAM59-08G, NCEMAH59-16G, NCEFEH58-16G,
#   NCEMASD9-16G. Mesma raiz "NC"+"EM", códigos de vendor/produto diferentes, capacidades 8/16/32GB.
#   NÃO submetidos agora (fora do escopo do PN buscado, "ASLD" já cobre o que foi pedido) — lote
#   extra grande se o dono quiser essa família inteira.
#
# Rodar (o DONO): submit_known_parts submissions/foresee_ncemasld_legacy_2026-08-19.yaml            # dry-run = portão
#                 submit_known_parts submissions/foresee_ncemasld_legacy_2026-08-19.yaml --commit    # grava (submitted) → aprovar
