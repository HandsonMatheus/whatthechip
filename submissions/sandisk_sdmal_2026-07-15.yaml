# Submissão known_parts — SanDisk, PN isolado SDMALBB2-016G (NAND Apple-proprietária)
# Origem: leitura de bancada "SDMALBB2C16G" (debug do estoque, 15/07/2026), família não reconhecida.
# Ver INVESTIGACAO_sandisk_sdmal_2026-07-15.md para a análise completa — inclusive por que NÃO é a
# família "SDMAG" já cadastrada (fantasma, zero evidência real) e a ambiguidade de leitura entre
# 3 candidatos visualmente parecidos (SDMALBB2 escolhido por ser o mais corroborado).
#
# 1 PN confidence=distributor — decisão explícita do dono 2026-07-15 ("aplicar essas specs pra
# SDMAL em tier mais baixo, já que ele é antigo mesmo"). Sem datasheet Tier-1 possível (peça
# Apple-proprietária, nunca documentada publicamente pela SanDisk).
#
# ⚠ chip_type="NAND Flash" (não eMMC) → profit_family="dead" em chips/chip_types.py: este PN fica
# AUTOMATICAMENTE NÃO RENTÁVEL, independente da capacidade. Decisão técnica minha (não foi
# perguntada explicitamente ao dono) — ver §4 da investigação. Reversível facilmente no admin se
# não for a intenção.
