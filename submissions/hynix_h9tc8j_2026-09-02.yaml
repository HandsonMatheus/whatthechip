# Submissão de known_parts — SK Hynix, família H9TC (LPDDR2 standalone, PREFIXO NOVO,
# 2026-09-02). Gerado a partir do debug de bancada H9TCNNN8JDMM. Prefixo nunca visto no
# yaml — família adicionada nesta mesma entrega (Trilha A, ver chips/knowledge/hynix.yaml),
# irmã do H9TK já mapeado (mesma estrutura, mesmo mapa HYX_LPDDR2_CAP).
#
# IDENTIDADE: H9TCNNN8JDMM (12 chars, forma BARE = leitura direta da bancada) é fragmento/
# raiz do PN completo H9TCNNN8JDMMPR-NGM (e variantes de sufixo -NDM, sem dash "PR"),
# atestado em 5+ distribuidores via DigiPart (YST Electronic, Anyway Electronics 30000un,
# Conevo Electronics, Sunether, Dechoele — DC:13-25+, mercado maduro/estabelecido).
#
# CAPACIDADE: confirmada por 2 fontes ESTRUTURADAS independentes, fetch direto (não
# resumo de busca):
#   Win-Source (página de produto): "LPDDR2 256Mx32 1066MHz (8Gb)"
#   OMO Electronic (página de produto): "DRAM Chip LPDDR2 SDRAM 8G-Bit 256Mx32 1.2V/1.8V
#     134-Pin F-BGA"
# As duas concordam exatamente: arquitetura 256M×32, densidade 8Gb, pacote 134-FBGA.
# ARITMÉTICA: 8Gb (die) ÷ 8 = 1GB. Bate com pn[7]='8'→1GB no mapa HYX_LPDDR2_CAP (mesmo
# mapa já usado pelo H9TK — reconfirma que os dois prefixos compartilham o codebook).
#
# CLUSTER pesquisado mas NÃO incluído nesta submissão (existência confirmada em múltiplos
# distribuidores DigiPart, mas SEM fonte estruturada própria de capacidade — "excluir, não
# adivinhar"; todos decodificam corretamente via gramática mesmo sem known_part):
#   H9TCNNNBLDMMPR-NGM (código B, mapa prevê 2GB) · H9TCNNN4KDBMUR-NGM e
#   H9TCNNN4KDCMUR-NDMR (código 4, mapa prevê 512MB) · H9TCNNN8LDMMPR-NDM/-NYM e
#   H9TCNNN4GDMLCR-NGMR (posição 8 = L/G em vez de J — fora do que decode_cap_pos lê,
#   significado não confirmado, não afeta a capacidade decodificada).
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h9tc8j_2026-09-02.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h9tc8j_2026-09-02.yaml --commit
#
