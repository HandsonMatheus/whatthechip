# Submissão de known_parts — Micron, FBGA D9HSS + família MT46H64M16LF (2026-09-02)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9HSS
# (não identificado na bancada, fila de revisão).
#
# ACHADO: D9HSS -> MT46H64M16LFCK-6 IT:A. Micron "Mobile DDR" / "Mobile
# LPDDR" -- JEDEC "LPDDR" original (primeira geracao, sem numero -- hoje
# chamada retroativamente de LPDDR1, antecessora da LPDDR2). Organizacao
# "64M16" = 64Meg x 16bit = 1024Mb / 1024 = 1Gb; 1Gb / 8bit = 0.125GB =
# 128MB. Interface x16.
#
# FONTES (2 independentes, convergentes):
# (1) Datasheet oficial Micron (1gb_ddr_mobile_sdram_t68m.pdf, Mouser) --
#     titulo "Mobile Low-Power DDR SDRAM", capa "MT46H64M16LF -- 16 Meg x
#     16 x 4 banks"; Figura 1 "1Gb Mobile LPDDR Part Numbering": "46 =
#     Mobile LPDDR" (produto), "64M16" = Configuration, "LF" = Addressing
#     JEDEC-standard, package/temp/speed/revisao SEPARADOS (ortogonais a
#     densidade -- mesmo padrao ja visto nos datasheets LPDDR2 e MCP desta
#     sessao).
# (2) Octopart, PN exato do alvo: "DRAM Chip Mobile LPDDR SDRAM 1G-Bit
#     64Mx16 1.8V 60-Pin VFBGA" -- bate exato.
# (3) A propria API FBGA da Micron devolveu part-name direto pra 8 dos 23
#     PNs desta leva (incl. o alvo): "MOBILE DDR 1G X16 VFBGA", IDENTICO
#     em TODOS -- span os dois grupos de pacote (CK e BF) e varios sufixos
#     (plain, "L", "AIT", "AAT") -- confirma que os sufixos nao mudam
#     densidade/tipo, so atributo de producao (temp/power/lead-free etc.).
#
# ⚠ EXCLUIDO por CAUTELA -- variante "LGCK" (addressing "LG", nao "LF"):
# 3 PNs de producao (D9HRL, D9HRN, D9HRQ) tem a MESMA organizacao "64M16"
# mas endereçamento DIFERENTE ("LG" em vez de "LF"). O datasheet oficial
# encontrado SO documenta "LF = JEDEC-standard" -- nao define "LG"
# especificamente, e NENHUM dos 3 PNs "LGCK" veio com part-name preenchido
# na API (diferente dos 8 confirmados acima). Sem confirmacao direta de
# que "LG" e eletricamente equivalente, optei por NAO estender -- fica de
# fora desta leva, sinalizado pro dono decidir se vale pesquisa dedicada.
#
# ES: 9 excluidos (padrao "ES" com espaco, regex padrao pegou) -- 3 LGCK
# (Z9HRM, Z9HRP, Z9HRR) + 4 LFCK (Z9HSR, Z9HST, Z9HSV, Z9HSZ) + 2 LFBF
# (Z9LRC, Z9LRF).
#
# Sobraram 23 PNs de producao (15 "LFCK" + 8 "LFBF"), todos com a MESMA
# chave "64M16LF" = LPDDR1, x16, 128MB -- package (CK=60-ball VFBGA vs
# BF=60-ball VFBGA, revisoes de pacote diferentes mas mesma forma fisica
# per Octopart) e demais sufixos nao rastreados neste schema.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisao de
# part_number_norm dentro da propria lista (checado programaticamente).
# Sem sobreposicao com nenhuma submissao anterior (grep em submissions/*.yaml,
# zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9hss_family_2026-09-02.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9hss_family_2026-09-02.yaml --commit --fill-empty
#
