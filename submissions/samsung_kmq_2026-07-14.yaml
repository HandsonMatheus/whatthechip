# Submissão de known_parts — Samsung, família KMQ (eMCP LPDDR3 + eMMC 5.1, maior volume
# na esteira ~2015-2019). PN alvo: KMQ4Z0013M (busca 2026-07-14). Grammar já decodifica certo
# (SAM_EMCP_CAP['4Z']=32GB+2GB, mapa LEGADO compartilhado, ainda sem SAM_EMCP_CAP_KMQ dedicado).
#
# Checagem de bug X6-style: local já tinha 7 known_parts KMQ confirmados (310006A/B, 310013M,
# 7X000SA, 820013M, D60013M, N10006B). Cruzei TODOS contra o mapa legado SAM_EMCP_CAP + pesquisei
# mais 9 chaves via Preduo/Samsung Global/distribuidores nesta rodada (4Z, 72, 31[novo sufixo],
# NW, 8X, E1, E6[2 sufixos], X6). RESULTADO: o mapa legado bate com a realidade confirmada da KMQ
# em TODAS as chaves testadas (11 de 11) — diferente de outras famílias (KM4/KMD/KMI/KMR) que já
# precisaram de mapa dedicado. NÃO criei SAM_EMCP_CAP_KMQ nesta rodada — sem evidência de bug.
#
# ⚠ ACHADO — discrepância KMQD60013M (NÃO ALTEREI o known_part existente): local tem
# confidence=confirmed via LEITURA FÍSICA na esteira eMiner (2026-05-13, "chip físico confirmado")
# = 32GB+3GB. Preduo (KMQD60013M-B318, ficha própria) diz "32+16" = 32GB+2GB. Mantive o valor
# físico (evidência mais forte que uma listagem de distribuidor) — sinalizando a divergência pro
# dono, sem tocar no registro já confirmado. Pode ser variante de die diferente sob o mesmo PN.
#
# Chave '31' segue com MÚLTIPLOS valores dentro da família (padrão já visto em KMR — ver memória
# wtc-mesma-chave-densidade-diferente-dentro-familia): 013B=1GB (físico, já local) e agora
# 000SM=1GB (Preduo, bate o default do mapa) são MAIORIA; 006A/006B=1.5GB (fabricante, já local)
# e 013M=2GB (Alibaba, já local) são exceções já registradas individualmente. Nada novo a fazer
# aqui — só documentando que o padrão se mantém consistente.
#
