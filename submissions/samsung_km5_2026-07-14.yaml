# Submissão de known_parts — Samsung, família KM5 (uMCP LPDDR4X + UFS, PREMIUM). PN alvo:
# KM5V7001DM (busca 2026-07-14). Chave 'V7001' (pn[3:8], decode_cap_len=5) estava SEM MAPA
# ("cap. não mapeada" → INDETERMINADO) — corrigido: adicionei V7001 + P8001 + P9001 ao
# SAM_EMCP_CAP_KM5 (chips/knowledge/samsung.yaml), todas 4GB, fontes abaixo.
#
# ⚠ DISCIPLINA DESTA FAMÍLIA (já documentada no tip do engine): só códigos Tier-1 confirmados
# pelo dono (Octopart/Samsung) — Preduo já provado NÃO confiável aqui (dava V8001=6GB, real
# 4GB). Nenhuma fonte usada nesta submissão é Preduo; usei Samsung Semiconductor
# (USA/Global, domínio oficial), NX Electronics, Win Source, Lisleapex, Puris, Avaq — todas
# fichas DEDICADAS de um único PN (não títulos concatenados de múltiplos PNs).
#
# KM5V7001DM (alvo): NX Electronics (ficha dedicada, "uMCP 128GB UFS2.1+ 32Gb LPDDR4X-3733")
# + Win Source + título indexado Samsung Semiconductor Global. 32Gb÷8=4GB. Mesmo padrão "001"
# =4GB já visto em L9001/V8001/C7001 (todos já no mapa).
#
# Bônus (3 PNs já pesquisados numa sessão anterior via Samsung Global — data/psg/
# samsung_global_umcp_lpddr4x.csv, confirmed/enriched — MAS nunca submetidos como known_parts;
# reverifiquei os 2 que também entraram na gramática nesta rodada):
#   - KM5C7001DM: já era âncora do mapa (64GB+4GB).
#   - KM5V8001DM: já era âncora do mapa (128GB+4GB) — reverificado via Samsung Semiconductor
