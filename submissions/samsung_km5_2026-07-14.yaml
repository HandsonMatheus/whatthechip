#     usei Puris como fonte de densidade por causa do histórico de bug desta família; mantive
#     o valor já-âncora 4GB, sourced em Octopart/Samsung Global originalmente).
#   - KM5P8001DM: NOVO no mapa nesta rodada. Samsung Semiconductor USA (domínio oficial!) +
#     Lisleapex + Puris + Avaq + Ovaga, todas "64GB UFS2.1+32Gb LPDDR4X"=4GB.
#   - KM5P9001DM: NOVO no mapa nesta rodada. Samsung Semiconductor Global (domínio oficial!) +
#     Fusion + NX Electronics + Edal Tech, todas "64GB+32Gb LPDDR4X"=4GB.
#
# ⚠ KM5H7001DM PESQUISADO MAS NÃO INCLUÍDO: pesquisa local prévia dizia 64GB+4GB(32Gb), mas
# uma fonte nova encontrada nesta rodada sugeriu 24Gb(3GB) — conflito não resolvido (não achei
