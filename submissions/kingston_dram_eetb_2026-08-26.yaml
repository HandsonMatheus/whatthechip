# Submissão known_parts — Kingston, DRAM discreta embarcada (§0.2 regra 9), família legada "EETB"
# Chat de marca Kingston, 2026-08-26. Disparado pelo PN físico do debug de estoque `D5128EETBPGGBU`
# (known:false, TUDO vazio — nem fallback genérico bateu, igual ao padrão MCAB/EC4B/KE4/FH32B08UCT1).
#
# DIAGNÓSTICO: mesmo padrão JÁ CONFIRMADO 2× antes (MCAB 17/08, EC4B 19/08) — 3º caso agora.
# O flyer DDR3/3L oficial vigente (media.kingston.com/pdfs/emmc/MKF_585_DDR3_3L_US.pdf, também
# espelhado em MKF_944_dram_flyer_us.pdf, já usado no batch1) lista a família "ECMD" no MESMO código
# de densidade/organização "5128" (D5128ECMDPGJD — 4Gb, 512Mx8, DDR3L 1.35V, 1866Mbps, FBGA-78 — JÁ
# no known_parts desde a submissão inicial de 17/08, confirmado por grep no arquivo antes de escrever
# este). "EETB" não aparece em nenhum flyer atual — mesma assinatura de família legada.
#
# CONFIRMAÇÃO (Octopart + electronicsdatasheets + harddiskdirect, cross-referenciados, 2026-08-26):
#   D5128EETBPGGBU: 4Gb (512Mx8), DDR3/3L, 1.35V, FBGA-78, **1600Mbps** (mais lento que os 1866/2133
#   do ECMD atual — mesmo padrão do EC4B) e **lifecycle "Obsolete" explícito, last-time-buy
#   30/09/2020** (Octopart) — confirma leitura de geração anterior descontinuada, não erro de marca.
#   Conta Gb→GB: 512M×8bit = 4.096Mbit = 4Gbit = 512MB (bytes) — density_gbit=4Gb é o valor correto
#   pro schema (nunca GB, ver convenção §1); harddiskdirect escreve "(4GB)" solto no título da
#   página, típico erro Gb×GB de distribuidor — NÃO usei esse valor, segui a conta.
#
# CLUSTER: achei também `D5128EETBPGGBU-U` (mesmas specs exatas, catálogo Octopart separado
# 71140301, corroborado por electronicsdatasheets) — sufixo "-U" também aparece na família ECMD
# atual (`D5128ECMDPGJD-U`), não é exclusividade do legado, não sei o que exatamente diferencia
# (talvez lote/embalagem) mas é PN real cadastrado à parte, incluí.
#
# Tentei e NÃO achei (excluído, não adivinhado):
#   - Irmãs de outra densidade/organização (`D1216EETB…`/`D2516EETB…`/`D2568EETB…`, espelhando os
#     códigos já confirmados da família ECMD) — nenhuma fonte. Cluster desta família parece ser só
#     essas 2 PN, mesmo padrão do EC4B (2 PN, sem irmãs de outra capacidade).
#   - Variante industrial (sufixo "I", como `D5128ECMDPGJDI`/`D2516EC4BXGGBI`) — não achei
#     `D5128EETBPGGBI` nem similar em nenhuma fonte.
#
# Convenção de campos: idêntica ao batch1/EC4B (KINGSTON.md §1) — chip_type="DDR3L" (subtype espelha
# chip_type), interface=largura de barramento ("x8"), density_gbit=die em Gb (nunca GB).
#
