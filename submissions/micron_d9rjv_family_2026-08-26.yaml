# Submissão de known_parts — Micron, FBGA D9RJV + família MT42L128M64 (2026-08-26)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9RJV
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (D9FJV, D9RDV, D9RFV, D9RJC, D9RJF) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ACHADO: D9RJV → MT42L128M64D2LL-25 IT:A. LPDDR2 AVULSO (standalone) —
# NÃO é eMCP. Prefixo "MT42L" = Mobile LPDDR2 SDRAM (confirmado via
# catálogo oficial Micron + datasheets Mouser/NXP da família MT42L).
# Convenção de campo: capacity em GB (não density_gbit — esse é só p/
# DDR/GDDR/SDRAM/RDRAM discreta).
#
# ⚠ ATENÇÃO — ACHADO IMPORTANTE (quebra a regra de formula-extension por
# organização usada nos lotes DDR anteriores desta sessão): dentro do
# MESMO forward-lookup "MT42L128M64", a MESMA organização "128M64" no
# texto do PN aparece com DUAS densidades diferentes conforme o
# DIE-CODE (5º campo do PN, ex. "D2LL"/"D2MC"/"D2MP"/"D2EU"/"D4KJ"):
#   - die-code D2EU: part-name direto da API = "LPDDR2 4G X64" (4Gb)
#   - die-codes D2LL/D2MC/D2MP: part-name direto da API = "LPDDR2 8G X64" (8Gb)
# Ou seja, "128M64" sozinho NÃO determina a densidade nesta família —
# ao contrário do DDR/DDR2/DDR3/DDR4 discreto (onde a organização é
# suficiente). Por isso a extensão de capacidade aqui foi feita POR
# DIE-CODE (mesmo die-code de um irmão com part-name confirmado), NUNCA
# pela organização isolada.
#
# Forward-lookup no PREFIXO DE PN "MT42L128M64" (2026-08-26, delegado —
# WAF do micron.com ainda bloqueado nesta sessão) devolveu 44 PNs.
# Filtro ES (regex de token "ES" delimitado no próprio texto de cada
# entrada) excluiu 18 (todos Z9-prefixados). Sobraram 26 — 9 com
# part-name direto da Micron, 5 formula-extendidos POR DIE-CODE
# (mesmo die-code de um confirmado), 12 EXCLUÍDOS por densidade
# NÃO CONFIRMÁVEL (ver abaixo) — não submetidos, para não adivinhar.
#
# EXCLUÍDOS (NÃO submetidos, densidade indeterminada, zero fonte Tier-1
# encontrada mesmo com busca dedicada por "MT42L128M64D4"):
#   - die-code D4KJ (6): D9MBB, D9MBD, D9PRF, D9PRN, D9QGT, Z9PHQ
#   - die-code D4LC (3): D9MCR, D9MCT, Z9PJD
#   - die-code D4LD (2): Z9PJR, Z9PJT
#   - die-code D2LN (1, único da família sem irmão confirmado): D9QSB
# "D4" pode ser um die-shrink/revisão posterior do "D2" (especulação —
# NÃO usada para classificar), mas sem part-name próprio nem datasheet
# localizado para D4KJ/D4LC/D4LD especificamente, não há base Tier-1
# pra decidir se são 4Gb, 8Gb ou outra densidade. Ficam de fora desta
# submissão; sinalizados ao dono para decisão (pesquisar mais / deixar
# na fila / aceitar risco).
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente,
# ver check_d9rjv.py). Sem sobreposição com nenhuma submissão anterior
# (grep em submissions/*.yaml, zero match).
#
