# Submissão de known_parts — Samsung, família K4F (LPDDR4 standalone, não-eMCP)
# Gerado pelo chat de marca Samsung a partir do PN não identificado K4FBE3D4HMAGCJ
# (busca em: 2026-07-06). Uso:
#   python manage.py submit_known_parts submissions/samsung_k4f_2026-07-06.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/samsung_k4f_2026-07-06.yaml --commit --user <seu_usuario>
#
# NOTA DE CONVENÇÃO (difere do submissions/samsung_k3qf_*.yaml): lá o PN foi
# truncado à base de 10 chars (sufixo pós-hífen omitido). Aqui mantive a string
# COMPLETA sem hífen (base + sufixo), pelos dois motivos: (1) o PN buscado pelo
# operador já veio assim, 14 chars ("K4FBE3D4HMAGCJ") — truncar não bateria com
# uma busca repetida do mesmo PN; (2) pn_length da família K4F é null (igual
# K3QF), então não há constraint estrutural nem a favor nem contra. Mantive os
# irmãos no mesmo padrão por consistência dentro deste arquivo.
#
# NOTA DE VERIFICAÇÃO (2026-07-06): os 6 source_url abaixo são páginas oficiais
# semiconductor.samsung.com, mas HOJE redirecionam para o hub genérico da linha
# LPDDR4 (Samsung parece ter descontinuado as páginas individuais desses SKUs,
# comuns em parts de ~2015-2018). A confirmação Tier-1 vem do TÍTULO indexado
# pelo buscador no momento da pesquisa (ex.: "K4FBE3D4HM-GHCL(32 Gb) | DRAM |
# Samsung Semiconductor Global") — ainda é fonte Samsung, não distribuidor —,
# só não é mais clicável/re-verificável ao vivo. Dono cross-checou os 6 PNs via
# Google de forma independente (2026-07-06) e confirmou. Ver SAMSUNG.md §3.
brand: "Samsung"
known_parts:
  # ── PN original (bancada) ────────────────────────────────────────────────────────
  - part_number: "K4FBE3D4HMAGCJ"
    chip_type: "LPDDR4"
    subtype: "LPDDR4"
    interface: ""
    capacity: "4GB"
    confidence: confirmed
    source_url: "https://semiconductor.samsung.com/dram/lpddr/lpddr4/k4fbe3d4hm-ghcl/"
    notes: >
      PN original buscado. Base "K4FBE3D4HM" confirmada em Samsung Semiconductor
      Global oficial sob 6 variantes de sufixo (-GHCL/-TFCL/-THCL/-GFCL/-GUCL/-TUCL),
      todas tituladas "(32 Gb)" = 4GB — bate exatamente com a gramática (cap-key
      'BE' do LPDDR4_CAP = 4GB/32Gb). O sufixo exato do PN buscado, "-AGCJ", não
      está entre as 6 variantes indexadas por Samsung, mas aparece confirmado
      independentemente na EET Group (distribuidor/revenda, Tier-2): listagem
      "K4FBE3D4HM-AGCJ,4GB,X32,FB" — mesma capacidade, mesmo pacote (X32).
      Suffix não muda capacidade (mesma lógica já aplicada em K3QF/KMD).

