# Submissão de known_parts — SK Hynix, família H9HQ (uMCP LPDDR4X, JÁ EXISTENTE)
# Gerado a partir da investigação do PN H9HQ53ACPMMD (busca na bancada, 2026-07-10).
# Família H9HQ e mapas HYX_H9HQ_NAND_CAP/HYX_LPDDR4X_RAM_CAP JÁ EXISTIAM e já decodificavam
# certo (64GB NAND/4GB RAM, RENTÁVEL) — SEM fix de gramática nesta rodada. Todas as chaves
# usadas (NAND 53/54, RAM AC/AD/AE) já estavam mapeadas antes desta busca.
#
# FONTES: Preduo e Puris (catálogos de broker estruturados, fetch direto) + WinSource via
# agregador DigiPart. Aritmética Gbit→GB mostrada em cada nota.
#
# ⚠ ACHADO — WinSource mostra a própria conta pronta pro PN alvo: descrição literal
# "uMCP 64GB UFS2.1 + 4GB(32Gb) LPDDR4X-4266" — confirma 64GB UFS + 32Gb÷8=4GB LPDDR4X,
# batendo exatamente com pn[4:6]='53'→64GB e pn[6:8]='AC'→4GB já mapeados.
#
# ⚠ NOTA — H9HQ53ACPMMDAR-KMM (variante de sufixo -KMM, mesma densidade 64+32 do alvo -KEM):
# a página do Preduo rotula "Type: eMCP" mas "Sub-Type: UFS+LPDDR4x" — inconsistência de
# categorização interna do site (o produto É uMCP, confirmado pela Sub-Type e pela densidade
# idêntica ao par -KEM já certo). Não é conflito de capacidade, só rótulo de categoria mal
# aplicado pelo Preduo — incluído normalmente.
#
# ⚠ NOTA — H9HQ54ACPMMDAR-KEM: Puris descreve como "UFS2.2" (não "UFS 2.1" como o tip da
# família assume por padrão) — detalhe de versão de protocolo que a gramática não decodifica
# posicionalmente; não afeta capacidade nem chip_type/subtype gravados.
#
# Uso:
#   python manage.py submit_known_parts submissions/hynix_h9hq_2026-07-10.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/hynix_h9hq_2026-07-10.yaml --commit --user <seu_usuario>
#
