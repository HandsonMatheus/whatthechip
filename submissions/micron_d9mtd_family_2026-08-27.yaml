# Submissão de known_parts — Micron, FBGA D9MTD + família MT47H128M16 (2026-08-27)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9MTD
# (não identificado na bancada, fila de revisão).
#
# ACHADO: D9MTD → MT47H128M16RT-25E:C. Prefixo MT47H = DDR2 (já confirmado
# nesta sessão, investigações D9GKW/D9JWH). Organização "128M16" = 128 Meg
# x 16 = 2048Mbit = 2Gb — confirmado por 3 fontes: (1) part-name direto da
# API Micron ("DDR2 2G X16 FBGA"); (2) datasheet oficial Micron/DigiKey
# "2Gb: x8, x16 Automotive DDR2 SDRAM" (MT47H256M8_MT47H128M16_RevF_2018.pdf,
# "2gbddr2_ait_aat.pdf"), que lista "128 Meg x 16 (16 Meg x 16 x 8 banks)"
# marcado "128M16" e dá "MT47H128M16RT-25E:C" como exemplo textual de PN;
# (3) aritmética 128M×16=2048Mb=2Gb. DDR2 não tem variante "L" de baixa
# tensão amplamente adotada (ao contrário do DDR3/DDR3L do caso D9MPK) —
# datasheet confirma VDD=VDDQ=1.8V padrão, sem ambiguidade de chip_type.
#
# ⚠ Datasheet usado é o ADDENDUM industrial/automotivo (marcação de
# temperatura só lista AIT/AAT) — mas o "Example Part Number" do próprio
# documento é "MT47H128M16RT-25E:C" (SEM sufixo de grau), e a tabela de
# Opções trata "Configuration" (128M16) e "Package/grau" como eixos
# INDEPENDENTES — por isso a densidade/organização vale pra família toda,
# grau à parte. Citado como fonte também para os PNs sem sufixo AIT/AAT.
#
# ⚠ Pacote "HG" (6 PNs abaixo) NÃO aparece na tabela de pacotes deste
# addendum específico (só lista EB/RT/PK) — provável revisão/pacote mais
# antigo não coberto por ESTE documento. Organização "128M16" ainda assim
# extensível (config. é independente de pacote na convenção Micron, ver
# acima) — reportado explicitamente pra auditoria, não é fonte direta pro
# pacote HG em si.
#
# Forward-lookup no PREFIXO DE PN "MT47H128M16" (2026-08-27, delegado — WAF
# do micron.com bloqueado nesta sessão) devolveu 29 PNs. Filtro ES (regex
# de token "ES" delimitado no PRÓPRIO texto de cada entrada) excluiu 8,
# todos Z9-prefixados. 2 sobrevivem ao filtro com "MS" em vez de "ES"
# (Z9JXC, Z9NKT) — mesmo padrão de anomalia já visto em Z9GMV (D9JWH,
# 2026-08-26) e Z9BWN (D9GCK, 2026-08-26): "MS" não é "ES", reportado
# exatamente como veio da API, specs iguais ao resto da família (nenhuma
# fonte sugere que "MS" mude organização/densidade). Sobraram 21 (incl. o
# alvo) — 7 com part-name direto da Micron ("DDR2 2G X16 FBGA"), 14
# formula-extendidos (mesma organização "128M16" no próprio texto do PN).
#
# Sufixos de velocidade (-25E=DDR2-800 CL5, -25=DDR2-667 CL5, -3=DDR2-667
# CL5 mais lento, -187E=variante -25E mais lenta) e de temperatura/
# qualificação (IT/AAT/AIT/XIT/P-AIT, die-rev A/C) NÃO entram em campo
# modelado — vão implícitos no PN completo (identidade), sem campo
# próprio.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente).
# Sem sobreposição com nenhuma submissão anterior (grep em
# submissions/*.yaml, zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9mtd_family_2026-08-27.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9mtd_family_2026-08-27.yaml --commit --fill-empty
#
