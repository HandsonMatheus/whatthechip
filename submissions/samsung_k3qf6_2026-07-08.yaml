# Submissão de known_parts — Samsung, família K3QF, cap-key '6' (LPDDR3 24Gb/3GB)
# Gerado a partir do PN não identificado K3QF6F60MMQGCF (busca em 2026-07-08).
# A família K3QF e o mapa K3QF_CAP já eram conhecidos (trabalhados antes nesta mesma
# sessão) — a chave '6' já estava confirmada no yaml (PSG 1H2017 + 2H2014), esta
# submissão só adiciona os PNs completos (base+sufixo) como known_parts. Uso:
#   python manage.py submit_known_parts submissions/samsung_k3qf6_2026-07-08.yaml            # dry-run = portão
#   python manage.py submit_known_parts submissions/samsung_k3qf6_2026-07-08.yaml --commit --user <seu_usuario>
#
# Convenção de PN: string completa sem hífen (base+sufixo, 14 chars), igual ao que
# o operador buscou — mesmo padrão do samsung_k4f_2026-07-06.yaml, não do k3qf
# original (que truncava pra base de 10). Duas bases de die confirmadas pro key
# '6': "K3QF6F60MM" e "K3QF6F60AM" (M/A = revisão de die, mesma lógica já
# documentada pro key '3' vs '2' no K3QF_CAP — não muda capacidade).
brand: "Samsung"
known_parts:
  - part_number: "K3QF6F60MMQGCF"
    chip_type: "LPDDR3"
    subtype: "LPDDR3"
    interface: ""
    capacity: "3GB"
    confidence: confirmed
    notes: >
      PN original buscado (família/mapa já cadastrados, mas este PN exato não
      estava no banco). Base "K3QF6F60MM" já é o próprio exemplo citado no
      K3QF_CAP do yaml (key '6' = 3GB/24Gb, fonte PSG 1H2017+2H2014). Sufixo
      "-QGCF" confirmado via Puris (distribuidor) + URL do Samsung MemoryLink
      com partNo=K3QF6F60MM-QGCF (conteúdo não pôde ser lido — JS — mas a URL
      indexada é evidência de registro real na base da Samsung).

