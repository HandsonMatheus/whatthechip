# Submissão de known_parts — Micron, FBGA D9RZH + família MT47H64M16 (2026-07-10)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9RZH
# (não identificado na bancada, fila de revisão).
#
# ⚠ ACHADO: D9RZH → MT47H64M16NF-25E:M. Prefixo MT47H — NOVO nesta
# série de lotes: DIFERENTE de MT41K/MT41J (DDR3-family), MT51J (GDDR5),
# MT58K (GDDR5X) e MT29C (MCP) já vistos. MT47H = DDR2. chip_type="DDR2".
#
# Capacidade: 64M × 16bit = 1024Mb = 1Gb — bate exato com o part-name
# direto da Micron "DDR2 1G X16 TFBGA/FBGA". Forward-lookup no prefixo
# "MT47H64M16" (2026-07-10) achou 126 PNs: 97 de produção ("D9*") + 29
# Engineering Sample ("Z9*", EXCLUÍDOS).
#
# ⚠ CORREÇÃO PÓS-CRASH (rodada 2): o --commit da 1ª versão (97 PNs)
# quebrou com UniqueViolation em part_number_norm="MT47H64M16HR25EPAITH".
# Causa: D9MVB ("MT47H64M16HR-25E P-AIT:H", hífen) e D9QKP ("MT47H64M16HR-
# 25E P AIT:H", espaço) são DOIS fbga_code DIFERENTES e genuinamente
# válidos no decoder oficial da Micron (confirmados individualmente via
# reverse-lookup, HTTP 200 nos dois, 2026-07-10) — mas normalize_pn()
# despreza hífen/espaço, então os dois colapsam pro MESMO
# part_number_norm. O schema só aceita um. NENHUM dos dois tem part-name
# da Micron pra desambiguar (ambos vazios), e specs são idênticas em tudo
# mais (pacote HR, -25E, temp AIT, revisão :H) — não dá pra saber qual
# fbga_code é "o certo" sem mais fonte. ⚠ AMBOS EXCLUÍDOS desta submissão
# (nem D9MVB nem D9QKP entram) — decisão sinalizada ao dono, não decidida
# sozinho. Restam 95 known_parts nesta versão (97 - 2).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9rzh_family_2026-07-10.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9rzh_family_2026-07-10.yaml --commit --user <seu_usuario>
#
