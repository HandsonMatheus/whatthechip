    fbga_code: "D9RZH"
    confidence: confirmed
    source_url: "https://www.micron.com/products/memory/dram-components/ddr2-sdram/part-catalog/part-detail/mt47h64m16nf-25e-m"
    notes: >
      Identidade via API FBGA oficial da Micron (fetch direto,
      2026-07-10): D9RZH → MT47H64M16NF-25E:M. Prefixo MT47H = DDR2 —
