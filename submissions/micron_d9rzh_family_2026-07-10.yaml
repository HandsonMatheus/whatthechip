      MT29C=MCP). TIPO + CAPACIDADE confirmados diretamente pelo campo
      part-name da própria Micron: "DDR2 1G X16 TFBGA", sub-category
      "ddr2-sdram" (em produção, não obsoleto). CAPACIDADE por fórmula:
      64M (profundidade) × 16bit (largura) = 1024Mb = 1Gb — bate exato com
      o "1G" do part-name. Campo density_gbit (Gb), convenção DDR discreta
      (CLAUDE.md §6). Pacote NF = TFBGA (thin FBGA); outros pacotes da
      mesma família (BT/B7/F7/HR/HW/RP) são FBGA padrão — diferença só de
      encapsulamento físico, não de especificação elétrica.

