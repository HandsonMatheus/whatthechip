#      (ver PIECEMAKERS.md §5, fica como lead pra próxima rodada).
#   5. DDR2 (PME)/DDR (PMD)/SDR (PMS): tabela completa do glochip, incluída no ADENDO #3 abaixo
#      (pedido do dono de cobertura máxima) — são sempre NÃO RENTÁVEL (geração morta), mas valem
#      como identidade/completude de catálogo.
