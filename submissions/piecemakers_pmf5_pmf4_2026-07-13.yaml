# METODOLOGIA:
#   1. Tier 1 — piecemakers.com.tw/products/standard-dram (catálogo oficial atual, SPA/Nuxt). Só a
#      aba "1Gb" carrega sem JS (sem navegador Chrome disponível nesta sessão); mostrou PMF510816C,
#      PMF510808D, PMF510816D, PMF510808E, PMF510816E — todas MP. Ausência da revisão B bate com o
#      EOL do glochip (ver abaixo). Abas 2Gb/4Gb não confirmadas neste site nesta rodada.
#   2. Tier 2 — glochip.com/ddr3/piecemakers.html: tabela técnica estruturada (Part No./Den./Org./
#      Vol./Speed/Package/Status) com a matriz COMPLETA de PMF5 (DDR3) e PMF4 (DDR3L), batendo 100%
#      com a Tier-1 nas linhas sobrepostas (1Gb: C/D/E MP, B ausente/EOL). Fonte principal desta
#      submissão.
#   3. PMF511816DBR (revisão D, 2Gb x16) NÃO aparece na tabela do glochip (que só lista E/F nessa
#      densidade) — mas "PMF511816DBR-KADN" aparece em DUAS distribuidoras independentes (Ariat-Tech
#      e Censtry, cada uma com página própria do PN, não menção de terceiros) com estoque real, mais
#      o achado físico na bancada (o operador escaneou o chip). Precedente: o próprio catálogo mostra
#      3 revisões (C/D/E) coexistindo em produção na densidade 1Gb — confirma que revisões múltiplas
#      convivem por densidade, então uma revisão D em 2Gb (além do E/F já no glochip) é plausível e
#      consistente com o padrão. Specs (2Gb/x16/256MB/1.5V) herdadas do known_part JÁ APROVADO
#      PMF511816EBR (mesma família/densidade/barramento) — revisão de silício (B/C/D/E/F/G) nunca
#      altera specs, regra já documentada em PIECEMAKERS.md §3 e confirmada de novo aqui (nenhuma
#      linha do glochip muda densidade/org/tensão entre revisões da mesma densidade).
#   4. NÃO incluído: PMF511816EBR e PMF511816EBRKADN (já APROVADOS — o comando pula automaticamente
#      known_part com review_status=approved, mas omiti da lista por limpeza). PMF511816GBR-KADN
