# densidade diferente dentro da família" já documentado (memória
# wtc-mesma-chave-densidade-diferente-dentro-familia) — desta vez na chave C1, não na '31'.
# O mapa continua default=4GB (maioria, KMRC10014M+variantes B809/B809007 já confirmados);
# este known_part individual resolve corretamente o caso 000B.
#
# KMR8X0001A: irmã de sufixo do já-confirmado KMR8X0001M (seed, 16GB+2GB, chave '8X'). Existe
