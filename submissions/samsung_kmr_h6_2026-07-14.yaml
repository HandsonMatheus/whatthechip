# página estruturada com NAND+RAM explícitos separados pra ESTE sufixo especificamente — só
# o agrupamento com o já-confirmado M. confidence=manual (padrão de invariância por sufixo,
# 100% consistente em todo caso já testado nesta família, mas sem citação explícita própria).
