# (sufixo M) é irmão de sufixo do já-confirmado H60014A — mesmo padrão de "sufixo não muda
# capacidade" já validado várias vezes nesta família (KMQN10006 A/B/M) e nesta sessão.
#
# Varredura via Puris master index (mesma técnica do round 07-13): cruzei os ~130 PNs Samsung
# do puris.net/emcplist contra os já confirmados (13 no seed + 8 do meu round 07-13) — achei
# 3 siblings genuinamente novos, todos verificados individualmente antes de registrar:
#
# KMR4Z0001A: irmã de sufixo do já-confirmado KMR4Z0001M (seed, 32GB+2GB). Puris (página
# dedicada archives/2982) + Jotrin + Lisleapex + Censtry + eBay ("32+2"), todos "32+16"=2GB.
# Mesmo padrão de invariância por sufixo.
#
# KMRC1000BM: ⚠ ACHADO NOVO — mesma chave 'C1' do já-confirmado KMRC10014M (seed, 64GB+4GB),
# mas KMRC1000BM tem RAM DIFERENTE: 64GB+3GB (24Gb). Confirmado Preduo + 2x AliExpress ("64+3"/
