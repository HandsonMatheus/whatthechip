# Submissão known_parts — Winbond, cluster DDR2 SDRAM "Specialty DRAM" W9712/W9725/W9751/W971GG/W972GG
# (2026-09-01). Origem: debug do estoque com PN de bancada "W9751G6JBB25" (known=false,
# in_review_queue=true, ver JSON colado pelo dono). Regra permanente: pesquisar cluster inteiro, não só
# 1 PN — este arquivo cobre as 5 densidades da família (128Mb/256Mb/512Mb/1Gb/2Gb), x8 e x16: 12
# known_parts.
#
# ATENÇÃO — PN de bancada NÃO confirmado literal (golden #10/#12, nunca decidir PN ambíguo sozinho):
# "W9751G6JBB25" (com "BB" duplo) NÃO aparece em nenhuma fonte que consultei (Alldatasheet, Octopart,
# DigiKey, LCSC, Findchips, DigiPart, Avnet, comparadores de spec, NAC Semi, TECHDesign) — todas mostram
# sufixo de pacote de 2 letras (JB/KB/NB/SB/SS/IB), nunca "JBB". O que EXISTE e bate 100% com a
# densidade/organização/pacote/tensão de um PN "W975...JB..." é `W9751G6JB-25` (confirmado em 2+ fontes
# independentes). NÃO submeti "W9751G6JBB25" como known_part — seria inventar identidade sem fonte. A
# leitura de bancada quase certamente é W9751G6JB-25 com um "B" a mais (erro de leitura/OCR), mas isso
# fica pro dono confirmar na marcação física do chip (ver nota de cada known_part relevante).
#
# Fonte Tier-1 direta (winbond.com): PDFs em /resource-files/*.pdf e páginas de documentação/produto
# bloqueados por robots.txt para fetch automatizado (não contornado). EXCEÇÃO que funcionou: o artigo de
# notícia oficial "Winbond Introduces Products...256Mb, 512Mb, 1Gb DDR2 SDRAM" (winbond.com, Tier-1
# direto, fetch OK) confirma a faixa de densidade, pacote WBGA-84, x16, Vdd 1.7~1.9V — mas cita só as
# séries "IB" sem sufixo de velocidade exato, por isso NÃO virou known_part aqui (string incompleta não
# bate marcação real, ver known_part-string-exata). Specs detalhadas dos demais PNs vieram da tabela
# sistemática da distribuidora NAC Semi (matemática bit→Mb conferida uma a uma, todas batem) + Alldatasheet
# (mirror do datasheet oficial do PN pesquisado).
#
# Família: DDR2 SDRAM "Specialty DRAM" da Winbond — geração ANTERIOR à W631/632/634 (DDR3) já submetida
# em winbond_ddr3_w63x_2026-09-01.yaml. Mapa de densidade confirmado nesta rodada (prefixos NÃO seguem
# um único eixo numérico simples como no DDR3 — cada prefixo é uma família de datasheet própria):
#   W9712G = 128Mb   W9725G = 256Mb   W9751G = 512Mb   W971GG = 1Gb   W972GG = 2Gb
# dígito "6" = x16, dígito "8" = x8 (mesma convenção do DDR3). Tensão padrão 1.8V±0.1V em toda a família
# — NÃO achei variante "DDR2L"/baixo-consumo pra esta linha (ao contrário do DDR3 GG/GU). Sufixo de
# pacote (JB/KB/NB/SB/SS/IB) varia por fonte/geração e NÃO decodificado — mesma situação já documentada
# no cluster DDR3 (detalhe físico, não muda capacity/chip_type).
#
# Convenção Winbond (WINBOND.md golden #6): nomenclatura da marca é em BIT; capacity aqui é SEMPRE byte
# (Gb÷8). Aritmética mostrada em cada `notes`.
#
# Rodar (o DONO):
#   python manage.py submit_known_parts submissions/winbond_ddr2_w97x_2026-09-01.yaml               # dry-run = portão
#   python manage.py submit_known_parts submissions/winbond_ddr2_w97x_2026-09-01.yaml --commit        # grava (submitted) → aprovar no admin
#
# CORREÇÃO 2026-09-01 (pós-entrega, achado por auditoria de OUTRA marca que revelou regra geral): o
# `_GBIT_RE` do engine (`chips/engine.py`) só casa o sufixo literal "Gb" — sub-1Gb escrito como "512Mb"/
# "256Mb"/"128Mb" NÃO tem "Gb" na string e vira `density_gbit_num=None` em silêncio (sem erro no
# dry-run, `density_gbit` não está em MEASURE_FIELDS). Corrigido pra fração de Gb: 512Mb→0.5Gb,
# 256Mb→0.25Gb, 128Mb→0.125Gb. `capacity` (byte) não muda, só `density_gbit` (bit). Aproveitei e
# populei `density_gb` (mesmo valor de `capacity`) em todos os 12, por recomendação do achado original
# (deixa `dram_density` legível como "0.5Gb = 64MB por die [✓]" em vez de só a fração crua).
#
# PRÉ-REQUISITO (winbond.yaml): a Brand "Winbond" precisa existir no banco antes do dry-run funcionar.
