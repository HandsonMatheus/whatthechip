# Submissão de known_parts — Micron, FBGA D9GBM + família MT46V128M4 (2026-08-20)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA D9GBM
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (D9GBF, D9GBG, D9GBH, D9GBJ, D9GHM) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ⚠ Reverse-lookup e forward-lookup rodados de FORA do sandbox (API oficial
# Micron bloqueando o IP daqui por reputação — F5 BIG-IP ASM, ver
# diagnóstico do dono 2026-08-20). Resultado colado no chat, verificado
# abaixo.
#
# ACHADO: D9GBM → MT46V128M4BN-5B:F. Prefixo MT46V = DDR (primeira geração,
# "DDR1" — chip_type verificado direto em chips/chip_types.py antes de usar:
# linha 80, ChipTypeSpec("dram_pc", "ddr", "ddr", carries_generation=True)).
# Bloco de configuração "128M4" = 128 Meg × 4 (x4) — fórmula JEDEC oficial:
# 128.000.000 × 4 = 512.000.000 bits = 512 Mbit = 0,5Gb.
#
# ⚠ density_gbit em fração de Gb, NÃO em "512Mb" — regra já documentada
# nesta sessão (o extrator de densidade do engine só reconhece o sufixo
# "Gb" literal; "Mb" não é parseado). density_gbit="0.5Gb".
#
# Cross-check Tier-1 do ALVO: DigiKey lista um sibling quase idêntico
# (mesmo bloco "128M4", mesma grade -5B, só pacote/revisão diferentes)
# "MT46V128M4P-5B:D TR" como "SDRAM - DDR Memory IC 512Mbit" — bate exato
# com a conta (512Mbit = 0,5Gb). Título do datasheet oficial (hospedado
# DigiKey): "512Mb DDR SDRAM (x4, x8, x16) Component Data Sheet".
# https://media.digikey.com/pdf/Data%20Sheets/Micron%20Technology%20Inc%20PDFs/MT46V128M4,_64M8,_32M16.pdf
#
# Além disso, 2 SIBLINGS desta mesma família vieram com part-name PREENCHIDO
# pela própria API Micron: "DDR 512M X4 FBGA" / "DDR 512M X4 TSOP" — "512M
# X4" bate exato com a fórmula (128M×4=512Mbit) e confirma a extensão pra
# toda a família (mesmo bloco "128M4" em todos).
#
# Forward-lookup no prefixo "MT46V128M4" (2026-08-20) devolveu 46 PNs.
# Filtro ES (D9+Z9 combinados no texto do PN): dos 14 fbga_code "Z9", TODOS
# têm "ES" literal no part-number — EXCLUÍDOS por completo (nenhum
# sobrevive, mesmo padrão do lote D9LJJ). Restam 32 (30 "D9" + "9MMW" +
# "DP9PJJ") — nenhum tem "ES" no texto.
#
# ⚠ fbga_code "DP9PJJ" (MT46V128M4CY-6:J) tem 6 caracteres, fora do padrão
# FBGA de 5 chars (`^[A-Z][A-Z0-9]{4}$`) — vem assim da própria API oficial,
# reportado tal qual (Tier-1, não alterado/corrigido por mim). Pode não ser
# alcançável pela busca por fbga_code na bancada; identidade e capacidade
# não são afetadas (mesmo bloco "128M4").
#
# Dos 32, 2 têm part-name direto da API (D9MLZ, D9NGZ — "DDR 512M X4..."),
# os outros 30 (incl. o alvo D9GBM) são extensão por fórmula, mesmo bloco
# de config em todos. Variações de pacote (BN/FN/CV/CY/P/TG/S2FB) e grade de
# velocidade (-5B/-6/-75/-75Z) não afetam capacidade.
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de part_number_norm
# dentro da própria lista (checado programaticamente, ver check_d9gbm.py).
# Sem sobreposição com nenhuma submissão anterior (grep em submissions/*.yaml,
# zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_d9gbm_family_2026-08-20.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_d9gbm_family_2026-08-20.yaml --commit
#
