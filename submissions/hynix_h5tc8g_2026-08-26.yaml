      documento único cobre as três larguras ("H5TC8G83AMR-xxA" citado na capa junto dos
      pares x4/x16). Mesma densidade total (8Gb÷8=1GB), só a largura de barramento muda.
      confidence=confirmed (corpo técnico do documento-fonte lido).
