# Submissão de known_parts — Micron, FBGA JW738 + família MT29C4G48M (2026-07-10)
# Gerado pelo chat de marca Micron a partir da investigação do FBGA JW738
# (não identificado na bancada, fila de revisão).
#
# fuzzy_sugest. do debug (JW438, JW708, JW778, JW788, JW838) IGNORADO por
# construção — já são KnownPart aprovado.
#
# ACHADO: JW738 → MT29C4G48MAAHBAAKS-5 WT. Família MT29C (mesma dos
# lotes JW500/JW614 — chip_type="MCP", NAND+LPDRAM raw em PoP). Bloco
# de densidade "4G48M" = NAND 4Gb + LPDRAM código "48M" = 2Gb — conta:
# NAND 4Gb÷8=512MB, LPDRAM 2Gb÷8=256MB, total 4Gb+2Gb=6Gb. Confirmado
# pelo PRÓPRIO part-name da Micron: "SLC EMMC/MOBILE DDR 6G VFBGA" —
# 6Gb bate EXATO com "6G".
#
# Forward-lookup no prefixo "MT29C4G48M" (2026-07-10) devolveu 74 PNs:
# 72 com fbga_code "JW*" (produção) + 1 "JQ*" (qualification sample,
# JQ257 — variante QS do JW257, EXCLUÍDO) + 1 "JZ*" (JZ106, também
# fora do padrão de produção "JW", EXCLUÍDO). Dos 72 "JW", só 14 têm
# part-name preenchido pela própria Micron (confirmação forte) — os
# outros ~58 NÃO têm nenhuma fonte Tier-1 e por isso NÃO entram aqui
# (mesma regra dos lotes JW500/JW614: sem fonte, fora da submissão).
#
# ⚠ EXCLUÍDO E SINALIZADO: JWC10 (MT29C4G48MAZBBAKB-48 IT ES) tem "ES"
# (Engineering Sample) literalmente no PRÓPRIO part-number, apesar do
# fbga_code começar com "JW" (padrão que neste lote indica produção —
# os ES ficaram em fbga_code "JY*"/"JQ*"/"JZ*" pros demais). Como o "ES"
# está no texto do PN, não no prefixo do fbga_code, tratei como amostra
# de engenharia mesmo assim e excluí — não é peça de produção garantida.
#
# Dos 13 que restam (12 confirmados + o alvo, já contado), 11 dizem
# "MOBILE DDR" (RAM tipo mDDR1, incl. o alvo — que diz especificamente
# "SLC EMMC/MOBILE DDR", ver nota do alvo sobre por que isso NÃO é o
# mesmo alerta do JW658) e 2 dizem "NAND MCP" genérico (RAM não
# especificada — tratado como tal, não inventei o tipo). Nenhuma
# variante "SDR" apareceu nesta família (diferente do JW614).
#
# Sem PN duplicado, sem fbga_code duplicado, sem colisão de
# part_number_norm dentro da própria lista (checado programaticamente).
# Sem sobreposição com nenhuma submissão anterior (grep em
# submissions/*.yaml, zero match).
#
# Uso:
#   python manage.py submit_known_parts submissions/micron_jw738_family_2026-07-10.yaml            # dry-run = portao
#   python manage.py submit_known_parts submissions/micron_jw738_family_2026-07-10.yaml --commit --user <seu_usuario>
#
