      JW658 (lote JW614). Tratado como raw MCP normal (SLC = tecnologia de
      célula da NAND, não indica controller gerenciado). chip_type=MCP
      (categoria "catalog", profit_family="dead", commercial=False — já
      resolvido nos lotes JW500/JW614 com o dono, ver chips/chip_types.py
