{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Painel — WhatTheChip?{% endblock %}</title>

  <script>
    // Ambiente de bancada: tema claro fixo (Carbon White content + shell escuro).
    document.documentElement.removeAttribute('data-theme');
    try { localStorage.removeItem('wtc_theme'); } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>

  <style>
  /* ═══ Painel WhatTheChip — IBM Carbon (shell escuro + conteúdo claro) ═══ */
  body.wtc-panel {
    margin: 0; background: #f4f4f4;
    font-family: 'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
    color: #161616; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .wtc-panel *, .wtc-panel *::before, .wtc-panel *::after { box-sizing: border-box; }
  .wtc-panel input::placeholder { color: #a8a8a8; }

  /* Header (Carbon UI shell — escuro) */
  .wtc-header { height: 56px; background: #161616; display: flex; align-items: center; position: sticky; top: 0; z-index: 40; }
  .wtc-header__logo { background: #fff; height: 100%; display: flex; align-items: center; padding: 0 18px; flex: none; }
  .wtc-header__logo img { height: 26px; width: auto; display: block; }
  .wtc-header__nav { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 8px 0 20px; color: #f4f4f4; font-size: 15px; font-weight: 600; border-bottom: 3px solid #0f62fe; margin-bottom: -1px; text-decoration: none; }
  .wtc-header__spacer { flex: 1; }
  .wtc-header__actions { display: flex; align-items: center; gap: 6px; padding-right: 12px; }
  .wtc-header__user { color: #c6c6c6; font-size: 14px; margin-right: 6px; }
  .wtc-header__btn { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; color: #f4f4f4; font-size: 14px; border: 1px solid #525252; background: transparent; cursor: pointer; white-space: nowrap; flex: none; text-decoration: none; }
  .wtc-header__btn:hover { background: #262626; }
  .wtc-header__btn--logout { color: #ff8389; }

  /* Área de trabalho centralizada */
  .wtc-work { max-width: 1340px; width: 100%; margin: 0 auto; padding: 24px; flex: 1; }

  /* Links visitados nunca roxos */
  .wtc-work a, .wtc-work a:visited { color: #0f62fe; }
  .wtc-header__nav, .wtc-header__nav:visited { color: #f4f4f4; }
  .wtc-header__btn, .wtc-header__btn:visited { color: #f4f4f4; }
  .wtc-header__btn--logout, .wtc-header__btn--logout:visited { color: #ff8389; }

  @media (max-width: 640px) {
    .wtc-header__user { display: none; }
    .wtc-work { padding: 16px; }
  }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="wtc-panel">

<!-- ── Carbon UI shell header (escuro) ─────────────────────────── -->
<header class="wtc-header">
  <a href="/" class="wtc-header__logo">
    <img src="{% static 'img/logo-light.svg' %}" alt="WhatTheChip?">
  </a>
  <a href="{% url 'estoque:index' %}" class="wtc-header__nav">
    <svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#78a9ff" stroke-width="2">
      <path d="M16 4 28 10v12L16 28 4 22V10z"/><path d="M4 10l12 6 12-6M16 16v12"/>
    </svg>
    Estoque
  </a>
  <div class="wtc-header__spacer"></div>
  <div class="wtc-header__actions">
    <span class="wtc-header__user">{{ request.user.get_full_name|default:request.user.username }}</span>
    <a href="/" class="wtc-header__btn">‹ Voltar ao site</a>
    <a href="{% url 'logout' %}" class="wtc-header__btn wtc-header__btn--logout">⤬ Sair</a>
  </div>
</header>

<!-- ── Conteúdo ────────────────────────────────────────────────── -->
<main class="wtc-work" id="pnl-content">
  {% block main %}{% endblock %}
</main>

{% block extra_js %}{% endblock %}
<script src="{% static 'js/mic.js' %}"></script>
</body>
</html>
