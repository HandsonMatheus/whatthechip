{% load i18n %}
<div class="est-confirm est-confirm--done">
  <div class="est-confirm-head">
    <span class="est-confirm-status est-confirm-status--ok">✓ {% trans "Registrado" %}</span>
    <span class="est-confirm-pn">{{ pn }}</span>
  </div>
  <p class="est-confirm-hint">
    {% trans "PN adicionado à fila de chips desconhecidos. Obrigado por contribuir com o banco de dados." %}
  </p>
  <div class="est-confirm-actions">
    <button class="est-btn est-btn--ghost" type="button"
            onclick="this.closest('#confirm-area').innerHTML=''; document.getElementById('pn-input').value=''; document.getElementById('pn-input').focus();">
      {% trans "Fechar" %}
    </button>
  </div>
</div>
