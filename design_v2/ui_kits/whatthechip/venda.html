<style>
.vrec{max-width:1680px;margin:0 auto;padding:20px 32px 44px}
@media(max-width:880px){.vrec{padding:16px 16px 36px}}
@container vp (max-width:880px){.vrec{padding:16px 16px 36px}}
/* escolha de transportadora */
.pick{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line)}
.pick button{flex:1 1 auto;height:38px;padding:0 14px;border:0;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-70);cursor:pointer;white-space:nowrap;transition:background var(--d1),color var(--d1)}
.pick button:hover{background:var(--ink-05);color:var(--text)}
.pick button.on{background:var(--ink-100);color:var(--white);font-weight:700}
</style>

<body>

<header class="shell">
  <a class="shell__brand" href="painel.html" aria-label="WhatTheChip 什么芯片"><img class="lg-l" src="../../static/img/whatthechip-lightmode.svg" alt="WhatTheChip" /><img class="lg-d" src="../../static/img/whatthechip-darkmode.svg" alt="WhatTheChip" /></a>
  <nav class="shell__nav">
    <a class="nlink" href="painel.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.2L12 3.5l8.5 6.7V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg><span>Painel</span></a>
    <a class="nlink" href="estoque.html" data-wtc-needs="lots"><svg viewBox="0 0 24 24"><path d="M12 3l9 4.5v9L12 21l-9-4.5v-9z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg><span>Estoque</span></a>
    <a class="nlink is-active" href="vendas-lista.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12"/><circle cx="12" cy="12" r="2.7"/><path d="M6 9.6v4.8M18 9.6v4.8"/></svg><span>Vendas</span></a>
  </nav>
  <div class="shell__spacer"></div>
  <div class="shell__who">
    <div class="shell__avatar" data-wtc-initials>MG</div>
    <div class="shell__user"><b data-wtc-user>Matheus G.</b><span class="shell__role" data-wtc-role>Gerente</span></div>
  </div>
  <button class="shell__ico" aria-label="Notificações" id="bell"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></button>

  <button class="shell__ico shell__ico--lang" aria-label="Idioma">PT</button>
  <a class="shell__ico shell__ico--out" aria-label="Sair" href="login.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5M21 12H9M12 19H5V5h7"/></svg></a>

<div class="rhead"><div class="wrap">
  <div class="rhead__u">
    <a class="rhead__back" href="vendas-lista.html"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg><span>Vendas</span></a>
  </div>
  <div class="rhead__bar">
    <div class="rhead__idl" id="vbar"></div>
    <div class="rhead__stat" id="stat"></div>
    <div class="rhead__act" id="act"></div>
  </div>
  <div class="rhead__desc"><p id="vdesc"></p></div>
  <div class="rhead__mx" id="rmx"></div>
  <div class="rhead__mx rhead__mx--g" id="rgrp"></div>
</div></div>

<main class="vrec">
  <div class="sheet">
    <div class="nb" id="nb"></div>
    <div class="nbb" id="nbb"></div>
  </div>

  <div class="demobar" id="demobar" style="margin:16px 0 0"></div>
</main>

<div class="prt" id="prt"></div>

<div class="scrim" id="ship-scrim" role="dialog" aria-modal="true" aria-labelledby="ship-t">
  <div class="modal modal--sm">
    <div class="modal__h">
      <h2 id="ship-t">Despachar lote</h2>
      <p>Informe por onde a caixa saiu. O rastreio deixa a plataforma acompanhar a chegada — e é o que dispara a conferência.</p>
    </div>
    <div class="modal__b" id="ship-b"></div>
    <div class="modal__f">
      <button class="btn btn--sec" id="ship-x" type="button">Cancelar</button>
      <button class="btn btn--pri" id="ship-ok" type="button" disabled>Confirmar despacho<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
    </div>
  </div>
</div>

<div class="scrim" id="acc-scrim" role="dialog" aria-modal="true" aria-labelledby="acc-t">
  <div class="modal modal--sm">
    <div class="modal__h">
      <h2 id="acc-t">Aceitar resultado</h2>
      <p>Confira o que a plataforma apurou. Aceitar libera o repasse para a conta da empresa.</p>
    </div>
    <div class="modal__b" id="acc-b"></div>
    <div class="modal__f">
      <button class="btn btn--sec" id="acc-x" type="button">Revisar antes</button>
      <button class="btn btn--pri" id="acc-ok" type="button">Aceitar e liberar repasse<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span id="toast-txt"></span></div>
