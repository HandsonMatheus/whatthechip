<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="wtc-carbon.css?v=27" />

<style>
/* casca das telas de listagem — cópia fiel de estoque.html. O .wrap vem do wtc-carbon.css. */
.phead{background:var(--surface)}
.phead__in{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding:34px 0 24px}
.phead h1{font-size:34px;font-weight:300;letter-spacing:-.025em;line-height:1.05}
.phead h1 b{font-weight:700}
.phead__right{display:flex;align-items:center;gap:12px;flex:none}
.kpis{background:var(--surface);border-bottom:1px solid var(--line)}
.kpis__in{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);margin:0 -32px}
.kpi{background:var(--surface);flex:1 1 185px;padding:18px 32px 20px;min-width:0}
.kpi__l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kpi__v{font-size:31px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:11px;white-space:nowrap}
.kpi__v small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi__d{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap}
.kpi__d b{font-weight:800}
/* o número recebe a cor do que ele é — as mesmas três do resto do sistema: verde é dinheiro que
   caiu, âmbar é dinheiro que falta, azul é resultado apurado. "Em trânsito" fica neutro de
   propósito: ainda não é nenhuma das três. No escuro o azul de TEXTO é o claro (--accent), nunca
   o azul de botão, que a esta altura já não tem contraste. */
.kpi--got .kpi__v{color:var(--green-60)}
.kpi--due .kpi__v{color:var(--amber-60)}
.kpi--res .kpi__v{color:var(--accent)}
.work{padding:26px 0 96px}
/* Quatro colunas apertadas: "US$" custa dois caracteres mais que "¥", e entre 880 e 1120 a faixa
   ainda tem quatro células. Um degrau só para essa janela — com min-width, para não disputar
   cascata com os degraus de tablet e celular, que já reflui a faixa para duas colunas. */
@container vp (min-width:881px) and (max-width:1120px){.kpi__v{font-size:26px}}
@media(min-width:881px) and (max-width:1120px){.kpi__v{font-size:26px}}
/* ============ TABLET (≤880) e CELULAR (≤600) ============
   Mesma régua do Estoque: a tabela não rola de lado — solta coluna por papel. São TRÊS colunas de
   dinheiro aqui, e o cartão do telefone só sustenta UMA (duas viravam duas linhas de valor no meio
   da 2ª linha, e a seta caía numa terceira: cada registro com uma altura diferente). Então
   Estimado é a célula que decide (.key — é o número que sempre existe, como o "Valor triado" do
   Estoque), Resultado sai no tablet (.hide-md) e A receber sai no telefone (.hide-sm), onde a
   etiqueta de status já diz em que ponto do repasse o lote está.
   Cada bloco em dose dupla: @media para a página solta no aparelho, @container para o
   enquadramento de celular/tablet do protótipo (media query lê a janela, não o frame). */
@media(max-width:880px){
  .wrap{padding:0 16px}.kpis__in{margin:0 -16px}
  .phead__in{flex-direction:column;align-items:flex-start;gap:18px;padding:22px 0}
  .phead h1{font-size:27px}
  .shell__org-txt,.shell__user{display:none}
  .toast{left:16px;right:16px;max-width:none}
  .kpi{flex:1 1 46%;padding:15px 16px 17px}
  .kpi__v{font-size:27px}
  .work{padding:20px 0 72px}
  .slabel span{display:none}
}
@container vp (max-width:880px){
  .wrap{padding:0 16px}.kpis__in{margin:0 -16px}
  .phead__in{flex-direction:column;align-items:flex-start;gap:18px;padding:22px 0}
  .phead h1{font-size:27px}
  .shell__org-txt,.shell__user{display:none}
  .toast{left:16px;right:16px;max-width:none}
  .kpi{flex:1 1 46%;padding:15px 16px 17px}
  .kpi__v{font-size:27px}
  .work{padding:20px 0 72px}
  .slabel span{display:none}
}
@media(max-width:600px){
  /* quatro indicadores, não três como no Estoque: empilhados a 100% eles somariam 440px antes da
     primeira venda. Aqui o valor é só dinheiro e a descrição é curta, então dois por linha cabem
     em 390px sem quebrar nenhum número. */
  .kpi{flex:1 1 calc(50% - 1px);padding:14px 16px 16px}
  .kpi__v{font-size:23px;white-space:normal}
  .kpi__d{white-space:normal}
  .tbar__search{flex:1 1 100%}
  .tbar__sel{flex:1 1 calc(50% - 1px);min-width:0}
  /* sem "Novo lote" para dividir a terceira linha (esta tela não cria registro), o ícone de
     exportar ocupa a linha inteira em vez de deixar uma faixa de filete à direita */
  .tbar__ico{flex:1 1 auto}
  .drange{flex:1 1 100%}
  .vgate{margin:32px auto;padding:32px 20px}
}
@container vp (max-width:600px){
  /* quatro indicadores, não três como no Estoque: empilhados a 100% eles somariam 440px antes da
     primeira venda. Aqui o valor é só dinheiro e a descrição é curta, então dois por linha cabem
     em 390px sem quebrar nenhum número. */
  .kpi{flex:1 1 calc(50% - 1px);padding:14px 16px 16px}
  .kpi__v{font-size:23px;white-space:normal}
  .kpi__d{white-space:normal}
  .tbar__search{flex:1 1 100%}
  .tbar__sel{flex:1 1 calc(50% - 1px);min-width:0}
  /* sem "Novo lote" para dividir a terceira linha (esta tela não cria registro), o ícone de
     exportar ocupa a linha inteira em vez de deixar uma faixa de filete à direita */
  .tbar__ico{flex:1 1 auto}
  .drange{flex:1 1 100%}
  .vgate{margin:32px auto;padding:32px 20px}
}
.vgate{max-width:560px;margin:64px auto;text-align:center;background:var(--surface);border:1px solid var(--line);padding:44px 36px}
.vgate__ic{width:48px;height:48px;margin:0 auto 18px;display:grid;place-items:center;background:var(--ink-05);border:1px solid var(--line)}
.vgate__ic svg{width:22px;height:22px;fill:none;stroke:var(--ink-60);stroke-width:1.8}
.vgate h2{font-size:21px;font-weight:400;letter-spacing:-.02em}
.vgate p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:11px;text-wrap:pretty}
</style>
</head>
<body>

<header class="shell">
  <a class="shell__brand" href="painel.html" aria-label="WhatTheChip 什么芯片"><img class="lg-l" src="../../static/img/whatthechip-lightmode.svg" alt="WhatTheChip" /><img class="lg-d" src="../../static/img/whatthechip-darkmode.svg" alt="WhatTheChip" /></a>
  <nav class="shell__nav">
    <a class="nlink" href="painel.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.2L12 3.5l8.5 6.7V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg><span>Painel</span></a>
    <a class="nlink" href="estoque.html" data-wtc-needs="lots"><svg viewBox="0 0 24 24"><path d="M12 3l9 4.5v9L12 21l-9-4.5v-9z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg><span>Estoque</span></a>
    <a class="nlink is-active" href="vendas-lista.html"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12"/><circle cx="12" cy="12" r="2.7"/><path d="M6 9.6v4.8M18 9.6v4.8"/></svg><span>Vendas</span></a>
  </nav>
  <div class="shell__spacer"></div>
  <div class="shell__org">
    <div class="shell__org-logo" data-wtc-avatar>eM</div>
    <div class="shell__org-txt"><span class="shell__org-name" data-wtc-company>eMiner</span></div>
  </div>
  <div class="shell__who">
    <div class="shell__avatar" data-wtc-initials>MG</div>
    <div class="shell__user"><b data-wtc-user>Matheus G.</b><span class="shell__role" data-wtc-role>Gerente</span></div>
  </div>
  <button class="shell__ico" aria-label="Notificações" id="bell"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></button>
  <button class="shell__ico shell__ico--theme" id="theme-btn" type="button" aria-label="Alternar modo escuro" aria-pressed="false"><svg class="sun" viewBox="0 0 24 24" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg><svg class="moon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
  <button class="shell__ico shell__ico--lang" aria-label="Idioma">PT</button>

</header>

<div id="gate" style="display:none"><div class="wrap"><div class="vgate">
  <div class="vgate__ic"><svg viewBox="0 0 24 24" stroke-linecap="round"><rect x="4" y="10" width="16" height="10"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
  <h2>Vendas é restrito</h2>
  <p>Esta área mostra o resultado dos lotes e os repasses da empresa. Só o <b>administrador da conta</b> tem acesso.</p>
</div></div></div>

<div class="phead" id="phead">
  <div class="wrap"><div class="phead__in">
    <div>
      <h1>Vendas <b>eMiner</b></h1>
    </div>
    <div class="phead__right">
    </div>
  </div></div>
</div>

<div class="kpis" id="kpis">
  <div class="wrap"><div class="kpis__in" id="vk"></div></div>
</div>

<main class="wrap" id="app"><div class="work">
  <div class="slabel"><h2>Todas as vendas</h2></div>
  <section class="panel">
    <div class="tbar">
      <div class="tbar__search">
        <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" type="text" placeholder="Buscar por ordem, lote ou rastreio…" autocomplete="off" />
      </div>
      <select class="tbar__sel" id="f-status">
        <option value="all">Todos os status</option>
        <option value="noprice">Falta preço</option>
        <option value="tofreeze">A congelar</option>
        <option value="draft">Despacho pendente</option>
        <option value="transit">A caminho</option>
        <option value="check">A conferir</option>
        <option value="result">Resultado pronto</option>
        <option value="topay">A receber</option>
        <option value="paid">Recebidas</option>
      </select>
      <select class="tbar__sel" id="f-period">
        <option value="any">Qualquer período</option>
        <option value="d7">Últimos 7 dias</option>
        <option value="d30">Últimos 30 dias</option>
        <option value="custom">Datas específicas…</option>
      </select>
      <div class="drange hide" id="drange"><span>de</span><input type="date" id="d-from" value="2026-06-01" aria-label="Data inicial" /><span>até</span><input type="date" id="d-to" value="2026-08-02" aria-label="Data final" /></div>
      <button class="tbar__ico" id="exp-tbl" type="button" title="Exportar CSV"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg></button>
    </div>
    <div class="dtab__wrap" id="tw"><table class="dtab">
      <thead><tr><th>Ordem</th><th>Lote</th><th class="num">Chips</th><th class="num money" data-money>Estimado</th><th class="num hide-lg money" data-money>Resultado</th><th class="num hide-sm money" data-money>A receber</th><th>Status</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table></div>
  </section>
</div></main>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span id="toast-txt"></span></div>

<script src="fx.js"></script>
<script src="theme.js?v=3"></script>
<script src="shell.js?v=4"></script>
<script src="access.js?v=3"></script>
<script src="viewport.js?v=7"></script>
<script src="venda-data.js?v=7"></script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i);},S=window.WTCSales,FX=window.WTCFX;
var tT;function say(m){$("toast-txt").textContent=m;$("toast").classList.add("is-on");clearTimeout(tT);tT=setTimeout(function(){$("toast").classList.remove("is-on");},2800);}
var TODAY=new Date(2026,7,2);   /* "hoje" do protótipo: 02/08/2026 */

/* DINHEIRO É PAPEL, NÃO TELA — o mesmo gate da ficha da venda. Gerente e operador acompanham os
   lotes sem cifra: a lista fica com lote, volume e status, e a FAIXA DE INDICADORES sai inteira
   (os quatro são dinheiro puro; sem eles não há o que indicar aqui). */
function M(){var a=window.WTCAccess&&window.WTCAccess.access();return !a||a.can_see_price;}
function gate(){
  var a=window.WTCAccess&&window.WTCAccess.access();
  var ok=!a||a.can_sales;
  $("app").style.display=ok?"":"none";
  $("phead").style.display=ok?"":"none";
  $("kpis").style.display=ok&&M()?"":"none";
  $("gate").style.display=ok?"none":"";
  return ok;
}
function rate(s){return s.lock||FX.rate()||0;}
/* a data da venda é o fechamento do lote ("31/07") — mesmo filtro de período do Estoque */
function dateOf(s){var m=/(\d{2})\/(\d{2})/.exec(s.closed||"");return m?new Date(2026,+m[2]-1,+m[1]):null;}
function inPeriod(s){
  var pe=$("f-period").value,d=dateOf(s);
  if(pe==="any"||!d)return true;
  if(pe==="custom"){
    var a=$("d-from").value?new Date($("d-from").value+"T00:00:00"):null;
    var b=$("d-to").value?new Date($("d-to").value+"T23:59:59"):null;
    if(a&&d<a)return false;
    if(b&&d>b)return false;
    return true;
  }
  return (TODAY-d)/864e5<=(pe==="d7"?7:30);
}
function view(){
  var q=$("q").value.trim().toLowerCase(),st=$("f-status").value;
  return S.all().filter(function(s){
    if(st!=="all"&&s.st!==st)return false;
    if(!inPeriod(s))return false;
    if(q){
      var hay=(S.code(s)+" "+S.soCode(s)+" "+(s.carrier||"")+" "+(s.track||"")).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}

function kpis(){
  if(!M())return;
  var A=S.all();
  /* recebido e a receber são a perna WhatTheChip → cliente, e ela é em US$ */
  var got=A.reduce(function(a,s){return a+S.paidUsd(s);},0);
  var due=A.reduce(function(a,s){return a+(S.hasRes(s)?S.restUsd(s):0);},0);
  var res=A.filter(S.hasRes).reduce(function(a,s){return a+S.grossCny(s);},0);
  var flight=A.filter(function(s){return !S.hasRes(s);});
  var est=flight.reduce(function(a,s){return a+S.cny(s);},0);
  function c(l,v,d,k){return '<div class="kpi'+(k?" kpi--"+k:"")+'"><div class="kpi__l">'+l+'</div><div class="kpi__v">'+v+'</div>'+(d?'<div class="kpi__d">'+d+'</div>':'')+'</div>';}
  $("vk").innerHTML=
  /* a faixa de indicadores é agregado do ANO: mostra unidade inteira, em moeda nenhuma mostra
     centavo — os dois KPIs em ¥ já faziam isso, e o centavo exato vive na ficha da venda.
     Além de ser a regra certa, "US$ 10.986,60" tem 13 caracteres e não caberia na célula. */
     c("Recebido este ano",FX.usd0(got),A.filter(function(s){return S.paidUsd(s)>0;}).length+" repasses","got")
    +c("A receber",FX.usd0(due),due?"líquido, já sem o serviço":"nada em aberto","due")
    +c("Resultados este ano",FX.cny(res),A.filter(S.hasRes).length+" lotes conferidos","res")
    +c("Em trânsito",FX.cny(est),flight.length+" lotes ainda sem resultado");
}
function exportCsv(){
  var v=view(),q=function(x){x=String(x==null?"":x);return /[";,\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;};
  var $m=M();
  var rows=[["Ordem","Emitida","Lote","Origem","Transportadora","Rastreio","Chips"]
    .concat($m?["CNY estimado","CNY resultado","USD a receber"]:[]).concat(["Status"])];
  v.forEach(function(s){
    rows.push([S.soCode(s),S.soDate(s),S.code(s),s.origin==="pcb"?"Placa (PCB)":"Celular",s.carrier||"",s.track||"",S.units(s)]
      .concat($m?[Math.round(S.cny(s)),S.hasRes(s)?Math.round(S.grossCny(s)):"",S.hasRes(s)?S.restUsd(s).toFixed(2):""]:[])
      .concat([S.stTag(s)[1]]));
  });
  var csv="\ufeff"+rows.map(function(r){return r.map(q).join(";");}).join("\r\n");
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="vendas-eminer.csv";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
  say("Exportado · "+v.length+" vendas");
}
function rows(){
  var v=view();
  if(!M())Array.prototype.forEach.call(document.querySelectorAll("#tw [data-money]"),function(th){th.hidden=true;});
  $("list").innerHTML=v.length?v.map(function(s){
    var st=S.stTag(s),done=S.hasRes(s),rest=S.restUsd(s),td=S.todo(s),$m=M();
    var a=S.act(s);
    return '<tr data-n="'+s.n+'" data-meta="'+FX.originName(s.origin)+'">'
      +'<td class="c"><div style="display:flex;align-items:center;gap:9px">'+S.soCode(s)+'<span class="when">'+S.soDate(s)+'</span></div></td>'
      +'<td data-label="Lote"><div style="display:flex;align-items:center;gap:9px">'+S.code(s)+'<span class="hide-lg">'+FX.origin(s.origin,"sm")+'</span></div></td>'
      /* sem dinheiro, o volume é a célula que decide (.key) — é o que resta de grandeza na linha */
      +'<td class="n'+($m?'':' key')+'" data-label="Chips" data-suffix="un.">'+S.units(s).toLocaleString("pt-BR")+'</td>'
      /* o ≈ marca ESTIMATIVA: sem câmbio travado o valor é re-resolvido a cada leitura e leva til;
         travado, sai exato. E lote com caixa sem cotação diz que o total está incompleto. */
      +($m?'<td class="v key" data-label="Estimado">'+FX.cny(S.cny(s))+'<span'+(S.noPrice(s)?' class="due"':'')+'>'
        +(S.noPrice(s)?S.noPrice(s)+(S.noPrice(s)===1?' caixa sem preço':' caixas sem preço')
                      :(s.lock?'':'≈ ')+FX.usd(S.cny(s)*rate(s)))+'</span></td>'
        +'<td class="v hide-lg" data-label="Resultado">'+(done?FX.cny(S.grossCny(s))+'<span>'+FX.usd(S.grossUsd(s))+'</span>':'<span class="none">—</span>')+'</td>'
        +'<td class="v hide-sm" data-label="A receber">'+(done?FX.usd(rest)+'<span class="'+(rest?"due":"got")+'">'+(rest?"em aberto":"repassado")+'</span>':'<span class="none">—</span>')+'</td>':'')
      +'<td data-label="Status">'+(a?'<span class="act act--'+(a.kind==="box"?"ship":"accept")+'"><i></i>'+a.label+'</span>'
        :'<span class="tag '+st[0]+'" title="'+S.waiting(s)+'"><span class="dot"></span>'+st[1]+'</span>')+'</td>'
      +'<td class="go"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></td></tr>';
  }).join(""):'<tr><td colspan="'+(M()?8:5)+'" class="dtab__empty"><b>Nenhuma venda encontrada</b>Ajuste a busca ou os filtros acima.</td></tr>';
  Array.prototype.forEach.call($("list").querySelectorAll("[data-n]"),function(tr){
    tr.onclick=function(){location.href="venda.html?v="+tr.getAttribute("data-n");};
  });
}
function fx(){
  var s=FX.state();
  if($("fxr"))$("fxr").textContent=s.has?("1 ¥ ≈ US$ "+s.rate.toFixed(4)):"sem taxa do dia";
  kpis();rows();
}
if(gate()){
  FX.onChange(fx);
  $("q").oninput=rows;
  $("f-status").onchange=rows;
  $("f-period").onchange=function(){
    $("drange").classList.toggle("hide",$("f-period").value!=="custom");
    rows();
  };
  $("d-from").onchange=rows;$("d-to").onchange=rows;
  $("exp-tbl").onclick=exportCsv;
  kpis();rows();
}
})();
</script>
</body>
</html>
