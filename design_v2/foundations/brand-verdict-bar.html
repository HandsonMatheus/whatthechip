<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--sans);background:var(--surface);color:var(--text);padding:20px;-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px;flex-wrap:wrap}.mono{font-family:var(--mono)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:11px">
 <div style="display:flex;height:12px;overflow:hidden;background:var(--surface-2)"><i style="width:64%;background:var(--green-50)"></i><i style="width:28%;background:var(--red-50)"></i><i style="width:8%;background:var(--amber-40)"></i></div>
 <div style="display:flex;gap:20px;font-size:12.5px;color:var(--muted)">
 <span style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;background:var(--green-50)"></span>Rentável <b class="mono" style="color:var(--text)">1.180</b></span>
 <span style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;background:var(--red-50)"></span>Não rentável <b class="mono" style="color:var(--text)">520</b></span>
 <span style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;background:var(--amber-40)"></span>Indeterminado <b class="mono" style="color:var(--text)">140</b></span>
 </div></div></body></html>
