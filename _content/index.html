<!-- HERO -->
<div class="hero">
  <h1>Guia de Identificação de Chips IC<br>para o mercado de refurbishing</h1>
  <p class="lede">Identifique qualquer chip pelo prefixo gravado no encapsulamento</p>

  <form class="pin-search" id="pin-search" role="search" onsubmit="event.preventDefault();" autocomplete="off">

    <!-- Label da família detectada -->
    <div class="pin-family-hint" id="pin-family-hint"></div>

    <!-- Caixas de caracteres -->
    <div class="pin-row" id="pin-row">
      <span class="pin-icon" aria-hidden="true">⌕</span>
      <div class="pin-boxes" id="pin-boxes"></div>
      <!-- Input real oculto — captura teclado, paste, mobile keyboard -->
      <input type="text" id="big-search-input"
             class="pin-real-input"
             autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false"
             aria-label="Digite o Part Number do chip" />
    </div>

    <!-- Resultados: decode card + lista de prefixos -->
    <div id="big-search-results">
      <div id="dc-result"></div>
      <div id="prefix-results"></div>
    </div>

  </form>

  <p class="quicklinks">
    <span class="count">{{PREFIX_COUNT}} prefixos catalogados</span>
  </p>
</div>

<script>
(function() {
  'use strict';

  var DATA        = {{PREFIX_DATA}};
  var input       = document.getElementById('big-search-input');
  var pinRow      = document.getElementById('pin-row');
  var pinBoxes    = document.getElementById('pin-boxes');
  var familyHint  = document.getElementById('pin-family-hint');
  var results     = document.getElementById('big-search-results');
  var dcResult    = document.getElementById('dc-result');
  var prefixDiv   = document.getElementById('prefix-results');

  // ── Utilitários ─────────────────────────────────────────────────────────────
  function normalize(s) { return s.toUpperCase().replace(/[^A-Z0-9]/g, ''); }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fabToPage(fab) {
    var map = {
      'Samsung':           'fab-samsung',
      'SK Hynix':          'fab-hynix',
      'Micron':            'fab-micron',
      'Elpida':            'fab-elpida',
      'Toshiba / Kioxia':  'fab-toshiba',
      'SanDisk / WD':      'fab-sandisk',
      'Nanya':             'fab-nanya',
      'Kingston':          'fab-kingston',
      'Kingston (HyperX)': 'fab-kingston',
      'Rayson':            'fab-rayson',
      'ISSI':              'fab-issi',
      'GigaDevice':        'fab-gigadevice',
    };
    return map[fab] || 'prefixos';
  }

  // isDjango: verdadeiro quando servido por Django (qualquer porta HTTP/HTTPS),
  // falso apenas quando aberto como arquivo local (file://) ou com extensão .html.
  // A checagem anterior usava window.location.port !== '' — quebrava em porta 80/443
  // (Nginx, proxy, domínio sem porta explícita).
  var isDjango = window.location.protocol !== 'file:' && !window.location.pathname.endsWith('.html');

  function pageUrl(slug) {
    return isDjango ? '/' + slug + '/' : slug + '.html';
  }

  // ── Estado do PIN ────────────────────────────────────────────────────────────
  var PIN_DEFAULT   = 8;   // caixas mostradas antes de identificar família
  var PIN_MAX       = 18;  // teto absoluto
  var _currentLen   = PIN_DEFAULT;
  var _detectedFam  = null;
  var _debounceTimer = null;
  var _lastApiPn    = '';

  // ── Renderiza as caixas ──────────────────────────────────────────────────────
  function renderBoxes(value, targetLen) {
    var len = Math.max(targetLen, value.length + (targetLen > value.length ? 0 : 2));
    len = Math.min(len, PIN_MAX);

    // Só reconstrói o DOM se a quantidade mudou
    if (pinBoxes.children.length !== len) {
      pinBoxes.innerHTML = '';
      for (var i = 0; i < len; i++) {
        var box = document.createElement('span');
        box.className = 'pin-box';
        pinBoxes.appendChild(box);
      }
      _currentLen = len;
    }

    var boxes = pinBoxes.querySelectorAll('.pin-box');
    var prefixLen = _detectedFam ? normalize(_detectedFam.prefix).length : 0;

    for (var j = 0; j < boxes.length; j++) {
      var ch = value[j] || '';
      boxes[j].textContent = ch;
      boxes[j].className = 'pin-box'
        + (ch ? ' pin-filled' : '')
        + (j === value.length ? ' pin-cursor' : '')
        + (j < prefixLen && ch ? ' pin-prefix' : '');
    }
  }

  // ── Atualiza hint da família ─────────────────────────────────────────────────
  function updateHint(fam) {
    if (!fam) {
      familyHint.textContent = '';
      familyHint.className = 'pin-family-hint';
      return;
    }
    familyHint.textContent = fam.fab + ' · ' + fam.tipo
      + (fam.pn_length ? '  (' + fam.pn_length + ' chars)' : '');
    familyHint.className = 'pin-family-hint pin-family-hint--active';
  }

  // ── Camada 1: busca de prefixos (client-side, instantânea) ──────────────────
  function matchPrefix(row, q) {
    var parts = row.prefix.split('/').map(function(p) {
      return normalize(p.replace(/\.\.\.$/, '').trim());
    });
    return parts.some(function(p) { return p.startsWith(q); })
        || normalize(row.fab).includes(q)
        || normalize(row.tipo).includes(q);
  }

  function bestMatch(q) {
    // Retorna a família com prefixo mais longo que ainda faça startsWith no q
    var best = null;
    DATA.forEach(function(row) {
      var parts = row.prefix.split('/').map(function(p) {
        return normalize(p.replace(/\.\.\.$/, '').trim());
      });
      parts.forEach(function(p) {
        if (q.startsWith(p) && (!best || p.length > normalize(best.prefix).length)) {
          best = row;
        }
      });
    });
    return best;
  }

  function renderPrefixRows(hits, q) {
    var MAX = 14;
    var header = '<div class="pr-header"><span>Prefixo</span><span>Fabricante</span><span>Tipo / Categoria</span></div>';
    var rows = hits.slice(0, MAX).map(function(r) {
      var cleanPrefix = r.prefix.replace(/\.+$/, '').replace(/[^A-Za-z0-9]/g, '');
      var page = fabToPage(r.fab);
      return '<a class="pr-row" href="/' + page + '/#highlight-' + cleanPrefix + '">'
        + '<span class="pr-prefix">' + r.prefix + '</span>'
        + '<span class="pr-fab">'    + r.fab    + '</span>'
        + '<span class="pr-tipo">'   + r.tipo   + '</span>'
        + '</a>';
    }).join('');
    var more   = hits.length > MAX ? (hits.length - MAX) + ' ocultos · ' : '';
    var footer = '<div class="pr-footer">' + more + '<a href="' + pageUrl('prefixos') + '">Ver tabela completa →</a></div>';
    return header + rows + footer;
  }

  // ── Camada 2: decode via HTMX ────────────────────────────────────────────────
  function callApi(pn) {
    if (!isDjango) return;
    if (pn === _lastApiPn) return;
    _lastApiPn = pn;
    if (dcResult) dcResult.innerHTML = '<div class="dc-loading">Consultando base de dados<span class="dc-ellipsis"></span></div>';
    htmx.ajax('GET', '/chips/decode/?pn=' + encodeURIComponent(pn), {
      target: '#dc-result',
      swap:   'innerHTML'
    });
  }

  // ── Render principal ─────────────────────────────────────────────────────────
  function render(raw) {
    var q = normalize(raw);

    if (q.length === 0) {
      renderBoxes('', PIN_DEFAULT);
      updateHint(null);
      _detectedFam = null;
      results.style.display = 'none';
      prefixDiv.innerHTML = '';
      if (dcResult) dcResult.innerHTML = '';
      _lastApiPn = '';
      clearTimeout(_debounceTimer);
      return;
    }

    // ── Detecta família ──────────────────────────────────────────────────────
    var fam = bestMatch(q);
    if (fam !== _detectedFam) {
      _detectedFam = fam;
      updateHint(fam);
      // Reset do decode se mudou de família
      if (dcResult) dcResult.innerHTML = '';
      _lastApiPn = '';
    }

    // ── Calcula quantas caixas mostrar ───────────────────────────────────────
    var targetLen = PIN_DEFAULT;
    if (fam && fam.pn_length) {
      targetLen = fam.pn_length;
    } else if (q.length >= PIN_DEFAULT) {
      // Sem pn_length definido: expande conforme o usuário digita
      targetLen = q.length + 2;
    }
    renderBoxes(q, targetLen);

    // ── Camada 1: prefixos (instantâneo) ────────────────────────────────────
    var hits = DATA.filter(function(r) { return matchPrefix(r, q); });
    if (hits.length === 0) {
      prefixDiv.innerHTML = '<div class="pr-empty">Nenhum prefixo encontrado para "<strong>'
        + escHtml(raw) + '</strong>". <a href="' + pageUrl('prefixos') + '">Ver tabela completa →</a></div>';
    } else {
      prefixDiv.innerHTML = renderPrefixRows(hits, q);
    }
    results.style.display = 'block';

    // ── Camada 2: trigger do decode ──────────────────────────────────────────
    clearTimeout(_debounceTimer);

    if (fam && fam.pn_length && q.length >= fam.pn_length) {
      // PN completo para família conhecida → dispara imediatamente
      callApi(q);
    } else if (q.length >= 4) {
      // Família sem pn_length definido → debounce de 500ms
      _debounceTimer = setTimeout(function() { callApi(q); }, 500);
    }
  }

  // ── Inicialização: caixas vazias ─────────────────────────────────────────────
  renderBoxes('', PIN_DEFAULT);

  // ── Foco: clicar em qualquer lugar do pin-row foca o input ──────────────────
  if (pinRow) {
    pinRow.addEventListener('click', function() { input && input.focus(); });
  }

  // ── Eventos do input ─────────────────────────────────────────────────────────
  if (input) {
    input.addEventListener('input', function() {
      // Força maiúsculo e limpa caracteres inválidos direto no input
      var clean = normalize(this.value);
      if (this.value !== clean) this.value = clean;
      render(clean);
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(_debounceTimer);
        var q = normalize(this.value);
        if (isDjango && q.length >= 4) callApi(q);
      }
      if (e.key === 'Escape') {
        this.value = '';
        render('');
        this.blur();
      }
    });

    // Foca o input ao carregar a página
    setTimeout(function() { input.focus(); }, 100);
  }

  // ── Fecha resultados ao clicar fora ─────────────────────────────────────────
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#pin-search')) {
      results.style.display = 'none';
    }
  });

  // ── API global para sugestões fuzzy ─────────────────────────────────────────
  window.triggerSearch = function(pn) {
    if (!input) return;
    var clean = normalize(pn);
    input.value = clean;
    render(clean);
    if (isDjango && clean.length >= 4) callApi(clean);
  };

  // ── Clipboard helper: tenta navigator.clipboard, cai em execCommand ─────────
  // navigator.clipboard.writeText exige contexto seguro (HTTPS ou localhost).
  // execCommand('copy') é deprecated mas funciona em HTTP para compatibilidade.
  function _copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('execCommand retornou false'));
      } catch (err) {
        document.body.removeChild(ta);
        reject(err);
      }
    });
  }

  // ── Botão de debug: copia diagnóstico completo para o clipboard ──────────────
  // Lê os dados do atributo data-debug embedado no card pelo servidor.
  // NÃO usa fetch — assim o clipboard API é chamado dentro do mesmo gesto do
  // usuário (user activation), resolvendo a falha silenciosa que acontecia quando
  // o fetch demorava (ex: Gemini em background) e expirava a janela de permissão.
  if (dcResult) {
    dcResult.addEventListener('click', function(e) {
      var btn = e.target.closest('.dc-copy-btn');
      if (!btn) return;
      var card = btn.closest('[data-pn]');
      var pn   = card ? card.getAttribute('data-pn') : '';
      if (!pn) return;

      // Lê JSON embedado no card (injetado pelo decode_html view via data-debug)
      var raw = card ? card.getAttribute('data-debug') : null;
      var d;
      try { d = raw ? JSON.parse(raw) : null; } catch (_) { d = null; }

      function buildDebugText(d) {
        var lines = [];
        var now   = new Date().toLocaleString('pt-BR');
        var sep   = '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━';

        lines.push('=== WhatTheChip Debug ===');
        lines.push('PN:      ' + (d.pn || pn));
        lines.push('Horário: ' + now);

        lines.push('');
        lines.push(sep + ' RESULTADO VISÍVEL');
        lines.push('Tipo:        ' + (d.chip_type    || '—'));
        lines.push('Subtipo:     ' + (d.subtype       || '—'));
        lines.push('Marca:       ' + (d.brand         || '—'));
        if (d.is_emcp) {
          lines.push('NAND:        ' + (d.emcp_nand   || '—'));
          lines.push('RAM:         ' + (d.emcp_ram    || '—'));
          lines.push('Dispositivo: ' + (d.emcp_device || '—'));
        } else {
          lines.push('Capacidade:  ' + (d.capacity     || '—'));
          lines.push('DRAM:        ' + (d.dram_density  || '—'));
          lines.push('Interface:   ' + (d.interface     || '—'));
          lines.push('Dispositivo: ' + (d.device        || '—'));
        }
        lines.push('Sufixo:      ' + (d.suffix_note   || '—'));
        lines.push('Confiança:   ' + (d.confidence     || '—'));
        lines.push('Tip:         ' + (d.tip            || '—'));

        lines.push('');
        lines.push(sep + ' MOTOR DE CLASSIFICAÇÃO');
        lines.push('Fonte:         ' + (d.classification_source || '—'));
        lines.push('Família:       ' + (d.family_prefix          || '—'));
        lines.push('known_exact:   ' + !!d.known_exact);
        lines.push('is_emcp:       ' + !!d.is_emcp);
        if (d.is_emcp) {
          lines.push('emcp_source:   ' + (d.emcp_source || '—'));
        }
        lines.push('from_web:      ' + !!d.from_web);
        lines.push('raw_in_db:     ' + !!d.raw_in_db);
        lines.push('remarked_flag: ' + !!d.remarked_flag);
        if (d.remarked_note) {
          lines.push('remarked_note: ' + d.remarked_note);
        }
        var geminiStatus = d.gemini_searched
          ? (d.gemini_found ? 'encontrado' : 'não encontrado')
          : 'não executado';
        lines.push('Gemini:        ' + geminiStatus);
        lines.push('doc_url:       ' + (d.doc_url    || '—'));
        lines.push('source_url:    ' + (d.source_url || '—'));

        if (d.fuzzy_suggestions && d.fuzzy_suggestions.length) {
          lines.push('fuzzy_sugest.: ' + d.fuzzy_suggestions.join(', '));
        }

        lines.push('');
        lines.push(sep + ' JSON COMPLETO');
        lines.push(JSON.stringify(d, null, 2));

        return lines.join('\n');
      }

      function restoreBtn() {
        btn.textContent = '📋 Debug';
        btn.disabled    = false;
      }

      if (d) {
        // Caminho rápido: dados já no DOM → copia dentro do gesto do usuário
        btn.disabled    = true;
        btn.textContent = '…';
        _copyText(buildDebugText(d))
          .then(function() {
            btn.textContent = '✓ Copiado!';
            setTimeout(restoreBtn, 2000);
          })
          .catch(function(err) {
            console.error('[WTC debug copy]', err);
            btn.textContent = 'Erro';
            setTimeout(restoreBtn, 2000);
          });
      } else if (isDjango) {
        // Fallback: card sem data-debug (renderizado antes da atualização) → fetch
        btn.disabled    = true;
        btn.textContent = '…';
        fetch('/chips/search/?pn=' + encodeURIComponent(pn))
          .then(function(r) { return r.json(); })
          .then(function(data) { return _copyText(buildDebugText(data)); })
          .then(function() {
            btn.textContent = '✓ Copiado!';
            setTimeout(restoreBtn, 2000);
          })
          .catch(function(err) {
            console.error('[WTC debug copy]', err);
            btn.textContent = 'Erro';
            setTimeout(restoreBtn, 2000);
          });
      }
    });
  }

})();
</script>
