<!-- ══════════════════════════════════════════════════════
     INDEX — WhatTheChip · 什么芯片   (redesenho "Render", finder bar)
     Injetado por pages/views.home — NÃO usar tags Django aqui, apenas os
     placeholders de dados PREFIX_DATA / STAT_* (entre chaves duplas) que a
     view substitui via str.replace.
     A nav e o footer ficam em base.html; o visual vem de static/css/design.css.
     O resultado REAL vem de /chips/search/ (JSON) — o JS abaixo consome esse
     endpoint (sem catálogo fake). Estados via data-state em #app.
     ══════════════════════════════════════════════════════ -->

<div class="app" data-state="idle" id="app">
  <div class="stage">
    <div class="col-main">

      <!-- Brandmark (grande no idle; pequeno à esquerda ao mostrar resultado) -->
      <div class="brandmark" aria-label="WhatTheChip 什么芯片">
        <img class="is-light" src="/static/img/wtc-logo-light.svg" alt="WhatTheChip 什么芯片" />
        <img class="is-dark" src="/static/img/wtc-logo-dark.svg" alt="" aria-hidden="true" />
      </div>

      <!-- Finder bar -->
      <div class="finder-wrap">
        <form class="finder" id="pn-form" role="search" autocomplete="off">
          <span class="finder__search" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>

          <input class="finder__input" id="pn-input" type="text"
                 inputmode="latin" spellcheck="false"
                 autocapitalize="characters" autocorrect="off" autocomplete="off"
                 placeholder="搜索 Part Number…  例如 KMQ310006A"
                 aria-label="芯片 Part Number" />

          <button type="button" class="finder__mic wtc-mic-btn" id="pn-mic"
                  data-mic-target="pn-input" data-mic-cta="pn-decode" data-mic-hint="pn-hint"
                  aria-label="说出 Part Number" title="说出 Part Number"></button>

          <button type="submit" class="finder__go" id="pn-decode" aria-label="识别" disabled>
            <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span class="spin" aria-hidden="true"></span>
            <span class="finder__go-label">识别</span>
          </button>
        </form>

        <div class="finder-bar" id="pn-bar"></div>

        <div class="subline">
          <div class="hintkeys" id="pn-hint"><span class="kbd">Enter</span> 识别 <span class="meta-sep">·</span> <span class="kbd">Esc</span> 清除</div>
        </div>
      </div>

      <!-- Exemplos clicáveis (idle) -->
      <div class="quick">
        <div class="quick__label">试试看</div>
        <div class="quick__grid" id="pn-examples"></div>
      </div>

      <!-- Resultado / não encontrado (preenchido por JS a partir de /chips/search/) -->
      <div class="result-slot" id="result-wrap"></div>

    </div>
  </div>

  <!-- Stats strip — números reais do banco -->
  <section class="stats">
    <div class="stats__inner">
      <div class="stat"><div class="stat__v">{{STAT_PARTS}}</div><div class="stat__l">数据库芯片数</div></div>
      <div class="stat"><div class="stat__v">{{STAT_BRANDS}}</div><div class="stat__l">制造商</div></div>
      <div class="stat"><div class="stat__v">{{STAT_FAMILIES}}</div><div class="stat__l">系列</div></div>
      <div class="stat"><div class="stat__v">{{STAT_SEARCHES}}</div><div class="stat__l">查询次数</div></div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  // Dados de prefixo injetados pelo Django (detecção de família client-side).
  var DATA = {{PREFIX_DATA}};

  var app        = document.getElementById('app');
  var form       = document.getElementById('pn-form');
  var input      = document.getElementById('pn-input');
  var goBtn      = document.getElementById('pn-decode');
  var bar        = document.getElementById('pn-bar');
  var hint       = document.getElementById('pn-hint');
  var resultWrap = document.getElementById('result-wrap');
  var examplesW  = document.getElementById('pn-examples');

  var _lastApiPn   = '';
  var _lastData    = null;
  var _detectedFam = null;

  // Rótulos de confiança (sem emoji — o "dot" colorido está no CSS).
  var CONF_LABEL = {
    confirmed:'已确认', manual:'手动', grammar:'语法', distributor:'分销商',
    ai_high:'AI · 高可信度', ai_medium:'AI · 中可信度', ai_low:'AI · 低可信度',
    estimated:'估算'
  };
  // Veredito: chave canônica (do servidor) → [classe CSS, rótulo]. Ver I18N.md.
  var VERDICT = {
    'RENTÁVEL':      ['rentavel', '有利可图'],
    'NÃO RENTÁVEL':  ['nao',      '无利可图'],
    'INDETERMINADO': ['indet',    '待定']
  };
  // PNs de exemplo (o dono pode ajustar esta lista conforme o catálogo).
  var EXAMPLES = [
    { pn:'KMQ310006A',     m:'Samsung · eMCP' },
    { pn:'K4B2G1646F',     m:'Samsung · DDR3' },
    { pn:'MT53E1G32D2FW',  m:'Micron · LPDDR' },
    { pn:'H9HCNNNCPMMLXR', m:'SK Hynix · LPDDR4X' }
  ];

  var IC_WARN  = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17v.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
  var IC_ERR   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3M11 8v3M11 14v.01"/></svg>';
  var IC_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var IC_SEND  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>';

  function normalize(s) { return (s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function effectiveConf(d) {
    if (d.grammar_complete && d.confidence === 'estimated') return 'grammar';
    return d.confidence || 'estimated';
  }

  // Detecção de família por prefixo (mais longo vence). DATA[].prefix pode ter
  // várias formas separadas por "/" e sufixo "..." (ex.: "KMQ.../KMD...").
  function bestMatch(q) {
    var best = null;
    DATA.forEach(function (row) {
      var parts = row.prefix.split('/').map(function (p) {
        return normalize(p.replace(/\.\.\.$/, '').trim());
      });
      parts.forEach(function (p) {
        if (p && q.indexOf(p) === 0 && (!best || p.length > normalize(best.prefix).length)) best = row;
      });
    });
    return best;
  }

  // Monta os chips de exemplo.
  EXAMPLES.forEach(function (e) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip-ex';
    b.innerHTML = '<span class="chip-ex__pn">' + escHtml(e.pn) + '</span>'
                + '<span class="chip-ex__meta">' + escHtml(e.m) + '</span>';
    b.addEventListener('click', function () { input.value = e.pn; render(normalize(e.pn)); decode(); });
    examplesW.appendChild(b);
  });

  // Atualiza o estado do botão e a dica conforme o texto digitado.
  function updateChrome(q, fam) {
    goBtn.disabled = q.length < 4;

    if (!q) {
      hint.innerHTML = '<span class="kbd">Enter</span> 识别 <span class="meta-sep">·</span> <span class="kbd">Esc</span> 清除';
      hint.className = 'hintkeys';
    } else if (q.length < 4) {
      hint.textContent = '继续输入——至少 4 个字符 (' + q.length + '/4)';
      hint.className = 'hintkeys is-warn';
    } else if (fam && fam.pn_length && q.length < fam.pn_length) {
      hint.textContent = 'PN 不完整——' + q.length + '/' + fam.pn_length + ' 个字符';
      hint.className = 'hintkeys is-warn';
    } else {
      hint.innerHTML = '<span class="kbd">Enter</span> 识别';
      hint.className = 'hintkeys';
    }
  }

  function render(q) {
    var fam = q ? bestMatch(q) : null;
    if (fam !== _detectedFam) { _detectedFam = fam; _lastApiPn = ''; }
    updateChrome(q, fam);
  }

  function setLoading(on) {
    goBtn.classList.toggle('is-loading', on);
    bar.classList.toggle('is-on', on);
    goBtn.disabled = on || normalize(input.value).length < 4;
  }

  function specCell(label, val, hi) {
    var has = val && val !== '—';
    return '<div class="spec' + (hi ? ' spec--hi' : '') + '">'
      + '<div class="spec__label">' + escHtml(label) + '</div>'
      + '<div class="spec__val' + (has ? '' : ' dim') + '">' + escHtml(has ? val : '—') + '</div></div>';
  }

  function renderResult(d) {
    _lastData = d;
    app.setAttribute('data-state', 'result');

    var eConf = effectiveConf(d);
    var v = VERDICT[d.profitable];
    var verdict = v ? '<div class="verdict"><span class="vpill vpill--' + v[0] + '">' + escHtml(v[1]) + '</span></div>' : '';

    var subtype = d.subtype ? '<small>' + escHtml(d.subtype) + '</small>' : '';
    var head = '<div class="card__head"><div class="card__id">'
      + '<div class="card__type">' + escHtml(d.chip_type || 'Chip') + subtype + '</div>'
      + '<div class="card__mfg"><span class="l">制造商</span>' + escHtml(d.brand || '—') + '</div>'
      + '</div>' + verdict + '</div>';

    var undoc = '';
    if (d.family_undocumented) {
      var pnEnc = encodeURIComponent(d.pn || '');
      undoc = '<div class="undoc">'
        + '<div class="undoc__t">' + IC_WARN + '无可核实公开文档的系列</div>'
        + '<div class="undoc__b">Este Part Number pertence a uma família <strong>nunca documentada oficialmente</strong>. '
        + 'Os dados abaixo são <strong>estimativas por analogia estrutural</strong> — confirme fisicamente antes de decidir.</div>'
        + '<a class="undoc__btn" href="mailto:eminerparaguay@gmail.com?subject=Informa%C3%A7%C3%B5es%20sobre%20' + pnEnc
        + '&body=PN%3A%20' + pnEnc + '%0A%0AInforma%C3%A7%C3%B5es%3A">📩 您认识这颗芯片吗？请联系我们</a>'
        + '</div>';
    }

    var grid;
    if (d.is_emcp) {
      grid = specCell('NAND', d.emcp_nand, true) + specCell('RAM', d.emcp_ram, true)
           + specCell('器件', d.emcp_device || d.device, false) + specCell('Interface', d.interface, false);
    } else {
      grid = specCell('密度', d.dram_density, true) + specCell('Interface', d.interface, false)
           + specCell('容量', d.capacity, false) + specCell('器件', d.device, false);
    }

    var foot = '<div class="card__foot"><span class="pntag">' + escHtml(d.pn || '') + '</span>'
      + '<span class="dotsep">·</span>'
      + '<span class="conf conf--' + eConf + '"><span class="dot"></span>' + escHtml(CONF_LABEL[eConf] || d.confidence || '') + '</span>';
    foot += '<span class="dotsep">·</span><button type="button" class="linkbtn linkbtn--danger" id="rp-report">报告错误</button></div>';

    resultWrap.innerHTML = '<div class="card">' + head + undoc
      + '<div class="card__grid">' + grid + '</div>' + foot + '</div>';

    wireResultActions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderNotFound(d, pn) {
    _lastData = null;
    app.setAttribute('data-state', 'notfound');

    var sugg = '';
    var list = (d && d.fuzzy_suggestions) || [];
    if (list.length) {
      sugg = '<div class="suggest"><div class="suggest__label">您是否想找？</div>';
      var bn = normalize(pn);
      list.forEach(function (s) {
        var t = normalize(s), i = 0;
        while (i < bn.length && i < t.length && bn[i] === t[i]) i++;
        var pre = t.slice(0, i), dif = t.slice(i);
        sugg += '<button type="button" class="suggest__item" data-sug="' + escHtml(s) + '">'
          + '<span class="suggest__pn">' + escHtml(pre) + '<span class="diff">' + escHtml(dif) + '</span></span>'
          + '<span class="suggest__arrow">' + IC_ARROW + '</span></button>';
      });
      sugg += '</div>';
    }

    resultWrap.innerHTML = '<div class="notfound">'
      + '<div class="notfound__head"><div class="notfound__badge">' + IC_ERR + '</div>'
      + '<div><div class="notfound__t">芯片未识别 <small>数据库中无匹配</small></div></div></div>'
      + '<div class="notfound__body">未找到 <strong>' + escHtml(pn) + '</strong>. '
      + 'Verifique o código gravado no chip e tente novamente.' + sugg
      + '<button type="button" class="btn-primary" id="rp-submit">' + IC_SEND + '提交分析</button>'
      + '</div></div>';

    var sb = document.getElementById('rp-submit');
    if (sb) sb.addEventListener('click', function () { if (window.wtcOpenSubmitModal) window.wtcOpenSubmitModal(pn); });
    resultWrap.querySelectorAll('[data-sug]').forEach(function (btn) {
      btn.addEventListener('click', function () { triggerSearch(btn.getAttribute('data-sug')); });
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Report + Debug do card.
  function wireResultActions() {
    var rb = document.getElementById('rp-report');
    if (rb) rb.addEventListener('click', function () {
      if (!_lastData) return;
      var body = new URLSearchParams({
        pn:        _lastData.pn || '',
        chip_type: _lastData.chip_type || '',
        capacity:  _lastData.capacity || _lastData.emcp_nand || ''
      });
      fetch('/chips/report/', { method: 'POST', body: body })
        .then(function () { rb.outerHTML = '<span class="ok">✓ Reporte recebido — obrigado!</span>'; })
        .catch(function () {});
    });

  }

  // Chama a API real de classificação do Django.
  function decode() {
    var q = normalize(input.value);
    if (q.length < 4) return;
    if (q === _lastApiPn) return;
    _lastApiPn = q;

    setLoading(true);
    fetch('/chips/search/?pn=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.known) renderResult(d); else renderNotFound(d, q); })
      .catch(function () {
        hint.textContent = '连接错误——请重试';
        hint.className = 'hintkeys is-warn';
        _lastApiPn = '';
      })
      .finally(function () {
        setLoading(false);
        input.focus(); input.select();   // fluxo de bancada: re-foca e seleciona
      });
  }

  function clearAll() {
    input.value = '';
    _lastApiPn = '';
    app.setAttribute('data-state', 'idle');
    resultWrap.innerHTML = '';
    render('');
    input.focus();
  }

  // Eventos.
  input.addEventListener('input', function () {
    var clean = normalize(this.value);
    if (this.value !== clean) this.value = clean;
    render(clean);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter')  { e.preventDefault(); decode(); }
    if (e.key === 'Escape') { e.preventDefault(); clearAll(); this.blur(); }
  });
  form.addEventListener('submit', function (e) { e.preventDefault(); decode(); });
  goBtn.addEventListener('click', function (e) { e.preventDefault(); decode(); });

  // API global (sugestões do card, mic.js CTA, etc.).
  window.triggerSearch = function (pn) {
    var clean = normalize(pn);
    input.value = clean;
    render(clean);
    if (clean.length >= 4) decode();
  };

  // Init.
  render('');
  setTimeout(function () { input.focus(); }, 120);
})();
</script>
