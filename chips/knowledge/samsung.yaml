  #   oficial Samsung: 64GB + 24Gb=3GB), KMGX6001BA/BM (distribuidores "32+24 D3 LPDDR3").
  #   ⚠ P6 = 3GB no KMG (LPDDR3) mas 4GB no KMD (LPDDR4X) — mesmo código, per-família de novo.
  #   CORRIGIDO 2026-07-04 via audit_known_parts: P6 estava 4GB (herdado do golden congelado do
  #   mapa compartilhado, ERRADO); o banco confirmado (3GB) e a página Samsung pegaram o erro.
  SAM_EMCP_RAM_KMG:
  - [D6, LPDDR3 3GB, '']
  - [P6, LPDDR3 3GB, '']
  - [X6, LPDDR3 3GB, '']
  # KMAG / KMAS (uMCP LPDDR5 UFS 3.1, flagship): famílias de LETRA (pn[2]='A') → split como KMD/KMG.
  #   decode_gen (pn[3:5]) → RAM "LPDDR5 <cap>"; NAND compartilhado (SAM_EMCP_NAND G9=128/S9=256).
  #   Corrige o Frankenstein antigo ("tipo 'A' — consultar datasheet"). Fonte: KMAG9001PM-B814
  #   (128GB + 64Gb=8GB) / KMAS9001PM-BC02 (256GB + 64Gb=8GB) — confirmados pelo dono (win-source) +
  #   tips + mapa compartilhado. ⚠ win-source é distribuidor: se surgir Octopart divergente, reavaliar.
  SAM_EMCP_RAM_KMAG:
  - [G9, LPDDR5 8GB, '']
  SAM_EMCP_RAM_KMAS:
  - [S9, LPDDR5 8GB, '']
  # KM4 (LPDDR4X — CORRIGIDO de LPDDR4, era erro no yaml): X6 = 32GB NAND + 2GB (16Gb).
  #   Fonte: KM4X6001KM-B321 (Preduo spec table: Type eMCP, Sub-Type eMMC+LPDDR4x,
  #   Density 32+16; página oficial Samsung: 16Gb LPDDR4X 0.6V). ⚠ MESMA geração do KMD
  #   mas X6=2GB≠3GB → mapa próprio (o caso que provou "por-família").
  #   ⚠ FORMATO DIFERENTE das de letra: KM4 é família de DÍGITO (pn[2]='4') e a regra de
  #   ouro #5 proíbe decode_gen no dígito. Então usa mapa COMBINADO [chave, NAND, RAM] via
  #   decode_cap (não o split NAND+RAM). O tipo (LPDDR4X) vem do subtype. Mesma exatidão.
  SAM_EMCP_CAP_KM4:
  - [X6, 32GB, 2GB]
  # KM5 (uMCP LPDDR4X + UFS): chave LONGA pn[3:8] (decode_cap_len=5). Por quê: a RAM
  #   depende do pn[7], fora do pn[3:5] — KM5L900**0** = 6GB vs KM5L900**1** = 4GB (mesmo
  #   "L9"). A chave de 5 chars (L9000 vs L9001) desambigua. NÃO é caso especial de uMCP —
  #   é só afinar decode_cap_len (campo por-família), mesmo padrão combinado do KM4.
  #   Fontes Tier-1 arbitradas pelo dono: L9000/L9001 = Samsung Global; V8001/C7001 = Octopart
  #   ("128GB+32Gb"=4GB / "64GB+32Gb"=4GB). ⚠ Preduo dava V8001=6GB — ERRADO (broker não confiável).
  #   2026-07-14: +3 chaves — V7001 (NX Electronics ficha dedicada "128GB UFS2.1+ 32Gb LPDDR4X"
  #   + Samsung Global indexado + Win Source, todas 4GB) · P8001/P9001 (Samsung Semiconductor
  #   USA/Global oficiais + Lisleapex/Puris/Avaq/NX Electronics, todas 4GB — mesmo padrão "001"=4GB
