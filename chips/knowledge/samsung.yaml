  # ── eMCP RAM POR FAMÍLIA (keyed no código de densidade, padrão SK Hynix) ────
  # ⚠ POR QUE POR-FAMÍLIA E NÃO POR-GERAÇÃO (decisão 2026-07-04): famílias da MESMA
  # geração divergem no MESMO código. KMD e KM4 são AMBOS LPDDR4X, mas X6 = 3GB (KMD,
  # 24Gb) vs 2GB (KM4, 16Gb) — a RAM depende da FAMÍLIA (pn[2]), não só da densidade.
  # Um mapa por família = ZERO ambiguidade. O NAND continua compartilhado (SAM_EMCP_NAND:
  # X6=32GB em qualquer família). SÓ chaves com fonte Tier-1 confirmada — grammar EXATA,
  # jamais aproximada. RAM embutida (val_primary "LPDDR<g> <cap>") → engine usa direto
  # como emcp_ram. Código sem confirmação → RAM "não mapeada" (NAND ainda decodifica).
  # Cada mapa CRESCE por família conforme confirmamos mais densidades.
  #
  # ⚠ CORRIGIDO 2026-08-20 (bug de POSIÇÃO — achado em pesquisa cruzada por outro
  #   chat, dossiê "KMDL6001DA", + verificação independente nesta sessão via
  #   Preduo/Puris/13 known_parts de produção): a chave acima (D6/H6/P6/X6/V6/C6…)
  #   é só o NAND (pn[3:5]). A RAM da família KMD NÃO depende dela — depende da
  #   CAUDA do PN (pn[8:10]). Prova (mesmo pn[3:5], RAM diferente por cauda):
  #   KMDP6001DA (P6+DA)=4GB × KMDP60018M (P6+8M)=3GB · KMDD6001DM (D6+DM)=4GB ×
  #   KMDD60018M (D6+8M)=3GB · KMDX6001DM (X6+DM)=4GB × KMDX60018M (X6+8M)=3GB.
  #   O fix de 2026-07-04 (comentário acima, "bug X6") consertou QUAL MAPA se lê
  #   (compartilhado→por-família); não consertou QUAL POSIÇÃO. Por isso o mapa
  #   agora é keyed pela CAUDA (decode_gen_pos=8, não mais 3) — e por não
  #   depender do NAND, o MESMO mapa de 5 chaves cobre TODAS as densidades da
  #   família (inclusive V6/C6, que antes não tinham RAM nenhuma mapeada).
  #   5 chaves confirmadas (Preduo + Puris + known_parts confirmed/manual de
  #   produção, zero contradição): 8M/BM→3GB (24Gb) · DA/DB/DM→4GB (32Gb).
  #   Impacto medido em produção (2026-08-20, auditoria read-only): 1 chip
  #   com RAM ERRADA (KMDP60018M, mostrava 4GB) + 4 chips sem RAM mapeada
  #   (KMDV6001DA/DM) — todos corrigidos por este fix. ⚠ NÃO replicar por
  #   analogia pra KMG/KMAG/KMAS (mesma exposição estrutural, mas NÃO
  #   verificado ainda — regra #12 da marca: cada família exige o próprio
  #   levantamento de peças reais antes de mexer).
  SAM_EMCP_RAM_KMD:
  - [8M, LPDDR4X 3GB, '']
  - [BM, LPDDR4X 3GB, '']
  - [DA, LPDDR4X 4GB, '']
  - [DB, LPDDR4X 4GB, '']
  - [DM, LPDDR4X 4GB, '']
  # KMG (LPDDR3): TODOS os códigos confirmados → 3GB (24Gb LPDDR3); só o NAND varia. Fontes Tier-1:
