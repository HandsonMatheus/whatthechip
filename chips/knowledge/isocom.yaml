brand:
  name: ISOCOM
  code: ISC
  notes: >
    Marca em onboarding (2026-09-01, evoluida em 5 rodadas no mesmo dia). Identidade provavel
    (ver ISOCOM.md secao 3.1 pro relato completo): Shenzhen Longsys Electronics Co., Ltd. --
    mesma dona da Foresee/FRS e da Lexar. "ISOCOM" aparece em memorias distribuidas sob esse
    nome; ha tambem uma "Isocom Components 2004 Limited" britanica (optoacopladores/MOSFETs/SSR,
    catalogo oficial conferido -- ZERO produtos de memoria), envolvida num litigio de marca
    registrada JA ENCERRADO com a Longsys (TTAB case 91256263, terminado -- trademarkelite.com).
    As duas marcas sao entidades DIFERENTES; a memoria aqui e da Longsys.

    2 familias eMMC (MEMA e MEMD) entraram em 2026-09-01, ambas capacidade LITERAL no PN (mesma
    convencao Foresee) e interface 'eMMC 5.1' -- as duas confirmadas via uma lista oficial de
    fornecedores aprovados de eMMC da Rockchip (documento tecnico de fabricante de SoC, hospedado
    em dl.radxa.com -- Tier-1-adjacente, nao e distribuidor nem marketplace): MEMA016G-M0T00
    (16GB), MEMA032G-M0D01 (32GB), MEMDNN032G-M1S07 (32GB) e MEMDNN064G-M1D03 (64GB), todos 3D
    TLC, FBGA 11.5x13mm. MEMD espelha a estrutura FEMD da Foresee EXATAMENTE (prefixo 4 chars
    terminado em D, grade NN em pn[4:6], capacidade em pn[6:9]) -- reforça a hipotese Longsys.
    MEMA usa capacidade direto em pn[4:7], sem grade infixa (forma mais curta, e a que aparece
    fisicamente marcada no chip do dono -- sem sufixo). Ancoras known_parts confirmadas:
    MEMA032G (32GB) e MEMA064G (64GB) em submissions/isocom_mema_2026-09-01.yaml
    (confidence=manual, confirmacao FISICA do dono); MEMA016G, MEMDNN032G-M1S07 e
    MEMDNN064G-M1D03 em submissions/isocom_mema_r2_2026-09-01.yaml (confidence=distributor,
    fonte = lista Rockchip). Relacao exata entre MEMA0xxG e MEMDNNxxxG-xxxxx (mesmo produto sob
    2 nomes, ou 2 SKUs distintos com specs identicas) NAO confirmada -- documentada como
    observacao, nao como fato.

    Pin-count FBGA exato do MEMA032G (fisico) permanece nao 100% cravado (Rockchip diz 11.5x13mm
    mas nao da a contagem de pinos; MEMA064G tem "153-Pin FBGA" via Alibaba) -- baixo risco, nao
    bloqueia nada. Nenhum datasheet OFICIAL da Longsys/fabricante foi encontrado ainda; toda a
    base e lista de fornecedor aprovado (Rockchip) + distribuidor + confirmacao fisica do dono +
    registro de marca/TTAB -- nenhuma fonte "confirmed" (3 fontes de engenharia cruzadas) ainda.

    brand.code = "ISC" e PALPITE deste chat (padrao de 3 letras da maioria das marcas). Ja em
    uso nas familias e nos known_parts -- trocar agora nao e mais custo zero (seria rename de
    Brand apos possivel commit, nao so texto).
maps:
  # Capacidade eMMC -- LITERAL no PN (3 digitos = GB, NAO Gbit -- mesma convencao Foresee/Longsys,
  # ver FRS_EMMC_CAP em foresee.yaml). Compartilhado entre MEMA (pn[4:7]) e MEMD (pn[6:9]) --
  # mesma tabela de digito->GB, so a POSICAO no PN muda por familia (igual Foresee reusa
  # FRS_EMMC_CAP entre FEMD/FEMK/FEMJ). '016' e '032' confirmados via lista de fornecedores
  # aprovados de eMMC da Rockchip (dl.radxa.com, doc tecnico de fabricante de SoC -- ver
  # reasoning das familias MEMA/MEMD). '064' via titulo de listagem Alibaba (MEMA064G) +
  # cross-referencia MEMDNN064G-M1D03 (mesma Rockchip). NAO extrapolar pra outros codigos
  # (004/008/128/256) sem evidencia -- ficam INDETERMINADO.
  ISC_EMMC_CAP:
  - ['016', 16GB, '']
  - ['032', 32GB, '']
  - ['064', 64GB, '']
