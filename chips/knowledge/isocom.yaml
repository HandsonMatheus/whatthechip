  tip: 'eMMC ISOCOM/Longbo, familia MEMA (MEMAxxxG, 8 chars -- forma CURTA sem sufixo, a que aparece marcada fisicamente no chip do dono). Capacidade LITERAL no PN: pn[4:7] = GB (016=16GB, 032=32GB, 064=64GB) -- mesma convencao Foresee/Longsys (3 digitos = GB, nao Gbit). eMMC 5.1 confirmado (lista de fornecedores aprovados Rockchip). 3D TLC, FBGA 11.5x13mm (Rockchip); pacote fisico BGA confirmado pelo dono pro MEMA032G. O ORDER CODE completo do fabricante tem sufixo (ex.: MEMA016G-M0T00, MEMA032G-M0D01, visto na mesma lista Rockchip) que NAO decodificamos aqui -- so o prefixo base de 8 chars, que e o que o dono realmente escaneia/marca. Identidade da marca: provavelmente Shenzhen Longsys Electronics (mesma dona da Foresee) -- ver ISOCOM.md secao 3.'
  reasoning: '["Confirmacao fisica do dono (fotos, 2026-09-01): chip BGA com "ISOCOM", "MEMA032G", "M0S00" e "203520081878" impressos. MEMA032G corroborado por digipart.com/part/MEMA032G e por listagem Alibaba (titulo: MEMA032G-Longbo-32GB-ISOCOM-eMMC-flash). MEMA064G corroborado por listagem Alibaba (titulo: MEMA064G-M0S00-EMMC-64GB-153FBGA-Memory) -- mesma marcacao M0S00 do 032G, mesma familia/pacote. MEMA016G e MEMA032G confirmados de forma independente numa 2a busca (2026-09-01, apos feedback do dono pra pesquisar mais a fundo): lista de fornecedores aprovados de eMMC da Rockchip (RKeMMCSupportList, dl.radxa.com -- doc tecnico de fabricante de SoC, nao distribuidor/marketplace) lista MEMA016G-M0T00 (16GB, 128Gb TLC x1, 3D, v5.1, 11.5x13mm) e MEMA032G-M0D01 (32GB, 256Gb TLC x1, 3D, v5.1, 11.5x13mm) -- confirma capacidade E versao eMMC exata dos dois, deixando de ser so derivacao de regra pro MEMA016G. Regra posicional (pn[4:7]=GB) validada em pelo menos 3 PNs (016/032/064) com fonte propria cada um, ZERO contra-exemplos. A mesma lista Rockchip tambem lista MEMDNN032G-M1S07 (32GB) e MEMDNN064G-M1D03 (64GB) -- prefixo IRMAO com estrutura identica a FEMD da Foresee (grade NN antes da capacidade); ver familia MEMD separada. known_parts MEMA032G/MEMA064G ficam em submissions/isocom_mema_2026-09-01.yaml (confidence:manual, ancora=confirmacao fisica); MEMA016G ganhou known_part proprio em submissions/isocom_mema_r2_2026-09-01.yaml (confidence:distributor, ancora=lista Rockchip) -- a gramatica aqui cobre esses 3 e qualquer sibling futuro dentro dos codigos ja no ISC_EMMC_CAP, sem exigir confirmacao individual de cada capacidade, mas NAO extrapola pra codigos ainda nao vistos (004/008/128/256 ficam INDETERMINADO ate serem observados em fonte real)."]'
