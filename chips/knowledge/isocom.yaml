  reasoning: '["Lista de fornecedores aprovados de eMMC da Rockchip (RKeMMCSupportList Ver1.84, dl.radxa.com -- doc tecnico de fabricante de SoC pra qualificacao de hardware, nao distribuidor/marketplace), achada numa 2a busca (2026-09-01) apos feedback do dono pra pesquisar o cluster mais a fundo. Lista MEMDNN032G-M1S07 (32GB, 256Gb TLC x1, 3D, v5.1, 11.5x13mm) e MEMDNN064G-M1D03 (64GB, 512Gb TLC x1, 3D, v5.1, 11.5x13mm) lado a lado com MEMA016G-M0T00/MEMA032G-M0D01 na MESMA tabela, mesmo fabricante ISOCOM. Estrutura MEMD+NN+capacidade+G bate exatamente com o padrao FEMD+NN+capacidade+G da Foresee (chips/knowledge/foresee.yaml) -- mesma convencao, reforca a hipotese de mesma controladora (Longsys) ou ao menos mesma pratica de nomenclatura de fabrica. 2 PNs independentes (032/064) confirmam a posicao pn[6:9] sem contra-exemplo. known_parts MEMDNN032G-M1S07 e MEMDNN064G-M1D03 (forma completa com sufixo, unica forma observada) em submissions/isocom_mema_r2_2026-09-01.yaml, confidence:distributor (fonte tecnica unica, nao cruzada com 2a fonte independente ainda). ATUALIZACAO 2026-09-02: debug de estoque ao vivo do dono capturou PN MEMDNN064G (bare, 10 chars, sem sufixo, in_review_queue=false -- engine ja classificou certo via gramatica: eMMC 64GB ISC 5.1 RENTAVEL) -- primeira vez que se ve a forma SEM sufixo desta familia na pratica, usada pra fixar pn_length=10 (paralelo exato ao pn_length=8 da MEMA, que tambem so aparece bare no chip fisico apesar do order code ter sufixo). NAO virou known_part novo: a unica evidencia da forma bare especifica e o proprio scan, sem fonte externa citavel confirmando MEMDNN064G (sem sufixo) como PN valido -- capacidade/interface aqui vem so por heranca da gramatica + do known_part irmao MEMDNN064G-M1D03, nao por confirmacao independente da string bare em si."]'
