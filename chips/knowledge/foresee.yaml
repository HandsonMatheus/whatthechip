  tip: 'eMMC 5.1 Foresee/Longsys (FEMD...), FBGA153 11.5x13mm, 1.8V/3.3V. Capacidade LITERAL no PN: pn[6:9] = GB (032=32GB, 128=128GB) — NAO e Gbit (o "G" da Foresee muda de unidade por linha; aqui e GB). Grade em pn[4:6]: NN=comercial · ME=automotivo Grade2 (AEC-Q100) · RM=industrial · RW=industrial wide-temp · MW=automotivo Grade3. pn[3]=D (pacote padrao). Sufixo (5 chars apos "-") = revisao/NAND/controlador, nao decodificado. Legado equivalente: FSEIASLD-* (mesmo produto que FEMDRM*). Fonte: catalogo oficial Longsys + LCSC.'
