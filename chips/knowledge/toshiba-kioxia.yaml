  tip: 'eMMC Toshiba / Kioxia — armazenamento Flash puro, sem RAM embutida. Prefixo THGBM cobre chips pré-2019 (Toshiba) e pós-2019 (Kioxia), e DUAS eras de encoding: letra (2015+, BiCS, 5.0/5.1) e dígito/letra-A (2012-2013, FG-NAND, 4.41/4.5 — série Premium/Supreme/Prime). Geração automática: pn[5] → N/T/F/B/D=eMMC 5.0 · H/J/U/G=eMMC 5.1 · 5=eMMC 4.41(α) · A=eMMC 4.5 (5 e A confirmados 2026-07-09 via tabela oficial Toshiba semicon-storage.co.jp "Card Interface e-MMC" dez/2013, mirror Arrow.com — ambas VERSÕES DISTINTAS, não confundir: 4.41α ⊂ Premium/Supreme "5G..."/"5G..." vs 4.5 ⊂ mesma linha "AG..."). ⚠ Separe por geração: 5.1 vale ~15-25% a mais que 5.0; 4.41/4.5 são MAIS ANTIGAS que 5.0/5.1 (2012-13 vs 2015+). Capacidade: pn[7:10] → chave 3-chars → THGBM_CAP: 5A1=4GB · 5D1=4GB · 5D2=8GB · 6A2=8GB · 6C1=8GB · 6D1=8GB · 6D4=8GB (⚠ SEM fonte Tier-1 direta pro PN THGBM1G6D4EBAID — mesma disciplina do 7D4: inferência estrutural aprovada pelo dono 2026-09-01, dígito pn[7]="6" já confirmado 8GB em 4 combinações) · 7A2=16GB · 7A4=16GB · 7B2=16GB · 7C1=16GB · 7C2=16GB · 7D2=16GB · 7D4=16GB (⚠ SEM fonte Tier-1 direta pro PN THGBMBG7D4KBAIR — busca exaustiva em 2026-07-10 não achou nenhuma menção dele; chave adicionada por INFERÊNCIA ESTRUTURAL aprovada explicitamente pelo dono: pn[7]="7" já confirmado 16GB em 6 variantes de stack distintas — A2/A4/B2/C1/C2/D2 — e o padrão "só pn[7] determina capacidade" está confirmado em TODOS os outros dígitos de densidade da família) · 8A4=32GB · 8B4=32GB · 8C2=32GB · 8C4=32GB · 8D4=32GB · 8D8=32GB (confirmado 2026-07-09 via iFixit Motorola Xoom Teardown, THGBM2G8D8FBAIB) · 8T4=32GB · 9A8=64GB · 9B8=64GB · 9C4=64GB · 9C8=64GB · 9D8=64GB (confirmado 2026-07-10 via catálogo oficial Toshiba/toshiba-components.com "FAB_eMMC_1405", THGBMBG9D8KBAIG) · 9T8=64GB · 0C8=128GB · 0CB=128GB · 0T8=128GB (0C8 e 0T8 confirmados 2026-07-08; 5A1/6A2/7A2/7B2/8A4/8B4/8T4/9A8/9B8/9T8 confirmados 2026-07-09 na mesma tabela oficial — cobre as classes Premium "xAy"/Supreme "xBy"/Prime "xTy" da série 4GB-64GB; 7A4=16GB confirmado 2026-07-09 via iFixit Samsung Galaxy S4 Teardown, Step 13 — prova que pn[9] ("dies") NÃO multiplica capacidade dentro do mesmo dígito de densidade pn[7]: 7A2/7A4 (dies 2 vs 4) ambos 16GB, igual ao já visto 7A2/7B2/7C1/7C2/7D2 — só o dígito pn[7] determina a faixa, pn[8]/pn[9] são variante comercial/stack sem efeito multiplicativo na capacidade). Varredura ampla 2026-07-09 (busca site-wide por teardowns iFixit citando THGBM, a pedido do dono — "não esqueça mais, de 1 em 1 só vamos terminar em 5 anos"): 4 PNs novos confirmados Tier-1 em UMA rodada — THGBMDG5D1LBAIT (4GB, Playdate), THGBM2G8D8FBAIB (32GB, Motorola Xoom — chave "8D8" NOVA), THGBM4G7D2GBAIE (16GB, Motorola Droid RAZR); pn[5]="2" e "4" vistos nesses 2 últimos NÃO entraram no THGBM_GEN (geração eMMC não confirmada nessas fontes — só a capacidade). Pacote: BGA153 (11.5×13mm) ou variantes WFBGA/VFBGA169/TFBGA169 conforme classe/capacidade — não afeta decode. Interface paralela eMMC — NUNCA confundir com socket UFS (THGJF/THGAF/KLUE). Destino: bancada reacondicional Flash eMMC (separar por geração).'
  reasoning: '["T=Toshiba · H=NAND tipo H · G=geração G · B=bus 8-bit · M=mobile", "pn[5]: código de geração NAND — N/T/F/B/D=eMMC 5.0 · H/J/U/G=eMMC 5.1 · 5=eMMC 4.41(α) · A=eMMC 4.5", "pn[6]=G: constante identificadora de processo (sem decode)", "pn[7:10]: chave composta 3-chars → capacidade total (ver THGBM_CAP)", "pn[7]: densidade/die — 5=32Gb(4GB) · 6=64Gb(8GB) · 7=128Gb(16GB) · 8=64Gb(8GB) · 9=64Gb(8GB)", "pn[8]: tipo de stack — A/B/C/D/J/K/T (sem impacto na capacidade total — confirmado 2x: 7A2/7B2 ambos 16GB, 8A4/8B4/8T4 ambos 32GB, 9A8/9B8/9T8 ambos 64GB, mesmo padrão de A/B/T sendo classe comercial Premium/Supreme/Prime, não capacidade)", "pn[9]: número de dies — 1/2/4/8", "pn[10]: tier de qualidade (L/K/E/J/G) — sem decode de capacidade", "pn[11:13]=BA: package BGA153", "pn[13]: I/O voltage — I=1.8V · U=dual-voltage 1.8/3.3V", "2026-07-08: D=eMMC5.0 e 0C8=128GB confirmados via tabela oficial Toshiba/TAEC (Mouser Toshiba_FAB_eMMC-1511507.pdf) e datasheet THGBMNG5D1LBAIL (LCSC C391255, rev1.0 2018); 8D4=32GB reconfirmado via datasheet THGBMBG8D4KBAIR (rev1.1 2013); G=eMMC5.1 e 0T8=128GB via THGBMGT0T8LBAIG (Octopart/Avnet/Puris, Tier2-3, sem datasheet individual — ver notes do known_part)", "2026-07-09: 5=eMMC4.41(α) confirmado via datasheet completo THGBM5G6A2JBAIR (boardcon.com, PDF oficial Toshiba jun/2012, rev0.2) — 8GB, chave 6A2; A=eMMC4.5 + TODA a tabela de capacidade 4GB-64GB (5A1/6A2/7A2/7B2/8A4/8B4/8T4/9A8/9B8/9T8) confirmados via página oficial de produto Toshiba semicon-storage.co.jp \"Card Interface : e-MMC\" (mirror Arrow.com, capturada dez/2013) — tabela completa com PN+capacidade+classe+versão+pacote pras 3 classes Premium/Supreme/Prime; classe Prime (7G..., ex. THGBM7G8T4JBAIR) tem capacidade confirmada mas versão eMMC não ficou clara na tabela — pn[5]=7 NÃO adicionado ao THGBM_GEN por falta de confirmação, só a capacidade (8T4/9T8) entrou", "2026-07-09 (2ª pesquisa, PN THGBM5G7A4JBA4W): chave nova \"7A4\" confirmada 16GB via iFixit Samsung Galaxy S4 Teardown (ifixit.com/Teardown/Samsung+Galaxy+S4+Teardown/13947, Step 13, publicado abr/2013, lido diretamente) — \"Toshiba THGBM5G7A4JBA4W 16 GB eMMC\". Achado estrutural: 7A2 (dies=2) e 7A4 (dies=4) dão a MESMA capacidade (16GB) — descarta hipótese de que pn[9] (dies) multiplica capacidade; o dígito pn[7] sozinho já determina a faixa de capacidade, confirmado agora em density=7 com 2 valores de dies diferentes dando o mesmo resultado (mesmo padrão do density=6: 6A2/6C1/6D1 todos 8GB com dies variando 1-2)", "2026-07-09 (varredura ampla, pedido do dono): busca site-wide iFixit por \"THGBM\" achou 7 teardowns citando a família numa rodada só (Nintendo Switch, Amazon Fire TV, Kindle Voyage, Motorola Moto X, Playdate, Motorola Xoom, Motorola Droid RAZR) — 3 PNs já batiam com known_parts existentes (THGBMHG8C2LBAIL/THGBM5G6A2JBAIR/THGBM5G5A1JBAIR/THGBMAG7A2JBAIR), 4 eram novos: THGBMDG5D1LBAIT (Playdate, 4GB, chave 5D1 já existente), THGBM2G8D8FBAIB (Motorola Xoom, 32GB, chave \"8D8\" NOVA no mapa), THGBM4G7D2GBAIE (Motorola Droid RAZR, 16GB, chave 7D2 já existente). Todos lidos diretamente da página iFixit (Tier-1), não resumo de busca — resumo do WebSearch cometeu erro nesta mesma rodada (afirmou THGBM1G5D2EBAI7=4GB, conflitando com 5D2=8GB já confirmado; PN descartado por não ter sido possível ler o PDF-fonte diretamente para verificar)", "2026-07-10 (PN THGBMBG6D1KBAIL, cluster \"BG\" completo): achado catálogo oficial Toshiba/toshiba-components.com \"FAB_eMMC_1405\" (mirror datasheet.live, lido diretamente, Copyright 2014 TOSHIBA corporation) com tabela EXPLÍCITA e COMPLETA da linha e-MMC standard-temp (A19nm/JEDEC5.0/-25°C a 85°C/153FBGA), 5 densidades: 4GB=THGBMBG5D1KBAIT · 8GB=THGBMBG6D1KBAIL (PN buscado) · 16GB=THGBMBG7D2KBAIL · 32GB=THGBMBG8D4KBAIR (já known_part) · 64GB=THGBMBG9D8KBAIG (chave \"9D8\" NOVA). A mesma tabela lista a coluna extended-temp (THGBMAG.../\"...JBAW*\", 19nm/JEDEC4.5/-40 a 85°C) e as 4 PNs dessa coluna JÁ estavam confirmados como known_part — corrobora o achado sem duplicar. THGBMBG7D2KBAIL teve confirmação ADICIONAL por datasheet oficial completo e independente (31pg, rev1.1 ago/2013, hospedado em s21i.faiusr.com mas com todo o conteúdo/boilerplate legal idêntico ao padrão Toshiba — CID Register mostra nome interno \"016GE2\"). ⚠ Resumo em prosa do WebSearch errou de novo nesta rodada (chamou THGBMBG5D1KBAIT de \"controlador de drive flash, 2GB, 65nm\" — contradiz a tabela oficial lida diretamente, que diz 4GB/A19nm/eMMC — confiar sempre na fonte primária, nunca no resumo).", "2026-07-10 (PN THGBMBG7D4KBAIR, chave \"7D4\" SEM fonte Tier-1 direta): busca exaustiva (datasheet.live, iiic.cc, Octopart PDF, censtry, veswin, jotrin — todas vazias ou sem menção ao PN) não achou NENHUMA fonte citando este PN específico. Decisão tomada em conjunto com o dono (pergunta feita no chat, resposta explícita \"opção 1\"): aceitar o padrão estrutural já multiplamente confirmado — pn[7]=\"7\" sempre decodifica 16GB, testado e confirmado Tier-1 em 6 combinações diferentes de pn[8:10] (7A2/7A4/7B2/7C1/7C2/7D2), mesmo padrão replicado em TODOS os outros dígitos da família (6xy sempre 8GB, 8xy sempre 32GB, 9xy sempre 64GB — nenhuma exceção documentada até hoje). \"7D4\" foi adicionado ao THGBM_CAP com base nessa inferência, NÃO em citação direta do PN — diferente de toda entrada anterior do mapa, que tinha pelo menos 1 fonte nomeando o PN exato. PNs que decodificarem por essa chave ficam confidence=estimated (só gramática, sem known_part) até aparecer fonte direta — NÃO submeter THGBMBG7D4KBAIR nem outro \"7D4\" como known_part confirmed/manual/distributor sem fonte própria, mesmo com a chave já na gramática (regra ''nunca adivinhar known_part'' continua valendo pra identidade do PN individual, só a GENERALIZAÇÃO de gramática foi aprovada).", "2026-07-10 (varredura ampla nº2, a pedido do dono — ''só achou esses 2? procure mais''): catálogo completo eMMC/UFS da Puris (puris.net/emmclist, fonte já usada antes neste projeto) trouxe TODOS os PNs Toshiba que eles vendem numa tabela só — cruzado contra os já submetidos, sobraram 20 PNs genuinamente novos. Dois achados Tier-1 fecharam a maior parte: (1) tabela oficial Toshiba/TAEC via DigiKey (media.digikey.com, PDF ''Card Interface e-MMC'', ago/2012) — 7 PNs novos com capacidade explícita, incluindo THGBM4T0DBGBAIJ=128GB (chave ''0DB'' NOVA) e THGBM4G6D2HBAIR=8GB (chave ''6D2'' NOVA, corroborado 2x por listagens eBay); (2) press release OFICIAL KIOXIA (kioxia.com/en-jp/business/news/2014/20141002-1.html, 2/out/2014) — tabela completa de 12 PNs da linha 15nm, 8 deles novos (THGBMFG6C1LBAIT=8GB, THGBMFG7C2LBAIL/W=16GB, THGBMFG8C4LBAIR/W=32GB, THGBMFG9C8LBAIG/X=64GB, THGBMFT0CBLBAIS=128GB — confirma a chave ''0CB'' já existente). Mais alguns via página dedicada Puris (Tier-3, ex. THGBMGG9T4LBAIR=64GB TLC eMMC5.1, chave ''9T4'' NOVA) e via existência na lista master Puris + chave já confirmada (THGBMAG8B4JBAWM, THGBMBG7C2KBAIL, THGBMHG7C2LBAIL, THGBMHG8C4LBAIR, THGBMHG9C8LBAIG). Dois PNs ficaram DE FORA: THGBH5G7A2JBAIH (prefixo ''THGBH'' não ''THGBM'', sem fonte) e THGBM1G5D2EBAI7 (resumo do WebSearch errou capacidade de novo, contradiz 5D2=8GB já confirmado). Ver submissions/toshiba-kioxia_thgbm_varredura2_2026-07-10.yaml.", "2026-07-10 (RESOLVIDO — PN era THGBMBG7D4KBAIW, não THGBMBG7D4KBAIR): o dono confirmou erro de digitação no final do PN original (\"1\"/\"I\" trocados — mesma confusão já vista no irmão THGBMBG7D2KBAIL/THGBMBG7D2KBA1L nos catálogos). Com o PN correto, achei fonte real: página de produto dedicada na Censtry (existência confirmada) + listagem Daraz.com.bd com campo estruturado \"Model Number: 16 Gigabyte\" (pacote com outros 4 chips, todos classe 16GB) + mesmo padrão em Amazon/Alibaba. Irmão THGBM4G7D4HBAIR (mesma chave \"7D4\", gen letter diferente) achado no mesmo pacote, também com página Censtry dedicada (1981 PCS em estoque). Ambos submetidos como known_part confidence=distributor (Tier-3) — ver submissions/toshiba-kioxia_thgbm_7d4_2026-07-10.yaml. A chave \"7D4\" na gramática (linha acima) permanece como estava — agora corroborada por fonte real, não só inferência estrutural pura.", "2026-08-24 (PN da bancada THGBM3G4D1FBAIG, pn[5]=3): gramática já decodificava capacidade certo (chave \"4D1\" já existente = 2GB), mas geração ficava sem Subtipo (pn[5]=\"3\" não estava no THGBM_GEN — mesma situação já documentada pras variantes \"2\" e \"4\"). Nesta rodada achei e li diretamente o catálogo oficial Toshiba/TAEC via DigiKey (\"Card Interface : e MMC\", media.digikey.com, datado 16/ago/2012, Copyright TOSHIBA CORPORATION) — MESMO documento já usado antes nesta família só pra capacidade (varredura nº2, 2026-07-10) — mas que eu não tinha lido a coluna \"e-MMC Version\" até agora: ela mostra explicitamente pn[5]=\"4\" -> e-MMC Version \"4.41\" (classificação \"-\", ou seja, SEM ser Premium/Supreme, diferente da linha \"5G...\" que é 4.41α/Premium-Supreme). Chave \"4\" ADICIONADA ao THGBM_GEN com essa fonte Tier-1 direta (tabela com Part Number + e-MMC Version lado a lado pras 7 densidades 2GB-128GB: THGBM4G4D1HBAIR/4G5D1HBAIR/4G6D2HBAIR/4G7D2GBAIE/4G8D4GBAIE/4G9D8GBAII/4T0DBGBAIJ — todos já eram known_part de rodada anterior, sem novidade de PN, só a geração). pn[5]=\"3\" (do PN da bancada) e pn[5]=\"1\" (THGBM1G8D8EBAI2, achado nesta mesma rodada via veswin.com) CONTINUAM sem fonte Tier-1 de geração — busca dedicada não achou tabela nem datasheet citando \"3G...\"/\"1G...\" com versão e-MMC explícita — ficam de fora do THGBM_GEN por ora (mesma disciplina já aplicada ao \"2\"), mas os 3 PNs (3G4D1FBAIG bancada, 3G5D1FBAIE irmã de capacidade via Jotrin/Ovaga, 1G8D8EBAI2 prima via veswin) entraram como known_part confidence=distributor — capacidade pela chave já confirmada, existência real por catálogo, geração deixada em aberto (Subtipo continua sem mapa pra esses 3 até aparecer fonte).", "2026-09-01 (PN da bancada digitado THGBM1G6DAEBA1D, string NÃO encontrada em nenhuma fonte): busca exaustiva (WebSearch em múltiplas variações, findcomponents.net, hkinventory, veswin, censtry, Octopart) não achou o PN exatamente como digitado. Duas posições batem no padrão de confusão de leitura já visto nesta família: pn[9]=\"A\" (posição de dies, historicamente só dígito 1/2/4/8 em toda a família) e pn[13]=\"1\" (posição de voltagem, historicamente só I/U — MESMA confusão 1↔I já resolvida antes no irmão THGBMBG7D4KBAIR/W, 2026-07-10). O candidato mais próximo real é THGBM1G6D4EBAID — existe como SKU no catálogo findcomponents.net, dentro de um cluster completo de variantes de sufixo do mesmo PN-base (THGBM1G6D4EBA14/EBAI4/EBAID/EBAI4DGH/EBAI4E10/EBAI4YCJ/EBAI4YDJ) — difere do digitado em EXATAMENTE essas 2 posições (pn[9] A→4, pn[13] 1→I). Pista adicional não usada como fonte (PDF de press release Toshiba 2008 \"largest density embedded NAND flash\", hospedado via datasheet.octopart.com, não foi possível extrair o texto pra ler direto — só o título/contexto apareceu no resumo de busca, que já errou 3x antes nesta família, então não conta como confirmação). Perguntado ao dono (pergunta direta no chat) qual candidato seguir — resposta explícita: confirmar THGBM1G6D4EBAID. Capacidade 8GB por INFERÊNCIA ESTRUTURAL, mesma disciplina já aprovada pro \"7D4\" (2026-07-10): dígito de densidade pn[7]=\"6\" já confirmado 8GB em 4 combinações Tier-1 diferentes (6A2/6C1/6D1/6D2), dies pn[9] comprovadamente não multiplica capacidade dentro do mesmo dígito, padrão sem exceção documentada em toda a família até hoje. \"6D4\" adicionado ao THGBM_CAP por essa inferência, NÃO por citação direta do PN — mesma ressalva do \"7D4\": fica confidence=estimated (só gramática) até aparecer fonte própria; NÃO submeter THGBM1G6D4EBAID nem outro \"6D4\" como known_part confirmed/manual/distributor sem fonte individual. Geração (pn[5]=\"1\") CONTINUA sem fonte Tier-1 — mesmo gap já documentado (THGBM1G8D8EBAI2, rodada 2026-08-24)."]'
