# Conhecimento Toshiba-Kioxia — GRAMÁTICA do catálogo (famílias + decode maps). UMA marca (code TXK):
# mesma empresa (Toshiba→Kioxia out/2019). THGBM tem decode (mapas THGBM_CAP/GEN); as demais famílias
# são magras (reconhecimento por prefixo; as specs vêm dos known_parts, que vivem no BANCO — Opção 2).
# Editar a gramática aqui, validar no portão (load_brands --brand toshiba-kioxia, dry-run), gravar com
# --commit. known_parts: via submit_known_parts → aprovação no admin. Convenção e formato: AUTORIA.md.
brand:
  name: Toshiba-Kioxia
  code: TXK
