o mesmo dígito de densidade pn[7]: 7A2/7A4 (dies 2 vs 4) ambos 16GB, igual ao já visto 7A2/7B2/7C1/7C2/7D2 — só o dígito pn[7] determina a faixa, pn[8]/pn[9] são variante comercial/stack sem efeito multiplicativo na capacidade). Varredura ampla 2026-07-09 (busca site-wide por teardowns iFixit citando THGBM, a pedido do dono — "não esqueça mais, de 1 em 1 só vamos terminar em 5 anos"): 4 PNs novos confirmados Tier-1 em UMA rodada — THGBMDG5D1LBAIT (4GB, Playdate), THGBM2G8D8FBAIB (32GB, Motorola Xoom — chave "8D8" NOVA), THGBM4G7D2GBAIE (16GB, Motorola Droid RAZR); pn[5]="2" e "4" vistos nesses 2 últimos NÃO entraram no THGBM_GEN (geração eMMC não confirmada nessas fontes — só a capacidade). Pacote: BGA153 (11.5×13mm) ou variantes WFBGA/VFBGA169/TFBGA169 conforme classe/capacidade — não afeta decode. Interface paralela eMMC — NUNCA confundir com socket UFS (THGJF/THGAF/KLUE). Destino: bancada reacondicional Flash eMMC (separar por geração).'
