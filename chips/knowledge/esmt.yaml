brand:
  name: ESMT
  code: ESMT
  notes: >
    Elite Semiconductor Memory Technology Inc. (Taiwan). Onboarding 2026-08-05.
    Familias "magras" (mesmo padrao das familias magras da Nanya) -- o prefixo ja
    fecha em densidade+organizacao literal (ex.: M15T1G1664A = DDR3(L) 1Gb x16);
    capacidade vem de known_parts confirmados, nao de decode posicional.
    RASCUNHO -- validado contra chips/knowledge/schema.py (Pydantic) fora do Django;
    ainda falta rodar "load_brands --brand esmt" (dry-run) no ambiente local real
    (checa colisao de prefixo entre marcas, algo que o portao standalone nao ve).

