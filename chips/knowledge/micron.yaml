  reasoning: '["MT → Micron Technology", "29 → MCP série (NAND+RAM combinados)", "TZZZ → bloco fixo família MCP Gen1/2 (anterior ao VZZZ)", "Gen B: pn[8]=RAM code (letra), pn[9:11]=NAND code — igual ao MT29VZZZ", "Gen A: pn[8]=NAND code (dígito), pn[9:11]=DRAM code — chave ex: 8D5=8GB NAND+1GB LPDDR3", "RAM: MIC_TZZZ_GEN — toda família TZZZ é LPDDR3 (BUG-8 corrigido 2026-06-19)", "Dispositivos típicos: 2014-2018 (Qualcomm MSM8909, MT6737)"]'
